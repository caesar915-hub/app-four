<text x="32" y="87" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#000">1st dose · Concerta 36mg · 12:23</text>
<text x="280" y="87" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#888">ends 22:23</text>

<rect x="16" y="112" width="358" height="44" rx="12" fill="#EADDFF" stroke="#D8B4FE" stroke-width="1"/>
