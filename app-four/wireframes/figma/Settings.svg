<svg width="390" height="844" viewBox="0 0 390 844" fill="#FAFAFA" xmlns="http://www.w3.org/2000/svg">
<!-- Background -->
<rect width="390" height="844" fill="#F9F9F9"/>

<!-- Medication Bar -->
<rect x="16" y="60" width="358" height="44" rx="12" fill="#EADDFF" stroke="#D8B4FE" stroke-width="1"/>
