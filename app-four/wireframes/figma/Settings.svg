<text x="305" y="230" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#888">Installed</text>

<!-- Section 2 -->
<text x="16" y="280" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#888">System</text>
<rect x="16" y="290" width="358" height="100" rx="12" fill="#FFF"/>
<text x="32" y="320" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#000">Storage</text>
<text x="358" y="320" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#888" text-anchor="end">11 recordings · 0.1 MB</text>
<path d="M32 340 H374" stroke="#EEE" stroke-width="1"/>
<text x="32" y="370" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#000">Download over Cellular</text>
<!-- Toggle off -->
<rect x="314" y="355" width="44" height="24" rx="12" fill="#E5E7EB"/>
<circle cx="326" cy="367" r="10" fill="#FFF"/>

<!-- Section 3 -->
<text x="16" y="420" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#888">Medication Bar</text>
<rect x="16" y="430" width="358" height="150" rx="12" fill="#FFF"/>
<text x="32" y="460" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#000">Show Medication Bar</text>
<!-- Toggle on -->
<rect x="314" y="445" width="44" height="24" rx="12" fill="#3B82F6"/>
<circle cx="346" cy="457" r="10" fill="#FFF"/>
<path d="M32 480 H374" stroke="#EEE" stroke-width="1"/>

<text x="32" y="510" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#000">Show Medication Name</text>
<rect x="314" y="495" width="44" height="24" rx="12" fill="#3B82F6"/>
<circle cx="346" cy="507" r="10" fill="#FFF"/>
<path d="M32 530 H374" stroke="#EEE" stroke-width="1"/>

<text x="32" y="560" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#000">Show Taken Time</text>
<rect x="314" y="545" width="44" height="24" rx="12" fill="#3B82F6"/>
<circle cx="346" cy="557" r="10" fill="#FFF"/>

<!-- Floating Action Button -->
<circle cx="330" cy="700" r="28" fill="#FFF" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.1))"/>
<path d="M320 690 h20 v15 h-20 z M325 695 h10 M325 700 h10" stroke="#007AFF" stroke-width="2" fill="none"/>

