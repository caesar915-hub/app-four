<rect x="305" y="760" width="60" height="32" rx="16" fill="#E5F1FF"/>
<circle cx="335" cy="776" r="10" fill="#007AFF"/>
<text x="335" y="804" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#007AFF" text-anchor="middle">Settings</text>
