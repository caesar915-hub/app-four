<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendar — converged v2 (mood icon, % in bead, card tint)</title>
<style>
  /*
    Converged v2 (palette B):
      • One general mood icon (neutral face) + ⚡ energy + 🎯 focus, white mono, in the banner.
      • Medication NOT taken → no pill/text; ring stays on the bead and the % sits INSIDE
        the circle, below the time (time stays centered). Taken → "TAKEN …" pill remains.
      • Whole day card tinted by the day's AVERAGE mood (V2).
  */
  :root {
    --purple:#AF52DE; --orange:#FF9500; --indigo:#5856D6; --pink:#FF2D55; --teal:#30B0C7;
    --bg:#FFFFFF; --text-pri:#000; --text-sec:#3C3C4399; --separator:#3C3C434A;
    --card:#F2F2F7; --frame:#111114;
    --m-low:#C75B49; --m-flat:#E1894F; --m-okay:#D9A94E; --m-good:#7FB069; --m-great:#4E8C7A;
  }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
         background:#e9e9ee; color:var(--text-pri); padding:30px 16px 64px;
         display:flex; flex-direction:column; align-items:center; gap:16px; }
  h1.page { font-size:18px; font-weight:600; color:#3a3a3c; margin:0; text-align:center; }
  p.sub { font-size:13px; color:#6b6b70; margin:-4px 0 0; max-width:700px; text-align:center; line-height:1.5; }

  .phone { width:384px; background:var(--bg); border-radius:42px; border:10px solid var(--frame);
           box-shadow:0 22px 56px rgba(0,0,0,.18); overflow:hidden; }
  .screen { padding:20px 16px 34px; background:var(--bg); min-height:760px; }

  .months { display:flex; gap:22px; padding:6px 4px 4px; overflow:hidden; }
  .month { font-size:16px; font-weight:600; color:var(--text-sec); padding:6px 2px 6px; position:relative; }
  .month.sel { font-weight:700; color:var(--text-pri); }
  .month.sel::after { content:""; position:absolute; left:2px; right:2px; bottom:0; height:2px; border-radius:1px; background:var(--text-pri); }

  .day-card { border-radius:20px; padding:16px 14px; margin-top:14px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .day-header { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:0 0 14px 2px; }

  .row { display:flex; align-items:flex-start; gap:13px; }
  .rail { position:relative; width:54px; flex:0 0 54px; display:flex; flex-direction:column; align-items:center; }
  .rail .connector { width:1px; background:var(--separator); flex:1 1 auto; min-height:20px; }
  .row:last-child .rail .connector { display:none; }

  .bead { position:relative; width:54px; height:54px; flex:0 0 54px; }
  .bead .label-stack { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .bead .time { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .bead .bead-pct { position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:8px; font-weight:700; font-variant-numeric:tabular-nums; opacity:.92; pointer-events:none; }

  .content { flex:1 1 auto; padding:8px 0 16px; display:flex; flex-direction:column; gap:7px; align-items:flex-start; }
  .row:last-child .content { padding-bottom:2px; }

  .head-banner { display:inline-block; font-size:13px; font-weight:700; letter-spacing:.01em; line-height:1.3; padding:4px 11px; border-radius:13px; }
  .bi { width:13px; height:13px; vertical-align:-2px; margin-right:1px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:999px; line-height:1.1; }
  .chip .ic { font-size:10px; }
  .chip.feel{ color:var(--pink); background:rgba(255,45,85,.12);}
  .chip.se{ color:#C24B17; background:rgba(255,149,0,.14);}
  .chip.sleep{ color:var(--indigo); background:rgba(88,86,214,.12);}
  .chip.med{ color:var(--purple); background:rgba(175,82,222,.13); font-weight:600;}

  .legend { width:700px; max-width:100%; background:#fff; border-radius:14px; padding:14px 18px; box-shadow:0 6px 24px rgba(0,0,0,.06); font-size:12.5px; color:#3a3a3c; line-height:1.65; }
  .legend b{color:#3a3a3c}
</style>
</head>
<body>

  <h1 class="page">Calendar — converged v2</h1>
  <p class="sub">One mood icon for any mood, ⚡ energy, 🎯 focus (white, in the banner). Active medication shows as the ring + a % inside the circle below the unmoved time; only a freshly-taken dose gets the “TAKEN” pill. Whole card tinted by the day's average mood.</p>

  <div class="phone"><div class="screen">
    <div class="months"><div class="month">MAY</div><div class="month sel">JUN 2026</div></div>
    <div class="day-card" id="card"></div>
  </div></div>

  <div class="legend" id="legend"></div>

<script>
  function lum(h){ const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return 0.299*r+0.587*g+0.114*b; }
  function ink(h){ return lum(h) > 150 ? "#1c1c1e" : "#ffffff"; }
  function darken(h,f){ const n=k=>Math.round(parseInt(h.slice(k,k+2),16)*(1-f)).toString(16).padStart(2,"0"); return "#"+n(1)+n(3)+n(5); }

  const PURPLE = "#AF52DE";
  const M = { low:"#C75B49", flat:"#E1894F", okay:"#D9A94E", good:"#7FB069", great:"#4E8C7A" };
  const SCALE = { low:1, flat:2, okay:3, good:4, great:5 };
  const SCALE_COLOR = { 1:M.low, 2:M.flat, 3:M.okay, 4:M.good, 5:M.great };

  // white mono banner icons
  const ICON = {
    mood: '<circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.4"/>'+
          '<circle cx="5.8" cy="6.6" r="1" fill="currentColor"/><circle cx="10.2" cy="6.6" r="1" fill="currentColor"/>'+
          '<line x1="5.6" y1="10.6" x2="10.4" y2="10.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
    energy:'<path d="M9.2 1.5 L4 9 H7 L6.4 14.5 L12 6.8 H9 Z" fill="currentColor"/>',
    focus: '<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2.3" fill="currentColor"/>'
  };
  const svg = (k,c) => `<svg class="bi" viewBox="0 0 16 16" style="color:${c}">${ICON[k]}</svg>`;

  // One dose taken at 09:15; later entries carry its rising effect %.
  const NODES = [
    { time:"16:42", mood:"great", mw:"Great", en:"Alert",  fo:"Focused",
      carry:75, taken:null, rings:[0.75], chips:[ {t:"feel",ic:"❤️",l:"Happy"}, {t:"feel",ic:"❤️",l:"Calm"} ] },
    { time:"14:30", mood:"good",  mw:"Good",  en:"Steady", fo:"Focused",
      carry:52, taken:null, rings:[0.52], chips:[ {t:"feel",ic:"🌴",l:"Relaxed"} ] },
    { time:"11:00", mood:"okay",  mw:"Okay",  en:"Tired",  fo:"Scattered",
      carry:18, taken:null, rings:[0.18], chips:[ {t:"feel",ic:"❤️",l:"Anxious"} ] },
    { time:"09:15", mood:"good",  mw:"Good",  en:"Calm",   fo:"Focused",
      carry:null, taken:"Concerta 36mg", rings:[0.0], chips:[ {t:"sleep",ic:"🌙",l:"5h sleep"}, {t:"se",ic:"🩹",l:"Headache"} ] },
  ];

  function avgMoodColor(nodes){
    const v = nodes.filter(n=>n.mood).map(n=>SCALE[n.mood]);
    if(!v.length) return null;
    return SCALE_COLOR[Math.round(v.reduce((a,b)=>a+b,0)/v.length)];
  }

  function bead(node){
    const S=64,c=S/2,RW=4,GAP=2,R=S/2-2, isMed=!node.mood, fill=isMed?null:M[node.mood];
    const centre = isMed
      ? `<circle cx="${c}" cy="${c}" r="${R-0.75}" fill="var(--bg)" stroke="var(--separator)" stroke-width="1"/>`
      : `<circle cx="${c}" cy="${c}" r="${R}" fill="${fill}"/>`;
    let rings=""; (node.rings||[]).forEach((p,i)=>{ const r=R-i*(RW+GAP)-RW/2,C=2*Math.PI*r,dash=Math.max(.001,p)*C;
      rings+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${PURPLE}" stroke-width="${RW}" stroke-linecap="round" stroke-dasharray="${dash} ${C-dash}" transform="rotate(-90 ${c} ${c})"/>`; });
    const col = isMed ? PURPLE : ink(fill);
    const pct = (node.carry!=null) ? `<div class="bead-pct" style="color:${col}">${node.carry}%</div>` : "";
    return `<div class="bead"><svg width="100%" height="100%" viewBox="0 0 ${S} ${S}">${centre}${rings}</svg>
            <div class="label-stack"><div class="time" style="color:${col}">${node.time}</div></div>${pct}</div>`;
  }

  function banner(node){
    const mood=M[node.mood], col=ink(mood);
    return `<span class="head-banner" style="background:${mood};color:${col}">`+
      `${svg('mood',col)} ${node.mw.toUpperCase()} ${svg('energy',col)} ${node.en.toUpperCase()} ${svg('focus',col)} ${node.fo.toUpperCase()}</span>`;
  }

  function row(node){
    const a=[];
    if(node.taken) a.push(`<span class="chip med"><span class="ic">💊</span>TAKEN ${node.taken.toUpperCase()}</span>`);
    node.chips.forEach(ch=>a.push(`<span class="chip ${ch.t}"><span class="ic">${ch.ic}</span>${ch.l}</span>`));
    const pills = a.length ? `<div class="chips">${a.join("")}</div>` : "";
    return `<div class="row"><div class="rail">${bead(node)}<div class="connector"></div></div>
            <div class="content">${banner(node)}${pills}</div></div>`;
  }

  const avg = avgMoodColor(NODES);
  document.getElementById("card").style.background = avg + "16";   // ~9% tint
  document.getElementById("card").innerHTML =
    `<div class="day-header" style="color:${darken(avg,.30)}">Today, 11 Jun</div>` + NODES.map(row).join("");

  document.getElementById("legend").innerHTML =
    `<b>Medication:</b> a dose still active shows only as the purple ring + its % <i>inside</i> the bead, under the time (the time stays put). A dose logged at the check-in gets the <b>TAKEN</b> pill instead. <b>Day colour:</b> average of today's moods = great·good·okay·good → <b>good (green)</b>, washed over the whole card. <b>Banner:</b> one mood icon (any mood) · ⚡ energy · 🎯 focus, in white.`;
</script>
</body>
</html>
