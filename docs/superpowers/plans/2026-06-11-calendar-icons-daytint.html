<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendar — icons in banner + average-mood day colour</title>
<style>
  /*
    Two additions on the converged direction (palette B):
      1. Icons before mood / energy / focus inside the banner (like 💊 on meds).
      2. Average-mood DAY colour (Daylio logic) — shown two ways:
           V1: tint the day HEADER strip + a mood ring (Daylio's placement)
           V2: tint the WHOLE day card lightly
    Per-entry tinted card stays removed; colour still = mood (+ its icon) only.
  */
  :root {
    --purple:#AF52DE; --orange:#FF9500; --indigo:#5856D6; --pink:#FF2D55; --teal:#30B0C7;
    --bg:#FFFFFF; --text-pri:#000; --text-sec:#3C3C4399; --separator:#3C3C434A;
    --card:#F2F2F7; --frame:#111114;
    --m-low:#C75B49; --m-flat:#E1894F; --m-okay:#D9A94E; --m-good:#7FB069; --m-great:#4E8C7A;
  }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
         background:#e9e9ee; color:var(--text-pri); padding:30px 16px 64px;
         display:flex; flex-direction:column; align-items:center; gap:16px; }
  h1.page { font-size:18px; font-weight:600; color:#3a3a3c; margin:0; text-align:center; }
  p.sub { font-size:13px; color:#6b6b70; margin:-4px 0 0; max-width:760px; text-align:center; line-height:1.5; }

  .stage { display:flex; flex-wrap:wrap; gap:26px; justify-content:center; align-items:flex-start; }
  .variant { display:flex; flex-direction:column; align-items:center; gap:8px; width:360px; }
  .variant .cap { font-size:13px; color:#3a3a3c; font-weight:700; }
  .variant .note { font-size:11.5px; color:#8e8e93; text-align:center; line-height:1.45; min-height:30px; }

  .phone { width:360px; background:var(--bg); border-radius:40px; border:9px solid var(--frame);
           box-shadow:0 20px 52px rgba(0,0,0,.17); overflow:hidden; }
  .screen { padding:18px 15px 30px; background:var(--bg); min-height:720px; }

  .months { display:flex; gap:20px; padding:6px 4px 4px; overflow:hidden; }
  .month { font-size:15px; font-weight:600; color:var(--text-sec); padding:6px 2px 6px; position:relative; }
  .month.sel { font-weight:700; color:var(--text-pri); }
  .month.sel::after { content:""; position:absolute; left:2px; right:2px; bottom:0; height:2px; border-radius:1px; background:var(--text-pri); }

  .day-card { border-radius:20px; padding:0; margin-top:14px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .day-card .inner { padding:14px; }
  .day-header { font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; display:flex; align-items:center; gap:8px; }
  .day-header.plain { color:var(--text-sec); padding:0 0 14px 2px; }
  .day-header.strip { padding:11px 14px; }
  .ring { width:14px; height:14px; border-radius:50%; border:2.5px solid currentColor; box-sizing:border-box; }

  .row { display:flex; align-items:flex-start; gap:13px; }
  .rail { position:relative; width:52px; flex:0 0 52px; display:flex; flex-direction:column; align-items:center; }
  .rail .connector { width:1px; background:var(--separator); flex:1 1 auto; min-height:20px; }
  .row:last-child .rail .connector { display:none; }
  .bead { position:relative; width:52px; height:52px; flex:0 0 52px; }
  .bead .label-stack { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .bead .time { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }

  .content { flex:1 1 auto; padding:8px 0 16px; display:flex; flex-direction:column; gap:7px; align-items:flex-start; }
  .row:last-child .content { padding-bottom:2px; }

  .head-banner { display:inline-block; font-size:13px; font-weight:700; letter-spacing:.01em; line-height:1.3; padding:4px 11px; border-radius:13px; }
  .head-banner .he { font-size:11.5px; }       /* icon a touch smaller than the word */

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:999px; line-height:1.1; }
  .chip .ic { font-size:10px; }
  .chip.feel{ color:var(--pink); background:rgba(255,45,85,.12);}
  .chip.se{ color:#C24B17; background:rgba(255,149,0,.14);}
  .chip.sleep{ color:var(--indigo); background:rgba(88,86,214,.12);}
  .chip.med{ color:var(--purple); background:rgba(175,82,222,.13); font-weight:600;}

  .legend { width:760px; max-width:100%; background:#fff; border-radius:14px; padding:14px 18px; box-shadow:0 6px 24px rgba(0,0,0,.06); font-size:12.5px; color:#3a3a3c; line-height:1.65; }
  .legend b{color:#3a3a3c}
</style>
</head>
<body>

  <h1 class="page">Banner icons + average-mood day colour</h1>
  <p class="sub">Each banner now leads its mood / energy / focus words with an icon. The day's colour is the average of its moods (here three positive moods average to “good” green). Left tints the header strip; right tints the whole card.</p>

  <div class="stage" id="stage"></div>
  <div class="legend" id="legend"></div>

<script>
  function lum(hex){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return 0.299*r+0.587*g+0.114*b; }
  function ink(hex){ return lum(hex) > 150 ? "#1c1c1e" : "#ffffff"; }
  function darken(hex,f){ const n=k=>Math.round(parseInt(hex.slice(k,k+2),16)*(1-f)).toString(16).padStart(2,"0"); return "#"+n(1)+n(3)+n(5); }
  function tint(hex,a){ return hex + a; }   // a = 2-hex alpha

  const PURPLE = "#AF52DE";
  const M = { low:"#C75B49", flat:"#E1894F", okay:"#D9A94E", good:"#7FB069", great:"#4E8C7A" };
  const SCALE = { low:1, flat:2, okay:3, good:4, great:5 };
  const SCALE_COLOR = { 1:M.low, 2:M.flat, 3:M.okay, 4:M.good, 5:M.great };
  const MOOD_ICON = { great:"☀️", good:"🌤️", okay:"⛅", flat:"🌥️", low:"☁️" };

  const NODES = [
    { time:"16:42", mood:"great", mw:"Great", en:"Alert", fo:"Focused",
      taken:null, active:null, rings:[20],
      chips:[ {t:"feel",ic:"❤️",l:"Happy"}, {t:"feel",ic:"❤️",l:"Calm"} ] },
    { time:"14:30", mood:"good", mw:"Good", en:"Steady", fo:"Focused",
      taken:null, active:{name:"Concerta 36mg", pct:60}, rings:[60],
      chips:[ {t:"feel",ic:"🌴",l:"Relaxed"} ] },
    { time:"11:00", mood:null, head:"Taken Concerta 36mg", taken:"Concerta 36mg", active:null, rings:[0], chips:[] },
    { time:"09:15", mood:"okay", mw:"Okay", en:"Tired", fo:"Scattered",
      taken:"Concerta 36mg", active:null, rings:[0],
      chips:[ {t:"sleep",ic:"🌙",l:"5h sleep"}, {t:"se",ic:"🩹",l:"Headache"} ] },
  ];

  function avgMoodColor(nodes){
    const v = nodes.filter(n=>n.mood).map(n=>SCALE[n.mood]);
    if(!v.length) return null;
    return SCALE_COLOR[Math.round(v.reduce((a,b)=>a+b,0)/v.length)];
  }

  function bead(node){
    const S=64,c=S/2,RW=4,GAP=2,R=S/2-2, isMed=!node.mood, fill=isMed?null:M[node.mood];
    const centre = isMed
      ? `<circle cx="${c}" cy="${c}" r="${R-0.75}" fill="var(--bg)" stroke="var(--separator)" stroke-width="1"/>`
      : `<circle cx="${c}" cy="${c}" r="${R}" fill="${fill}"/>`;
    let rings=""; (node.rings||[]).forEach((p,i)=>{ const r=R-i*(RW+GAP)-RW/2,C=2*Math.PI*r,dash=Math.max(.001,p/100)*C;
      rings+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${PURPLE}" stroke-width="${RW}" stroke-linecap="round" stroke-dasharray="${dash} ${C-dash}" transform="rotate(-90 ${c} ${c})"/>`; });
    return `<div class="bead"><svg width="100%" height="100%" viewBox="0 0 ${S} ${S}">${centre}${rings}</svg>
            <div class="label-stack"><div class="time" style="color:${isMed?PURPLE:ink(fill)}">${node.time}</div></div></div>`;
  }

  function banner(node){
    const isMed=!node.mood, mood=isMed?PURPLE:M[node.mood], col=ink(mood);
    if(isMed) return `<span class="head-banner" style="background:${mood};color:${col}"><span class="he">💊</span> TAKEN CONCERTA 36MG</span>`;
    return `<span class="head-banner" style="background:${mood};color:${col}">`+
           `<span class="he">${MOOD_ICON[node.mood]}</span> ${node.mw.toUpperCase()} `+
           `<span class="he">⚡</span> ${node.en.toUpperCase()} `+
           `<span class="he">🎯</span> ${node.fo.toUpperCase()}</span>`;
  }

  function row(node){
    const isMed=!node.mood;
    let pills="";
    if(!isMed){ const a=[];
      if(node.taken)  a.push(`<span class="chip med"><span class="ic">💊</span>TAKEN ${node.taken.toUpperCase()}</span>`);
      if(node.active) a.push(`<span class="chip med"><span class="ic">💊</span>${node.active.name} · ${node.active.pct}%</span>`);
      node.chips.forEach(ch=>a.push(`<span class="chip ${ch.t}"><span class="ic">${ch.ic}</span>${ch.l}</span>`));
      if(a.length) pills=`<div class="chips">${a.join("")}</div>`;
    }
    return `<div class="row"><div class="rail">${bead(node)}<div class="connector"></div></div>
            <div class="content">${banner(node)}${pills}</div></div>`;
  }

  function phone(mode){
    const avg = avgMoodColor(NODES);
    const rows = NODES.map(row).join("");
    if(mode==="strip"){
      const dk = darken(avg,.28);
      return `<div class="day-card" style="background:#fff">
        <div class="day-header strip" style="background:${tint(avg,'24')};color:${dk}"><span class="ring"></span>Today, 11 Jun</div>
        <div class="inner">${rows}</div></div>`;
    }
    // whole-card tint
    return `<div class="day-card" style="background:${tint(avg,'16')}">
      <div class="inner"><div class="day-header plain" style="color:${darken(avg,.30)}">Today, 11 Jun</div>${rows}</div></div>`;
  }

  const VARIANTS = [
    { cap:"V1 · Tint the header strip", note:"Daylio's placement: a coloured day header + mood ring; entries stay on white.", mode:"strip" },
    { cap:"V2 · Tint the whole card", note:"The day's average mood washes the entire card lightly.", mode:"card" },
  ];
  document.getElementById("stage").innerHTML = VARIANTS.map(v=>`
    <div class="variant"><div class="cap">${v.cap}</div><div class="note">${v.note}</div>
      <div class="phone"><div class="screen">
        <div class="months"><div class="month">MAY</div><div class="month sel">JUN 2026</div></div>
        ${phone(v.mode)}
      </div></div>
    </div>`).join("");

  document.getElementById("legend").innerHTML =
    `<b>Average-mood colour:</b> moods map to 1–5 (low→great), average, round to the nearest, use that colour. Today = great·good·okay → <b>4 = good (green)</b>. Med-only entries don't count toward the average. <b>Banner icons:</b> a weather glyph for mood (matches your <code>moodIcon</code>), ⚡ for energy, 🎯 for focus — each before its word, like 💊 on medication.`;
</script>
</body>
</html>
