<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendar — Lighter palette with white font (options)</title>
<style>
  :root {
    --purple:#AF52DE; --ink:#2c2c30; --neutral:#3a3a3c;
    --bg:#FFFFFF; --text-sec:#3C3C4399; --separator:#3C3C434A; --frame:#111114;
  }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
         background:#e9e9ee; color:#000; padding:28px 16px 64px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  h1.page { font-size:18px; font-weight:600; color:#3a3a3c; margin:0; text-align:center; }
  p.sub { font-size:12.5px; color:#6b6b70; margin:-2px 0 0; max-width:780px; text-align:center; line-height:1.5; }

  .stage { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; align-items:flex-start; }
  .variant { display:flex; flex-direction:column; align-items:center; gap:6px; width:330px; }
  .variant .cap { font-size:13px; color:#3a3a3c; font-weight:700; }
  .variant .note { font-size:11px; color:#8e8e93; text-align:center; min-height:28px; line-height:1.4; }

  .phone { width:330px; background:var(--bg); border-radius:36px; border:9px solid var(--frame); box-shadow:0 16px 44px rgba(0,0,0,.16); overflow:hidden; }
  .screen { padding:16px 13px 26px; background:var(--bg); min-height:640px; }
  .months { display:flex; gap:18px; padding:5px 4px 4px; }
  .month { font-size:14px; font-weight:600; color:var(--text-sec); padding:5px 2px; position:relative; }
  .month.sel { font-weight:700; color:#000; }
  .month.sel::after { content:""; position:absolute; left:2px; right:2px; bottom:0; height:2px; border-radius:1px; background:#000; }

  .day-card { border-radius:18px; padding:13px 11px; margin-top:11px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .day-header { font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:0 0 12px 2px; }

  .row { display:flex; align-items:flex-start; gap:11px; }
  .rail { position:relative; width:50px; flex:0 0 50px; display:flex; flex-direction:column; align-items:center; }
  .rail .connector { width:1px; background:var(--separator); flex:1 1 auto; min-height:18px; }
  .row:last-child .rail .connector { display:none; }
  .bead { position:relative; width:50px; height:50px; flex:0 0 50px; }
  .bead .ls { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .bead .time { font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; color:#fff; }
  .pct-badge { position:absolute; left:50%; bottom:-4px; transform:translateX(-50%); background:#fff; color:var(--purple);
               font-size:11px; font-weight:800; padding:1px 6px; border-radius:999px; box-shadow:0 1px 3px rgba(0,0,0,.22); font-variant-numeric:tabular-nums; z-index:2; }

  .content { flex:1 1 auto; padding:6px 0 14px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .row:last-child .content { padding-bottom:2px; }
  .banner { display:inline-block; white-space:nowrap; font-size:12px; font-weight:800; color:#fff; letter-spacing:.01em; line-height:1.3; padding:4px 10px; border-radius:12px; }
  .bi { width:12px; height:12px; vertical-align:-2px; margin-right:1px; color:#fff; }
  .bi-lg { width:14px; height:14px; vertical-align:-2px; margin-right:1px; color:#fff; }

  /* white-font rescue treatments */
  .fx-shadow  .banner, .fx-shadow  .time { text-shadow:0 1px 2px rgba(0,0,0,.45); }
  .fx-shadow  .bi { filter:drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
  .fx-outline .banner, .fx-outline .time { -webkit-text-stroke:.75px rgba(0,0,0,.45); paint-order:stroke fill; }
  .fx-outline .bi { filter:drop-shadow(0 0 .9px rgba(0,0,0,.6)); }

  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500; padding:3px 8px; border-radius:999px; line-height:1.1; }
  .chip .bi { width:11px; height:11px; vertical-align:-1px; margin:0; }
  .chip.neutral { color:var(--neutral); background:rgba(0,0,0,.06); }
  .chip.neutral .bi { color:var(--ink); }
  .chip.med { color:var(--purple); background:rgba(175,82,222,.13); font-weight:600; }
  .chip.med .bi { color:var(--ink); }

  .legend { width:780px; max-width:100%; background:#fff; border-radius:14px; padding:14px 18px; box-shadow:0 6px 24px rgba(0,0,0,.06); font-size:12.5px; color:#3a3a3c; line-height:1.6; }
  .legend b{color:#3a3a3c}
</style>
</head>
<body>

  <h1 class="page">Lighter palette + white font — options</h1>
  <p class="sub">Plain white on the Lighter pastels is too faint, so these add help. Left two keep the Lighter palette and rescue the white with a shadow / outline; the right uses the lightest palette where white reads cleanly on its own. Card tint constant.</p>

  <div class="stage" id="stage"></div>
  <div class="legend" id="legend"></div>

<script>
  const PURPLE="#AF52DE";
  const LIGHTER = { low:"#E6A99C", flat:"#F0BB97", okay:"#EBCF98", good:"#B6D4A9", great:"#A6C3BA" };
  // lightest palette that still carries clean white text (no tricks)
  const MEDIUM  = { low:"#CC7361", flat:"#D17B3F", okay:"#C0922F", good:"#6AA457", great:"#5E9A88" };
  const CARD_TINT="#5F9A5016", CARD_HEADER="#5F9A50";

  const ICON = {
    sparkle:'<path d="M8 1.2 L9.4 6.6 L14.8 8 L9.4 9.4 L8 14.8 L6.6 9.4 L1.2 8 L6.6 6.6 Z" fill="currentColor"/>',
    heart:'<path d="M8 13.6 C2.4 9.3 3 5.1 5.6 5.1 C7.1 5.1 8 6.6 8 6.6 C8 6.6 8.9 5.1 10.4 5.1 C13 5.1 13.6 9.3 8 13.6 Z" fill="currentColor"/>',
    moon:'<path d="M10.6 2.1 A6 6 0 1 0 13.9 10.6 A4.8 4.8 0 0 1 10.6 2.1 Z" fill="currentColor"/>',
    cross:'<path d="M6.6 2.3 h2.8 v3.9 h3.9 v2.8 h-3.9 v3.9 h-2.8 v-3.9 H2.7 V6.2 h3.9 Z" fill="currentColor"/>',
    pill:'<g transform="rotate(-32 8 8)"><rect x="2.4" y="6" width="11.2" height="4" rx="2" fill="currentColor"/></g>',
    bolt:'<path d="M9.2 1.5 L4 9 H7 L6.4 14.5 L12 6.8 H9 Z" fill="currentColor"/>',
    target:'<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2.3" fill="currentColor"/>'
  };
  const svg=(k,c,cls="bi")=>`<svg class="${cls}" viewBox="0 0 16 16"${c?` style="color:${c}"`:""}>${ICON[k]}</svg>`;
  const CHIP_ICON = { feel:"heart", sleep:"moon", se:"cross" };

  const NODES = [
    { time:"16:42", mood:"great", mw:"Great", en:"Alert",  fo:"Focused", carry:75, taken:null, rings:[0.75], chips:[{t:"feel",l:"Happy"},{t:"feel",l:"Calm"}] },
    { time:"14:30", mood:"good",  mw:"Good",  en:"Steady", fo:"Focused", carry:52, taken:null, rings:[0.52], chips:[{t:"feel",l:"Relaxed"}] },
    { time:"11:00", mood:"okay",  mw:"Okay",  en:"Tired",  fo:"Scattered", carry:18, taken:null, rings:[0.18], chips:[{t:"feel",l:"Anxious"}] },
    { time:"09:15", mood:"good",  mw:"Good",  en:"Calm",   fo:"Focused", carry:null, taken:"Concerta 36mg", rings:[0.0], chips:[{t:"sleep",l:"5h sleep"},{t:"se",l:"Headache"}] },
  ];

  function bead(node, P){
    const S=64,c=S/2,RW=4,GAP=2,R=S/2-2, fill=P[node.mood];
    let rings=""; node.rings.forEach((p,i)=>{ const r=R-i*(RW+GAP)-RW/2,C=2*Math.PI*r,dash=Math.max(.001,p)*C;
      rings+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${PURPLE}" stroke-width="${RW}" stroke-linecap="round" stroke-dasharray="${dash} ${C-dash}" transform="rotate(-90 ${c} ${c})"/>`; });
    const badge = node.carry!=null ? `<div class="pct-badge">${node.carry}%</div>` : "";
    return `<div class="bead"><svg width="100%" height="100%" viewBox="0 0 ${S} ${S}"><circle cx="${c}" cy="${c}" r="${R}" fill="${fill}"/>${rings}</svg>
            <div class="ls"><div class="time">${node.time}</div></div>${badge}</div>`;
  }
  function banner(node, P){
    return `<span class="banner" style="background:${P[node.mood]}">${svg('sparkle','#fff','bi-lg')} ${node.mw.toUpperCase()} ${svg('bolt','#fff')} ${node.en.toUpperCase()} ${svg('target','#fff')} ${node.fo.toUpperCase()}</span>`;
  }
  function row(node, P){
    const a=[];
    if(node.taken) a.push(`<span class="chip med">${svg('pill',PURPLE)}TAKEN ${node.taken.toUpperCase()}</span>`);
    node.chips.forEach(ch=>a.push(`<span class="chip neutral">${svg(CHIP_ICON[ch.t],'#2c2c30')}${ch.l}</span>`));
    return `<div class="row"><div class="rail">${bead(node,P)}<div class="connector"></div></div>
            <div class="content">${banner(node,P)}<div class="chips">${a.join("")}</div></div></div>`;
  }

  const VARIANTS = [
    { cap:"1 · Lighter + white + shadow", note:"Lighter palette, white text rescued with a soft drop shadow.", P:LIGHTER, fx:"fx-shadow" },
    { cap:"2 · Lighter + white + outline", note:"Lighter palette, white text with a thin dark outline.", P:LIGHTER, fx:"fx-outline" },
    { cap:"3 · Medium + white (clean)", note:"Lightest palette where white reads on its own — no shadow/outline.", P:MEDIUM, fx:"" },
  ];

  document.getElementById("stage").innerHTML = VARIANTS.map(v=>`
    <div class="variant"><div class="cap">${v.cap}</div><div class="note">${v.note}</div>
      <div class="phone"><div class="screen ${v.fx}">
        <div class="months"><div class="month">MAY</div><div class="month sel">JUN 2026</div></div>
        <div class="day-card" style="background:${CARD_TINT}">
          <div class="day-header" style="color:${CARD_HEADER}">Today, 11 Jun</div>
          ${NODES.map(n=>row(n,v.P)).join("")}
        </div>
      </div></div>
    </div>`).join("");

  document.getElementById("legend").innerHTML =
    `<b>The trade-off:</b> white text needs a dark-enough fill. On the true <b>Lighter</b> pastels white only survives with a <b>shadow (1)</b> or <b>outline (2)</b> — both add a little visual noise and (1) can look faint on the palest moods. <b>(3)</b> nudges the palette just dark enough that white is clean with no tricks — it's lighter than the deep palette you had, but not as pale as “Lighter”. If you want genuinely pale pastels, dark text is the honest choice; if white is a must, (3) is the lightest that works.`;
</script>
</body>
</html>
