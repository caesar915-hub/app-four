<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendar — mood palette options (layout: I + pills)</title>
<style>
  /*
    Chosen layout locked: I (soft mood-tinted card + full-headline mood banner)
    + K's pill body (meds + inputs as pills). ONLY the mood palette changes here.
    Non-mood colours (medication purple, feeling pink, etc.) stay constant.
    Banner/bead text uses AUTO-CONTRAST (white on dark moods, dark on light moods).
  */
  :root {
    --purple:#AF52DE; --orange:#FF9500; --indigo:#5856D6; --pink:#FF2D55; --teal:#30B0C7;
    --bg:#FFFFFF; --text-pri:#000; --text-sec:#3C3C4399; --separator:#3C3C434A;
    --card:#F2F2F7; --frame:#111114;
  }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
         background:#e9e9ee; color:var(--text-pri); padding:28px 16px 64px;
         display:flex; flex-direction:column; align-items:center; gap:22px; }
  h1.page { font-size:18px; font-weight:600; color:#3a3a3c; margin:0; text-align:center; }
  h2.sec { font-size:13px; font-weight:700; color:#3a3a3c; margin:6px 0 -6px; text-transform:uppercase; letter-spacing:.05em; }
  p.sub { font-size:13px; color:#6b6b70; margin:-4px 0 0; max-width:840px; text-align:center; line-height:1.5; }

  .stage { display:flex; flex-wrap:wrap; gap:22px; justify-content:center; align-items:flex-start; max-width:1180px; }
  .variant { display:flex; flex-direction:column; align-items:center; gap:8px; width:300px; }
  .variant .cap { font-size:13px; color:#3a3a3c; font-weight:700; }
  .variant .swatches { display:flex; gap:3px; }
  .variant .sw { width:26px; height:14px; border-radius:3px; }
  .variant .note { font-size:11px; color:#8e8e93; text-align:center; line-height:1.4; min-height:30px; }

  .phone { width:300px; background:var(--bg); border-radius:34px; border:8px solid var(--frame);
           box-shadow:0 16px 42px rgba(0,0,0,.16); overflow:hidden; }
  .screen { padding:14px 12px 24px; background:var(--bg); min-height:560px; }

  .months { display:flex; gap:18px; padding:5px 4px 4px; overflow:hidden; }
  .month { font-size:14px; font-weight:600; color:var(--text-sec); padding:5px 2px 5px; position:relative; }
  .month.sel { font-weight:700; color:var(--text-pri); }
  .month.sel::after { content:""; position:absolute; left:2px; right:2px; bottom:0; height:2px; border-radius:1px; background:var(--text-pri); }

  .day-card { background:var(--card); border-radius:16px; padding:12px; margin-top:10px; }
  .day-header { font-size:10.5px; font-weight:600; letter-spacing:.04em; color:var(--text-sec); text-transform:uppercase; padding:0 0 10px; }

  .row { display:flex; align-items:flex-start; gap:11px; }
  .rail { position:relative; width:48px; flex:0 0 48px; display:flex; flex-direction:column; align-items:center; }
  .rail .connector { width:1px; background:var(--separator); flex:1 1 auto; min-height:18px; }
  .row:last-child .rail .connector { display:none; }
  .bead { position:relative; width:48px; height:48px; flex:0 0 48px; }
  .bead .label-stack { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .bead .time { font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }

  .content { flex:1 1 auto; padding:0 0 8px; display:flex; flex-direction:column; gap:5px; align-items:flex-start; }
  .content.card { border-radius:11px; padding:9px 11px; margin-bottom:6px; }

  .head-banner { display:inline-block; font-size:13px; font-weight:700; letter-spacing:.02em; line-height:1.25; padding:3px 11px; border-radius:12px; }

  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500; padding:3px 8px; border-radius:999px; line-height:1.1; }
  .chip .ic { font-size:9.5px; }
  .chip.feel{ color:var(--pink); background:rgba(255,45,85,.12);}
  .chip.se{ color:#C24B17; background:rgba(255,149,0,.14);}
  .chip.sleep{ color:var(--indigo); background:rgba(88,86,214,.12);}
  .chip.med{ color:var(--purple); background:rgba(175,82,222,.13); font-weight:600;}

  /* energy/focus demo */
  .demo { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; max-width:1000px; }
  .demo .col { width:300px; background:#fff; border-radius:14px; padding:14px 16px; box-shadow:0 4px 18px rgba(0,0,0,.06); }
  .demo .col h3 { font-size:12px; margin:0 0 4px; color:#3a3a3c; }
  .demo .col .tag { font-size:11px; padding:1px 7px; border-radius:6px; font-weight:600; }
  .demo .ok { background:#E7F7EC; color:#1F6B3A; } .demo .bad { background:#FCEDEA; color:#A23B2A; }
  .demo .col p { font-size:11.5px; color:#8e8e93; margin:8px 0 0; line-height:1.45; }
  .demo .ex { margin-top:10px; }
  .ef-icon { font-size:11px; opacity:.9; }
  .legend { width:840px; max-width:100%; background:#fff; border-radius:16px; padding:16px 20px; box-shadow:0 6px 24px rgba(0,0,0,.06); font-size:12.5px; color:#3a3a3c; line-height:1.7; }
  .legend b{color:#3a3a3c}
</style>
</head>
<body>

  <h1 class="page">Mood palettes — on your chosen layout (I + pills)</h1>
  <p class="sub">Same layout and same day; only the five mood colours change. Banner/bead text auto-switches white⇄dark for legibility. Medication (purple) and input chips keep their fixed colours.</p>

  <h2 class="sec">Mood palette options</h2>
  <div class="stage" id="stage"></div>

  <h2 class="sec">Energy &amp; focus — colour for mood only</h2>
  <div class="demo" id="demo"></div>

  <div class="legend" id="legend"></div>

<script>
  // --- auto-contrast: white on dark moods, near-black on light moods ---
  function lum(hex){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
                     return 0.299*r+0.587*g+0.114*b; }
  function ink(hex){ return lum(hex) > 150 ? "#1c1c1e" : "#ffffff"; }

  const PURPLE = "#AF52DE";

  // five-step diverging mood scales: [low, flat, okay, good, great]
  const PALETTES = [
    { name:"A · Current (Coral→Steel)", note:"Your shipped kawaii palette. Warm=low, cool=great. Lighter middles need dark ink.",
      c:{ low:"#DA7964", flat:"#E89178", okay:"#7BCDB1", good:"#85B9DF", great:"#5179A8" } },
    { name:"B · Sunset→Sage", note:"Warm, earthy, muted — wellness feel. All deep enough for white ink.",
      c:{ low:"#C75B49", flat:"#E1894F", okay:"#D9A94E", good:"#7FB069", great:"#4E8C7A" } },
    { name:"C · Classic mood (Red→Green)", note:"Most familiar as a mood scale. Caveat: red↔green is weakest for colour-blindness.",
      c:{ low:"#D8463A", flat:"#EE8A4B", okay:"#E6B33E", good:"#74B85C", great:"#3E9E66" } },
    { name:"D · Deep jewel (cohesive)", note:"Saturated, even weight — white ink works on all five; calm but confident.",
      c:{ low:"#C25E6E", flat:"#CC8456", okay:"#5FAE97", good:"#5E93C4", great:"#5566B0" } },
  ];

  const NODES = [
    { time:"14:30", mood:"great", head:"Great Alert Focused",
      taken:null, active:{name:"Concerta 36mg", pct:60}, rings:[60],
      chips:[ {t:"feel",ic:"❤️",l:"Happy"}, {t:"feel",ic:"❤️",l:"Calm"} ] },
    { time:"11:00", mood:null, head:"Taken Concerta 36mg", taken:"Concerta 36mg", active:null, rings:[0], chips:[] },
    { time:"09:15", mood:"low", head:"Low Drained Scattered",
      taken:"Concerta 36mg", active:null, rings:[0],
      chips:[ {t:"sleep",ic:"🌙",l:"5h sleep"}, {t:"se",ic:"🩹",l:"Headache"}, {t:"feel",ic:"❤️",l:"Anxious"} ] },
  ];

  function bead(node, P) {
    const S=64,c=S/2,RW=4,GAP=2,R=S/2-2, isMed=!node.mood;
    const fill = isMed ? null : P[node.mood];
    const centre = isMed
      ? `<circle cx="${c}" cy="${c}" r="${R-0.75}" fill="var(--bg)" stroke="var(--separator)" stroke-width="1"/>`
      : `<circle cx="${c}" cy="${c}" r="${R}" fill="${fill}"/>`;
    let rings=""; (node.rings||[]).forEach((p,i)=>{ const r=R-i*(RW+GAP)-RW/2,C=2*Math.PI*r,dash=Math.max(.001,p/100)*C;
      rings+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${PURPLE}" stroke-width="${RW}" stroke-linecap="round" stroke-dasharray="${dash} ${C-dash}" transform="rotate(-90 ${c} ${c})"/>`; });
    const col = isMed ? PURPLE : ink(fill);
    return `<div class="bead"><svg width="100%" height="100%" viewBox="0 0 ${S} ${S}">${centre}${rings}</svg>
            <div class="label-stack"><div class="time" style="color:${col}">${node.time}</div></div></div>`;
  }

  function row(node, P) {
    const isMed=!node.mood, mood = isMed ? PURPLE : P[node.mood];
    const banner = `<span class="head-banner" style="background:${mood};color:${ink(mood)}">${isMed?'💊 ':''}${node.head.toUpperCase()}</span>`;
    let pills="";
    if (!isMed) {
      const arr=[];
      if (node.taken)  arr.push(`<span class="chip med"><span class="ic">💊</span>TAKEN ${node.taken.toUpperCase()}</span>`);
      if (node.active) arr.push(`<span class="chip med"><span class="ic">💊</span>${node.active.name} · ${node.active.pct}%</span>`);
      node.chips.forEach(ch=>arr.push(`<span class="chip ${ch.t}"><span class="ic">${ch.ic}</span>${ch.l}</span>`));
      if (arr.length) pills=`<div class="chips">${arr.join("")}</div>`;
    }
    const tint = isMed ? '#AF52DE12' : mood+'1A';
    return `<div class="row">
      <div class="rail">${bead(node,P)}<div class="connector"></div></div>
      <div class="content card" style="background:${tint}">${banner}${pills}</div>
    </div>`;
  }

  document.getElementById("stage").innerHTML = PALETTES.map(p => {
    const sw = ["low","flat","okay","good","great"].map(k=>`<span class="sw" style="background:${p.c[k]}"></span>`).join("");
    return `<div class="variant">
      <div class="cap">${p.name}</div>
      <div class="swatches">${sw}</div>
      <div class="note">${p.note}</div>
      <div class="phone"><div class="screen">
        <div class="months"><div class="month">MAY</div><div class="month sel">JUN 2026</div></div>
        <div class="day-card"><div class="day-header">Today, 11 Jun</div>
          <div>${NODES.map(n=>row(n,p.c)).join("")}</div>
        </div>
      </div></div>
    </div>`;
  }).join("");

  // energy/focus demo (uses palette B's great colour)
  const G = "#4E8C7A";
  document.getElementById("demo").innerHTML = `
    <div class="col"><h3>1 · Text only <span class="tag ok">clean</span></h3>
      <div class="ex"><span class="head-banner" style="background:${G};color:${ink(G)}">GREAT ALERT FOCUSED</span></div>
      <p>Mood owns the colour. Energy + focus are just words in the banner. Calmest.</p></div>
    <div class="col"><h3>2 · Text + icons <span class="tag ok">clean</span></h3>
      <div class="ex"><span class="head-banner" style="background:${G};color:${ink(G)}">GREAT <span class="ef-icon">⚡</span>ALERT <span class="ef-icon">🎯</span>FOCUSED</span></div>
      <p>Icons differentiate energy/focus without a second colour. Scannable, still one hue.</p></div>
    <div class="col"><h3>3 · Separate colours <span class="tag bad">messy</span></h3>
      <div class="ex"><span class="head-banner" style="background:${G};color:${ink(G)}">GREAT</span>
        <span class="chip" style="color:#C24B17;background:rgba(255,149,0,.16);margin-left:4px"><span class="ic">⚡</span>ALERT</span>
        <span class="chip" style="color:#5856D6;background:rgba(88,86,214,.14)"><span class="ic">🎯</span>FOCUSED</span></div>
      <p>Three colours competing in one line — the eye can't tell what colour <i>means</i>. Avoid.</p></div>`;

  document.getElementById("legend").innerHTML = `
    <b>How to choose:</b> pick the row whose <i>great→low</i> sweep reads most clearly as “better→worse” at a glance, then check the swatch strip dims smoothly (varies in lightness, not just hue). <b>B</b> and <b>D</b> are safest — every step is deep enough for white banner text and they hold up in greyscale. <b>A</b> (your current) is lovely but its mint/sky middles force dark text. <b>C</b> is the most “mood-app familiar” but weakest for colour-blind users. Whatever you pick, the takeaway from the bottom row stands: <b>colour = mood only; energy/focus get icons, not colours.</b>`;
</script>
</body>
</html>
