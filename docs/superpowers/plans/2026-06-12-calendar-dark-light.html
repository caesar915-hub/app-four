<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendar — dark + light side by side</title>
<style>
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
         background:#9a9aa0; color:#111; padding:30px 16px 64px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  h1.page { font-size:18px; font-weight:600; color:#fff; margin:0; text-align:center; }
  p.sub { font-size:12.5px; color:#f0f0f2; margin:-4px 0 0; max-width:780px; text-align:center; line-height:1.5; }
  .stage { display:flex; flex-wrap:wrap; gap:24px; justify-content:center; align-items:flex-start; }
  .variant { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .variant .cap { font-size:13px; color:#fff; font-weight:700; }

  .phone { width:360px; border-radius:40px; border:9px solid #2a2a2e; box-shadow:0 18px 48px rgba(0,0,0,.3); overflow:hidden; }
  .screen { padding:18px 15px 30px; min-height:720px; }
  .months { display:flex; gap:20px; padding:6px 4px 4px; }
  .month { font-size:15px; font-weight:600; padding:6px 2px; position:relative; }
  .month.sel { font-weight:700; }
  .month.sel::after { content:""; position:absolute; left:2px; right:2px; bottom:0; height:2px; border-radius:1px; }

  .day-card { border-radius:20px; padding:16px 13px; margin-top:13px; }
  .day-header { font-size:14px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; padding:0 0 14px 2px; }

  .row { display:flex; align-items:flex-start; gap:12px; }
  .rail { position:relative; width:52px; flex:0 0 52px; display:flex; flex-direction:column; align-items:center; }
  .rail .connector { width:1px; flex:1 1 auto; min-height:20px; }
  .row:last-child .rail .connector { display:none; }
  .bead { position:relative; width:52px; height:52px; flex:0 0 52px; }
  .bead .ls { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .bead .time { font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; color:#1C1C1E; }
  .pct-badge { position:absolute; left:50%; bottom:-4px; transform:translateX(-50%); font-size:9.5px; font-weight:800;
               padding:1px 6px; border-radius:999px; font-variant-numeric:tabular-nums; z-index:2; border:0.5px solid; }

  .content { flex:1 1 auto; min-width:0; padding:6px 0 16px; display:flex; flex-direction:column; gap:7px; align-items:flex-start; }
  .row:last-child .content { padding-bottom:2px; }
  /* mood pills are FIXED pastel + dark ink in both themes — they pop on dark, sit softly on light */
  .banner { display:inline-block; white-space:nowrap; font-size:12px; font-weight:700; color:#1C1C1E; line-height:1.3; padding:4px 10px; border-radius:13px; }
  .bi { width:1em; height:1em; vertical-align:-2px; margin-right:1px; }
  .bi-lg { width:1.2em; height:1.2em; vertical-align:-2px; margin-right:1px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:500; padding:3px 9px; border-radius:999px; line-height:1.1; }
  .chip .bi { width:11px; height:11px; vertical-align:-1px; margin:0; }

  .legend { width:780px; max-width:100%; background:#fff; border-radius:14px; padding:14px 18px; box-shadow:0 6px 24px rgba(0,0,0,.18); font-size:12.5px; color:#3a3a3c; line-height:1.6; }
  .legend b{color:#111}
</style>
</head>
<body>

  <h1 class="page">Calendar timeline — dark &amp; light</h1>
  <p class="sub">Same day, same M2 mood pills (fixed pastel + dark ink in both modes). Only the surfaces and chrome adapt: dark mode gets a real dark card (elevated surface + a faint mood tint), an adaptive header, chips, connector and dose badge.</p>

  <div class="stage" id="stage"></div>
  <div class="legend" id="legend"></div>

<script>
  // ---- colour helpers ----
  const rgb = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const hx = (r,g,b) => "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
  const blend = (base, top, a) => { const B=rgb(base),T=rgb(top); return hx(B[0]*(1-a)+T[0]*a, B[1]*(1-a)+T[1]*a, B[2]*(1-a)+T[2]*a); };
  const darken = (h,f) => { const c=rgb(h); return hx(c[0]*(1-f),c[1]*(1-f),c[2]*(1-f)); };

  const PURPLE = "#AF52DE";
  // committed M2 ramp
  const FILL = { low:"#D4705F", flat:"#EA9D72", okay:"#EFD68C", good:"#AED68C", great:"#6BC68A" }; // pastel surface
  const BASE = { low:"#C2503F", flat:"#DE8050", okay:"#E5C46A", good:"#94C56F", great:"#4CAF6E" }; // saturated base
  const SCALE = { low:1, flat:2, okay:3, good:4, great:5 };
  const SCALE_FILL = {1:FILL.low,2:FILL.flat,3:FILL.okay,4:FILL.good,5:FILL.great};
  const SCALE_BASE = {1:BASE.low,2:BASE.flat,3:BASE.okay,4:BASE.good,5:BASE.great};

  const ICON = {
    sparkle:'<path d="M8 1.2 L9.4 6.6 L14.8 8 L9.4 9.4 L8 14.8 L6.6 9.4 L1.2 8 L6.6 6.6 Z" fill="currentColor"/>',
    heart:'<path d="M8 13.6 C2.4 9.3 3 5.1 5.6 5.1 C7.1 5.1 8 6.6 8 6.6 C8 6.6 8.9 5.1 10.4 5.1 C13 5.1 13.6 9.3 8 13.6 Z" fill="currentColor"/>',
    moon:'<path d="M10.6 2.1 A6 6 0 1 0 13.9 10.6 A4.8 4.8 0 0 1 10.6 2.1 Z" fill="currentColor"/>',
    cross:'<path d="M6.6 2.3 h2.8 v3.9 h3.9 v2.8 h-3.9 v3.9 h-2.8 v-3.9 H2.7 V6.2 h3.9 Z" fill="currentColor"/>',
    pill:'<g transform="rotate(-32 8 8)"><rect x="2.4" y="6" width="11.2" height="4" rx="2" fill="currentColor"/></g>',
    bolt:'<path d="M9.2 1.5 L4 9 H7 L6.4 14.5 L12 6.8 H9 Z" fill="currentColor"/>',
    target:'<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2.3" fill="currentColor"/>'
  };
  const svg=(k,c,cls="bi")=>`<svg class="${cls}" viewBox="0 0 16 16" style="color:${c}">${ICON[k]}</svg>`;
  const CHIP_ICON = { feel:"heart", sleep:"moon", se:"cross" };

  const NODES = [
    { time:"16:42", mood:"great", mw:"Great", en:"Alert",  fo:"Focused", carry:75, taken:null, chips:[{t:"feel",l:"Happy"},{t:"feel",l:"Calm"}] },
    { time:"14:30", mood:"good",  mw:"Good",  en:"Steady", fo:"Focused", carry:52, taken:null, chips:[{t:"feel",l:"Relaxed"}] },
    { time:"11:00", mood:"okay",  mw:"Okay",  en:"Tired",  fo:"Scattered", carry:18, taken:null, chips:[{t:"feel",l:"Anxious"}] },
    { time:"09:15", mood:"good",  mw:"Good",  en:"Calm",   fo:"Focused", carry:null, taken:"Concerta 36mg", chips:[{t:"sleep",l:"5h sleep"},{t:"se",l:"Headache"}] },
  ];
  const avgKey = ()=>{ const v=NODES.filter(n=>n.mood).map(n=>SCALE[n.mood]); return Math.round(v.reduce((a,b)=>a+b,0)/v.length); };

  // ---- themes ----
  const THEMES = {
    light: {
      screen:"#FFFFFF", cardBase:"#FFFFFF", tintAlpha:0.16,
      header: k => darken(SCALE_BASE[k], 0.18),
      monthFg:"rgba(60,60,67,0.6)", monthSel:"#000000",
      neutralBg:"rgba(0,0,0,0.06)", neutralFg:"#3a3a3c", chipIcon:"#1C1C1E",
      medFg:"#AF52DE", medBg:"rgba(175,82,222,0.13)",
      connector:"rgba(60,60,67,0.29)",
      badgeBg:"#FFFFFF", badgeFg:"#AF52DE", badgeBorder:"rgba(0,0,0,0.12)"
    },
    dark: {
      screen:"#000000", cardBase:"#1C1C1E", tintAlpha:0.14,
      header: k => SCALE_FILL[k],
      monthFg:"rgba(235,235,245,0.6)", monthSel:"#FFFFFF",
      neutralBg:"rgba(255,255,255,0.12)", neutralFg:"rgba(255,255,255,0.92)", chipIcon:"rgba(255,255,255,0.92)",
      medFg:"#D2A0EE", medBg:"rgba(175,82,222,0.26)",
      connector:"rgba(235,235,245,0.2)",
      badgeBg:"#2C2C2E", badgeFg:"#D2A0EE", badgeBorder:"rgba(255,255,255,0.15)"
    }
  };

  function bead(node, T){
    const S=64,c=S/2,RW=4,GAP=2,R=S/2-2, fill=FILL[node.mood];
    const rings = node.carry!=null ? (()=>{ const r=R-RW/2,C=2*Math.PI*r,dash=node.carry/100*C;
      return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${PURPLE}" stroke-width="${RW}" stroke-linecap="round" stroke-dasharray="${dash} ${C-dash}" transform="rotate(-90 ${c} ${c})"/>`;})() : "";
    const badge = node.carry!=null ? `<div class="pct-badge" style="background:${T.badgeBg};color:${T.badgeFg};border-color:${T.badgeBorder}">${node.carry}%</div>` : "";
    return `<div class="bead"><svg width="100%" height="100%" viewBox="0 0 ${S} ${S}"><circle cx="${c}" cy="${c}" r="${R}" fill="${fill}"/>${rings}</svg>
            <div class="ls"><div class="time">${node.time}</div></div>${badge}</div>`;
  }
  function banner(node){
    return `<span class="banner" style="background:${FILL[node.mood]}">${svg('sparkle','#1C1C1E','bi-lg')} ${node.mw.toUpperCase()} ${svg('bolt','#1C1C1E')} ${node.en.toUpperCase()} ${svg('target','#1C1C1E')} ${node.fo.toUpperCase()}</span>`;
  }
  function row(node, T){
    const a=[];
    if(node.taken) a.push(`<span class="chip" style="color:${T.medFg};background:${T.medBg};font-weight:600">${svg('pill',T.chipIcon)}TAKEN ${node.taken.toUpperCase()}</span>`);
    node.chips.forEach(ch=>a.push(`<span class="chip" style="color:${T.neutralFg};background:${T.neutralBg}">${svg(CHIP_ICON[ch.t],T.chipIcon)}${ch.l}</span>`));
    return `<div class="row"><div class="rail">${bead(node,T)}<div class="connector" style="background:${T.connector}"></div></div>
            <div class="content">${banner(node)}<div class="chips">${a.join("")}</div></div></div>`;
  }

  function phone(name, T){
    const k = avgKey();
    const cardBg = blend(T.cardBase, SCALE_FILL[k], T.tintAlpha);
    return `<div class="variant"><div class="cap">${name}</div>
      <div class="phone"><div class="screen" style="background:${T.screen}">
        <div class="months">
          <div class="month" style="color:${T.monthFg}">MAY</div>
          <div class="month sel" style="color:${T.monthSel}">JUN 2026<span style="position:absolute;left:2px;right:2px;bottom:0;height:2px;border-radius:1px;background:${T.monthSel}"></span></div>
        </div>
        <div class="day-card" style="background:${cardBg}">
          <div class="day-header" style="color:${T.header(k)}">Today, 12 Jun</div>
          ${NODES.map(n=>row(n,T)).join("")}
        </div>
      </div></div></div>`;
  }

  document.getElementById("stage").innerHTML = phone("Light", THEMES.light) + phone("Dark", THEMES.dark);
  document.getElementById("legend").innerHTML =
    `<b>What adapts in dark mode:</b> the day card becomes a real elevated dark surface (<code>secondarySystemBackground</code>) with the average-mood tint layered <i>on top</i> (not as the whole background); the header switches to the brighter mood shade; chips/connector/month text use the dark semantic colours; the dose badge becomes a dark capsule with a light-purple %. <b>What stays fixed:</b> the mood pills (banner + bead) keep their pastel fill and dark ink in both modes — that's intentional, so they read as colourful tags on either surface.`;
</script>
</body>
</html>
