<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calendar — full-width mood bars</title>
<style>
  :root { --purple:#AF52DE; --ink:#1C1C1E; --neutral:#3a3a3c; --sep:rgba(60,60,67,.29); }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
         background:#e9e9ee; color:#000; padding:30px 16px 64px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  h1.page { font-size:18px; font-weight:600; color:#3a3a3c; margin:0; text-align:center; }
  p.sub { font-size:12.5px; color:#6b6b70; margin:-2px 0 0; max-width:680px; text-align:center; line-height:1.5; }

  .phone { width:384px; background:#FFFFFF; border-radius:42px; border:10px solid #111114; box-shadow:0 22px 56px rgba(0,0,0,.18); overflow:hidden; }
  .screen { padding:20px 16px 34px; min-height:820px; }
  .months { display:flex; gap:22px; padding:6px 4px 4px; }
  .month { font-size:16px; font-weight:600; color:rgba(60,60,67,.6); padding:6px 2px; position:relative; }
  .month.sel { font-weight:700; color:#000; }
  .month.sel::after { content:""; position:absolute; left:2px; right:2px; bottom:0; height:2px; border-radius:1px; background:#000; }

  .day-card { border-radius:20px; padding:16px 13px; margin-top:14px; }
  .day-header { font-size:14px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; padding:0 0 16px 2px; }

  .row { display:flex; align-items:flex-start; gap:12px; }
  .rail { position:relative; width:56px; flex:0 0 56px; display:flex; flex-direction:column; align-items:center; }
  .rail .connector { width:1px; flex:1 1 auto; min-height:30px; background:var(--sep); }
  .row:last-child .rail .connector { display:none; }
  .bead { position:relative; width:56px; height:56px; flex:0 0 56px; }
  .bead .ls { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .bead .time { font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; color:#1C1C1E; }
  /* % nudged UP — sits on the lower rim, overlapping the circle */
  .pct-badge { position:absolute; left:50%; bottom:6px; transform:translateX(-50%); font-size:10px; font-weight:800;
               padding:1px 6px; border-radius:999px; font-variant-numeric:tabular-nums; z-index:2; border:0.5px solid rgba(0,0,0,.12);
               background:#fff; color:var(--purple); box-shadow:0 1px 2px rgba(0,0,0,.18); }

  /* more space between check-ins */
  .content { flex:1 1 auto; min-width:0; padding:5px 0 30px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .row:last-child .content { padding-bottom:2px; }

  /* FULL-WIDTH mood bar: fixed font, one line, vertically centred, truncates only in the extreme */
  .banner { display:block; width:100%; border-radius:16px; padding:9px 13px; font-size:15px; font-weight:700; color:#1C1C1E;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1; }
  .banner .bi { width:15px; height:15px; vertical-align:-3px; }
  .banner .bi-lg { width:18px; height:18px; vertical-align:-4px; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; padding:3px 9px; border-radius:999px; line-height:1.1; }
  .chip .bi { width:11px; height:11px; vertical-align:-1px; }
  .chip.neutral { color:var(--neutral); background:rgba(0,0,0,.06); }
  .chip.neutral .bi { color:var(--ink); }
  .chip.med { color:var(--purple); background:rgba(175,82,222,.13); font-weight:600; }
  .chip.med .bi { color:var(--ink); }

  .legend { width:680px; max-width:100%; background:#fff; border-radius:14px; padding:14px 18px; box-shadow:0 6px 24px rgba(0,0,0,.06); font-size:12px; color:#3a3a3c; line-height:1.65; }
  .legend b{color:#3a3a3c}
</style>
</head>
<body>

  <h1 class="page">Calendar — full-width mood bars</h1>
  <p class="sub">Every banner is a full-width bar with one consistent font size (no per-entry resize), text vertically centred. The % badge sits up on the bead's rim, and there's more room between check-ins.</p>

  <div class="phone"><div class="screen">
    <div class="months"><div class="month">MAY</div><div class="month sel">JUN 2026</div></div>
    <div class="day-card" id="card"></div>
  </div></div>

  <div class="legend" id="legend"></div>

<script>
  const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const hx=(r,g,b)=>"#"+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
  const blend=(b,t,a)=>{const B=rgb(b),T=rgb(t);return hx(B[0]*(1-a)+T[0]*a,B[1]*(1-a)+T[1]*a,B[2]*(1-a)+T[2]*a);};
  const darken=(h,f)=>{const c=rgb(h);return hx(c[0]*(1-f),c[1]*(1-f),c[2]*(1-f));};
  const PURPLE="#AF52DE";
  // M2 ramp
  const FILL={low:"#D4705F",flat:"#EA9D72",okay:"#EFD68C",good:"#AED68C",great:"#6BC68A"};
  const BASE={low:"#C2503F",flat:"#DE8050",okay:"#E5C46A",good:"#94C56F",great:"#4CAF6E"};
  const SCALE={low:1,flat:2,okay:3,good:4,great:5};
  const SFILL={1:FILL.low,2:FILL.flat,3:FILL.okay,4:FILL.good,5:FILL.great};
  const SBASE={1:BASE.low,2:BASE.flat,3:BASE.okay,4:BASE.good,5:BASE.great};

  const ICON={
    sparkle:'<path d="M8 1.2 L9.4 6.6 L14.8 8 L9.4 9.4 L8 14.8 L6.6 9.4 L1.2 8 L6.6 6.6 Z" fill="currentColor"/>',
    heart:'<path d="M8 13.6 C2.4 9.3 3 5.1 5.6 5.1 C7.1 5.1 8 6.6 8 6.6 C8 6.6 8.9 5.1 10.4 5.1 C13 5.1 13.6 9.3 8 13.6 Z" fill="currentColor"/>',
    moon:'<path d="M10.6 2.1 A6 6 0 1 0 13.9 10.6 A4.8 4.8 0 0 1 10.6 2.1 Z" fill="currentColor"/>',
    pill:'<g transform="rotate(-32 8 8)"><rect x="2.4" y="6" width="11.2" height="4" rx="2" fill="currentColor"/></g>',
    bolt:'<path d="M9.2 1.5 L4 9 H7 L6.4 14.5 L12 6.8 H9 Z" fill="currentColor"/>',
    target:'<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2.3" fill="currentColor"/>'
  };
  const svg=(k,c,cls="bi")=>`<svg class="${cls}" viewBox="0 0 16 16" style="color:${c}">${ICON[k]}</svg>`;

  // mirrors the screenshot
  const NODES=[
    {time:"09:57",mood:"great",mw:"Great",en:null,fo:null,carry:90,taken:null,chips:[]},
    {time:"09:45",mood:"low",mw:"Low",en:null,fo:null,carry:88,taken:null,chips:[]},
    {time:"00:58",mood:"okay",mw:"Okay",en:null,fo:"Sharp",carry:null,taken:null,chips:[]},
    {time:"00:57",mood:"low",mw:"Low",en:"Tired",fo:null,carry:null,taken:null,chips:[]},
    {time:"00:55",mood:"great",mw:"Great",en:"Charged",fo:"Lockedin",carry:null,taken:null,chips:[{t:"feel",l:"Indifferent"},{t:"feel",l:"Bored"}]},
    {time:"00:55",mood:null,taken:"Concerta 36mg",carry:null,chips:[]},
  ];
  const avgKey=()=>{const v=NODES.filter(n=>n.mood).map(n=>SCALE[n.mood]);return Math.round(v.reduce((a,b)=>a+b,0)/v.length);};

  function bead(node){
    const S=64,c=S/2,RW=4,R=S/2-2, isMed=!node.mood;
    const centre = isMed
      ? `<circle cx="${c}" cy="${c}" r="${R-0.75}" fill="#fff" stroke="var(--sep)" stroke-width="1"/>`
      : `<circle cx="${c}" cy="${c}" r="${R}" fill="${FILL[node.mood]}"/>`;
    const ring = node.carry!=null ? (()=>{const r=R-RW/2,C=2*Math.PI*r,d=node.carry/100*C;
      return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${PURPLE}" stroke-width="${RW}" stroke-linecap="round" stroke-dasharray="${d} ${C-d}" transform="rotate(-90 ${c} ${c})"/>`;})() : "";
    const badge = node.carry!=null ? `<div class="pct-badge">${node.carry}%</div>` : "";
    const col = isMed ? PURPLE : "#1C1C1E";
    return `<div class="bead"><svg width="100%" height="100%" viewBox="0 0 ${S} ${S}">${centre}${ring}</svg>
            <div class="ls"><div class="time" style="color:${col}">${node.time}</div></div>${badge}</div>`;
  }
  function banner(node){
    const c="#1C1C1E";
    let html = `${svg('sparkle',c,'bi-lg')} ${node.mw.toUpperCase()}`;
    if(node.en) html += ` ${svg('bolt',c)} ${node.en.toUpperCase()}`;
    if(node.fo) html += ` ${svg('target',c)} ${node.fo.toUpperCase()}`;
    return `<div class="banner" style="background:${FILL[node.mood]}">${html}</div>`;
  }
  function row(node){
    let body;
    if(node.mood){
      const chips = node.chips.map(ch=>`<span class="chip neutral">${svg('heart','#1C1C1E')}${ch.l}</span>`).join("");
      body = banner(node) + (chips?`<div class="chips">${chips}</div>`:"");
    } else {
      body = `<div class="chips"><span class="chip med">${svg('pill','#1C1C1E')}TAKEN ${node.taken.toUpperCase()} 36MG</span></div>`;
    }
    return `<div class="row"><div class="rail">${bead(node)}<div class="connector"></div></div>
            <div class="content">${body}</div></div>`;
  }

  const k=avgKey();
  const card=document.getElementById("card");
  card.style.background=blend("#FFFFFF", SFILL[k], 0.16);
  card.innerHTML=`<div class="day-header" style="color:${darken(SBASE[k],0.18)}">Today, 12 Jun</div>`+NODES.map(row).join("");

  document.getElementById("legend").innerHTML =
    `<b>Changes:</b> (1) the mood banner is now a <b>full-width bar</b> — one consistent fixed font for every entry, no per-entry shrinking; text vertically centred; a very long combo (see 00:55 GREAT · CHARGED · LOCKEDIN) truncates with “…” rather than resizing. (2) The <b>%</b> badge sits up on the bead's rim. (3) More vertical space between check-ins. The “Taken …” medication entry stays a hugging pill (it's a medication tag, not a mood bar).`;
</script>
</body>
</html>
