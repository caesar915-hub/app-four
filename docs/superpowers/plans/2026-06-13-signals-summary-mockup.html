<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Day Signals — Summary mockup (009-healthkit-signals)</title>
<style>
  :root{--paper:#FAF7F0;--ink:#2B2722;--muted:#8A8174;--line:#E7E0D3;--sleep:#5566A6;--health:#C2557A;}
  body{margin:0;background:#EDE7DA;font-family:'DM Sans',-apple-system,system-ui,sans-serif;color:var(--ink);}
  .phone{max-width:390px;margin:24px auto;background:var(--paper);border-radius:28px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.18);}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .head .title{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:16px;}
  .head .edit{color:var(--muted);font-size:17px;}
  .row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:0;}
  .row .name{color:var(--muted);flex:1;}
  .row .val{font-variant-numeric:tabular-nums;}
  .row .val.empty{color:var(--muted);}
  .src{width:14px;height:14px;display:inline-block;}
  .src.health{color:var(--health);} .src.manual{color:var(--muted);} .src.none{color:#C9C1B2;}
  .bed{width:20px;height:20px;color:var(--sleep);}
  .note{color:var(--muted);font-size:12px;line-height:1.5;margin-top:14px;}
</style>
</head>
<body>
  <div class="phone">
    <div class="card">
      <div class="head"><span class="title">Signals</span><span class="edit">✎</span></div>

      <div class="row">
        <svg class="bed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 0 1 2-2h9a4 4 0 0 1 4 4v4"/><path d="M3 14h17"/><rect x="6.2" y="8.4" width="4.6" height="1.6" rx=".8"/></svg>
        <span class="name">Sleep</span><span class="val">7.4 h · Okay</span>
        <svg class="src health" viewBox="0 0 16 16" fill="currentColor"><path d="M8 14s-6-3.8-6-8a3 3 0 0 1 6-1 3 3 0 0 1 6 1c0 4.2-6 8-6 8z"/></svg>
      </div>

      <div class="row"><span class="name">Activity</span><span class="val">8,240 steps</span><svg class="src health" viewBox="0 0 16 16" fill="currentColor"><path d="M8 14s-6-3.8-6-8a3 3 0 0 1 6-1 3 3 0 0 1 6 1c0 4.2-6 8-6 8z"/></svg></div>
      <div class="row"><span class="name">Heart</span><span class="val">58 bpm</span><span class="src manual">✎</span></div>
      <div class="row"><span class="name">Cycle</span><span class="val empty">—</span><span class="src none">·</span></div>
    </div>
    <div class="note">Sleep = bed icon + indigo + named level (no colour beads). Activity/heart/cycle = plain values. A trailing glyph marks each value's source (Apple Health vs added by you vs not set).</div>
  </div>
</body>
</html>
