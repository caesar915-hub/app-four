<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squirl · DayCard timeline — 10 evolutions (Paper & Pollen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EEE2; --paper:#FBF6EC; --surface:#FFFDF7; --surface2:#EFE7D6; --ink:#221E16; --muted:#8A8270;
    --hair:#E7DECB; --green:#5F8A4C; --amber:#E0A33A; --accent:#B8842A; --med:#7E5CA8;
    --m-low:#DA7A2A; --m-flat:#EDA94A; --m-okay:#9FCB79; --m-good:#5FB36E; --m-great:#2E8B57;
    --shadow:0 2px 6px rgba(60,48,24,.05),0 14px 34px rgba(60,48,24,.08); --shadow-sm:0 1px 2px rgba(60,48,24,.05);
  }
  [data-theme="dark"]{
    --bg:#100F0B; --paper:#1A1812; --surface:#221F18; --surface2:#2C2920; --ink:#F3EEE0; --muted:#9A917C;
    --hair:#34301F; --green:#7CAA64; --amber:#E8B255; --accent:#D8AA52; --med:#A488CC;
    --m-low:#E08A3C; --m-flat:#EFB860; --m-okay:#A9D183; --m-good:#6EC07C; --m-great:#43A268;
    --shadow:0 2px 6px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;}
  .wrap{max-width:1400px;margin:0 auto;padding:48px 28px 120px;}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 14px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(34px,5vw,52px);line-height:1.02;margin:0;letter-spacing:-.025em;}
  .sub{font-family:'Fraunces',serif;font-style:italic;font-size:18px;color:var(--accent);margin:14px 0 0;max-width:64ch;}
  .toggle{position:sticky;top:16px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--hair);border-radius:999px;padding:11px 18px;box-shadow:var(--shadow-sm);z-index:50;}
  .stage{display:flex;gap:48px 40px;flex-wrap:wrap;align-items:flex-start;margin-top:44px;}
  .unit{width:320px;}
  .pn{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .pn .tag{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle;}
  .pn .tag.edge{color:var(--med);background:color-mix(in srgb,var(--med) 14%,transparent);}
  .pd{font-size:12px;color:var(--muted);margin:4px 0 14px;min-height:46px;}

  .phone{width:320px;height:660px;background:#000;border-radius:46px;padding:9px;box-shadow:var(--shadow);}
  .screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;}
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 2px;font-size:11px;font-weight:600;}
  .fr{font-family:'Fraunces',serif;} .mono{font-family:'IBM Plex Mono',monospace;}
  .glyph{display:inline-flex;vertical-align:middle;}

  .medbar{margin:6px 12px 0;padding:10px 13px;border-radius:22px;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(14px);border:1px solid var(--hair);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:10px;}
  .medbar .pill{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--med) 14%,transparent);display:flex;align-items:center;justify-content:center;flex:none;}
  .medbar .mname{font-size:13px;font-weight:700;} .medbar .mmeta{font-size:10.5px;color:var(--muted);margin-top:1px;}
  .medbar .mtrack{width:54px;height:5px;border-radius:4px;background:var(--surface2);overflow:hidden;flex:none;}
  .medbar .mtrack span{display:block;height:100%;background:var(--med);border-radius:4px;}
  .medbar.none .pill{background:var(--surface2);}

  .hdr{padding:12px 16px 0;}
  .hdr .top{display:flex;align-items:center;justify-content:space-between;}
  .hdr .month{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
  .hdr .today{font-size:10px;font-weight:700;color:var(--accent);border:1.2px solid var(--accent);border-radius:20px;padding:3px 9px;}
  .wcaps{display:flex;margin-top:10px;} .wcaps span{flex:1;text-align:center;font-size:10px;color:var(--muted);font-weight:600;}
  .drow{display:flex;margin-top:3px;}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:3px;}
  .day .n{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;font-weight:600;}
  .day.today .n{border:1.6px solid var(--ink);}
  .day.sel .n{background:var(--ink);color:var(--bg);}
  .day.future .n{color:var(--muted);}
  .day .dot{width:6px;height:6px;border-radius:50%;}
  .divider{height:1px;background:var(--hair);margin:10px 16px 0;}

  .list{flex:1;overflow:hidden;padding:12px 14px 70px;-webkit-mask-image:linear-gradient(transparent,#000 12px,#000 calc(100% - 60px),transparent);mask-image:linear-gradient(transparent,#000 12px,#000 calc(100% - 60px),transparent);}
  .daycard{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden;margin-bottom:11px;box-shadow:var(--shadow-sm);}
  .wash{padding:9px 14px;display:flex;align-items:center;justify-content:space-between;}
  .wash .dl{font-family:'Fraunces',serif;font-weight:600;font-size:14px;}
  .wash .dr{font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .tlrow{display:flex;gap:11px;padding:11px 14px;border-top:1px solid var(--hair);}
  .tlrow .bcol{display:flex;flex-direction:column;align-items:center;flex:none;padding-top:1px;}
  .tlrow .line{width:2px;flex:1;background:var(--hair);margin-top:3px;}
  .tlrow .time{font-size:10.5px;color:var(--muted);}
  .tlrow .summary{font-size:13.5px;font-weight:600;margin-top:2px;}
  .tlrow .chips{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
  .chip{font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:3px 8px;border-radius:20px;text-transform:uppercase;}
  .chip.med{background:color-mix(in srgb,var(--med) 14%,transparent);color:var(--med);}
  .chip.sleep{background:color-mix(in srgb,#5566A6 16%,transparent);color:#5566A6;}

  .empty{padding:24px 16px;text-align:center;}
  .empty .fr{font-size:17px;font-weight:500;}
  .empty .t{font-size:12.5px;color:var(--muted);margin-top:5px;}
  .speak{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--green),color-mix(in srgb,var(--amber) 55%,var(--green)));color:#fff;border-radius:999px;padding:11px 18px;font-weight:700;font-size:13px;margin-top:14px;box-shadow:var(--shadow-sm);}

  .tabbar{position:absolute;left:16px;right:16px;bottom:11px;height:50px;border-radius:25px;background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(14px);border:1px solid var(--hair);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:space-around;}
  .tb{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:9px;font-weight:600;}
  .tb.on{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Squirl · Paper &amp; Pollen · DayCard timeline · 10 evolutions</p>
      <h1>Your timeline, ten ways</h1>
      <p class="sub">Grounded in your real calendar — glass med bar, month + day-row with mood dots, the DayCard timeline, tab bar — reskinned to DESIGN.md. Six DayCard treatments, four edge states. Toggle light/dark.</p>
    </div>
    <button class="toggle" onclick="toggleTheme()">◐ light / dark</button>
  </header>
  <div class="stage" id="stage"></div>
</div>

<script>
const RAMP={1:'--m-low',2:'--m-flat',3:'--m-okay',4:'--m-good',5:'--m-great'};
const FILL={3:'#B9DB9C',4:'#7EC38A',2:'#FDC06C'};
const MOODW=['Low','Flat','Okay','Good','Great'];
function gMood(hex,l,base){const s=base+l*3,fo=(0.42+l*0.145).toFixed(2),o=l>=4,w=o?Math.round(s*1.15):s;return `<svg width="${w}" height="${s+5}" viewBox="0 0 24 26"><path d="M12 25 C12 18 12 14 12 ${o?9:11}" stroke="${hex}" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M12 ${o?9:11} C ${o?4:6} ${o?13:14}, ${o?5:6} ${o?2:5}, 12 1 C ${o?19:18} ${o?2:5}, ${o?20:18} ${o?13:14}, 12 ${o?9:11} Z" fill="${hex}" fill-opacity="${fo}" stroke="${hex}" stroke-width="1.3"/>${l>=3?`<path d="M12 ${o?9:11} L12 4" stroke="${hex}" stroke-width="1" opacity="0.5"/>`:''}${l>=5?`<circle cx="12" cy="6" r="2" fill="${hex}"/>`:''}</svg>`;}
function icCapsule(c,sz){return `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><rect x="4.5" y="9" width="15" height="6" rx="3" fill="none" stroke="${c}" stroke-width="1.7"/><path d="M12 9.2 V14.8" stroke="${c}" stroke-width="1.3"/><path d="M7.5 9 a3 3 0 0 0 0 6 H12 V9 Z" fill="${c}" fill-opacity="0.22"/></g></svg>`;}
const cssv=v=>v&&v.startsWith('var(')?getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1).trim()).trim():v;
const mc=l=>cssv('var('+RAMP[l]+')');
const tint=(h,p)=>`color-mix(in srgb, ${h} ${p}%, var(--surface))`;
const mg=(l,b)=>`<span class="glyph">${gMood(mc(l),l,b||7)}</span>`;
const cap=(sz)=>`<span class="glyph">${icCapsule(cssv('var(--med)'),sz||16)}</span>`;

// concentric medication-ring bead (signature element). mood=1-5 or null(hollow). doses=[progress...] oldest first→outermost
function ringBead(mood,doses){
  const S=34,c=17; doses=doses||[]; const n=Math.min(3,doses.length);
  let rings='';
  for(let i=0;i<n;i++){ const r=8+(n-1-i)*3.2; const C=2*Math.PI*r; const p=Math.min(0.99,doses[i]); rings+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${cssv('var(--med)')}" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="${(p*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})" opacity="0.9"/>`; }
  const center = mood?`<circle cx="${c}" cy="${c}" r="5.2" fill="${mc(mood)}"/>`:`<circle cx="${c}" cy="${c}" r="5" fill="var(--bg)" stroke="${cssv('var(--muted)')}" stroke-width="1.6"/>`;
  return `<span class="glyph"><svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${rings}${center}</svg></span>`;
}

const WEEK=[[9,3],[10,4],[11,2],[12,4],[13,5],[14,3],[15,4]];
function shell(opts){
  const {medState='active',sel=15,list}=opts;
  const med = medState==='none'
    ? `<div class="medbar none"><span class="pill">${icCapsule(cssv('var(--muted)'),16)}</span><div style="flex:1"><div class="mname" style="color:var(--muted)">No medication today</div><div class="mmeta">Nothing logged</div></div><span style="font-size:16px;color:var(--muted)">＋</span></div>`
    : `<div class="medbar"><span class="pill">${cap(16)}</span><div style="flex:1"><div class="mname">Concerta 18 mg</div><div class="mmeta">Winding down · ends 02:34</div></div><span class="mtrack"><span style="width:58%"></span></span></div>`;
  const days=WEEK.map(([n,m])=>{const isSel=n===sel,today=n===15,fut=n>15;return `<div class="day ${today?'today':''} ${isSel?'sel':''} ${fut?'future':''}"><span class="n">${n}</span><span class="dot" style="background:${m&&!fut?mc(m):'transparent'}"></span></div>`;}).join('');
  return `<div class="phone"><div class="screen">
    <div class="statusbar"><span>14:34</span><span>􀙇 􀉪 54</span></div>
    ${med}
    <div class="hdr"><div class="top"><span class="month">June 2026 ›</span><span class="today">Today</span></div>
      <div class="wcaps"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="drow">${days}</div></div>
    <div class="divider"></div>
    <div class="list">${list}</div>
    <div class="tabbar"><div class="tb on">◷<span>Calendar</span></div><div class="tb">◍<span>Check-in</span></div><div class="tb">◳<span>Insights</span></div><div class="tb">⚙<span>Settings</span></div></div>
  </div></div>`;
}
// timeline row
function row(time,mood,summary,chips,doses,last){
  return `<div class="tlrow"><div class="bcol">${ringBead(mood,doses)}${last?'':'<span class="line"></span>'}</div><div style="flex:1"><div class="time">${time}</div><div class="summary">${summary}</div>${chips?`<div class="chips">${chips}</div>`:''}</div></div>`;
}
const chipMed='<span class="chip med">'+'Taken · Concerta</span>';
const chipSleep='<span class="chip sleep">Slept 7h30</span>';

// ===== 10 proposals =====
const P=[
{n:'1 · Wash Header', tag:'card', edge:false, d:'The canonical card, Paper & Pollen: a mood-tinted wash header with the sprout glyph, then timeline rows with ring-beads and chips.',
 list:()=>`<div class="daycard"><div class="wash" style="background:${tint(mc(4),50)}"><span class="dl">Mon 15 Jun</span><span class="dr" style="color:${mc(4)}">${mg(4,8)} Good</span></div>
   ${row('09:12',4,'Steady after the morning walk',chipMed,[0.62])}
   ${row('14:40',3,'Bit foggy in the afternoon','',[],true)}</div>
   <div class="daycard"><div class="wash" style="background:${tint(mc(3),50)}"><span class="dl">Sun 14 Jun</span><span class="dr" style="color:${mc(3)}">${mg(3,8)} Okay</span></div>${row('20:10',3,'Quiet evening, low key','',[],true)}</div>`},

{n:'2 · Ring Beads', tag:'card', edge:false, d:'Foregrounds the signature: concentric purple dose-rings on each bead (oldest outermost), so the day’s medication arc reads on the timeline itself.',
 list:()=>`<div class="daycard"><div class="wash" style="background:${tint(mc(4),50)}"><span class="dl">Mon 15 Jun</span><span class="dr" style="color:${mc(4)}">${mg(4,8)} Good</span></div>
   ${row('08:30',4,'Took the morning dose',chipMed,[0.15])}
   ${row('13:00',3,'Both doses active now',chipMed,[0.62,0.2])}
   ${row('18:45',4,'Wearing off, gentle','',[0.9,0.55],true)}</div>`},

{n:'3 · Compact Rows', tag:'card', edge:false, d:'Denser timeline: small bead, time + summary on one line, no wash. For days with many check-ins — more on screen, still calm.',
 list:()=>`<div class="daycard"><div class="wash"><span class="dl">${mg(4,7)} Mon 15 Jun</span><span class="dr" style="color:var(--muted)">4 check-ins</span></div>
   ${['09:12|4|Morning walk','11:40|3|Deep work block','14:40|3|Foggy patch','19:05|4|Good evening'].map((r,i,a)=>{const[t,m,s]=r.split('|');return `<div class="tlrow" style="padding:8px 14px"><div class="bcol">${ringBead(+m,i===0?[0.4]:[])}${i===a.length-1?'':'<span class="line"></span>'}</div><div style="flex:1;display:flex;align-items:center;gap:8px"><span class="mono" style="font-size:10px;color:var(--muted);width:32px">${t}</span><span style="font-size:13px;font-weight:600">${s}</span></div></div>`;}).join('')}</div>`},

{n:'4 · Summary-first', tag:'card', edge:false, d:'The card header is the whole read at rest (“Good · 3 check-ins · meds taken”); rows stay folded until you open it. Progressive disclosure.',
 list:()=>`<div class="daycard"><div class="wash" style="background:${tint(mc(4),50)}"><span class="dl">${mg(4,8)} Mon 15 · Good</span><span class="dr" style="color:var(--muted)">3 · ${cap(13)} ⌄</span></div></div>
   <div class="daycard"><div class="wash" style="background:${tint(mc(3),50)}"><span class="dl">${mg(3,8)} Sun 14 · Okay</span><span class="dr" style="color:var(--muted)">2 ⌄</span></div></div>
   <div class="daycard"><div class="wash" style="background:${tint(mc(5),50)}"><span class="dl">${mg(5,8)} Sat 13 · Great</span><span class="dr" style="color:var(--muted)">4 · ${cap(13)} ⌄</span></div></div>`},

{n:'5 · Color Memory', tag:'card', edge:false, d:'A strong full-bleed mood gradient wash per day (Daylio-style color memory) — you recognise a day by its colour before reading a word.',
 list:()=>[ [15,4,'Good','Steady, shipped the thing'],[14,3,'Okay','Quiet, even keel'],[13,5,'Great','Best day in a while'] ].map(([n,m,w,s])=>`<div class="daycard" style="border:none"><div class="wash" style="background:linear-gradient(120deg, ${mc(m)}, ${tint(mc(m),35)});padding:16px 16px"><div><div class="dl" style="color:#fff;font-size:16px">${w}</div><div style="color:#fff;opacity:.85;font-size:11.5px;margin-top:2px">${s}</div></div><div style="text-align:right;color:#fff"><div style="font-size:12px;font-weight:700">${n} Jun</div></div></div></div>`).join('')},

{n:'6 · Rich Node', tag:'card', edge:false, d:'A fully-loaded day: combined recording+dose nodes with rings, sleep + med chips, multiple rows. The dense real day, still legible.',
 list:()=>`<div class="daycard"><div class="wash" style="background:${tint(mc(4),50)}"><span class="dl">Mon 15 Jun</span><span class="dr" style="color:${mc(4)}">${mg(4,8)} Good</span></div>
   ${row('08:30',4,'Woke rested, took meds',chipMed+chipSleep,[0.1])}
   ${row('12:15',3,'Lunch dip, second dose',chipMed,[0.5,0.12])}
   ${row('16:20',4,'Locked in, peak focus','',[0.78,0.42])}
   ${row('22:00',3,'Winding down for bed',chipSleep,[],true)}</div>`},

{n:'7 · Quiet Day', tag:'edge', edge:true, d:'A logged-in day with no check-ins. Reads as permission, never red or overdue — with a gentle way back in.',
 list:()=>`<div class="daycard"><div class="wash"><span class="dl">Mon 15 Jun</span><span class="dr" style="color:var(--muted)">—</span></div>
   <div class="empty"><div class="fr">No check-ins yet</div><div class="t">That’s alright. Squirl’s here when you are.</div><div class="speak">◍ Speak a check-in</div></div></div>
   <div class="daycard"><div class="wash" style="background:${tint(mc(3),50)}"><span class="dl">Sun 14 Jun</span><span class="dr" style="color:${mc(3)}">${mg(3,8)} Okay</span></div>${row('19:30',3,'Quiet evening','',[],true)}</div>`},

{n:'8 · No-Meds Day', tag:'edge', edge:true, medState:'none', d:'A day with no medication: the bar shows a calm “none today” state and the cards carry no med chips. No nagging, no empty progress bar.',
 list:()=>`<div class="daycard"><div class="wash" style="background:${tint(mc(2),50)}"><span class="dl">Mon 15 Jun</span><span class="dr" style="color:${mc(2)}">${mg(2,8)} Flat</span></div>
   ${row('11:00',2,'Skipped the dose to see','',[])}
   ${row('15:30',2,'Foggier, but calmer in the chest','',[],true)}</div>`},

{n:'9 · Future Day', tag:'edge', edge:true, sel:18, d:'A day that hasn’t happened. Selecting ahead shows a soft “not yet”, not an error or a blank — time stays legible.',
 list:()=>`<div class="daycard"><div class="wash"><span class="dl" style="color:var(--muted)">Thu 18 Jun</span><span class="dr" style="color:var(--muted)">—</span></div>
   <div class="empty"><div class="fr" style="color:var(--muted)">Not yet</div><div class="t">This day hasn’t happened. Nothing to see — and that’s fine.</div></div></div>`},

{n:'10 · First Run', tag:'edge', edge:true, d:'An empty calendar before any data exists: the day-row dots are bare, and a warm prompt invites the very first check-in.',
 list:()=>`<div class="daycard" style="border-style:dashed"><div class="empty" style="padding:34px 18px"><div class="fr">Your days will gather here</div><div class="t">Each check-in becomes a quiet entry on your timeline. Start whenever you like.</div><div class="speak">◍ Speak your first check-in</div></div></div>`},
];

function render(){
  document.getElementById('stage').innerHTML=P.map(p=>{
    const tagcls=p.edge?'tag edge':'tag';
    return `<div class="unit"><div class="pn">${p.n}<span class="${tagcls}">${p.edge?'EDGE STATE':'DAYCARD'}</span></div><div class="pd">${p.d}</div>${shell({medState:p.medState||'active',sel:p.sel||15,list:p.list()})}</div>`;
  }).join('');
}
function toggleTheme(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark');render();}
document.documentElement.setAttribute('data-theme','light');
render();
</script>
</body>
</html>
