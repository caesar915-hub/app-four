<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NLP Extractor — Evaluation Browser</title>
<style>
  :root{--cor:#1a8a4a;--par:#c98a00;--mis:#d2691e;--fp:#c0392b;--na:#9aa0a6;--bg:#f7f6f2;--card:#fff;--ink:#23262b;--mut:#6b7178;--line:#e6e3da}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;background:rgba(247,246,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;z-index:10}
  h1{font:600 17px/1.2 "Iowan Old Style",Georgia,serif;margin:0 0 8px}
  .stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-bottom:10px}
  .stats b{color:var(--ink)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  select,input,button{font:13px inherit;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
  input[type=search]{min-width:220px}
  button{cursor:pointer}
  button.q{background:#efece4}
  button.q:hover{background:#e6e2d6}
  #count{font-size:12px;color:var(--mut);margin-left:auto}
  main{padding:16px 20px;max-width:1000px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .crow{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .id{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut)}
  .ov{font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:20px;letter-spacing:.04em}
  .ov.good{background:#e3f3e8;color:var(--cor)} .ov.ok{background:#fbf0d6;color:var(--par)} .ov.poor{background:#f8e0db;color:var(--fp)}
  .gold{font-size:11px;color:var(--mut)}
  .gold b{color:var(--ink)}
  .text{white-space:pre-wrap;color:#33373d;background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:6px 0;font-size:13px}
  .sig{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chip{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;display:inline-flex;gap:6px;align-items:center}
  .chip .v{font-weight:600}
  .chip[data-j=correct]{border-color:var(--cor)} .chip[data-j=correct] .dot{background:var(--cor)}
  .chip[data-j=partial]{border-color:var(--par)} .chip[data-j=partial] .dot{background:var(--par)}
  .chip[data-j=missed]{border-color:var(--mis)} .chip[data-j=missed] .dot{background:var(--mis)}
  .chip[data-j=false_positive]{border-color:var(--fp)} .chip[data-j=false_positive] .dot{background:var(--fp)}
  .chip[data-j=na]{opacity:.6} .chip[data-j=na] .dot{background:var(--na)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .meta{font-size:12px;color:var(--mut);margin:4px 0}
  .note{font-size:13px;color:#444;border-left:3px solid var(--line);padding:2px 0 2px 10px;margin-top:8px}
  .legend{font-size:11px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
  .legend span{display:inline-flex;gap:5px;align-items:center}
</style></head>
<body>
<header>
  <h1>NLP Extractor — Evaluation Browser</h1>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <select id="fOverall"><option value="">overall: any</option><option>good</option><option>ok</option><option>poor</option></select>
    <select id="fSignal"><option value="">signal: any</option><option>mood</option><option>energy</option><option>focus</option><option>meds</option></select>
    <select id="fVerdict"><option value="">verdict: any</option><option>correct</option><option>partial</option><option>missed</option><option>false_positive</option><option>na</option></select>
    <input type="search" id="fSearch" placeholder="search text or note…">
    <button class="q" data-q="poor">Poor only</button>
    <button class="q" data-q="moodfp">Mood FPs</button>
    <button class="q" data-q="energymiss">Energy misses</button>
    <button class="q" data-q="reset">Reset</button>
    <span id="count"></span>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--cor)"></i>correct</span>
    <span><i class="dot" style="background:var(--par)"></i>partial</span>
    <span><i class="dot" style="background:var(--mis)"></i>missed</span>
    <span><i class="dot" style="background:var(--fp)"></i>false positive</span>
    <span><i class="dot" style="background:var(--na)"></i>n/a</span>
  </div>
</header>
<main id="list"></main>
<script>
const DATA = [{"id": "d90a0c80", "text": "When I first started on Adderall mine were from Sandoz. I was on that for quite a few months before my pharmacy decided to mostly do Teva. \n\nI much prefer the Sandoz generic, personally. Sandoz was great at cutting through my brain fog, allowing me to think more clearly. The first time I was prescribed the generic from Teva I noticed right away that it was much less effective at handling my ADHD symptoms than Sandoz. I had been taking 20mg twice a day of the Sandoz but I've since had to go up to 30mg twice a day with the Teva version and I still don't feel like I'm getting as much benefit from them. The Sandoz also seemed to last longer, whereas as I almost feel rather like an addict with the Teva because the benefits I do get just do not last. \n\nI've thought about seeing if my doctor could specifically write for the Sandoz generic but have never gone through with it because, well, do I ", "mood": "good", "energy": null, "focus": "foggy", "meds": ["Adderall"], "feelings": ["curious"], "activities": ["Errands", "Work"], "sleepHours": null, "sideEffect": false, "title": "When I first started on Adderall mine were", "gold": ["focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "partial", "jmeds": "correct", "overall": "ok", "note": "mood=good is unsupported (post is a dry generic-comparison); focus=foggy misreads 'brain fog' that Sandoz *cleared*, not a current state."}, {"id": "39b916fd", "text": "&gt; So, next time she comes in yelling, tell her you're sorry about the messed up room, and show her something awesome you did instead.\n\nDamn, every kid should know this advice...\n\nAlso, I empathise with your personal story about how you can still focus on SOME things. I actually study computer science at the moment at university, in high school I was getting D and E grades, but I did get a B in one subject, and at university I'm doing much better. I find programming easier to focus on because some problems can give instant gratification when you get something working. But if I'm doing something tedious, or couldn't find why there was a problem with the program, I found I couldn't keep going and got bored very easy. It's why I can program for 6 hours, but can't work on a math problem for 5 min before giving up. \n\nI just started stims, and my focus has gone through the roof. Can't wait t", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "&gt", "gold": ["focus"], "jmood": "partial", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=sharp nails 'focus has gone through the roof'; mood reads more excited/elated than plain 'good'."}, {"id": "ab581be1", "text": "Not at all! I absolutely get what you mean about hyper-focus. If I'm writing a paper, for example, and I get into that zone, I'll look up and realize it's five hours later and I've cranked out some serious work. That quality of ADD can be amazing when I can actually managed to get myself to hyperfocus on the stuff I need to work on. \n\nIt's tougher with this sort of thing, though, because it's very dry subject matter, and a lot of it is just \"practice\". There isn't a lot of creativity or problem-solving involved in the work, which is ironic, because there's a ton of creativity and problem-solving involved in actually doing this sort of thing professionally (server and network troubleshooting). It's why I want to do this for a living (right now I'm only doing it part-time). It's one of the few ways I can get myself to focus for a long period of time: if there's an unsolved issue, I can foc", "mood": "great", "energy": "steady", "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies", "Resting", "Work"], "sleepHours": null, "sideEffect": false, "title": "I absolutely get what you mean about hyper-focus", "gold": ["focus"], "jmood": "correct", "jenergy": "false_positive", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "energy=steady invented — text describes hyperfocus, says nothing about energy level."}, {"id": "863018b6", "text": "i stopped by this sub reddit because i just went to the psychiatrist today due to problems with tiredness, memory, and motivation.  she broke me down in 30 minutes then prescribed me concerta.  \n\nyour description of your morning sounds like mine.  i have a 15-20 minute conversation with myself about \"do i really need a job?\" and \"being homeless wouldn't be so bad\" and \"i wish i could go to work unbrushed, unwashed in my mario pjs\" until i finally convince myself the \"pros\" outweigh the \"cons\" and the biggest \"pro\" of all?  coffee.  i love coffee.  though lately even coffee isn't enough, hence the p-doc.\n\nso my suggestion is to find/create some sort of reward.  sort of like what /u/603d3c94-c27d-4106-ae84-0612db0fa7ba said.  for me it's coffee, and \"if i don't get my ass to work then i'm letting all these people down.\"  what it sounds like to me is you might not be medicated? or under med", "mood": null, "energy": null, "focus": null, "meds": ["Concerta"], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I stopped by this sub reddit because i", "gold": ["mood", "energy"], "jmood": "missed", "jenergy": "missed", "jfocus": "na", "jmeds": "correct", "overall": "poor", "note": "Clear low energy ('tiredness') and low/depressive mood ('homeless wouldn't be so bad') both returned null."}, {"id": "4aa5b28f", "text": "All the time. May or may not be where I'm at right now, still trying to force myself to do something for this paper that I need to do entirely today...but I hardly even know what to do with it. I definitely know the feeling, getting overwhelmed because there's a lot of different tasks to do (or a lot of step to one task, or whatever) and then you can't focus on what part you need to do next (or even figure out what part that should be) because it all feels equally important or you try to start part of it but youre distracted thinking about how much else you'll need to do- and then you avoid making a decision by...going on reddit or something instead? And not accomplishing much at all? It happens to me way too much.\n\nI definitely spent hours mostly just thinking about how much work I need to do this week and last week- instead of actually getting anywhere on the work. Wish I had advice to", "mood": "great", "energy": "steady", "focus": "present", "meds": [], "feelings": ["overwhelmed", "guilty"], "activities": ["Hobbies", "Resting", "Work"], "sleepHours": null, "sideEffect": false, "title": "I definitely know the feeling", "gold": ["mood", "energy", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Inverted: an overwhelmed, can't-focus, procrastinating post scored mood=great / focus=present / energy=steady."}, {"id": "0874484b", "text": "That’s really shitty of them. It’s not any of their business. And that’s highly inappropriate. That being said, never feel guilty for using the systems put in place to help people who need it. Eg, you with you medication. This gonna sound like the “don’t feel guilty, your fine” but I get it. You feel you shouldn’t have to need them (that’s what it was with me) but my friend, there’s no shame in it. Your not cheating. Personally, if you haven’t already, and can afford it. I recommend a therapist or some kind of counseling. Sometimes just talking through these things an impartial party can really go a long way", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": ["guilty"], "activities": ["Hanging Out"], "sleepHours": null, "sideEffect": false, "title": "That being said", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=okay weak — writer is reassuring someone else; the guilt is the addressee's, not a stated mood of the author."}, {"id": "a914ed9a", "text": "Wine is worse than beer!\n\nI started with a bottle of wine and then felt guilty. Next I know, a 6-pack is gone.\n\nI will try to do a week sober.\n\nI'm not sure what to do at this point. I either need more things to distract me (my dad does computer animated Christmas lights on his house) or maybe an addiction counselor before it becomes a full-blown addiction. Alcohol is the only thing that makes me feel \"normal\" at this point, even with my wife.\n\nMy brother gave me an Olympic barbell and weight set that he doesn't use anymore, and I *still* can't figure out how to make a schedule or regimen that I will stick to.\n\nI am broken.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["guilty"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I started with a bottle of wine", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "'I am broken' + guilt is an unmistakable low mood, returned null."}, {"id": "13992874", "text": "I have actually never taken any meds (except for Aspirin when I have a rly bad headache once a year or smth like that) and I don't really know what a sugar pill is, but I didn't take one too. My next appointment with my doc is at the end of the month. The thing is im at a kinda important situation at work, where I really need to focus. Should I just try one and a half pill until I see my doc again?", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "I have actually never taken any meds (except", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=sharp inverted — writer 'really needs to focus' and is asking whether to try a pill; no sharp focus present."}, {"id": "7e3daf76", "text": "Did you start with lower doses? Have you tried different meds? I'll try to help you with psych aspect of things because I'm not a psych.\n\n\nThe thing that helped me was to move to a place of my own. I cut all activities other than work and studies and focused on having a better future for myself and it is doing good for me.\n\n\nI'm naturally introverted and it drains me to have a roommate especially if the roommate naturally has a strong personality.\n\n\nIt might just be me but growing up with ADHD, you're probably lagging in focus and executive functioning. For example, I always felt that there way something missing in me. I couldn't pay attention to a conversation in a group setting. I would tune out completely beyond the 3 minute mark. I couldn't study unless I made myself feel immense pressure. All of this might, but not necessarily, lead to feeling of lack and feeling that you have somet", "mood": "good", "energy": "sluggish", "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I cut all activities other than work and", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "partial", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=sharp wrong — the post describes focus *deficits* ('lagging in focus, executive functioning'), not sharpness."}, {"id": "8ea8440b", "text": "I think it depends on what your coffee intake was before starting Adderall.  If you body is used to a certain level of caffeine intake I don't think it should be dangerous to mix the two.  But everybody is different so feel it out.  If you feel bad after mixing the two, don't mix them.\n\nWhen I was taking generic adderall in smaller doses I had a couple of cups of coffee with it and felt fine, but I did have to cut down on my number of moka pots I brewed during the day.\n\nTo me it sounds like op isn't a big coffee drinker which could be why they're having such a marked response.", "mood": "okay", "energy": null, "focus": "present", "meds": ["Adderall", "Adderall"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I think it depends on what your coffee", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "poor", "note": "Pure coffee+Adderall advice; mood=okay and focus=present both fabricated. Meds also duplicated (Adderall x2)."}, {"id": "886f7d6d", "text": "10mg is super low, 10mg was intended as a titration dose. The typical starting dose is 30mg which is to be increased at weekly intervals by 10mg until the therapeutic dosage is found. I'm currently on 40mg and I can tell it's too low. It wears off while Im still at work and I become distractible and unproductive. I'm hoping to get my doctor to increase the dose at the next visit but I feel like he doesn't really understand how to prescribe it properly so I'm looking to get a referral to a psychiatrist to get it sorted out. You should definitely try higher doses to properly assess whether it's right for you.", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "It wears off while Im still at work", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=distracted matches 'become distractible and unproductive'. Clean."}, {"id": "1fd60f2e", "text": "I’ve done it multiple times before for short periods most recently was last year, when I got out four of them and they were all tired and whiny from a long day of running errands with me and for a full five minutes I didn’t notice that my 1 year old wasn’t in the house. I’d left him strapped into his car seat because instead of throwing a fit to get out of it like his siblings he had fallen asleep. I felt like a horrible mother even though my husband assured me it was an accident and he was fine,but fuck I still check religiously and throw literally everything I need into the backseat if I go anywhere, even if the kids aren’t coming just because I was terrified of a repeat", "mood": "okay", "energy": "tired", "focus": null, "meds": [], "feelings": [], "activities": ["Errands", "Fitness"], "sleepHours": null, "sideEffect": false, "title": "I’ve done it multiple times before for short", "gold": ["energy"], "jmood": "partial", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=tired is misattributed to the *kids* ('they were all tired'); author's own state is guilt/distress, so mood=okay also understates."}, {"id": "bae58e6c", "text": "Well I have only tried/ been prescribed adderall XR 15mg and it helps me so much to be productive but I get told  that I’m boring or not the same when on it. I noticed this in myself as well and over time I’ve gotten better at acting myself while on it. \n\nOne thing that sucks about it though is the comedown. After you comedown you feel depressed, not much desire to do anything, trouble sleeping, just feeling like everything is pointless. Because of the horrible comedowns I only take adderall when I really need it like when I study for a test or am taking a test. This means I will take it maybe 1-3 times a week rather than daily. \n\nI would recommend trying medication for your ADHD as it can be very helpful. If you try a medication and don’t find it very helpful Just tell your doctor and try another until you do. \n\n(Btw 16 y/o male)", "mood": "low", "energy": null, "focus": null, "meds": ["Adderall XR", "Adderall"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I have only tried/ been prescribed adderall XR", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "missed", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "mood=low fits the depressed comedown; but 'not much desire to do anything' is low energy and was missed."}, {"id": "75c10258", "text": "Aw yeah totally. Im 25 and its still up there in my all time favourites. Your Mom probably never realised at the time just how cherished and memorable her actions that day would be for you. ����\n\nGamesharks were a device that you could connect to your Gameboy to cheat. You input some codes and you could get things such as any Pokemon you choose spawning in your next wild encounter, or xx number of items appearing in your PC or bag (rare candies and master balls all day). I had a couple of friends that used Gamesharks back then and I felt that it just spoiled everything that was great about the Pokemon games.\n\nBTW didn't realise Block Busters was also a thing in America. Those were the days!", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I had a couple of friends that used", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood=great matches warm nostalgia ('all time favourites'). Clean."}, {"id": "87bdc5e4", "text": "For reading you could try reading aloud or whispering whatever you need to learn, I find that helps me as I have to semi focus on the text even if my brain is determined to think about something else so I can actually absorb some of the text instead of just my eyes passing over it and as I'm also hearing the words at the same time it means I can actually absorb some of the information. I hope that helps", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "For reading you could try reading aloud or", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=sharp wrong — a study tip about *forcing* semi-focus while reading, not a sharp-focus state."}, {"id": "40284567", "text": "&gt; Computer science. Something I'm still very passionate about,\n\nDude...  Seriously...\n\n**ONE:**  Kiss of Death?  From a *high-school* English teacher?  heh.  Sorry...  Listen, you may like the guy...  You may admire teachers; maybe you've had some really good ones you respect.\n\nMy experience has been *much* different.  I have little to no respect for most of them.  Why?  Respect is earned, not given away.  Most of my \"teachers\" failed to earn mine.\n\nI'm an adult, a grown man with a long and successful career in IT as a programmer.  If a high-school teacher were to confront me and attempt to insult me in any way, I would verbally eviscerate him.  Just sayin'.\n\nAnd \"All that would tell the school is that despite being smart, I don't know how to focus and apply myself.\"  No.  All that would tell anyone with a brain in their head is you didn't really bother to do the bullshit busywork the", "mood": "okay", "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "And \"All that would tell the school is", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "A teacher-bashing rant; focus=present comes from quoting the addressee's worry, and mood=okay is unsupported."}, {"id": "d0f0f2bc", "text": "Hmm interesting! So you take 40mg in the morning? How long do you find that usually lasts for you? Right now my Adderall seems to work until 2pm at the latest, and I take it at 8:30am when I get to work. I was thinking of discussing a small dose as a booster for the afternoons, but I've almost been beginning to wonder if I'll need to try a whole different medication instead. I guess I should try higher doses or boosters though first before giving up on Adderall. \n\nMy psychiatrist's only concern is that we're in the process of figuring out if I have some form of bipolar disorder (due to my family history/symptoms), so medication-induced hypomania is a concern as well. Having multiple psych conditions and trying to treat them effectively is endlessly frustrating.", "mood": null, "energy": null, "focus": null, "meds": ["Adderall", "Adderall"], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Now my Adderall seems to work until 2pm", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "'endlessly frustrating' is a genuine frustrated mood that was returned null; meds correct (Adderall, dup)."}, {"id": "652b7c6c", "text": "I was the same in my teens. i thought of every possible outcome of an action and how others would react to it. \n\nBut by having a narcissistic flatmate i could see the difference. He was kind of extreme in his believes that he's the best and that he's never wrong. He was full of himself but at the same time he wasn't an asshole. He was a reasonably nice guy that just believed he's better than everybody. \n\nAnyway.. his attitude somehow influenced me and everyday i cared less if i made somebody uncomfortable or what they think of me. Of course i still try to be a nice person but only to a certain degree. It was kind of learning that not everybody has to like me and that it is fine.\n\nIt wasn't easy to break the old habits but it kind of set me free.", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "He was a reasonably nice guy that just", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood=okay is a fair read of a calm reflective post ending 'it set me free'. Clean."}, {"id": "81fceb3a", "text": "You're going to get a lot of varied responses. All you can really do is talk to your doctor about it, experiment with it, and see what's best for *you*.\n\nMy personal anecdote though is that I am in the middle of quitting Wellbutrin. I have no confirmation yet, but do suspect it was lending to increased social anxiety. I didn't want to leave the house anymore. It was prescribed to help with ADHD symptoms, but didn't help enough. In addition to that, when I restarted Adderall, the adderall wasn't working like it used to pre-Wellbutrin. I still just wanted to sit around and do nothing.\n\nI was taking the extended version of wellbutrin at 150mg. I don't think there's a lower dose, so my \"stepping down\" has been taking it every other day for a bit, then every two days, and then one final one after three days. My doctor didn't say I had to do this; he said I could just stop. I just know from pr", "mood": "good", "energy": null, "focus": "present", "meds": ["Wellbutrin", "Adderall", "Adderall", "Wellbutrin", "Wellbutrin", "Adderall", "Wellbutrin", "Wellbutrin"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "My personal anecdote though is that I am", "gold": ["mood"], "jmood": "false_positive", "jenergy": "missed", "jfocus": "false_positive", "jmeds": "correct", "overall": "poor", "note": "Inverted: social anxiety + anhedonia ('sit around and do nothing', won't leave house) scored mood=good; that line is missed low energy, not focus=present."}, {"id": "3c2d9ed3", "text": "I know the feeling.\n\nFor the most part, I’m able to maintain my composure so even when I’m angry or upset, you wouldn’t know it. But if another person is angry and repeatedly provokes me, my defenses get activated and I can’t control myself. I either lash out and return their anger, or I try to hold it in and just find myself blinded with rage. \n\nI meditate daily too, but that isn’t enough. I try to avoid these situations to begin, but sometimes they’re unavoidable, especially when it comes to people you care about who you spend a lot of time around. I understand that they’re probably on autopilot when their emotions take over, so the worst possible thing I can do is engage their ego by fighting back. Everybody thinks they’re right and if you approach any argument or disagreement from the position of “you’re wrong”, no matter how right you feel you are, you’re just making them more defen", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["angry"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "For the most part", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Negative valence is right but the affect is anger/'blinded with rage' (irritable), which mood=low only loosely captures."}, {"id": "5c6151f1", "text": "Just for both you and him to know -- there are reasons some of the stimulant meds made him feel like a zombie as a kid. Things like how it affects the emotional centers of the brain, as well as the overall balance of brain activity when kids are young. However, the dose of stimulants can absolutely be adjusted to prevent that side effect, and there are other non-stimulant options (like guanfacine)  that can broaden the range of symptoms that are treated so that a lower dose of stimulant works.\n\nWith meds, I feel more cheerful, playful, joyous, and happy, because I finally feel effective. It doesn't sound like he has as much emotional baggage from his diagnosis... it's just to note that taking the meds in no way compromised those feelings for me :) And if they did for him, the meds could be adjusted.\n\nNot to push either of you towards meds -- just to let you know that they don't have to m", "mood": "great", "energy": null, "focus": null, "meds": ["Guanfacine"], "feelings": ["playful"], "activities": ["Resting", "Work"], "sleepHours": null, "sideEffect": true, "title": "Just for both you and him to know", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "mood=great matches 'cheerful, playful, joyous, happy'; meds=Guanfacine correctly named. Clean."}, {"id": "44fa233d", "text": "It's not you, it's retail. Seriously. Retail fucking blows. Stores tend to understaff to save money and then call themselves 'fast paced' because they want one person to do the work of two, the hours are crap, store managers are (no offence to anyone) generally just sales assistants who stuck it out long enough to be promoted and aren't going anywhere with their lives and know this is as good as they'll get, so they power trip. \n\nSeriously, it is probably one of the least ADHD friendly jobs out there, especially if you're inattentive ADHD (like I am). They expect robots, you're expected to put up with shitty customers and generally the work is monotonous (putting things out on shelves). You're also expected to do it 'their way' which takes away your ability to find ways to make things work for you. \n\nDon't beat yourself up for being crap at retail.\n\nIn my family, my father has ADHD as we", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Stores tend to understaff to save money", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=great badly inverted — 'Retail fucking blows' is a frustrated/venting post, not a positive one."}, {"id": "8a7cb6dc", "text": "I have to sit at the very front of the class and take notes. Fidgeting has to be productive for me or else I will focus on the object of my fidgeting. So I just use different color pens and highlighters and take notes in multiple places like a notebook *and* a printout of a PowerPoint. I sometimes wiggle or bounce my feet around a bit.\n\nSitting in the front is the most important for me because it removes all potential visual distractions (does she know her tag is sticking out? Where did that backpack come from? Etc etc) between me and the lecture material.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Fidgeting has to be productive for me or", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "missed", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=sharp wrong — text is about *managing* distraction/fidgeting; the restlessness it describes (an energy hint) was missed."}, {"id": "bc424e02", "text": "I'm the worst at this. Creating my own deadlines? Never heard of her. \n\n&amp;#x200B;\n\nI find if I sit down to write I write for an entire section then take a 25 minute break. Like two days ago I wrote a 20 page paper divided up into sections. After each section, I'd allow myself to fuck around on my phone, vape, chill, get a soda, etc. then once my timer went off, I'd go back to the paper. \n\n&amp;#x200B;\n\nStarting it is honestly half the battle. Once you start and get on a roll, your hyperfocus will kick in. \n\n&amp;#x200B;\n\nBut, I feel this so hard. I'm willing myself to do 2 papers this weekend so I don't have to do them next week when I should be preparing for graduation and  vacation instead.", "mood": "good", "energy": null, "focus": "lockedIn", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "After each section", "gold": ["focus"], "jmood": "partial", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=lockedIn matches 'hyperfocus will kick in'; mood=good is defensible but thin against the self-deprecating opener."}, {"id": "52e762df", "text": "I actually tend to not eat super quickly because I often have troubles getting meals down.  I notice that with a lot of meals my brain will start getting bored and frustrated and telling me \"I'm freakin tired of chewing, you're not done with your food yet?  ugh, just throw the rest a way!\".  Being on vyvanse has actually helped a bit with that...\n\n&amp;#x200B;\n\nOn top of that, I've also had some health issues for some years now that have made it difficult to maintain my weight.  Bleh.", "mood": "low", "energy": "tired", "focus": null, "meds": ["Vyvanse"], "feelings": ["bored", "frustrated"], "activities": ["Eating", "Resting"], "sleepHours": null, "sideEffect": false, "title": "I notice that with a lot of meals", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "na", "jmeds": "correct", "overall": "poor", "note": "Text is descriptive/neutral about eating troubles ('a bit' helped by Vyvanse); no low mood ('low') nor tiredness — both are present-tense FPs from the word 'tired of chewing' and 'bored/frustrated' quotes the brain says about food."}, {"id": "e02dade0", "text": "Yup. I had an epiphany in January this year that depression and anxiety were not possibly not the problems but symptoms of the problem. This realization came as the result of therapy and introspection, so less of an epiphany and more the culmination of the work to be better. I'd hate to say that just the stimulant therapy itself has transformed my my mind but it's 90% of it. It has allowed my to think about things in a different way and has ultimately allowed me to find a path to happiness. All this time I'd been treating the symptoms, depression and anxiety, without addressing the underlying cause. Somehow I was able to create work around for the deficits and was fortunate enough to use my memory to offset the issues. My memory has been referred to by others as somewhat photographic and I believe this is why the underlying problem, ADHD, was masked. It's only recently that I've become a", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "This realization came as the result of therapy", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "missed", "overall": "ok", "note": "Mood 'good' is right (found path to happiness, anxiety shut off); but meds=[] misses the clearly central 'stimulant therapy' the whole post is about."}, {"id": "fc09745b", "text": "I didn't have a drastic overnight change, but over time as I found the right medication and dosage for me, I did see improvement. And looking back on it, I realize how dramatic the difference is from when I wasn't medicated. It may take more than a few months for you to really spot the changes, but if your partner has noticed a positive change, then something is probably working. \n\nPersonally, I sometimes feel like I struggle with executive dysfunction even more than before I was medicated, but I honestly think it's because I learned more about it and became more self aware about the reasons behind all those difficulties I was having. So it can feel like I have so many executive function problems still, but I think part of it is that I can identify each one much more clearly.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I didn't have a drastic overnight change", "gold": ["focus"], "jmood": "partial", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "Gold marks focus; text explicitly discusses executive dysfunction/EF problems (focus signal) yet focus=null — missed; mood 'good' is defensible from 'positive change/improvement' but the post is mixed/analytical, so weak."}, {"id": "3a93f18f", "text": "Hi, I went off of Adderall about 10 years ago and have been medication free since.  It's not an easy transition, and took me years to become a highly - functional person without meds.\n\nFirst, watch out for extreme mood swings when you stop.  I followed someone home and shouted them down in their driveway in the first week I went off meds, and I was coming off of just 5mg.  That is very unlike me, and who knows how you'll react.  You may want to step down gradually, but talk to your doc about it.\n\nNext, try to maintain your current routines as best you can, but accept the fact that you won't be able to do everything the same way anymore.  You're giving up a major source of discipline and motivation, and your old habits will probably feel daunting and overwhelming for a while.  You'll wonder how you ever did them before.\n\nSo allow them to change to suit your new needs.  I recommend stickin", "mood": null, "energy": null, "focus": "sharp", "meds": ["Adderall"], "feelings": [], "activities": ["Chores", "Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Hi", "gold": ["mood", "energy"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "poor", "note": "focus='sharp' is unsupported — text warns of losing 'discipline/motivation' and 'extreme mood swings' off Adderall, the opposite of sharp focus; mood swings/'shouted them down' signal is missed (gold: mood, energy)."}, {"id": "64e8bea2", "text": "I hyperfocused for the first time on a test last week and I agree with your assessment, it was pretty awesome feeling like I got it all together. When I left the exam room I checked the time and I was shocked because I thought I was in there for three hours but instead I had only been in there for one hour!! \n\nMeanwhile today I’m struggling to string together a couple sentences and I’m just zoning out the entire time while trying to study for another test :(", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I hyperfocused for the first time on a", "gold": ["focus"], "jmood": "missed", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "Post contrasts last-week hyperfocus vs today 'struggling to string sentences, zoning out :(' — single focus='distracted' captures only today, ignoring the hyperfocus; sad ':(' low mood missed (gold: focus only, but mood is clearly present)."}, {"id": "1cf05e8d", "text": "I feel like my brain is a thunderstorm. I don't feel smarter than most people. But most people don't seem to pick up on everything I notice? Every distraction is fighting for equal attention of my brain, and I have to give it to all of them. Most people can just tune out distractions, automatically sorting them. But I manually have to pay attention to every small thing, classify what it is, and then go back to what I'm doing. I think it keeps me sharp. Also another pro is, I don't really get bored. When I go for a run or a long drive, that thunderstorm in my head is always thinking. Making me think of things that have happened, problems in my life, etc and I just think about them and how I should approach them. ADHD is a blessing and a curse though. I'm MUCH lazier than my friends because my brain does give me so much stimulation that I don't need to go outside my bubble to seek more.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Outdoors"], "sleepHours": null, "sideEffect": false, "title": "But most people don't seem to pick up", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "focus='sharp' — author literally says 'keeps me sharp,' but the dominant theme is uncontrollable distraction ('every distraction fighting for attention'); sharp is the self-claimed upside, so partial at best."}, {"id": "a18ae7f7", "text": "I know. And if that happens, I would obviously discontinue use. However, my anxiety is a LOT better after starting on lexapro. ADHD is something that impregnates my day to day life, and just because it might increase my anxiety, it doesn't mean I shouldn't try it. Also, I will either only take it once or twice a week to complete the week long projects I do, or just take it on week days. I don't want a high dose, but I know it is a miraculous difference that I want, I need, to try.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "ADHD is something that impregnates my day to", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "missed", "overall": "ok", "note": "Mood 'good' fits ('anxiety a LOT better', 'miraculous difference'); but Lexapro is named and meds=[] misses it."}, {"id": "57f79204", "text": "I see music as a way to redirect my brains focus to something that is in front of me. \n\nI absolutely love to have them in individual based work where I don’t need to listen to anyone. It still can wander but I feel like it is more controlled? I don’t know what the right word would be, but if I was to pick one, I’d say redirect focus. As if music reminded my brain to focus. \n\nDoesn’t work much in social situation because I can be a chatter box so words from the music would just give me unnecessary ideas and words I might use. \n\nAnd if I do find a song I like, like get hyped about it, I do tend to listen the shit out of it. With time I would begin to have it engraved to the back of my brain, know it word for word, involuntary. I don’t mind it at all, but then I find a new one and add that too a playlist. \n\nI have a playlist with my favourite songs, or the ones that used to be my favourite.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I see music as a way to redirect", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus='sharp' is well-supported — whole post is about music redirecting/controlling focus; mood/energy correctly null. Clean."}, {"id": "5ec61338", "text": "Because when i take my meds, sure i can concentrate more, be more productive but i notice a change in my personality and behaviour. I tend to be more withdrawn, participate in conversations less, act differently than i would usually. Many of my friends have even noticed the difference and most of them dont even know i have ADHD, they just see the difference within 10 min of interaction. But it's not that i overly care about other people's opinion on my personality, its mine i care about and i care that im different on my meds, im no longer 'me'. \n\nAlso for those who do rely on medicine i wouldnt think of you any less or more than someone who didnt rely on medicine. Maybe people who rely on medicine, their problems are far more severe than mine where they cannot function to a reasonable standard in society. (not saying im reasonable but i somehow manage, and thats what i want to be workin", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["withdrawn"], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I tend to be more withdrawn", "gold": ["energy", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "missed", "jmeds": "missed", "overall": "poor", "note": "mood='good' unsupported — post is ambivalent/negative about meds making him 'not me'/withdrawn; gold flags focus ('concentrate more') and energy ('productive'), both missed; meds discussed but []."}, {"id": "a6db7582", "text": "Medications used to treat ADHD fall in one of two categories: stimulants and non-stimulants. Stimulants are considered first-line pharmaceutical treatment for ADHD and you've tried two so far. It sounds like you're not getting good results with the medications you've tried so far so it might be reasonable to request a trial of something else. You might get better results with an extended release formulation of methylphenidate or mixed amphetamine without as many side effects. (You also wouldn't have to take this multiple times per day). I've also heard good things about vyvanse but this is a newer medication and can be very expensive if you're insurance won't cover it.  \n\nIt's just important to realize that not all brains are the same; every medication used to treat ADHD won't be equally helpful for every person with ADHD. Work with your psychiatrist and be honest about your symptoms to ", "mood": "good", "energy": null, "focus": "present", "meds": ["methylphenidate", "amphetamine", "Vyvanse"], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "You might get better results with an extended", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "partial", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "Strong: 'improvement in mood, focus, and motivation', 'calmer, more capable' → mood good, focus present, meds all three correct; energy/motivation present in text but energy=null (gold flags energy) — minor miss."}, {"id": "8a368056", "text": "Besides the parent who spent all day in bed, I kinda gone through the same thing, with video game addiction and all. I am now 27yo, and it is still a struggle, to be honest, and I am saying that while I am having two jobs, as a neuroscientist and as a neuropsychologist. So yeah, CBT is something you should consider, because now I do work 40 hours a week at least, and it is still not good enough. While you are at 20/80, you think you will be satisfied when you reach a different number, but you don't. Even though you can rationally say to yourself: yeah, I am doing a great job, you still won't completely *feel* that way because of how you've developed yourself.\n\nSo please consider therapy, because if you feel you need to change, you need a proper tool. And just like you use a tool such as a saw to work on wood, you use a therapist to work on yourself. Choose someone that has not only exper", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "While you are at 20/80", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "poor", "note": "mood='great' is wrong — author says still a 'struggle', 'still not good enough', never feels satisfied; the 'great job' is a hypothetical you-still-won't-feel. Gold flags mood+focus; focus (40hr work, never enough) arguably missed."}, {"id": "389a0a04", "text": "I know OP didn’t ask this but the only way for me to KEEP to a routine is to pay someone to stand there while I do it.  Every week I work out with a trainer and every week we both show up because I paid for it! (Just paying for a gym membership doesn’t work, I find I need to have a regularly scheduled appointment/Class)\n\nI now realize why I would get overwhelmed at the gym on my own. So many possible exercises I could do.   Having a trainer makes the gym so enjoyable and focused. I don’t even have to count and then forget what number I’m on!", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": ["overwhelmed"], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "I know OP didn’t ask this", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "Post is actually positive about the trainer solution ('so enjoyable and focused'); mood='low' overweights past 'overwhelmed', focus='sharp' overweights present-tense ('focused' with trainer) — both directionally off for the post's upbeat resolution."}, {"id": "4c5b9aa4", "text": "I feel like, off-medication, I'm in an endless loop of self destruction. And the worst part of it all is that I developed a reflex of lying about it and making up excuses that, again and again, saved my ass. But now I realize this situation is not one i can talk myself out of, and if I do, it will come to light that I did.\n\nOne of the reasons that i'm so scared, is that I always had a hard time expressing my feelings and thoughts, and I know I will not tell the truth the way that it was planned out in my head (It would be a way messier version of it). But you're right, I have to tell this, no matter how hard it is, or what the reactions will be. It will be nothing compared to the backlash I will get if I just keep lying about it.  \n\nI still have a feeling that ADD/ADHD is misunderstood by so many people. Whenever i go to my doctor for a prescription, the first thing she asks is \"How long", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["scared", "misunderstood"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "But now I realize this situation is not", "gold": ["focus"], "jmood": "missed", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "poor", "note": "Clear low mood ('endless loop of self destruction', 'so scared') but mood=null; gold flags focus ('couldn't function without it') also null — extractor returned no signals despite strong emotional content (caught feelings scared/misunderstood only)."}, {"id": "0074526b", "text": "I have ADHD and my husband and all of our 3 children have been diagnosed with it recently as well.  We delayed meds for our oldest until 8. We mostly homeschooled until then in a low stress very laid back environment.  She started school recently and although the school is so different from a typical school and has a wonderful set-up for children with ADHD we decided that it was important academically for her to be more calm and able to focus better in class. We also believe that school before 8 school is mostly for fun and socialization. We eat fairly cleanly because it is important to us. Although we are food dye free I honestly notice a bigger different when we avoid all processed foods especially sugar. Food is fuel for the body and mind and the best fuel gives you the best performance. \n\nWe have the children on a fairly set routine. They really thrive when they know what to expect. ", "mood": "low", "energy": "alert", "focus": "sharp", "meds": [], "feelings": ["frustrated", "overwhelmed"], "activities": ["Chores", "Driving", "Eating", "Outdoors", "Screen Time"], "sleepHours": null, "sideEffect": false, "title": "I have ADHD and my husband and all", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Calm parenting/routine essay about her kids — mood='low', energy='alert', focus='sharp' all asserted with no first-person state support; this is advice/description, not a self-report of mood/energy/focus."}, {"id": "30343335", "text": "Develop an mean nasty autopilot... I have not lost my keys or wallet in years (except within my handbag itself).\nI come in the door and beeline for the bag spot.. anyone who tries to engage me is snubbed or abused... my house is super well trained...I have a home from work ritual that is NEVER allowed to change. If anyone touches my bag/phone/keys they are immediately disowned &amp; sold/taken to animal welfare - especially children! \nWhen and only when I’ve done that then I come back and say “Hi I’m home!!!”.\nOther one is the art of self deception... I get my partner to randomly change the clocks to 5 or 10 minutes early without telling me. I put my meetings into my calendar for 30mins earlier than they are (but only every other time), that way I can’t remember which ones I have/haven’t done that for... at least I’m not late for half of them! I make sure that my friends and family know ", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "When and only when I’ve done that then", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood='great' unsupported — jokey/hyperbolic coping-tips post ('disowned & sold to animal welfare'); humor isn't a 'great' mood self-report. Gold flags mood but value is fabricated tone-reading."}, {"id": "102fb070", "text": "I feel like I should be able to, but I also think that people without ADHD have an easier time being open without really being as “open and honest” as we are. Other people might share shit, but I seem to have no control over what I share in a relationship sometimes. And yes, it has bitten me in the ass, so I try not to... but then I do it again cause like “this is my person, they’re supposed to get me”. It also sucks cause I feel like we are SO accepting of what other people tell us (deepest darkest secrets and all), so it’s hard to realize that that’s not the case for other people and might actually be us acting impulsive in conversation or liking the emotional thrill of being so connected and sharing/receiving risky information. \n\nAnd everyone argues, but what’s funny is that for many people with ADHD it’s just part of our immediate reward system. REACT TO THAT SHIT AND SOLVE THAT SHIT", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["connected"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "It also sucks cause I feel like we", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Reflective essay on oversharing in relationships; no clear mood/energy/focus state — all null is correct (feeling 'connected' captured). Gold hint mood is weak; null defensible. Clean."}, {"id": "d47a9143", "text": "Ya it's sort of like those who go into telling others what they need to do have forgotten that empathy and just listening can be more powerful than \"practical\" advice. I made the mistake of conversating with someone yesterday who made me realize that there are people out there who truly cannot conceive of the brain making things different from what the person would rather do. Just because crippling anxiety does not mean it's all in the contents of the mind and no, trying to peacefully meditate while everything in the body is telling one to fight or flight is neither easy, comfortable, nor effective. \n\nThere's a lot to dealing with these things and sometimes it's hard to be stuck with the body one has, but there are others out there experiencing similar things. Ahh idk, misery loves company, but it's hard to wish there's another going through mental health stuff... \n\nKeep on keepin on!", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["loved"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "There's a lot to dealing with these things", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Empathetic, somewhat down post ('hard to be stuck with the body one has', 'misery loves company'); mood=null misses a mild-low lean (gold flags mood). 'loved' feeling tag is a stretch but mood signal under-called."}, {"id": "61d7282a", "text": "This reminded me of something else I've seen, which is that it's also a problem with the time until the consequences happen. If there are no consequences or they are far off an abstract, then the motivation to do the thing tends not to be there.\n\nI run into this a lot myself with things like personal art projects and sometimes even work projects. Since there's no consequence for me not doing the thing, my ability to focus on and do it fizzles very quickly.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Since there's no consequence for me not doing", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "partial", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus='sharp'... actually text says focus 'fizzles very quickly' with no consequences — so 'sharp' is questionable; better read as distracted. Gold flags energy+focus; motivation/energy theme present but energy=null."}, {"id": "ef1d2390", "text": "Ok, you're doing what you can on that end. And you're trying to get in with specialists. I'm not trying to be an armchair psychologist here, but it sounds like you're dealing with more than your fair share of anxiety, due to your situation and naturally through ADHD (isn't that a great side effect?). And honestly, I think you're doing the best you can do right now. You're making schedules, you've developed habits to deal with your symptoms, you've contacted professionals... that's a lot of healthy coping. Right now is the hardest part, the time between being pushed overboard and the first appointment. \n\nIf you can't hold yourself accountable, then work while someone else is present. Do what works for you, and try not to beat yourself up for failure. You're doing the best you can do right now while dealing with this, and that might not be enough for other people, but try to have it be eno", "mood": "okay", "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Ok, you're doing what you can", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "Reassuring 2nd-person advice ('you're doing the best you can'); mood='okay' is a reasonable read of the calm supportive tone but it's about the addressee, not author; focus='present' has no support — FP."}, {"id": "3b4ad6fb", "text": "I got through high school because I had a strong support system. I was in a program for students with learning disabilities, I am dyslexic as well, and in retrospective the things they had me do were more designed to help me with adhd then dyslexia. I had an hour long study hall all 4 years where I had to meet with a counselor and tell them what I was working on and what I had to finish. I got extended time for tests. I was not allowed to become to disorganized, I had days in the middle of every semester where all I was allowed to do was reorganize myself. All that helped and allowed me to develop really very good coping mechanisms. \n\nThe first 2 years of college kicked my ass and I almost dropped out. I had to learn how to cope on my own and spent the better part of my college career struggling with work. I finally went into a psych and was diagnosed with adhd. I've been on adderal for ", "mood": "low", "energy": null, "focus": null, "meds": ["adderal"], "feelings": ["angry"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I got through high school because I had", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "partial", "jmeds": "correct", "overall": "good", "note": "mood='low' fits ('really angry I was not diagnosed', lost chances); 'adderal' captured; brain 'just calmed down' on meds is a focus/calm signal not encoded (gold flags focus) — minor under-call."}, {"id": "6958c672", "text": "Picked up a second job. Spent the following weeks finding special baby books and putting games together for my sister's baby shower. Made \"get well\" soup for other, sick, sister the day before. Leave early for the shower in a nice new dress. \n\nGet to my mom's place and . . . nobody is there. I had forgotten the shower was at a restaurant closer to my sister's house, 50 minutes away! I leave in such a rush that, half-way to the restaurant, I realize I've left all the shower games, the gifts, and get well soup at my mom's place.\n\nThat's when I lose my s***.\n\n I thought I was doing so well. By the time I got to the shower, I was so frustrated with myself I couldn't walk into the room without bursting into tears. Not only did I show up an hour late empty handed but I stole all the attention from my sister by looking like a complete moron with a bunch of maternal figures closing in to make su", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["frustrated"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I thought I was doing so well", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Strong low-mood narrative ('I wanted to die', burst into tears, frustrated) → mood='low' correct, 'frustrated' captured. Gold flags focus too; forgetting/overwhelm is arguably focus but null is tolerable. Solid."}, {"id": "8a194ae8", "text": "The ADHD-er’s dependence on medication is certainly stigmatized. However, I have had it drilled into me by my providers that there should be no shame in me taking adderall, because I need it to stimulate the prefrontal cortex, the part of the brain that is inactive or at best under active in a person with ADHD.   However, I have found that you need a lot more than just meds to help. You need a supportive cast of people around you who can actually set aside their own preconceptions and frustrations who understand that this is a disorder just like any other disorder of the brain, just that on the outside we kind of look lazy, unmotivated and distracted. I’m dealing with a little of this myself currently. It’s hard getting a neurotypical person to get why you do the things you do, even on medication.", "mood": null, "energy": null, "focus": "distracted", "meds": ["Adderall"], "feelings": [], "activities": ["Outdoors"], "sleepHours": null, "sideEffect": false, "title": "However", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "partial", "jmeds": "correct", "overall": "ok", "note": "focus='distracted' from 'lazy/distracted' descriptor — but that's how others perceive ADHDers generally, not the author's current state; gold flags mood ('hard getting NT person to get you', mild frustration) which is null. Adderall correct."}, {"id": "80671985", "text": "Yeah, I hyperfocus when getting about too, especially riding my motorbike.  I get how some ADHDers get really distracted, but I find that even if I’m exhausted and can’t focus on anything, I’m wide awake as soon as I hit the road.  It’s pretty dangerous and exciting, so dopamine and adrenaline are released, I think.\n\nWhen walking, I can even read things on my phone and never bump into people.  Most people are made into zombies by phones.  I don’t know if this makes me fake ADHD or something, because it would seem to be the sort of thing ADHDers should have more trouble with, but I don’t at all.", "mood": null, "energy": "tired", "focus": "lockedIn", "meds": [], "feelings": ["exhausted"], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "I get how some ADHDers get really distracted", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "correct", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "Nuanced and right: 'exhausted and can't focus' → energy='tired'; but 'wide awake as soon as I hit the road' hyperfocus → focus='lockedIn' — captures the exhausted-yet-hyperfocused split well. Clean."}, {"id": "17af022e", "text": "Sometimes i feel like suffecating because i think to much. I get this feeling of un-pleasant tickeling inside my belly and all the way up to the top of my chest, and i NEED to get up and do something, or else i will just spiral further down on this toughts and go deeper in my head. Like i cannot sit still, i have to either tap my feet faster than a plane, or get up and try to \"shake\" this feeling out. Or talk, talking with people, sometimes i cant hear myself talk, the things atleast feels like nonsence", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Sometimes i feel like suffecating because i think", "gold": ["mood"], "jmood": "missed", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Vivid distress ('suffocating', spiraling down, can't sit still) — mood is clearly low yet mood=null and no feelings captured at all; restless 'NEED to get up/tap feet' is a hyperarousal energy signal also missed (gold flags mood)."}, {"id": "413d65ca", "text": "Ah, gotcha, I was just curious.\n\nThat seems to be the right path in your case. Good luck! Sounds like you already had a good start with that first meeting. \n\nI definitely have those kind of things, at least mildly, co-morbid with adhd. For me, it seems to be the same kinds of things affecting both, but I could also very easily see how any number of things could go into it, and more than anything affect different people in different ways. \n\nI just can definitely sympathize with the feeling of being hyper aware of little things, and having the chance that any little thing could break my concentration, especially if it's something like you were talking about with programming, where you need multiple levels of thinking going on at once.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": ["curious"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Ah", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp is backwards — text describes fragile/breakable concentration (distractibility), not sharp focus."}, {"id": "e5c96d9f", "text": "It's totally different for some people as you would expect. I really dislike being on medication because I feel it isn't an accurate representation of myself. I feel like it's almost cheating the system/ or that I'm giving in to life throwing adversity in my face. My mom, however; prefers to depend on it to be sure that she wont lose focus at important times. idk it's different for everyone I think. \np.s I hope I made some sense xDDD", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "My mom", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp from a hypothetical about the mom 'not losing focus' — not the writer's own state."}, {"id": "c25dde4d", "text": "Of Vyvanse, Concerta and Generic Adderall (Sandoz), I loved Vyvanse the best. Lasted usually 10 hours for me. When I was stepping up doses, sometimes it lasted longer. 50 up to 70 was the worst. The first time I took a 70, I felt like I wanted to run a marathon like 18 hours later. I thought I would never sleep again. Sadly, taking it daily for work (not on weekends) had a diminishing effect on me after several months of use and I felt it wasn't doing too much for me anymore. Now that I'm on Sandoz (no insurance), I'm miserable and would kill to have Vyvanse again. Another thing I loved about Vyvanse was that it was smooth kicking in and coming off. I had zero side effects with it (unlike Sandoz!!) and was incredibly productive. Ugh, I miss it!", "mood": "low", "energy": null, "focus": "present", "meds": ["Vyvanse", "Concerta", "Adderall", "Vyvanse", "Vyvanse", "Vyvanse"], "feelings": ["loved"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Of Vyvanse", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "missed", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "mood=low and meds correct, but 'incredibly productive/run a marathon' energy missed and focus=present unsupported."}, {"id": "20b14d29", "text": "Oh yes.  I like that idea very much.  Sorry folks, you know I speak Spanish so I'm off to see my old college friend Jorge in Ecuador!\n\nI'm just back from seeing my mom for 24 hours.  She was actually nice to me, but her ADHD drove me so crazy I had two hypoglycemic crashes (always happens when I go see her; my psyche decides to slam my poor pancreas).  She had lost a check and was going through her garbage looking for it, and she also lost two separate charging cords for appliances ... oh my god, I do love her and she's 82, so I know there won't be that many more Christmases to deal with.  And I will just have to keep snacks on hand for the inevitable blood sugar crash.\n\nShe wanted to harp on the election and wanted me to explain the damned electoral college for the 98th time... I could only listen to her talk about Hillary and Bill and say, yes, Mom, a lot of people feel that way.  I co", "mood": null, "energy": "charged", "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "She had lost a check and was going", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=charged unsupported — 'hypoglycemic crashes' and mom 'drove me crazy' are not the writer's high energy."}, {"id": "cdf9cf19", "text": "I know ADD/ADHD is different in every case, but for me, it’s less a matter of doing *nothing* to relax, and more a matter of *finding* something to occupy myself with. Find something to challenge yourself with that’s even *more* your kind of thing than your major.\n\nI tend to burn out when there’s a *particular* academic problem I can’t solve in my current obsession (e.g. a nasty bug in a program I’m writing). That’s what triggers a change in obsession for me. I find, though, that if I buckle down and break down the problem, I manage to solve it and can continue doing the same thing I’ve been doing without having to switch to something else.\n\nIt’ll apply differently to a “sprint” of school, of course, but the principle might be the same. The easiest method would be to pick up a dropped hobby again, and figure out what made you stop before. For me, it’s usually something very specific that", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I know ADD/ADHD is different in every case", "gold": ["mood", "energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp from abstract burnout/obsession advice; no current focus state asserted."}, {"id": "9d1a7155", "text": "I really feel for you. I was in this position myself as I finished school. You may very well be ADHD. But don't stress too much on the label right now, just do whatever you can to dig out of this before you fail out!!!\n\nDo you have a Panic Mode that gets activated the night before a huge deadline? If so, do whatever you can to activate that panic mode. \n\n\nAs for your emails... I feel you on the guilt and worry. But you have to stop making excuses and go and read their replies. And respond right away, if only to acknowledge the email and thank them. Most of your professors will want to help you. And the only way they can help you is if you engage with them and tell them what you need and then work with them to do your share. \n\n\nTutoring sessions are a great idea. Professors, teaching assistants, grad students, friends, classmates... see who will help you work on the material interactively", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I was in this position myself as I", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=great is wrong — writer is consoling a struggling student ('I feel for you'), not in a great mood."}, {"id": "4f6293c3", "text": "&gt;willing to say things no one else will\n\nThere are different versions of ADHD. Thats not really true, in fact a lot of people with ADHD have social anxiety.\n\nIn my experience almost nothing comes positive from ADHD. You might over focus on the things you love but thats not really positive. Most of the time that means spending all day watching TV or playing video games etc..\n\nPretty much everyone with actual ADHD and a decent doctor (went to a psych spent more than a day getting diagnosed) wish they didn't have it. There isn't much to like honestly...", "mood": "okay", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "In my experience almost nothing comes positive from", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Tone is pessimistic ('wish they didn't have it'); mood=okay wrong-direction and focus=sharp from negated hyperfocus."}, {"id": "9ec339c5", "text": "Thank you for your reply. I’m just frustrated. I feel like I can’t trust doctors to actually figure out what the fuck is wrong with me. I’ve been treating depression and anxiety for 15 years (I’m 28 and a woman FWIW) with medication and therapy with no clue as to why life is still so hard for me, even when my depression and anxiety seem to be fairly under control. ADHD seems to make so much sense in a lot of ways. My therapist throughout high school also thought I had it and constantly talked about my difficulties with executive functioning but I didn’t take her seriously because I didn’t understand the disorder (“I’m not hyperactive!”), I was even put on both adderall and Ritalin and had bad or no results (don’t remember the dosages), so this convinced me at the time that ADHD was not the problem. I also had a lot of stressors in my family growing up which could have made it difficult t", "mood": "low", "energy": null, "focus": null, "meds": ["Adderall", "Ritalin"], "feelings": ["frustrated"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "My therapist throughout high school also thought I", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "clean — mood=low (frustrated/life hard) and Adderall+Ritalin correctly caught; no false energy/focus."}, {"id": "8ff19144", "text": "I was diagnosed when I was 10 but since I was so chill and non hyperactive, my mom thought it was a misdiagnosis.  \n\nI began to realize, as an adult, that I had ADHD all along, it’s just everyone has different symptoms and things they can’t focus on\n\nMy symptoms are:  procrastinating, struggle with getting to places on time, I can’t retain a lot of information and I am extremely forgetful, get overwhelmed easily, I have social anxiety (although, it’s improved as I got older), I will obsess over information I’m interested in and will research for hours sometimes days, I overthink, I dwell on things...the list goes on and on\n\nAlso,when I do chores etc, I have to listen to podcasts &amp; YouTube videos to stay motivated.  I get very bored with a lot of movies &amp; TV shows. There are only few I am interested in, and when I’m interested, I can sit through them and watch them.  I get bored w", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": ["overwhelmed", "motivated", "bored"], "activities": ["Fitness", "Hobbies", "Screen Time"], "sleepHours": null, "sideEffect": false, "title": "I was diagnosed when I was 10", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "Self-inventory of traits; mood=low and focus=sharp both cherry-picked from a mixed list (also forgetful/distracted/can't-focus)."}, {"id": "91cea816", "text": "If someone is trying to study something and gets distracted so much that studying is literally a waste of time, there's a problem. It really doesn't matter if you feel that some people have ADHD in lesser degrees than others. Just like most medical conditions, some people have it worse than others.\n\nHow can you expect a normal person to not judge those with ADHD when you're judging others right now by claiming that they are abusing the medication themselves?", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "If someone is trying to study something and", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocu
