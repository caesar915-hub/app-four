 for giving me the courage to speak up.", "mood": "low", "energy": "tired", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I got switched to adzenys recently and it", "gold": ["mood", "energy"], "jmood": "partial", "jenergy": "correct", "jfocus": "na", "jmeds": "missed", "overall": "ok", "note": "Missed med 'adzenys'; mood=low overstates a past-tense stress, current tone is hopeful."}, {"id": "d62295d5", "text": "It must of been GTA V for Xbox 360. Last year, around march. I'm not sure how i did it... I've lost my ability to play lengthy games, and it makes me really sad. All of my friends are huge Bethesda fans, and I can't even manage to get past the Whiterun intro most times. Legend of Zelda, Mass Effect, Borderlands 2... I find myself bingeing for a few hours at best, then not touching it for months.\n\nBut I ended up somewhat recently giving up RPG's for other games, such as KSP or League of Legends.\n\nIt makes me sad, because my childhood was solely comprised of RPG's that I remember fondly. Now I can't even finish Metroid. I have a huge backlog that I just realized I'll never actually play, but I wish I could...", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["sad"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I'm not sure how i did it", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — 'really sad' (x2) supports mood=low."}, {"id": "402665c3", "text": "Don't worry, 5mg is pretty low. It's the lowest dose you can get so there shouldn't be a problem when asking for an increase. These precriptions aren't supposed to work perfectly from the start, you have to experiment until you find the right dose. I take Methylphenidate xr and it didn't do much until I was upped to  30mg. \n\nIt's frustrating to see them not work as well anymore, but try to see it like this: Now you know they work, Ritalin is right for you, now you just have to find out how much. Btw, there is rarely an actual tolerance build up, you're just getting used to the new 'normal' and comparing to the great first weeks or months where everything stood out to you that can seem discouraging. But that's the way it's supposed to be. The euphoria is supposed to vanish after a few weeks too. If you're not prepared for it, it can crash you down, because of the energy and motivation lac", "mood": "low", "energy": null, "focus": "present", "meds": ["methylphenidate", "Ritalin"], "feelings": ["frustrated"], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "I take Methylphenidate xr and it didn't do", "gold": ["mood", "energy"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "focus=present unsupported (no focus claim); mood is empathized 'frustrated' advice, 'low' is a stretch."}, {"id": "491d3cc7", "text": "\"Failure isn't a step backwards. No, no, no. In every sense of the word failure is a step forward. A step forward in the right direction. I want you to fail forward! Don't drop the class, don't quit. Because when  you get back up you're that much closer to your goal. You're that much more prepared next time!\"\n\nhttps://youtu.be/4bQ1BX3hz7I\n\nI have been sharing this a lot lately and hope this type of thing can help you as much as it helped me. \n\nMy brother dropped out of school 3 times. Once in highschool, once in uni, and once in a technical school. He is smarter and more talented than myself and most others in many things. But he quits trying and stops growing as much as he could.\n\nFail forward. Failing doesn't make you a failure. Keep pushing and keep fighting. \"You'll never win the fight of your life if you are too scared to fight. Fight for your dream. Find your 'why'\"\n\nApologies in a", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["scared"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Don't drop the class", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — motivational 'gives me a high' supports mood=good (SSRI is generic, fine to skip)."}, {"id": "aeec1f22", "text": "I have 4 alarms just to get me out of bed in the morning! \nThe thing is I used to apply as little attention as possible or put another way just enough to get by and used to think my method of teaching was 'spontaneous' whereas in reality it was chaotic and I just wasn't getting my knowledge across and was confusing my students.\n\nIn truth I need to measure how long a task will take now I have the motivation and focus and adjust from how my brain is used to handling structure before medication, which took no time at all because I didn't structure anything because I really didn't know how to and so used the same chaotic approach and dreamy muddling I have used since 6 years old.\n\nIt's stressful to suddenly do almost everything completely differently but it's also becoming  less stressful and quite amazing when I see how different the results are becoming.\n\nThink it's gonna take a while to p", "mood": "great", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "In truth I need to measure how long", "gold": ["energy", "focus"], "jmood": "correct", "jenergy": "missed", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "'now I have the motivation and focus' — focus=sharp correct but motivation/energy missed."}, {"id": "da61432c", "text": "I’ll give you my perspective but want to preface it with this: I don’t know you, I know that, and I am not trying to tell you what to actually do, just give a perspective. \n\nOk I don’t know if I have ADHD, I suspect it but I’m not diagnosed. Anyway I used to drink lots everyday to deal with my anxiety and stress (about the same amount as you), I stopped when I had my first positive pregnancy test and the first six months were freaking hard, not having alcohol to shut my brain down. Urgh. I didn’t see it as ADHD then but I knew it was weird. But eventually it got easier, I realised I was a lot better off for not drinking, so I stayed stopped. Mentally, physically and financially I am a lot better off than back then, and I was very surprised to find that. I’m more stable and better at impulse control. \n\nThe thing with alcohol is it affects you for longer than the time you were drunk/tipsy ", "mood": "good", "energy": "sluggish", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I’ll give you my perspective", "gold": ["mood"], "jmood": "correct", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "energy=sluggish from 'groggier' describes the drinking scenario (2nd person), not author's state."}, {"id": "ce10e711", "text": "fake your death, buy a van, live in it, r/vandwellers\n\nor\n\nshower, clean your room, take your meds.spend your entire day not just cleaning your room but organizing it.\n\njust finished this process again, and ohhhhh my room is so clean it feels so nice. i was cuddling my laundry for a week because i couldn't put it away\n\n&amp;#x200B;\n\nas far as getting by in college. drop out. i dropped out 3 times, went back later for practical college, now i am doing something completely different. stop beating the dead horse\n\n&amp;#x200B;\n\ntldr: the spiral requires change. either something else to get excited about or a process of designing organzation", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": ["excited"], "activities": ["Chores"], "sleepHours": null, "sideEffect": false, "title": "Just finished this process again", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=okay understates 'so clean it feels so nice' + excited; should be good/great."}, {"id": "229a3e6b", "text": "Are you me? I'm also a 21yr old engineering major, and I've experienced what you have but sans meds (I'm setting up proper diagnosis atm, but a screening at my school showed I'm pretty likely to have ADHD, plus my dad has it pretty badly so I likely inherited it). During high school and freshmen year of college I could always get something done once the deadline was upon me. I could stay up late and grind it out until I finished or I ran out of time. After my second year of college though, I started to feel burnt-out. I wasn't aware of it until I went to a counselor later, but I was subscribing to a defeatist attitude. The work was getting harder, I was barely keeping afloat anymore, and it was easier to avoid work all together and choose to fail than it was to try my best and fail anyway. At least that way I was the one in control of my life, even if I was leading myself down a really s", "mood": "good", "energy": "sluggish", "focus": "distracted", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "During high school and freshmen year of college", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "correct", "jfocus": "partial", "jmeds": "na", "overall": "poor", "note": "mood=good is backwards — text is 'burnt-out', 'defeatist', 'really shitty path'."}, {"id": "0fc9ad76", "text": "Hello fellow German! I was also diagnosed later in life. \nI have seen a neurologist because of my PNES, so I kind of know how stressful this alone is. \n\nThe neurologist send me to a test which lasted about an hour, a bit interview but mostly pushing some buttons after a light appeared. This guy told me yes, my concentration is very bad, buuuut I can't have ADHD. But stimulants would most likely help me. The neurologist couldn't do anything for me, so I went to the \"Ambulanzzentrum\" from our local psychiatric ward and got tested there. The test was three sessions of interviews with a psychologist about my life and a lot of questionnaires I had to fill in at home. They finally gave ne the adhd diagnosis. \nThere was also a doctor here in town where I could have went to have three sessions and pay 180. \nYes you can go somewhere and pay privately and you can get an appointment there more quic", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "This guy told me yes", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp inverts the text: 'my concentration is very bad'."}, {"id": "25ff26ed", "text": "You're not wrong, but I have so many problems even solving an entire problem is like picking up a piece of sand on a beach, its so insignificant to the point of forcing me to have no other feeling than complete and utter hopelessness and helplessness. I've technically made great strides this past year and a half, yet it feels as though I've made only 1% progress on a 100% journey, and maybe I went from 20 to 21%.\n\nBasically, I am no longer motivated to find people/resources to help me, so I languish further. I need something, a 10 or even 5% improvement, to give me hope again.", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": ["motivated"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I've technically made great strides this past year", "gold": ["mood"], "jmood": "false_positive", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Negation missed: 'no longer motivated' + 'utter hopelessness' read as mood=great/motivated."}, {"id": "96fcf50a", "text": "I guess I see it like someone who’s visually impaired saying I really appreciate the flavour of food more and as such I’m a fantastic food critic.  Then someone else saying ‘fuck you I’m blind and it’s terrible’....which is likely true.  In my mind I guess I understand we all see ADHD as a disability and I don’t think anyone is undermining you.  I think they are likely looking on the bright side.  Hoping to spark some hope in others not make them feel bad.  That’s how I receive those messages.  When I’m in a shitty mood or feeling like I’m failing at everything I just don’t read them.", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Eating"], "sleepHours": null, "sideEffect": false, "title": "In my mind I guess I understand we", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=great unsupported; only mood cue is conditional 'when I'm in a shitty mood'."}, {"id": "73d33b83", "text": "So, communication skills are the most important part of any marriage or other long-term relationship and you BOTH need to get your head straight and learn skills. This is not part of your personality, or anyone's disorder or diagnosis. This is a skill. You have identified a skill deficit. Learn the skill, or you will crash and burn.\n\nLook into Crucial Conversations, the book. It's an excellent one. Also look at the Scream-free Marriage. It's a silly title, with serious amount of information between the covers.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": true, "title": "Learn the skill", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean for judged dims — pure advice, extractor correctly returned no mood/energy/focus (gold hints are noise)."}, {"id": "a450b591", "text": "First off, thank you for your response. My apologies for not responding sooner! \n\nSince this post, my focus has actually improved! I think it was a matter of adjusting to being back at school, and the fact that my school lectures blow (no problem watching pathoma, sketchy, etc).\n\nThe problem now is that I can only last from 6-7 am until 5-6 pm. I can’t do later than that... which is probably a problem, since classes take up 9 am until 1-4 pm, depending on the day. \n\nNow to answer your questions &amp; provide background: \n\nI have tried other meds: first non-stimulants (Wellbutrin, Straterra; given by family doc) then Vyvanse 40 mg (psychiatrist) which I was on for 4 years (1.5 of those years were MS-1 and half of MS-2), I did okay (no fails and no C’s)...but now it’s boards season. \n\nThen I had to go on medical LOA (at the end of the first semester of MS-2). \n\nIn that year off (entire 201", "mood": "okay", "energy": null, "focus": "sharp", "meds": ["Wellbutrin", "straterra", "Vyvanse", "Concerta", "Provigil", "Vyvanse", "Adderall", "Vyvanse"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I have tried other meds: first non-stimulants (Wellbutrin", "gold": ["focus"], "jmood": "partial", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "focus=sharp matches 'focus has actually improved'; mood=okay weak (lifted from 'did okay' academics)."}, {"id": "2b25a208", "text": "I wish they had gotten me tested and treated all the way. I wish my mom, who knew I also had Tourettes (was actually tested for that in elementary school) had bothered to look into treatment for that, too, instead of telling me I must stop those tic behaviors. I wish she had been savvy enough to see that tics were just the icing on the cake for me. I wish my dad had believed in neurological disorders. For a guy with epilepsy he was pretty dense about that. I wish my parents had worked with my teachers to find ways to break down the difficult academic tasks I couldn't do so well instead of telling me I had to try harder. I wish they believed in \"trying\" - my dad literally told me there was no such thing as trying, only doing. I got a lot of \"you're not striving to meet your goals\". I wish my dad had been tested, because I could see him potentially having had ADHD-C, like me. I wish they h", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I wish they believed in \"trying\" - my", "gold": ["mood", "energy", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Regretful/wistful 'I wish...' tone is a present low mood the extractor missed entirely."}, {"id": "703961c7", "text": "From what I'm reading here, it sounds like none of you have trouble paying attention, you just can't do the things you're not interested in doing or have to do. Your default setting is to do literally anything else. To me that's very different from not being able to pay attention. I've always been clumsy/forgetful too, before this feeling of always being tired set in. I've had teachers feel so bad for me because I KNEW I had put my homework in my bag and when it came time to turn it in, it just wasn't there. This didn't surprise anyone. I've always missed important details too. I'm starting to wonder if there's something in addition to/instead of a sleep disorder that's messing me up. I've seen three sleep doctors and I'm seeing a psychologist next week. I'm not going to try to convince her I have ADHD by cherry picking symptoms, but right now, this is the only other thing I suspect/know", "mood": null, "energy": "tired", "focus": null, "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "From what I'm reading here", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "correct", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "energy=tired correct; missed focus despite 'always missed important details' / attention complaints."}, {"id": "434ea1d7", "text": "It’s funny because it had been suggested all through my childhood that I might have ADHD. However I always got good grades and I’m a girl, therefore I couldn’t possibly have ADHD/s. \n\nI grew up in the backwoods and my mom and pediatrician insisted I was just high spirited and needed to buckle down and try harder. \n\nFast forward to today and I’m a mess of anxiety, untamed adhd, and ocd. It’s slowly being managed and my doctor now is amazing as well as my support system. My mom is now so understanding and realizes she was wrong all those years ago. My hubby is also amazing. He’s really great at “managing” me lol! \n\nThis sub has been amazing for me! It makes me feel so much more “normal” and understood. Like wow there are other people like me and I’m not just a weirdo???", "mood": "great", "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "It’s slowly being managed and my doctor now", "gold": ["mood"], "jmood": "correct", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "energy=steady unsupported (no energy cue); mood=great defensible from grateful arc."}, {"id": "688b2bc7", "text": "Omg. I have literally done that exact thing. Lol.\n\nI do work better and stay on task more when I have a list though. I'm a perfectionist and am either a total slob or neat freak. There is rarely in-between. Plus there's procrastination and distraction as issues. \n\nOne thing that works for me is to make a list of small actions such as clean sink. Do an activity, cross it off, and then if I feel like it do another. It seems less overwhelming. Another trick is to pause a show or video game every episode or amount of time like 20 minutes, do one activity, and then go back to watching. It makes it more bearable.", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I have literally done that exact thing", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "clean — 'stay on task more when I have a list' supports focus=sharp; light upbeat mood."}, {"id": "d3b2dc00", "text": "I've been taking it for 3 years so far. I've never seen that article before-- thanks for sharing. I've been contemplating trying something new bc as much as I love strattera I don't know if the amount of energy it sucks out of me makes it worth taking anymore. I get sooooo tired in the afternoon, &amp; if I take it at night I don't focus as well during the day. \n\nAnyone know of a mild/non-stimulant for ADHD (besides intuniv-- tried that &amp; felt like I was going to faint) ?", "mood": null, "energy": "tired", "focus": "present", "meds": ["Strattera", "Intuniv"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I've been contemplating trying something new bc as", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "correct", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "focus=present inverts 'I don't focus as well'; energy=tired and meds correct."}, {"id": "8714a89b", "text": "&gt;Side note: you know all that insane nervous energy that's coursing through you right now? Use a bunch of it to work out, it's good for you, it makes you feel better about yourself, and it probably won't hurt your chances with this person, either.\n\nHaha I don't think I've ever fallen in love but this one hits close to home for a different reason. I've gotten this feeling only once or twice in my life with a game or show or book that I REALLY REALLY loved, and man was it bizarre. It's like for the first time in my life I actually had strong emotions, I got this wonderful painful ache in my chest whenever I thought about the media that I had \"fallen for\". The first time, for a few months, I had a burst of motivation like nothing I have ever had before. I don't even know where it came from, but I all I wanted to do was self-improve. Exercise more, read more, be more creative, be less shy", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["loved"], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "Use a bunch of it to work out", "gold": ["energy"], "jmood": "correct", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Missed high energy ('insane nervous energy', 'burst of motivation like nothing I've had'); mood=good ok."}, {"id": "f131a270", "text": "ME. After I even started trying ti exercise and get my life in order, got my job in my career path and had most all I could ask for and still felt that way? That's when I went to the doctor. I was prescribed Zoloft, took that about 2 months, upped the dose once during that time and finally got to a psych. I was prescribed Ritalin, upped that dose once and also adjusted the amount of times I take it during the day.\n\nI'm me again. I can get up and do things and don't spend half my day idling. A factor I have to toss out though is that I also never thought I was depressed. Apparently I check off the boxes for major depression to my surprise. And I have always been a pretty positive, happy person (aside from anger issues, humans are complex lol). \n\nDefinitely talk to your doc. The small cocktail I take is wonderful, I have equilibrium again.", "mood": "great", "energy": null, "focus": null, "meds": ["Ritalin"], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "I was prescribed Ritalin", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "'I'm me again', 'equilibrium again' supports mood=great; Ritalin captured (Zoloft omitted, minor)."}, {"id": "83fabbde", "text": "I was diagnosed in my late 30's (because when I was 12 ADHD wasn't a thing) but even before I knew that my brain was different I had started to sort through the things I could do easily, the things I could do but took more...motivation, and the things that only got done if I had a gun to my head. I'm still working on it and deciding what is lazy and what is ADHD. An other post recently directed me to a YouTube channel called \"How to ADHD\" and last night (coincidentally) I watched a video ([https://www.youtube.com/watch?v=uE-W\\_LI9FdE](https://www.youtube.com/watch?v=uE-W_LI9FdE)) about this very topic, and they say in 10 minutes what would take me an hour to write about. Actually I should add some context, the video is about determining when a delivery service is a luxury or saves you money in the long run. It made me think about the times when I didn't even think about another way to do", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Screen Time"], "sleepHours": null, "sideEffect": false, "title": "I was diagnosed in my late 30's (because", "gold": ["energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Clean — reflective task-sorting post conveys no affect/energy/focus state; all-null is correct (gold 'energy' hint is task difficulty, not a felt level)."}, {"id": "89232b8a", "text": "You've been friends for a long time by the sounds of it, and she hasn't asked you how to get a script for it to abuse it. It sounds like her problems have been persistent have gotten worse recently and that she's been talking to her bf and thought Adderall could help. \n\nSure, I'd be frustrated with 'learning what to say to the doc' deligitmizing ADHD, but so far it doesn't sounds like she is taking it recreationally but for the actual intended purpose. The contrast in personal effectiveness is higher as the start of taking it as well, so she will probably talk less about how much she's had done given time.\n\nI was diagnosed with ADHD recently and also 'blagged' to a friend that I had mimicked a friend in saying 'cocaine makes me feel calm' in the diagnosis... but that was my bravado in feeling as if I had accomplished the diagnosis, rather than needing it. \n\nNobody *wants* to have to take", "mood": "great", "energy": null, "focus": "sharp", "meds": ["Adderall"], "feelings": ["frustrated"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "It sounds like her problems have been persistent", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "poor", "note": "Third-person advice about a friend's Adderall — author asserts no mood; mood=great and focus=sharp are unsupported fabrications."}, {"id": "9ddb41be", "text": "Just wanted to chime in with my own experience bc maybe it'll be useful to somebody. I'm (still) in recovery from the worst depressive episode of my life, 5+ years and counting. Met the diagnostic criteria for severe depression for a good portion of that.\n\nI'm quite confident I have ADHD, looking back at my childhood all the signs were there. The shrinks however were very reluctant to diagnose it for a long time while I was deeply depressed, because it can be very difficult to separate out depression-related executive dysfunction from ADHD. What ended up happening was my psychiatrist eventually prescribed me a stimulant more for depressive symptoms (no motivation, extremely low energy) and surprise, it helped! Then as I continued to get better thru meds, therapy, meditation etc, the attention stuff didn't improve. Finally this year I went to an ADHD specialist clinic and got the most tho", "mood": "low", "energy": "tired", "focus": null, "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "The shrinks however were very reluctant to diagnose", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "partial", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "Narrative is recovery/improvement; mood=low and energy=tired latch onto historical 'extremely low energy', and ongoing executive/attention struggle (focus) is missed."}, {"id": "3fbcd389", "text": "First of all, it's never too late to turn it all around. \n\nBut you can only do one thing at a time. Sometimes things can pile up like this, and you just get so overwhelmed that you can't see over the top of the pile. But the only way to get over it is to tackle the first step, and keep moving.\n\nIt will be slower progress than normal people, and it's easy to get discouraged. That's just our struggle. You hafta own it. \n\nYou have to know that anything you tackle will be more difficult than for most people, so you can't expect to change it all overnight. You just hafta take things slow, and focus hard. And you gotta keep at it.\n\nYou are stronger than most people, and you can do this. \n\nTake a deep breathe, write down your goals, and figure out what to do next. \n\nYou can only do one thing at a time. \n\nDo one thing today. \n\nThen tomorrow do the next thing. \n\nAnd keep at it every day. At least", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": ["overwhelmed", "discouraged", "motivated"], "activities": ["Resting", "Screen Time", "Work"], "sleepHours": null, "sideEffect": false, "title": "Sometimes things can pile up like this", "gold": ["mood", "energy", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Second-person pep talk — 'overwhelmed' and 'focus hard' describe the addressee/imperatives, not the author; mood=good and focus=sharp are false positives."}, {"id": "e025b483", "text": "Wellbutrin has helped somewhat for my depression. It helps keep my depression in check without completely eliminating my emotions like Zoloft and Prozac did. I’m still somewhat prone to depressive fits even with it, but if I forget to take it on consecutive days, I have a complete meltdown, so there’s that. As for the ADD, I had been on it for sometime before being diagnosed, and it never really affected me. Concerta on the other hand, has helped me eliminate the brain fog I would get after what I can only describe as a manic episode (a rush of adrenaline I get when I get completely overwhelmed at work). Still a work in progress on that end.", "mood": "low", "energy": null, "focus": "present", "meds": ["Wellbutrin", "Concerta"], "feelings": ["overwhelmed"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Wellbutrin has helped somewhat for my depression", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "partial", "jmeds": "correct", "overall": "good", "note": "mood=low (ongoing depression/meltdowns) and meds right; focus=present understates 'eliminated the brain fog' improvement but acceptable."}, {"id": "daebad57", "text": "One of the most common side effects of Strattera is depression, as it's often used in favour of stimulants for those who have anxiety disorders. Sadly most of the time people with anxiety disorders are also more prone to depression, so while you'll feel a lot calmer you'll probably wind up feeling very low in the process.\n\nI know that 5-HTP supplement is safe to take with Strattera after I spoke to my local pharmacists (who contacted the supplier when they couldn't find anything in their textbooks) and some people do find it helpful for managing the low moods. Maybe it could be worth a go?", "mood": null, "energy": "steady", "focus": null, "meds": ["Strattera", "Strattera"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "One of the most common side effects of", "gold": ["mood"], "jmood": "na", "jenergy": "false_positive", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "Purely informational post about Strattera's effect on others; energy=steady ('calmer' is not energy) is a false positive."}, {"id": "09afc4d8", "text": "Yeah, ummm, he's wrong.  Depending on how you adapt to ADHD, you could do well in school and other areas, and still have ADHD.\n\nMy eldest child has done well in school but had huge anxiety, problems with attention on a lot of things, losing things, hyperfocus on some things, volume control problems while talking, interrupting others, verbal logorrhea, etc.  Now he's on meds he's much more relaxed and in general happier.\n\nI wasn't diagnosed until after I was 40 years old.  I did ok in high school, came close to maxing the SAT, did fairly well in a good engineering program in college and have a good job I've kept for a long time.  But I always had problems with a lot of the typical ADHD things, but never connected it.  Because I've always *tightly* controlled myself (which is fucking exhausting).  \n\nNow that I'm medicated, I don't have the dragging low grade depression I used to have, I fe", "mood": "okay", "energy": "steady", "focus": "foggy", "meds": [], "feelings": ["exhausted"], "activities": ["Driving"], "sleepHours": null, "sideEffect": false, "title": "Because I've always *tightly* controlled myself (which is", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "partial", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=foggy is inverted — text says medicated and 'less foggy'; mood=okay also understates the 'happier/more patience' improvement."}, {"id": "8550be4b", "text": "Yeah completely agree!! My life before finally getting diagnosed and medicated was a MESS. I was fired from every job I ever had, I had problems in my social relationships, I couldn't even get to the post office to mail a fucking letter. Every day felt so hard and exhausting I struggled with depression and suicidal thoughts for years. I fucking HATE IT when I tell people I have ADHD and they're like \"yeah, I probably have that too\" or something ... NO YOU DON'T, TRUST ME, YOU WOULD KNOW. It's not just having a short attention span or whatever, it affects every aspect of your life.", "mood": null, "energy": "tired", "focus": null, "meds": [], "feelings": ["exhausted"], "activities": ["Errands", "Work"], "sleepHours": null, "sideEffect": false, "title": "Every day felt so hard and exhausting I", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "correct", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "energy=tired right ('exhausting'), but strong low-mood signal ('depression and suicidal thoughts for years') is missed (mood=null)."}, {"id": "325d01ff", "text": "I know I'm not as successful career wise as I could have been if diagnosed early instead of in my mid 30s. I don't want this to sound like any kind of brag, so please don't take it that way. I was always smart, did well in school, As and Bs - but scatty as hell, distracted, unable to stick to things. I read fast, and when I was interested in something I would read a lot about it, so I usually did well in exams, but I struggled with long term assignments and course work, and socially I was awkward as a teen - moved schools several times, and had a short fuse, so I didnt always deal with things in the best way and got in a lot of fights. University was the same - the modules I was interested in I hyper focused and did fine in exams, but I was always handing stuff in late, and there were several courses where I just tuned out and barely scraped by. I was also drinking a lot and smoking a lo", "mood": "good", "energy": null, "focus": "distracted", "meds": [], "feelings": ["bored"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I was always smart", "gold": ["focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=distracted correct ('scatty, distracted'), but mood=good is a false positive — the retrospective tone is regretful, no positive mood."}, {"id": "74c865c8", "text": "You need to turn things into a challenge, basically gamify your life. There are some apps out there which can do this. You turn mundane tasks into quests worth points for example.  I used the Health app on my phone to hugely improve my nutrition. The drive to get the highest possible nutritional balance score really motivates me to eat well.  \n\nUrgency is the other good motivator for us. That's why we are suddenly able to focus and do heaps of work at the very last moment, when the adrenaline rush kicks in.  So you need to have urgency kicking in before things are due. Basically than means you need people who support you to create earlier deadlines, check ins to finish part of the task, with immediate consequences if you don't get it done.  \n\nAlso we struggle with activation, meaning the ability to start a task. Because we have trouble with organisation and prioritisation we fail to brea", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": ["motivated"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "The drive to get the highest possible nutritional", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Generic second-person advice; 'suddenly able to focus when adrenaline kicks in' is a generalization about ADHD, not the author's state — focus=sharp is a false positive."}, {"id": "5d940fc1", "text": "I took it for about a year and a half. At first my dose was too high and I literally slept all day.\n\nOnce we got the dose right it was a miracle, until it wasn't. It helped with so much of my ADHD issues, except actual focus. But that was the only issue and in comparison it was great.\n\nBut it made my anxiety so very much worse. My panic attacks actually started for me when I was on strattera. It was not the cause of my anxiety but it made it so much worse. I couldn't sleep I was up all night stressed out. Then I was so exhausted I would fall asleep in class.\n\nIt wasn't right for me. Doesn't mean you will have he same experience. If you do try it I would maybe keep a journal of how you're feeling. The issues with Strattera crept up on me slowly so it was hard to pinpoint it as the issue. But once we did and I stopped taking it it was amazing. \n\nKeep track of how you're feeling and talk wi", "mood": "okay", "energy": "tired", "focus": "sharp", "meds": ["Strattera", "Strattera", "Vyvanse"], "feelings": ["exhausted"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "My panic attacks actually started for me when", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "correct", "jfocus": "false_positive", "jmeds": "correct", "overall": "poor", "note": "focus=sharp directly contradicts 'helped with so much... except actual focus'; energy=tired and meds correct, mood=okay partial (anxiety/panic worse)."}, {"id": "a4554c4c", "text": "So, I excelled until my sophomore year of HS when I kept getting pulled out of school for getting sick, and couldn’t catch up. \n\nIt was debilitating. That’s how I found out I had ADHD. I flew under the radar bc I’m not so hyperactive, I’m inattentive. I would daydream in class and zone out and miss entire lessons and lectures, but I was smart enough to almost immediately understand the subject on my own. \n\nGoing from straight As to failing every single class was ... identity destroying. My entire perception of myself flipped upside down. I honestly would rather have struggled earlier and found out and learned how to deal with it, because after that, I still did pretty well, but it was frustrating knowing I could have done so much better had I known what to deal with.", "mood": "low", "energy": null, "focus": "present", "meds": [], "feelings": ["frustrated"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "So, I excelled until my sophomore", "gold": ["energy", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "mood=low correct ('debilitating, identity destroying'), but focus=present is inverted — 'daydream, zone out, miss entire lessons' is distracted/inattentive."}, {"id": "c5a7eb28", "text": "i get what youre saying. here's what has helped me lately.. find things that are true to yourself.. things that you truly enjoy and like. for me, i suddenly had an interest in mountain biking. it sprung out of nowhere. before i just went to work, came home, played video games, and had no goals. its so wierd because now, i borrowed a mountain bike from a friend, and went and rode on a local trail i found by myself. i had a fucking blast. so i started watching downhill mountain biking videos. they are addicting to watch. now, i have this goal to get a nice mountain bike, and ride trials in other states in the mountains.. that gave me a goal to travel, and a hobby in mountain biking... and to travel i need a 4x4 suv (4runner), and camping gear. and all that fun stuff. anyways, my point is screw everyone elses goals.. your goals are different from thiers. most people have this standard life ", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I get what youre saying. here's what has", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Clean — mood=great matches 'had a fucking blast' and 'you will be happy'."}, {"id": "35b4d8a7", "text": "You know how clothes for girls, and little girls, those dresses and stuff, can get so frilly and have some weird fabrics and stuff? I ended up a tomboy because I just couldn't deal with the discomfort of cutesy dresses, and the feeling of tights and stuff. So here goes early years feminity.\n\nThen I was always interested in subjects so far removed from what the regular everyday girl was supposed to like that I felt awkward amongst my peers. I was distracted, would draw instead of listen, and I had jumped a class. Anyway, here goes your standard way to conform: without a girly peer group, I was excluded (and felt excluded, those were really hard time for my teenaged girl self) from stereotype conformity.\n\nTeenage years were harsh. I managed to be a girl conforming teenager only during ONE year. Only because I think I took a weird interest (you know how it is, your brain stays fixated on so", "mood": null, "energy": "steady", "focus": "distracted", "meds": [], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I was distracted", "gold": ["focus"], "jmood": "na", "jenergy": "false_positive", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=distracted correct ('I was distracted, would draw instead of listen'), but energy=steady has no textual support — false positive."}, {"id": "e160d86b", "text": "My theory right now is that I might be goign to sleep too late, and waking up too late (and taking adderall xr 30mg too late)\n\nLike, going to bed at 2am, waking up at 10:30am or 11am.. and taking adderall xr 30mg right when i wake up\n\nSo I am thinking i need to go to sleep earlier, and i need to take adderall earlier.. as the shit probably goes on for 12 hours\n\nbut yeah about what you said, I guess maybe I could eat more. \n\nI eat 2 sausage,egg, and cheese breakfast burritos, and 1 sausage, egg, and cheese english muffin in the morning at around 10/11am when I wake up..\n\nThen at 2pm I eat a banana\n\nThen at 7pm I eat dinner\n\nMaybe I guess i should be eating more, as i view what i described as 2 meals a day.. Dont think the banana really counts a lot\n\nI also think a big part of why I can't get more than 6 hours and 30 mins (lately) is that I wake up at least 2 times a night to go pee for aw", "mood": "great", "energy": null, "focus": null, "meds": ["Adderall XR", "Adderall XR", "Adderall", "Adderall"], "feelings": [], "activities": ["Eating", "Hobbies"], "sleepHours": null, "sideEffect": false, "title": "My theory right now is that I might", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "poor", "note": "mood=great is badly inverted — tone is anxious/distressed ('my life is fucked without it', 'devastating thought'); meds correct."}, {"id": "291e15d6", "text": "I've never tried anything else but I take 15mg dexedrine er daily. I started at 10am but lately it's around 9am. I don't let myself take my meds until I've eaten or my food is in front of me ready to eat, because it really dampens my appetite.\n\nIt kicks in within 30-60 minutes and I never notice it dropping off. It's a slow and steady drop off after around 4pm. I get my adhd symptoms back again at the later part of the evening but it's really minor and tolerable.\n\nThe negative side effects are mostly dry mouth and loss of appetite.\n\nIt helps me feel like my mind is slowing down to a manageable level, I have more incentive to do things ahead of time and more thoroughly, my anxiety is way lower, I can be more extroverted and communicate clearly. I don't feel like the sky is falling. However I can't easily pick what to focus on so sometimes I waste a lot of time browsing the internet for bu", "mood": null, "energy": "steady", "focus": "present", "meds": ["Dexedrine"], "feelings": [], "activities": ["Eating", "Work"], "sleepHours": null, "sideEffect": true, "title": "I've never tried anything else", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "partial", "jfocus": "partial", "jmeds": "correct", "overall": "ok", "note": "focus=present captures the nuance loosely (helped overall but 'can't easily pick what to focus on'); energy=steady leans on med 'slow and steady drop-off' not a felt energy state."}, {"id": "90cce2c0", "text": "I can hit targets just fine, but I have to be allowed to work at my own pace &amp; give my brain space when it needs it, rather than constantly trying to focus on one thing for hours at a time. I pitch a lot better when I've had a chance to have a quick chat, or laugh at something with my work-wife between calls.\n\nBefore it got so strict, whenever I was having a Bad Brain Day (tm), I'd quickly go online &amp; find something to make myself laugh, or look at funny things my husband sends me on whatsapp, which always helped me to de-stress &amp; reset my focus.\n\nNow I have absolutely no coping mechanisms available &amp; my thoughts are too jumbled to string a decent pitch together, so I'm falling behind. Maybe I'll try getting one of those fidget spinner things?", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I can hit targets just fine", "gold": ["focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Both inverted — 'thoughts too jumbled... falling behind' is the opposite of focus=sharp and mood=good."}, {"id": "d1302a37", "text": "Not really on the ADHD side.\n\nOn the anxiety side, ACT (Acceptance and Commitment Therapy) was a little more helpful for me than cognitive behavioral therapy or general \"mindfulness\".\n\nACT doesn't require believing the positive alternative thoughts like you have to do in CBT, and doesn't require \"non-judgmental awareness\" like regular mindfulness - you just identify your anxious thoughts as anxious thoughts, introduce reasonable doubt by identifying ways in which past stories could be clouding your perception, and then remind yourself that you can still move forward even while you are having anxious thoughts.\n\nA great starter book on ACT is \"The Confidence Gap\" by Russ Harris, which I am working through right now. It seems to fit with the way I naturally think, and is really the first book that has ever been at all helpful with my anxiety, but YMMV...", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": ["anxious"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "ACT doesn't require believing the positive alternative thoughts", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Informational post on ACT for anxiety; mood=great is unsupported — author is managing anxious thoughts, asserts no positive mood."}, {"id": "28589d00", "text": "I’m in school with this exact issue. I have severe ADHD and take a daily dose of Vyvanse; problem is, my school day last 7 hours... I take my medication as I wake up so that I can drive normally but that also means I take my Vyvanse an hour before it even starts. I am unable to accomplish anything once schools out and just sit and sulk about how worthless I feel not being able to do anything myself. \n\nWhat I’ve started doing is waiting till I’ve got about an hour or two of my medication left and I drink 300mg of Caffeine (usually a “Bang” or “Reign” energy drinks). I’ve found that if I drink one before the Vyvanse wears off, I don’t feel the Vyvanse leave. I end up forgetting about my medication no longer being in effect and manage to get an additional 6 hours of ADHD relief. That’s what I do, I know that some people’s ADHD ends up getting worse with caffeine but in my experience it’s gr", "mood": "great", "energy": null, "focus": null, "meds": ["Vyvanse", "Vyvanse", "Vyvanse", "Vyvanse"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I have severe ADHD and take a daily", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "poor", "note": "mood=great inverted — 'sit and sulk about how worthless I feel', 'devastating'; meds correct."}, {"id": "c651c0fc", "text": "You absolutely have to eat. On my commutes home from work I noticed I got extremely angry, upset, and livid at everyone around me. Just a few days ago I maintained my caloric intake throughout the day and literally had 0 issues driving home that day and every day thereafter. I'm not entirely certain if you can get 'Ensure' in the UK (it's essentially liquid food, and is probably the easiest thing to get down). They make 220 and 350 calorie 250ml bottles of different flavors. If you find that you just can't eat food, get 2 or 3 of those, hold your nose shut with your fingers, chain drink all of them, and before releasing your fingers, wash your mouth out with water. For me it was literally a 1 day turnaround from complete dick mode to relaxed and stable persona.\n\nThe thing with Elvanse/Vyvanse is that you may not feel hungry, but you really have to put yourself into this simple mindset: a", "mood": "good", "energy": "steady", "focus": null, "meds": ["Elvanse", "Vyvanse", "Vyvanse", "Elvanse"], "feelings": ["angry"], "activities": ["Driving", "Eating", "Work"], "sleepHours": null, "sideEffect": false, "title": "On my commutes home from work I noticed", "gold": ["mood"], "jmood": "correct", "jenergy": "partial", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "mood=good fits the resolved 'relaxed and stable' end-state (anger captured in feelings); energy=steady loosely supported; meds correct."}, {"id": "713567a7", "text": "Oh man that was definitely a problem for me early on in university. By that point in my life, I had studied and done plenty of schoolwork in my life. I had not gotten the opportunity to drink and do drugs whenever I wanted  with potentially thousands of other young people and have wild conversations and experiences....Yeah that was a bit distracting.\n\nI basically let work slide early on (it wasn't too difficult for me anyway, the material/ideas, not the workload necessarily lol) and partied hardy. Then I let it slip the other way and suffered socially while focusing on schoolwork. Then I became depressed and both went to shit. Starting over. Again.", "mood": "low", "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "By that point in my life", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "Clean — focus=distracted ('a bit distracting') and mood=low ('became depressed and both went to shit') both correct."}, {"id": "11fc1424", "text": "definitely agree with you. I am certain my mom has it too and it explains so much. She tries so hard to be a great mom but she just cant keep up with what should be easy for most moms. I hate the fact that she doesnt  believe in ADHD though :/ and I hope one day I can convince her to talk to a doctor. But it's not the end of the world, shes happy and it doesnt affect us too much, just some things that shouldn't be a problem are really hard for her. \n\nI am also pretty sure my brother has it too but I am still wondering if its just him being a rebellious teenager. Even if he does, I figure I will wait till he gets to the point I got where it would have been most beneficial to have been diagnosed like the end of senior year in high school.", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "She tries so hard to be a great", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=great overstates — 'happy' refers to the author's mom; author is hopeful but frustrated ('I hate the fact that she doesnt believe')."}, {"id": "3893eca4", "text": "Aside from medication, coffee is my new water. I do notice the more often I drink the more I need to just keep my eyes open, so I keep it cyclical: a few weeks on, maybe a week or so off, etc. And, maybe it's just for me, check your vitamin D levels if you can. I live up north, and not having enough vitamin D can cause fatigue, so I have recently made sure to take some supplements. Regardless, keep fighting!", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Aside from medication", "gold": ["energy"], "jmood": "na", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Clear fatigue/energy signal missed — 'coffee... to keep my eyes open', 'vitamin D... can cause fatigue'; extractor returned no energy."}, {"id": "5108b0fa", "text": "I often have to remind myself of what is considered \"reasonably upset\" and also think about the other persons feelings as well. \n\n&amp;#x200B;\n\nFor example, as a kid i almost always had a crush on some one. Think Tina Belcher from Bob's Burgers. I was pretty weird and obsessed with romance. Naturally, I got rejected pretty often. Before I realized I had RSD, I would get unbelievably sad from the rejection even if the other person was super nice about it. I struggled with dating and having a love life for a very long time because of it. \n\n&amp;#x200B;\n\nSo after a certain point I just said to myself, It's ok that your feelings are hurt, it's reasonable to feel down after getting rejected, however, not everyone is going to like you just like how I don't like everyone. I thought about the ways in which I maybe didn't want to date some one else. Sometimes the reason is simply that was, you ar", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["sad"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Before I realized I had RSD", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good contradicts the captured 'sad' feeling and 'unbelievably sad from rejection' — the affect is sadness, reframing is coping not good mood."}, {"id": "9852039c", "text": "I’ve taken Adderall XR for around 15 years. Taking it does not elevate me over others, but it’s like wearing glasses. I’m 24 now, but, at 7 years old, I was misunderstood and in my own little bubble. I was no dummy but I could not connect to what was happening in the classroom. \n\n— I have a distinct memory of crying in my third grade class.  I was projecting my own “movies” on the white cinder block walls. Everyone had already turned to a page in their English books. I hadn’t the slightest clue what I should have been doing and the whole class saw my confusion when the teacher confronted me... awful feeling— \nMy family was worried that medication would stifle my artistic abilities. \nMedication affected my appetite and my heart rate, but I was finally able to listen to others. I could connect my creative world in my mind to the academic world. I was able to succeed with all my quirks in A", "mood": "low", "energy": null, "focus": null, "meds": ["Adderall XR"], "feelings": ["misunderstood"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I’ve taken Adderall XR for around 15 years", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "mood=low reads childhood narrative ('misunderstood','crying') as current; post is net grateful/positive ('worth it')."}, {"id": "0c84d700", "text": "It's funny. I can relate so much to the people here. I am a programmer and one thing really stood out so much to me. If I have some task to do, I'll spend hours working on something that will automate it, as opposed to doing some repetitive thing for 30 minutes. Regarding grading, I'm like that, I make stupid mistakes, like missing a page or something really glaringly obvious. It's like I just fall out of consciousness for a split second and thing skip a few frames but I don't notice. I notice the consequences later though. I can't tell you how many tests I've done that I never noticed the fucker was double sided or had a last page.\n\nSucks so much that the person I was seeing asked \"Why do you want an ADHD diagnosis?\". Well, I don't – I just don't think I've been anxious my *entire* life but I've had attention problems that long. I just want to function. I want to be able to keep my life", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "If I have some task to do", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "poor", "note": "clear attention problem ('fall out of consciousness','missing a page') missed; mood=okay contradicts frustrated tone ('utterly sucks')."}, {"id": "22a3fc00", "text": "My doctor told me Vyvanse is getting ready to go generic. Mydayis is the next iteration. Basically, it's supposed to last up to 16 hours. \n\nI've been on it for 4 months and it does last longer. There is also a noticeable difference in the delivery. The initial 30 minutes after taking it, which we are all familiar with, another around 4 hours later and another around 4 hours later. Unfortunately, during the second delivery, I get really tired. I just need to remember to be active during that time. During the third, I just get a calm feeling. It's usually when I'm on my home from work.", "mood": "good", "energy": "alert", "focus": null, "meds": ["Vyvanse", "Mydayis"], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "My doctor told me Vyvanse is getting ready", "gold": ["energy"], "jmood": "false_positive", "jenergy": "partial", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "energy=alert but dominant report is 'really tired' then 'calm'; mood=good unsupported."}, {"id": "248cded6", "text": "Yeah I hope that helps! Make sure you are well hydrated too, and getting enough food and all that, it's easy to forget. Since it was making you feel productive I hope it works out and is level for you. Test run it as long as you feel is worth it and if it's not a good fit you can just work something out with your doc. :)  I'm not getting the motivation and clarity you're describing which is why I'm going in to see about adjustment/possible med switch, so it's all different for everyone.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Eating", "Work"], "sleepHours": null, "sideEffect": false, "title": "Make sure you are well hydrated too", "gold": ["energy"], "jmood": "na", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'not getting the motivation and clarity' is a low-energy/motivation self-report the extractor dropped."}, {"id": "eee9a145", "text": "What medication are you on? I was on concerta for about 2 weeks and in that time it managed to pretty much take over my life for the worst because I was so irritable and had crazy mood swings. Judging by you saying \"whenever I do manage to focus\" it sounds like your medication isnt working wonders for you? If its making you irritable and its not helping your focus as much as it should talk to your doctor about other medications, there are lots of different ones maybe you just havent found the right one for you yet.", "mood": "low", "energy": "steady", "focus": "sharp", "meds": ["Concerta"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I was on concerta for about 2 weeks", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "correct", "overall": "poor", "note": "focus=sharp is backwards — text says med 'isnt working'/'not helping your focus'; energy=steady unsupported."}, {"id": "12270a9e", "text": "I grew up struggling a lot with my mental health. That's the only way I can really say it all, but the important part here is that I went through institutional programs for depression and anxiety and an eating disorder, and it just wasn't helping. It didn't help because I never expressed this weird impending doom-ish feeling that something else was wrong that we can't figure out.   \nWhen I moved out for college, everything got so much worse. I was barely functional and I struggled so hard to process information and do my schoolwork. I was having panic attacks in class and in the library and ended up taking incomplete grades for most of that quarter.   \nI had a panic attack at the library towards the end of the Quarter. The school stuff was always a battle, but I was never this isolated and overwhelmed. I just shook and cried outside our school quad, waiting for my roommate to help me hom", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Eating", "Outdoors"], "sleepHours": null, "sideEffect": false, "title": "It didn't help because I never expressed this", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=okay is a defensible net of a heavy panic/depression narrative that ends hopeful, but flattens severe distress."}, {"id": "97d1231d", "text": "I can't speak for him since I don't actually know him, but for me adjusting to major changes in life have always been really difficult. I don't think he has lost interest in you, he propably feels overwhelmed and is trying to get his life back on track before concentrating on yet another new thing, you. If he tried to fit you in right now with all the other stuff he's working on, it could soon result to him getting drained and exhausted (or that's how I would personally feel in his situation). Propably he's trying to work on himself/the changes he's had recently to eventually be able to be there for you better. Hope this helps!", "mood": "good", "energy": "tired", "focus": "sharp", "meds": [], "feelings": ["overwhelmed", "exhausted"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I don't think he has lost interest in", "gold": ["mood", "energy", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "all three signals describe 'him' (overwhelmed/exhausted), not the writer; mood=good directly contradicts the projected feelings."}, {"id": "3c7da5b9", "text": "Strength training has helped me so much! I also find it very motivating when I can do something I couldn't do before -- things just get easier, and that's a good thing for ADHD. It's easier to carry laundry up and down the stairs, bring in the groceries and I honestly just feel more comfortable SITTING. I can sit for longer periods of time with less pain/discomfort to distract me -- I always used to focus on my shoulder or lower back pain, but now that they're disappearing as I get stronger, it's one less thing pulling my attention away from a task! I have less anxiety too -- I can always tell I need to go to the gym if my anxiety starts building up. \n\nAll these benefits have kept me motivated to go to the gym more than anything else! And all I do is  run 1 mile and lift for 30-40 minutes twice per week, sometimes three times, and otherwise I mix in walking and gentle yoga.", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": ["motivated"], "activities": ["Chores", "Fitness"], "sleepHours": null, "sideEffect": false, "title": "I also find it very motivating when I", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=distracted inverts the text — distractions are 'disappearing'/'one less thing pulling my attention'; positive mood missed."}, {"id": "2f6882fb", "text": "Yep. I can remember most of my childhood (even some really early and obscure things), and I can recall all kinds of things that I've read without having made an effort to study them (depending on how/when I read it, though – if I'm skimreading something or reading it while procrastinating/daydreaming, I forget it almost instantly), but I can't even remember what time I woke up on most days, and whenever I go out I always worry that I've left the front door open because I can never remember actually closing it.\n\nMy working memory is the worst one, though – I can't even do the simplest of arithmetic without writing it down as I go (otherwise all of the numbers get lost in brain fog).", "mood": null, "energy": null, "focus": "foggy", "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "I can remember most of my childhood (even", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=foggy matches explicit 'brain fog'/poor working memory; no real mood expressed."}, {"id": "c312cd17", "text": "I'm good, thanks.\n\n&gt; I am curious what is happening here? I probably can guess, but even if it is what I am guessing happening hearing words helps me organize my life for sometimes my brain is chaotic when planning the long term future even though in the near present I can focus so well. There are just too many unknowns, this is kinda related to my ADHD but it is also kinda a different coexisting condition that often comes with ADHD.\nSo do you mind telling what happened? I ask for I am now at that point trying to plan out my future career in the classes I am going to take.\n\n\nAre you asking what classes I took? Confused a bit, but I'm pretty sure that's what you meant? Some colleges have dedicated concentrations within a major that are listed on your transcript (i.e., Psychology with concentration in Social Psych, or etc), my university does not. One of my majors was in psych, I decide", "mood": "great", "energy": null, "focus": "present", "meds": [], "feelings": ["curious"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "&gt", "gold": ["focus"], "jmood": "partial", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=present supported ('in the near present I can focus so well'); mood=great overshoots a mild 'I'm good'."}, {"id": "ea972e52", "text": "Yea your IQ results are confusing. I got a really low score on the short term memory section of my IQ test (bottom 3rd Percentile) but the test I was given was harder than yours because I was given a bunch of letters and numbers and then asked to put them in alphabetical and sequential order.  this was hard for me because I don't know the order of the alphabet (I can get up to K, lol).\n\nBut you having a low processing speed is weird considering your high Working Memory. I have a pretty good processing speed (well the higher end of average) but it was noted in my report that it would of been signifantly higher if I had a better short-term memory since they are both related.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I got a really low score on the", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=good unsupported — text is neutral descriptive talk about IQ/memory test scores."}, {"id": "e21c7486", "text": "Holy shit I thought there was something wrong with me. I thought I had tinnitus! Or auditory hallucinations? Because I hear music ALL THE TIME that isn’t there. Mostly at night, winding down and reading or whatever and I’ll ask my husband to turn his volume down because the music from his Instagram feed is distracting me, and I’ll look over at him and he’s reading a book, not dicking around on his phone. Or I’ll think the neighbors are having a party because I hear a muffled bass line, but their house is completely dark. It’s always sort of fuzzy and muffled and indistinct, like the music is coming to me through the walls from way down the street. Like you, it doesn’t bother me, and meds don’t affect it; it’s just kind of weird. Is your experience similar?", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": ["Hanging Out", "Hobbies", "Screen Time"], "sleepHours": null, "sideEffect": false, "title": "Mostly at night", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=distracted supported (phantom music 'distracting me'); no mood/energy claim."}, {"id": "1f8e3a73", "text": "my personal experience, started **10mg 2x daily IR** generic Barr, started off great then one week later crazy side effects. Mainly stomach issues and slight headaches. i was made aware that your body kinda as to become acquainted with new medications like adderall, which mines did adjust to. On my second month i switch to a different generic, CorePharma, no side effects and great focus! it's like i have this focus mentality to get things done but knowing i have a organized schedule. i notice with Barr it gave me more of a wide awake feeling and kept me multitasking without prioritizing, yet still productive is of course good. So far good with Core. Waiting for my appointment to hopefully get a dosage increase.", "mood": "great", "energy": "alert", "focus": "sharp", "meds": ["Adderall"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Mainly stomach issues and slight headaches. i was", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "correct", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "clean — 'great', 'wide awake', 'great focus' all map correctly; Adderall captured."}, {"id": "141520af", "text": "I hope you get paired with a great psych and a great therapist when you get away from home because I think both could do wonders for you. It sounds like you might be a bit hesitant about stimulant meds, I was very hesitant myself. But I decided to try them, knowing I could stop if it didn't work, and it was a dramatic overnight difference for me. Not a miracle drug and not a cure, but it had an enormous effect on a lot of the symptoms that you're bothered by. \n\nRe: depression, it's really a misconception that depression is about sadness. Depression is often an experience of numb detachment. It can often feel like a depression of both positive and negative moods, leaving you feeling empty and hopeless without necessarily being sad. \n\nRe: trauma, I know you're downplaying that experience because it's your normal and because you were so young. But that is a significant fucking trauma at an ", "mood": "flat", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I hope you get paired with a great", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood=flat fits the 'numb detachment/empty' depression description; advice-framed but apt."}, {"id": "b5ec5114", "text": "My son is five and takes a total of 20mg of evekeo daily and is not a zombie at all. Is actually still hyper through the day. If he wasn't on meds I would be doing him a disservice because he wouldn't even be able to focus long enough to write his name. He is also on risperdal, low dose, to help with anger rages which we think is stemming from bipolar. Both diseases run strong in his family. To say kids shouldn't be able to be on medicine till five would be helping some children whosee parent cry wolf but it would also really hurt kids like my son who wouldn't barley be functional without it", "mood": "okay", "energy": null, "focus": "present", "meds": ["Evekeo"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "My son is five and takes a total", "gold": ["focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "focus=present matches son 'able to focus'; mood=okay not stated, unsupported."}, {"id": "38a658e1", "text": "**update**\n\nI think the video card is fried. Arg.\n\nOn the plus side I accidentally have to work on computer, the part of my job that is a hobby. I'm actually excited about having to work on my computer. So that's cool.\n\nOn the negative, I need to find a decent video card in the era of block chain crypto currency *mobile phone posting*.\n\n**TLDR** It was a weird crappy productive day. I'm super excited that I'm getting to work on my computer tomorrow. So I got that going for me, and that's nice.\n\nI'm actually feeling good about how I dealt with today. It sucked, but I made it and I get to do something fun tomorrow, and maybe reward myself by doing more fun things. Yay!", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["excited"], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I'm actually excited about having to work on", "gold": ["energy"], "jmood": "correct", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'super excited'/'Yay!' is high energy the extractor left null; mood=good correct."}, {"id": "2f94b641", "text": "My one resolution is to bike to work. I used to, but slowly the temptation to drive when I was late (which was every day) took over. I feel more focused when I start my day with exercise, and less guilty for using gas and wearing on the car for the very short distance. So far so good! And being able to tackle my one resolution well is reminding me that I can do stuff, unlike if I had overpromised on a bunch of crazy resolutions and failed them.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": ["guilty"], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "I feel more focused when I start my", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=sharp matches 'feel more focused'; positive mood ('so far so good', less guilty) not captured."}, {"id": "5537ff52", "text": "This is the same thing for me, I've tried meds a few times, it works short term, but I was worried about the long term. I could tell different unhealthy symptoms were arising the longer I took them. I loved the results though, but I didn't want the results to be more important than my long term health, personality change, priorities, etc just because I could focus longer and have better social experiences. Don't get me wrong though, I would be taking them right now if there was some balance with them and a healthier long term effect. They just don't work for me, which sucks because I have to work that much harder to keep a better diet, exercise, workflow, routines, a lot of routines, counseling, the list goes on. With the right strategies, and maybe experience on meds to know you are able to focus, you can develop the skills to maintain and live a healthy life. But that's only my my opin", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": ["loved"], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "I loved the results though", "gold": ["focus"], "jmood": "partial", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=sharp supported ('could focus longer'); mood=good is the conflicted upside ('loved the results' but quitting)."}, {"id": "abf0695c", "text": "A pseudonym, like u/avordrok suggested could work. However, it really depends on how you want to tell your story. If you're focusing solely on how ADD affects you, then you might consider only mentioning your family briefly. Otherwise, it might be wise to disclose that your family will be mentioned in your book if it's published - however, you should talk to an expert or a lawyer about this. \n\nAlso, you might find that just the act of writing your book is cathartic. If you realize that you don't necessarily need to publish the book after it's done, then there's no point in telling your family because your story won't be available for the public. So, maybe just write your book first, then see how you feel about publishing it/talk to an expert to figure out your next steps.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "If you're focusing solely on how ADD affects", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp is a keyword misfire on 'focusing solely on how ADD affects you' — book-scope, not attention."}, {"id": "e4b9e8bc", "text": "1. No, it doesn't really have much PNS activity at all. It's all about focus and mental function vs motivation. In fact, some people feel kind of lazy at certain moments because the dopamine balance is sort of perfect. In those times, drink water and move and it goes away (for me)\n\n2. Mood - for me, no, I don't think. I'm fairly consistent day to day, and happy, but not high or chipper or anything odd. Just levels my mood. Those of us with dopamine related issues can have swings and self medicating with coffee and such can make that worse. Vyvanse keeps me level. \n\n3. No way. 30IR mixed salts is about 23mg dex, all at once. That's a hefty dose compared to typical Vyvanse starting doses. Expect some... Transition effects while your tolerance lowers. Prepare the iced coffee.", "mood": "great", "energy": null, "focus": "sharp", "meds": ["Vyvanse", "dex", "Vyvanse"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "No", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "missed", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "focus=sharp ('all about focus') correct; 'feel kind of lazy' is a low-energy cue dropped; mood=great overshoots 'happy, just levels my mood'."}, {"id": "110f6a8e", "text": "does anyone every get prescribed 2 XR pills?  I have an XR and a booster for the afternoon, but since I changed up my schedule, the XR I take at 6AM seems to phase out at about
