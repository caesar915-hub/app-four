 1-2 which makes sense.  Ideally I'd take my booster then, but that leaves me crashing right at 6 when I get home, so I'm a pain in the ass to be around and I can't do anything for a little while.  So typically I wait to take my booster at 4, which at leasts allows me to transition home and then make dinner with my SO, etc.  But if I could take two XRs, one at 6, the other at 2, I'd have full day coverage.  Also I find the XR to be much more subtle and less crash inducing compared to the IR booster, which is my other rationale here.", "mood": null, "energy": "sluggish", "focus": null, "meds": [], "feelings": [], "activities": ["Eating"], "sleepHours": null, "sideEffect": true, "title": "Does anyone every get prescribed 2 XR pills?", "gold": ["mood", "energy"], "jmood": "missed", "jenergy": "correct", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "energy=sluggish matches 'crashing'/'can't do anything'; irritable mood ('pain in the ass to be around') missed."}, {"id": "9879df20", "text": "Yea... \"Rude\" doesn't really cover the full extent of it. I'm an aggressive person who's gotten into the habit of teasing and poking fun at people to show my affection. It was fine with my old partner who did the same thing, but it's really hurting my current partner who's much more passive. What seemed like playful fun in my old relationships is verbal abuse in my new one. I had to be called out on it to realize how horrible my behavior really was, and how it was affecting him.\n\n\nI sat down with my partner to figure out which behaviors I needed to stop or change. He struggles with expressing his thoughts and feelings due to social anxiety, so we're working on ways he can let me know when I've crossed any lines. \n\n\nBeing aware of it has helped, but I'm really struggling to control my impulses. I still slip up from time to time and say mean things. I call myself out on it now and apologiz", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": ["playful"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "\"Rude\" doesn't really cover the full extent of", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=okay contradicts self-critical distress ('horrible','struggling to control impulses'); 'playful' pulled from past behavior."}, {"id": "7eed0ef1", "text": "I agree\n\nI hate that we live in a society where everyone always has to be \"productive\". Like sheesh. Weekends exist for a reason. People literally died for us to have weekends, and I don't want to spend them doing chores. And if anything seems like a chore, I just avoid doing it and \"waste\" my weekend so it's counterproductive\n\nI've started to roll my eyes at people who say things like \"I feel awful when I don't have a productive day...I constantly need to keep working\". Okay well just know that that doesn't make you superior to others", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "People literally died for us to have weekends", "gold": ["energy"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=low captures the irritated/cynical tone direction, though it's more annoyance than sadness; no energy actually self-reported."}, {"id": "6e769008", "text": "Ahahahahah. My diet SUCKS.\n\nI have appetite suppression as my main sideffect and well. I can stand to loose some weight, but I lost way too much over a short period in the beginning and so I basically react to unhealthy things with \"nice, a way to boost my calories!\".\n\nThat being said, I do eat a relatively healthy diet outside of that. Lots of veggies, lots of water.\n\nI've not noticed sugar doing anything to me except perhaps give me some energy when I need it. It does not make my adhd worse.\n\nThere's also been a study about the whole sugar thing, Russell barkley mentions it somewhere - they gave all the kids sugar substitutes and told the parents of half that they had sugar. The reports of those parents were noticeably worse, even though.... The kids hadn't had any sugar...\nDr. Barkley has mentioned diet a few times, iirc. Might be worth checking that out. \n\nIn the end, there are kids ", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": ["restless"], "activities": ["Eating", "Fitness", "Outdoors"], "sleepHours": null, "sideEffect": false, "title": "I've not noticed sugar doing anything to me", "gold": ["energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=okay is a false positive on a didactic diet/sugar advice post; 'gives me energy' is a generic claim, not a current state — nulls elsewhere correct."}, {"id": "2dcff8cc", "text": "I feel this HARD. I was recently diagnosed with CPTSD and \"ADHD-like symptoms\" (she's not sure if it's full comorbidity, haven't done computer testing or anything). Your post and all of the comments are super validating, especially as a person who had been through multiple diagnoses (depression, anxiety, bipolar, PTSD, possibly ADHD) by different therapists. I definitely think that the CPTSD is the main thing, but seeing that there are a lot of symptoms in common with ADHD helps me feel less crazy in taking adderall and needing it to get anything done.\n\nAlthough this does make me wonder if there's ever any \"correct\" diagnosis for anything, because all of the symptoms for so many disorders overlap.", "mood": null, "energy": null, "focus": null, "meds": ["Adderall"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I was recently diagnosed with CPTSD and \"ADHD-like", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "Adderall captured correctly, but the relieved/validated 'feel less crazy' mood was missed (mood=null)."}, {"id": "545b6a12", "text": "&gt;With that being said, if I do it on the fly it is (so I have been told) believable and quite good.\n\nThat's interesting. I've noticed with myself when I'm messing around with friends (cuz I'm a jokesta) when I start concocting some made up scenario, if I don't think about it and just go with the flow, it becomes natural and easy to be witty and charming. I can't explain how or why, but when there's no anxiety or distractions going on in my head, my mind can easily grab material from out of nowhere and apply it to whatever I'm talking about on the fly. I guess this is tapping into the same vein when comedians can make people laugh so effortlessly.\n\nHowever, when it comes to personal or serious issues of nature, yea.... forget about it. Exact opposite happens.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Hanging Out", "Outdoors"], "sleepHours": null, "sideEffect": false, "title": "I've noticed with myself when I'm messing around", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Reflective/general musing on wittiness with no current-state signal; all-null output is defensible. Clean."}, {"id": "4500b5ad", "text": "I 100% understand this. I was diagnosed about 6 months ago and started medication immediately. When I forget to take it, it's like overwhelming how difficult it is to calm your mind and think about only one thing, or just think clearly without a giant fog over your brain. I'm in my second year of a PhD program and man do I wonder how I got here like this, lol. Kinda wish I could turn back time and start over but with meds.. Oops, that was a little sad. It's really actually life changing how much the meds help and I'm just grateful I have it now. ��", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["overwhelmed", "sad", "grateful"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "When I forget to take it", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "mood=low overweights 'a little sad' against the dominant grateful/'life changing' turn; off-meds 'fog over your brain' focus signal missed."}, {"id": "0e57c501", "text": "I feel like people who have suggested these kinds of things to me over the course of my life vastly underestimate my imagination's ability to create distractions. \n\nIf there's something I really don't want to do, I will (and genuinely have, more than once) sit on the floor and stare at the wall for hours rather than getting down to it. But even before getting to that extreme, the number of ways I can distract myself is endless. Does my task require a computer? I'm done. Perhaps some tools or supplies which could be organised better? Perhaps the task itself could be made more efficient in some way? And oh look, the whole day is gone, the task isn't finished, and I didn't actually enjoy myself at any point because I had the stress of not doing the thing looming over me all day.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "If there's something I really don't want to", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "poor", "note": "mood=good is wrong-direction (text is stressed, 'didn't enjoy myself'); heavy distraction/procrastination focus signal missed."}, {"id": "f8be873e", "text": "Friends require too much attention. Now that I am on meds I am able to function socially with people. I do feel like it may be too little too late and that I am now just a loner by choice. Like people like me, SURPRISE! Though I’m always in the clouds so now I’m trying to be present and take interest in people and be socially aware. \n\nIt is hard, but don’t give up it just takes us longer to get there.", "mood": null, "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Though I’m always in the clouds so now", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=present matches 'trying to be present' vs 'always in the clouds' baseline. Clean."}, {"id": "db666f8f", "text": "I have never abused them, I also never exceeded the dosage as outlined by our national regulation association. \n\nI am very anxiety sensitive, a few cups of coffee can give me such crippling anxiety. This in turn leads me to believe that the release of nor-epi/noradrenaline has a very bad effect on my psyche. When I found out about the low affinity for nor-epi by IPP and the high affinity for DAT/DOPAMINE I figured it would be worth a shot. Lo and behold, the IPP is treating my ADD without causing severe anxiety/OCD issues.\n\nThe prevalence of OCD/TICS has btw been implicated in many many studies studies regarding dopamine dysregulation. The thing is, I am not sure what benefit a psychiatrist would have right now. Thats why I posted this question", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I have never abused them", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "anxiety-sensitivity content ('crippling anxiety') is a mild mood signal that was missed; IPP correctly not catalogued."}, {"id": "e083f47b", "text": "A doctor once told me that caffeine is actually bad for productivity. He kind of explained it like this, you only have so much mental energy throughout the day. Coffee makes you think you are more productive, because it bunches of all that energy within 2-3 hours. After this, you're basically running on fumes. You can drink more coffee, but now you're bunching up even less energy in that 2-3 hours. Because you can't possibly do everything within 2-3 hours, after the crash, you are significantly losing productivity, and the average productivity is really hindered.  \n\nIts kind of like driving a car, if you go 120mph down the freeway, you actually won't make it as far as if you go 55mph, because you will use up gas *much* faster, per mile driven.\n\nIt actually does work quite well if you take it in smaller doses, more times throughout the day.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Driving", "Fitness", "Work"], "sleepHours": null, "sideEffect": true, "title": "Because you can't possibly do everything within 2-3", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Pure third-person advice about caffeine/energy with no personal state; all-null is correct despite gold hints."}, {"id": "a2ece712", "text": "I haven't done much acting while on medication yet, but so far it's actually improved it sooooo much.\n\nI'm actually able to remember the next line and actually deliver it on time. I used to stuff up my lines a fair amount (no matter how much I practiced) because I'd get lost in my sea of thoughts.\n\nI also used to struggle with keeping up my acting for long periods of time. For example I'd have to be angry for a bit but before I know it, I'm back to smiling because I got distracted.\n\n**Anyways! TL;DR Overall it's been a positive experience!**", "mood": "low", "energy": null, "focus": "distracted", "meds": [], "feelings": ["angry"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I haven't done much acting while on medication", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "poor", "note": "mood=low inverts a clearly positive post ('improved sooooo much','positive experience'); 'angry' is a role being acted, not the author's mood."}, {"id": "a32be327", "text": "&gt;And therefor everything I've achieved is fake and something I don't deserve.\n\nYou have acheived everything you have *in spite* of having the challenges associated ADHD. That's huge and it's fine to acknowledge that and feel proud. Taking meds isn't cheating, it's giving yourself the opportunity to play on a level field. \n\n&gt;I obviously felt that way when I learned about ADHD. I don't know why I suddenly doubt it.\n\nBecause it's weird that a pill can change these habits that are ingrained in you, these things that you consider a part of your self identity. It makes you feel like it's too easy and that if it's this easy, maybe you didn't struggle as much you think you did. Trust me, you did. \n\nIt's important to note that often the start of medication therapy is awesome but pills aren't skills and they aren't magic. Take this time, when the meds are super effective, to delevop better h", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": ["proud"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "&gt", "gold": ["focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Second-person encouragement misread as the author's state: mood=good and focus=sharp are both misattributed ('feel proud' is told to the reader)."}, {"id": "ab5eab66", "text": "I feel like I may actually be able to help out with this! I've always had Raynaud's, and as such never really noticed any difference once starting medication. However, a week or two ago I had a series of migraines hit me, and my arms and hands had a feeling that I believe is very similar to what you're referring to - tense and almost akin to the feeling you get with 'dead arm' (from accidentally sleeping on your arm or something.\n\nI, like you, was pretty freaked out. But I finally finished my assignments and it went away. I guess that my issue was caused by being extremely stressed. With writing your medical school exam this week, it could likely be that? Definitely still get it checked out once your finished your exam though!", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["tense"], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": true, "title": "However", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=low is the right negative direction but 'freaked out/stressed' over physical symptoms is anxious, not depressive; 'tense' is a physical arm sensation."}, {"id": "94cdda32", "text": "I’ve noticed keeping my house and car clean greatly reduces my anxiety and distraction. If I find myself frazzled and unable to focus on anything, I can usually take a look around and find that my house is a wreck. I make cleaning my number one priority once I realize this, and force myself not to do anything else until it’s all clean. I usually make numbered lists when I clean, in sequential order of what I think will prove most efficient. The list helps me refocus, I’ll often turn to it if I get distracted and lost on what I was doing. \n\nBut generally, I’m really bad at putting things away, so by the end of the week it gets messy again! Back to the list!", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Chores"], "sleepHours": null, "sideEffect": false, "title": "If I find myself frazzled and unable to", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp inverts the self-state ('frazzled and unable to focus','distracted and lost'); the anxiety mood is also missed."}, {"id": "7218daae", "text": "ADHD can sort of help sometimes too. \n\nMy previous job was a project manager for a large tech-based company. It was fast paced, lots of quick impromptu meetings, lots of choices to make and different things to do every day. \n\nI had coworkers get burnt out by the constant jumping around to different tasks and changing priorities. For me though, it felt like a job I'd been training for my whole life. With meds it was even better.\n\nThat said, the few times I had to assist with manual data migration made me want to jump out a damn window.", "mood": "good", "energy": "sluggish", "focus": "foggy", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I had coworkers get burnt out by the", "gold": ["mood"], "jmood": "correct", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "mood=good is fine, but energy=sluggish and focus=foggy both contradict a fast-paced/thriving post — two false positives."}, {"id": "884b4816", "text": "I recently got (re-)diagnosed, my therapist strongly suggested me taking medication and arranged an appointment with a psychatrist to make this happen. Problem is I am writing university tests in a couple days and will only receive medication after those tests, so I borrowed some medikinet from an ADHD friend of mine last week and started out with the regular dosis of 10 mg per day (currently at 20), so I could study successfully.\n\nI can tell you the results are insane, unbelivable, beyond imagination. The impact is actually not even that dramatic, it is not like you can pinpoint down that you are on a drug, nothing changes, you dont feel stimulated or high. What happens is that everything seems a bit more straightforward and simple in some way, as if someone had blown away the fog. My hyperactivity/restlessness, my inability to stay focussed on one task, my boredom with simple tasks, my", "mood": "okay", "energy": null, "focus": "distracted", "meds": ["amphetamine"], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Doing mudane", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "missed", "jfocus": "false_positive", "jmeds": "false_positive", "overall": "poor", "note": "meds=amphetamine is wrong (drug is Medikinet=methylphenidate); focus=distracted inverts 'inability to focus... gone'; mood=okay understates 'calmer/well leveled'."}, {"id": "56fb8c4e", "text": "The way that it works for me is that my brain jumps around from terrible depressive scenario number 1 to depressing scenario number 1 billion very quickly. I also fixate on how much I've screwed up and then do impulsive/compulsive things to punish myself. It's like an ouroboros of misery and self-destruction. If you're depressed and you have ADHD, please get some help. My life is so completely different now that I am medicated and working every day to find a middle path. Where I am not completely in the depths of hell and not bouncing off the walls. Moderation is a beautiful thing.", "mood": "low", "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "The way that it works for me is", "gold": ["mood"], "jmood": "correct", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=low well supported (depression/'ouroboros of misery'), but energy=steady is unsupported — false positive."}, {"id": "51fd58b4", "text": "It's easy to get distracted when you don't feel safe. Sex is a really vulnerable state, physically and emotionally. If your partner gives you any reason to fear your emotional safety. If you have arguments outside or inside the bedroom, your emotional safety is compromised, how you both deal with the fallout of disagreements, arguments, failures to emotionally respond to a partners bid, etc determines how safe you feel in a deep level.  \nUs ADHD sufferers often feel fear very easily and it often manifests as anxiety and a sort of hypervigilence, you'll notice wrong music,  sounds,  smells,  etc and fall to be in the moment.  \nThink of the times you did enjoy sex greatly,  I bet you were relaxed and maybe even noticed you felt safe.   \nRemeber,  a new partner (even a casual one) in the right circumstances can give this feeling of safety and results in great sex, until they do things that ", "mood": "great", "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": ["Outdoors"], "sleepHours": null, "sideEffect": false, "title": "It's easy to get distracted when you don't", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "poor", "note": "mood=great is a keyword artifact from 'great sex'; the post is about fear/hypervigilance. focus=distracted is generic-advisory, not a personal state."}, {"id": "c1df3833", "text": "I'm a PhD student in biology.  The only way I know how to prioritize is to put something at the top of my list and put in all of my energy into that one thing.  I really need to learn how to balance my priorities, but for now I just rotate through what is at the top of the list.  I'm afraid that if I divide my attention I will lose all my passion...  But honestly, that could be applicable to other jobs or even life in general.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "The only way I know how to prioritize", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Reflective prioritization strategy ('all my energy into one thing') is figurative/general; all-null defensible. Clean."}, {"id": "4e6bf5d4", "text": "I HATE the \"the reason you have ADHD is because you eat too much sugar.\" I was raised by a dietitian, so my diet growing up was excellent. If it was diet related I wouldn't have shown symptoms!\n\nNow, there are times when I do indulge my sweet tooth too much, and it has no effect on my concentration. The only thing I have found that helps my focus is exercise (high intensity for at least an hour), but that only helps, doesn't cure. ADHD naysayers piss me off so much. I would happily not have it, not take meds, and would do the simple thing IF IT WORKED!", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "Now", "gold": ["focus"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp unsupported (exercise only 'helps, doesn't cure'); clear anger ('naysayers piss me off') missed as mood."}, {"id": "13315bf9", "text": "I am a teacher with ADHD and I'd never ever ever say this. It just gives you anxiety and makes it worse. Then you try to meet high expectations and it makes you make more mistakes. Then you get reprimanded for the mistakes. It makes you feel slow and dumb. It shows people's impatience with the way you think, work and feel. \n\nWell then find a system they say.\n\nHey... I already have a system and this stuff still happens because I am always in the moment. \n\nTime is a bitch. \n\nI will always, be patient with my kids. Especially the ones who learn differently.", "mood": null, "energy": "sluggish", "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "It makes you feel slow and dumb", "gold": ["mood"], "jmood": "missed", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=sluggish misreads 'feel slow and dumb' (self-worth/external impatience, not energy); the clearly negative mood was missed."}, {"id": "4f00f18f", "text": "HAHAHA I've almost ruined my underwear so many this week because of this. Even when on my meds it is almost every time I need to go I put it off. Off my meds is worse. I'm gonna have to seriously cut back on my reddit for a while, and if that isn't possible I'm gonna have to just cut it out for a while. It's so bad I get distracted masturbating. I can't tell you the number of times I've caught myself 10 minutes later reading some article or watching something on tv and realized my dick has gone limp in my hand.", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "It's so bad I get distracted masturbating", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=distracted strongly supported (chronic distraction on and off meds); jokey tone justifies null mood. Clean."}, {"id": "e5f84860", "text": "For me it was the physical pain! Completing caught me off guard and would never go away. So lucky my husband was there to take care of me. \n\nIt should pass soon though! If you’re still feeling the same way, I’d suggest talking to your doctor/psychiatrist, as it is known to cause mood changes. Or if you ever need to just talk, feel free to send me a message �� we all take care of each other in our little tribe", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Completing caught me off guard and would never", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Warm/grateful tone ('lucky my husband','our little tribe') is a mild mood signal that was missed; otherwise thin and reassuring."}, {"id": "2c8e0853", "text": "My psychiatrist told me that a normal person allow themselves about 20 - 30 percent less slack than they give to others while people with adhd either give themselves 40-50 percent less or more slack depending on their personality. \n\nI take it that you are the tape that gives yourself less slack than the ones around you.\n\nThis in theory means that you can beat yourself up over things 20 percent less than you currently do and still do it more than the normal person. \n\nSo what can you do? Well first of: realise that you and everyone around you make mistakes.\n\nNot one person are better than you and you are not better than them. \n\nThey might have it easier, but there will always be someone who is better than them.\n\nIn other words, there will always be someone better. Celebrate that they are good in something and move on. You have your own thing, but might not have found out what that thing is", "mood": "good", "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Not one person are better than you and", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Entirely advice to another person; mood=good and focus=present are misattributed coaching ('practice positive responses'), not the author's state."}, {"id": "4baa6bc5", "text": "As the other person said, I think Rejection Sensitive Dysphoria is a huge factor why I often feel childlish, as if I am fixating on meaningless nonsense while other people are thinking about important things relating their future(although that may not be case, since I really don't know what goes in the heads of neurotypicals).  \nI still cringe at those moments when I felt feelings of rejection, and ruined many opportunities, while in actuality those feelings had nothing to do with objective reality of things(and often, or most of times it was complete opposite of it).", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "As the other person said", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Negative self-conscious mood ('feel childish', cringe, 'ruined many opportunities') clearly present but returned null — missed."}, {"id": "35ea95db", "text": "Physics/Math student here, and I have very similar symptoms to what you are listing. I wasn't diagnosed until a few years into college. I always had great grades and the best grades on tests. I got a 31 on my ACT my junior year of HS. Always drawing during lectures instead of note-taking is a huge indicator according to my psychologist. It allows one to remain in complete control of one of their senses, and that means better focusing on the others. I am always drawing instead of taking notes. I didn't start noticing major memory issues until I became very stressed for a period of a few months, and then they popped up with a vengeance and never went away. I ended up going to the doctor and getting diagnosed because my anxiety from losing things eventually became so bad I couldn't function.", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "I always had great grades and the best", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "poor", "note": "mood=good ignores the arc ending in anxiety 'so bad I couldn't function'; focus=sharp overstates (drawing aids focus, but net is memory/anxiety impairment)."}, {"id": "996b2ea3", "text": "Definitely talk to your doctor first. Stopping medication suddenly is a bad idea, generally. Also, it's possible just adjusting dosages will help with feeling weird.\n\nLast thing to consider when thinking about tapering off meds, is are you in a good place right now? Is your mood stable (and has been for a few months), and do you have a good support network? Going off meds can be hard, especially if you don't have people you can check in with and talk to if things aren't going so well. \n\nBest of luck finding what works for you :)", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Going off meds can be hard", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Advice to another about tapering; 'is your mood stable' is a question to the reader, not the author's mood. All-null correct; gold 'mood' is a false hint."}, {"id": "41cb6981", "text": "It was in the 30 Essential Ideas video, but the examples he used were for babysitting and driving - two common activities for teenagers, but he insists they be medicated because they are emotionally 12 or younger, and you would not have, say, a 9 year old driving a car. \n\nI know the feeling about the pressure from everyone else. But honestly? Fuck 'em. Who gives a shit what they think. Family generally wants you to be happy, and they have been stupidly conditioned by society to think a young man NEEDS a girlfriend to be happy. I'm sure some of your high school friends are in the same boat. If I had a nickel for every couple I've met who were MISERABLE together but just didn't want to be alone...\n\nBut yeah, I get it's hard. \"Fuck 'em\" is easier said than done. I hope therapy helps you as well. But as someone in their 30s - trust me, it gets easier. Every year you get older, you give expon", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Driving"], "sleepHours": null, "sideEffect": false, "title": "Family generally wants you to be happy", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=low is a false positive — post is an upbeat pep talk ('it gets easier', 'give fewer fucks'); 'MISERABLE'/'drag' refer to others, not the author."}, {"id": "ad702fbe", "text": "I had a job once that based productivity calculations on an assumed 6.5 hours of work in an 8 hour shift. Needless to say, due to the fact that they actually had productivity calculations, I didn't last long there. \n\nAn ADHD engineer friend of mine also once told me that he estimated spending half of his 40 hour work week actually working (and still getting everything done) when I expressed guilt at only putting 20 hours of work/week toward a freelance project I was working on at the time. \n\nI think task-based measures of productivity make a lot more sense than hourly measures, in general. Though sometimes with repetitive jobs, creating hourly goals for yourself is the only way to gamify the boredom away.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Needless to say", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Abstract take on productivity metrics; no self mood/energy/focus. All-null correct; gold 'energy' unsupported."}, {"id": "58a5343d", "text": "Recently diagnosed, I have high suspicion that my boyfriend also has ADHD (inattentive) so we are useless at life together �� we both hyperfocus on things and either sit in the same room doing so or spend time in different rooms doing said things. We understand each other more than anyone else would (except my other ADHD friends) and I wouldn’t change it for the world. \n\nThe way I look at it, ‘in sickness and in health, for richer or poorer’ \n\nWe both have mental health problems and because of these we are broke: we are slowly getting where we want to in life but understand the struggles - we have such a good relationship because of this because we know how each other’s health problems work. \n\nFinding someone that understands (not that they deal with it themselves mind) reaaaaally helps, having someone who doesn’t and makes you feel pants because of it just makes it worse. \n\nI wish every", "mood": null, "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Recently diagnosed", "gold": ["focus"], "jmood": "missed", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "Warm post ('wouldn't change it for the world') — mood positive missed; 'we both hyperfocus' is trait-level, focus=present understates hyperfocus (partial)."}, {"id": "ffa3fbd1", "text": "Seems like you're on top of the things I suggested! That makes me happy, because now I can feel both smart AND validated :P. \n\nThe sleeping could be a thing, but if that started earlier than the C, it would be coincidental to mess you up since only this weekend. Did you cut out the coffee just in the last few days? \n\nAre you checking your body and posture on low-level stress accumulated during the day?\n\nWhat's HIIT? Recommended? \nAnd what does the magnesium do for you?", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": ["validated"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "That makes me happy", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — 'makes me happy', 'smart AND validated' → mood=great correct; HIIT/magnesium are questions to another, no med taken."}, {"id": "cc281045", "text": "I'm a guy with no kids, but I still feel I can relate to important parts of this. I'm gay, married, ADHD-PI, and almost all of the housework falls to me. \n\nSo many conflicting feelings.\n\nI feel guilty that I don't stay on top of the dishes/etc better, but also feel underappreciated for what I *do* accomplish. I wish I got more help from my husband, but feel like I can't say so when he's the primary breadwinner working overtime every week while I only work part-time. I'll finally start dinner, much too late, and he'll look annoyed for a second then say, \"thanks babe, I'll pack that as lunches when it's ready - but it's late and I'm hungry now, so I'm just having cereal for dinner\".\n\nI love him and he's the best thing that's ever happened to me, but being the \"housewife\" with ADHD is frustrating and hard.", "mood": "good", "energy": "alert", "focus": null, "meds": [], "feelings": ["guilty", "frustrated"], "activities": ["Chores", "Eating", "Work"], "sleepHours": null, "sideEffect": false, "title": "I feel guilty that I don't stay on", "gold": ["mood"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Dominant affect is guilt/frustration/'frustrating and hard' — mood=good is wrong direction; energy=alert has zero textual basis (gold lists mood only)."}, {"id": "a124a511", "text": "Don’t EVER be ashamed of who you are, my dude. Don’t look at it as a disease. Look at it as playing life on hard mode. That’s how I get through the day. Yeah, it’s harder to focus, but when I do and get a job done I make sure I congratulate myself and give a good ole FUCK YOU to ADHD and anyone whoever doubted me. If anyone thinks I’m “annoying” or loud I just stop talking to them, and move on to the next person. If they feel the need to try and make you conform to the way THEY want you to act. FUCK THEM. You’re you, and that’s all you ever NEED to be. I wish I could give the biggest hug, man. And, I wish I could hear you say “FUCK YOU I’m me. GET OVER IT.” Take pride in the things you enjoy, and focus on those as much as you can. Which, I know is so hard, believe me. But, nothing that’s worth having in this life is easy. But, when you finally get it, and you can proudly say “FUCK EVERYO", "mood": "great", "energy": null, "focus": "sharp", "meds": [], "feelings": ["ashamed"], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Don’t EVER be ashamed of who you are", "gold": ["focus"], "jmood": "correct", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "Pep talk; author's own pride ('feeling is more than sublime') supports mood=great; focus=sharp overstates 'it's harder to focus, but when I do' (partial)."}, {"id": "7ba0bb0b", "text": "Take a big deep ass breathe clothes your eyes try to think about nothing then when you exhale stand up and go do the first thing that overwhelmed you when you’ve tried thinking of nothing. This works sometimes when I feel like there’s a million things I have to do but can’t hold onto any of them as the first to complete. Take a deep breathe and try to accept that you have things to do and nothing will change that fact, remind yourself that you constantly end up in this situation and every time it happens you feel worse.\n\nI feel like it’s hard to accept that things will suck whether or not you complete what you’ve been putting off. Very depressing tbh but when I accept that I’m the only one who can change anything about myself, it’s more of a “just do it” instead of a “I can’t even stand up how can I do that.”\n\nAlso try watching motivational videos on YouTube, sounds corny and it is corny", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["overwhelmed"], "activities": ["Fitness", "Screen Time"], "sleepHours": null, "sideEffect": false, "title": "Take a big deep ass breathe clothes your", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=low correct (overwhelmed, 'depressing', 'feel worse'); 'couldn't even get out of bed' is clear low energy left unextracted (gold hints energy)."}, {"id": "2e79221b", "text": "Aw, I totally feel you! (And why do so many people on this sub have beast usernames?) I haven't been rejecting the idea of having ADHD, but everything else you wrote resonates! \n\nI'm still earlier in the scheduling stage. Just today I got on a list *to be called* for scheduling in a month, so still a lot of window-watching for me. And it's all I can do to just not focus on this potential diagnosis all the time. \n\nAnd I also am terrified at the prospect of being thoroughly tested and *not* having ADHD. Because if not that, then what? This really is as good as I get? I mean, I had already given up in so many ways, and stumbling upon ADHD and gradually coming to realize it might be the the root of so many of my problems has breathed new life into me. Like, maybe there's hope because all these years I've been trying to do better, but without knowing what the real problem was. Maybe now I can", "mood": "good", "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "And it's all I can do to just", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=present misreads 'all I can do to NOT focus on this diagnosis' (rumination, not focus); mood mixed terror+hope, 'good' captures only the hopeful half."}, {"id": "23107031", "text": "I haven't been officially diagnosed yet but I fully expect to be. When I first started looking back I was like \"well idk I never really had any symptoms in childhood\" but now that I've thought more about it I think the signs were there. \n\nI always did well in school but a big part of that was being smart enough to never have to study and I was always doing my homework at the very last possible minute. I don't think I've ever read an entire book that was required for an English class, I've always been the type to read the cliff notes the night before a test, and finish on my homework in the class periods before they were due. I started depending on caffeine my freshman year of high school because it was the only way I could stay awake through boring classes. I honestly actually have no idea how I finished high school as well as I did and I feel like it says more about the quality of our e", "mood": null, "energy": "alert", "focus": null, "meds": [], "feelings": [], "activities": ["Chores"], "sleepHours": null, "sideEffect": false, "title": "I always did well in school", "gold": ["mood"], "jmood": "na", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=alert is wrong direction — 'caffeine to stay awake through boring classes' implies low energy; rest is historical childhood recollection, no current state."}, {"id": "53eea397", "text": "When you see the tree. You have \"tree\" image in your head while others have \"tree\" as spokenwords in their head. \n\nAnd while you think tree in your head, you see other things so attached to the tree. Like \"birds, grass, blue air, happiness\" When you start to a bit focus on happiness, then you take all things attached to happiness like \"world peace, no deaths, smiling faces, happy marriage\". \n\nThat's why most of us come with the solution on different problems so fast. \n\nNo associative thinking = they think in the consequence. They have to take steps to solve the problem. \nWhile we just see the image and get all pictures attached and boom you see the solution image in your head, it goes so fast.", "mood": "great", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "\"birds", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "poor", "note": "mood=great false positive — 'happiness' is an example node in an associative-thinking diagram, not the author's mood; focus=sharp stretches a cognitive-style description."}, {"id": "a7758886", "text": "Have never heard of strattera, will research it. Thanks! \n\nSo far I've heard about vyvanse and strattera, perhaps I'll feel a bit better (anxiety wise) with them? I'll certainly explain the whole situation to my doctor. \n\nI have been exercising and doing yoga followed by mindfulness meditation which has been helping my anxiety greatly, so even if I do get some anxiety from meds I think I can be functional with side effects now. \n\nThank you for the advice :)", "mood": "good", "energy": null, "focus": null, "meds": ["Strattera", "Vyvanse", "Strattera"], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "Have never heard of strattera", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "false_positive", "overall": "ok", "note": "meds false positive — Strattera/Vyvanse are 'never heard of, will research', prospective not taken (plus duplicate Strattera); mood=good ok ('helping my anxiety greatly')."}, {"id": "f02977a8", "text": "Sometimes when I’m tired after a wrestling match I’ll be saying something and my mind will go faster than I can speak, then I’ll notice and forget what I’m trying to say. Basically, in my head I’ll say something like “I’m so happy I won, the shot I took in the beginning almost failed but I adjusted and got the takedown.” But it will come out as “I’m happy I won, I shot beginning failed but...never mind.” I don’t know if it’s just being tired or if its both, but I always feels dumb afterwards.", "mood": "great", "energy": "tired", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Sometimes when I’m tired after a wrestling match", "gold": ["mood", "energy"], "jmood": "partial", "jenergy": "correct", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "energy=tired correct ('tired after a wrestling match'); mood=great overreads — 'I'm so happy I won' is a quoted example, the landing affect is 'I always feel dumb'."}, {"id": "b9f8c3a8", "text": "This is definitely my experience. I'm not any more outgoing perse'. But I just have to energy to stay in the mode for longer than 30 minutes like I would be normally. \n\nI also find myself excited to focus on whatever I am doing, regardless of what it is. So if it is a conversation with whomever, then I am excited to focus on the conversation and actually listen and absorb what they say, which gives me more good feelings because I could never really hold conversations before and I feel the progress happening. \n\nThat is the key for me with this medication. I am training my brain to enjoy doing things \"normal\" people are expected to do. Simple things such as getting your daily business done and not wallowing in the procrastination valley, doing my job at work without bitching about it, calling my grandparents to say hi. \n\nAll of these things seemed like \"a lot of work\" to me before. And now", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": ["excited"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I also find myself excited to focus on", "gold": ["energy", "focus"], "jmood": "missed", "jenergy": "missed", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=sharp correct ('excited to focus', 'actually listen and absorb'); but 'energy to stay in the mode' (energy) and 'more good feelings' (mood) both missed."}, {"id": "ea15311e", "text": "Haha same. I used to think about some of the crazy things my mom did when me and my 5 siblings were growing up and get angry about it. Now I’m starting to understand how similar our minds are and how incredibly stressful it would have been having ADHD and dealing with the logistics of keeping 6 kids fed, clothed and out of trouble with not much help. She hung in there. All 6 of us have stable lives and are either in college or working toward our careers. Thanks mom. To all of you ADHD mothers out there, I love you and one day your children will realize your amazing and noble sacrifice!", "mood": "great", "energy": "steady", "focus": null, "meds": [], "feelings": ["angry"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I used to think about some of the", "gold": ["mood"], "jmood": "correct", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=great ok — post resolves past anger into love/gratitude ('Thanks mom'); energy=steady has no basis (gold lists mood only)."}, {"id": "33b211b3", "text": "Honestly that's amazing of you. My mother raised two boys, myself included, with ADHD, one comorbid with Oppositional Defiant Disorder. It's not easy at first, but through finding techniques that work and working with them, the outcome is fantastic. Honestly the best combination is behavioral therapy/group therapy with a great psychologist and medication that works and makes them feel good. Neither works 100% without the other. If you ever have any questions, i would be happy to answer from both having ADHD/ODD and from a psychological standpoint. You are doing everything right and I am beyond happy for you and your child.", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "It's not easy at first", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=great is positive sentiment but directed at another ('beyond happy for you and your child'), not an author self-state log — partial."}, {"id": "9aab5b31", "text": "Med student here.\n\nI also struggle with having two productive days in a row. One productive day? Sure. I’m on fire, and I feel accomplished. I exercise, I get enough sleep, etc. Then often the next day I’m distractible and can’t get in the zone.\n\nI can’t figure it out either. My theories include getting burnt out, subconsciously feeling bored doing the same thing, underlying depression. But I don’t know.\n\nI do know that if I vary my routine (ie the places I study) and give myself real breaks (full days when I do something active outside and don’t do any studying) it tends to get better. But it’s really hard. Medical school doesn’t have a lot of structure, and when it does it’s random, which is a constant struggle.\n\nWhat year are you? Can you start to shift away from lecture materials and use board prep materials, premade Anki decks, etc? Those things can save me a lot of time, but first ", "mood": "great", "energy": "charged", "focus": "distracted", "meds": [], "feelings": ["bored"], "activities": ["Fitness", "Outdoors", "Work"], "sleepHours": null, "sideEffect": false, "title": "I’m on fire", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "correct", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "energy=charged ('on fire') and focus=distracted ('can't get in the zone') correctly capture the two-day pattern; mood=great overstates given the burnout/'depression' theme."}, {"id": "39f930c3", "text": "A few years back I spent 4 x 14 hour days shooting big tv commercials for a local casino- there were lots of background actors walking on cue behind the main talent, we had dozens of actors. For a month after this all I could see when I watched TV was background actors walking behind the main actors in every show. It drove me totally crazy. The worst was an episode of Law and Order where a train crashed and in the background there was a choreographed ballet of Ambulances, EMTs, doctors, firefighters, stretchers, walking wounded. I could not focus on anything the actors said.\nI kept rewinding and watching the background.", "mood": null, "energy": "sluggish", "focus": "distracted", "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "The worst was an episode of Law and", "gold": ["mood", "energy", "focus"], "jmood": "na", "jenergy": "false_positive", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=distracted correct ('could not focus on the actors', fixated on background); energy=sluggish is a false positive — no fatigue/energy cue in the text."}, {"id": "57b5d19e", "text": "I think I get this, but not seasonally (probably because where I am, it'sbeen so weirdly nice out). I get it on days that are really gloomy and overcast/raining. Like, a normal mildly overcast day is fine, but if I wake up, and I can't tell the difference between it being 8 am or 2 pm outside, I get in a really bad funk. Like, just in a gloomy or sad mood, don't want to do anything except just lay in bed and sleep.\n\nIt's even worse if I'm having these shitty weather-induced depressed moods, and then someone else around me is also in a shitty mood and are venting to me, because I am like an empathetic sponge, so I also take on their bad mood, so then I really just feel like shit. It sucks. This actually happened last Sunday, where it was crappy and rainy outside, and my mom was having issues with her boyfriend and was venting to me about it, so her bad mood, plus the weather, just really ", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["sad"], "activities": ["Outdoors"], "sleepHours": null, "sideEffect": false, "title": "I think I get this, but", "gold": ["mood"], "jmood": "correct", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=low correct (sad, 'bad funk', 'feel like shit'); 'lay in bed... don't want to do anything' is co-present low energy left unextracted."}, {"id": "7f078985", "text": "I probably don't fit the bill for answering the question but I feel like I should.\n\nNever went to a psych for depression but I've always felt I might have it. But it's milder than what it used to be. \n\nThis is my own opinion, people can differ but I believe that many other disorders, including depression, anxiety or stress is a byproduct of ADHD. Cure the ADHD and you'll cure other cocktail of disorders. My depression arises from the feeling of not getting anything done, failing everywhere and many other things directly related to ADHD. So If I get myself to do whatever I intend to do, I'll cry happy tears and never ever will be depressed or anxious. Emotional Dysregulation is a part of ADHD symptoms, so I guess it makes sense.\n\n &gt;Did you bring up the possibility of ADHD yourself?\n\nMy psych didn't take me seriously when I did. Idk may be he thought I'm just looking for ADHD meds?\n\n&gt", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": ["anxious"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I probably don't fit the bill for answering", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "sideEffect=true correct (anxiety meds 'gave me more anxiety and depression'); mood=okay understates the depression/'failing everywhere' content (leans low)."}, {"id": "a88ef630", "text": "Welcome!\n\nDon’t want some of your first experiences here  being me nitpicking, but “normal” implies that you’re *not* normal and it’s not okay to be experiencing what you’re experiencing.  Then you’re trying to get back to what should be “normal” and that’s some arbitrary standard no one can hit. It’s totally okay for you to be adjusting like this and going through a pretty significant life change. (This is speaking from my own experience mostly.) But people ‘round these parts use “typical” or “neurotypical.” \n\nThat said, I think it’s very typical. I don’t know how your ADHD presents day-to-day but my bet is that your sense of time is adjusting to be more realistic and you aren’t jumping around to ten million things a day. You might find it easier to focus and follow through on things. That might mean that you don’t have as many irons in the fire as you’re used to, but the fact that you’", "mood": "okay", "energy": null, "focus": "foggy", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Don’t want some of your first experiences here", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Entirely advice to a newcomer; focus=foggy inverts the text ('you might find it easier to focus'), and mood=okay has no author self-state — two false positives."}, {"id": "49032331", "text": "I just like books. But I have to pick my battles.\n\nIf it's a book I'm really into or on a topic I'm obsessing over that often helps me focus.\n\nDespite that I'll still have to reread parts. All depends on the day and enviroment I'm in. If I've had to reread the same part more than 2/3 times and consistently finding myself going back to reread other bits or even focus on it then I just have to take a break.\n\n  \n\n\nIt's pretty frustrating because honestly it's often hard to get into books, even if I know given a chance I'll be super into it. However there are some books/series that I can just power through. Series where the books are 300k words long and I'll get through the book within a week. Even when I have to reread stuff at times.\n\n  \n\n\nTips wise some things to consider:\n\n\\- non lyrical music playing in the background.\n\n\\- generally non busy environment\n\n\\- Try to really take each word ", "mood": null, "energy": null, "focus": "lockedIn", "meds": [], "feelings": ["restless"], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "If it's a book I'm really into or", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "focus=lockedIn overstates — dominant report is reread-struggle/skimming/restlessness, with hyperfocus only as a conditional exception ('whether I'm able to hyperfocus')."}, {"id": "59afbfb2", "text": "RSD-driven perfectionism and executive dysfunction is an exhausting and unwelcome combination. \n\nWhen I told my therapist how negative I was about myself at work and how I thought my manager probably thought I was slacking and that I need to get better, she told me it sounded like I was holding myself up to a higher standard than even he is. In not meeting that ridiculous standard, I was projecting those negative thoughts about myself and incorrectly assuming that my manager thought so too. \n\nIn other words, instead of being driven by money, I am so driven by success that I hold myself accountable to an absurdly high degree, as opposed to others who would be content with that kind of supposed mediocrity because “at least I’m getting paid.” I presume that external rewards like money or the high/passing grade don’t do much for us but the dopamine rush we get from a producing something that", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["content"], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "RSD-driven perfectionism and executive dysfunction is an exhausting", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=good captures only the affirming resolution; the bulk is self-critical/'exhausting' RSD-perfectionism. focus correctly null (gold 'focus' unsupported)."}, {"id": "fa518820", "text": "Hey there, finals period is stressful!  I'm sorry having trouble getting things in on time.  Also, writing is hard.  Full disclosure: I'm also \"procrastinating\" for a bit on some essays right now.  \n\nI was an undergraduate English major and worked as a writing tutor, but to this day, I still have trouble submitting essays on time (I'm a PhD student now).\n\nIt's not laziness, or at the very least, we're not any lazier than the average person.  People w/o ADHD also procrastinate.  There's a normal level of procrastination that everyone deals with, but I suspect that the consequences of that procrastination is worse for people with ADHD.  \n\nMight be tangential, but I was diagnosed after college and worked an office job for a few years.  I was prescribed Ritalin and was able to do the whole 9-5.  The diagnosis surprised me because I had always done well in school, but my doctor said that some", "mood": null, "energy": null, "focus": null, "meds": ["Ritalin"], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "Full disclosure: I'm also \"procrastinating\" for a bit", "gold": ["energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "clean — meds=[Ritalin] correct ('prescribed Ritalin', 'even with the medication'); diffuse stress only, null mood/energy/focus defensible (gold 'energy' unsupported)."}, {"id": "9051669d", "text": "Physical exercise and writing down your thoughts are both great ways to get well. For many, it might make most of what I wrote above unnecessary in a process of making oneself healthy again.\n\nI would also like to add that choosing the right music to match, or even manipulate your emotional state can help a lot too. Not on the mental aspects, but the emotional aspects. Having a shitty day? Listen to music that reminds you of better days!", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Fitness", "Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Physical exercise and writing down your thoughts are", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good fabricated from generic advice; only mood word is hypothetical 'shitty day' (negative)"}, {"id": "24f2f8a7", "text": "when it's something I dont like doing it's much harder. Sometimes I just have to give up for the day and try again tomorrow and it helps. though you said it's been a few days so I'd actually recommend something else.\nmy first tip would be to do the \"only 5 minutes\" kinda deal where in you set a timer for a suuuper low goal. maybe even just 1 minute. just make it sure it's no longer than 10. This helps me to kick start a painful task since now the time limit is so close it becomes urgent and important and thus my brain decides \"oh I need to do this now\".\n\nsecond try to exercise  your body before you exercise your brain. move around! go for a walk/jog, dance around your room to your favorite high energy song and get all that energy out. sometimes that can help calm your body and mind a bit to start on a project.\n\nalso a side note: make sure you are in an environment that doesnt have a lot ", "mood": "good", "energy": "charged", "focus": null, "meds": [], "feelings": [], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "When it's something I dont like doing it's", "gold": ["energy", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=charged/mood=good invented from 2nd-person advice ('get all that energy out'); no author state"}, {"id": "9de91bab", "text": "I know what I’m about to say may seem common sense or cliche but please hear me out. Speaking from my experience (I also have depression and OCD along with adhd though) My life as VASTLY improved buy just three simple habits that take up only an hour each day.\n\n1. Walk/exercise— I know exercise can seem intimidating (you may already do it) but it doesn’t have to be. Just walk up and down the street, block, heck get a gym membership if you’re feel courageous and just treadmill it up! It actively releases key chemicals to keep you happy, motivated, and focused. This is the one one thing I cannot go without and has helped the most. If I go more than a day or two without a small 30min walk I actively feel myself slipping back to old habits and depressive undertones consuming my every thought.\n\n2. Meditation— it’s not a magic get in touch with yourself, blah blah blah stereotype you think of.", "mood": "great", "energy": null, "focus": "sharp", "meds": [], "feelings": ["motivated"], "activities": ["Fitness", "Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Walk/exercise— I know exercise can seem intimidating (you", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "good", "note": "'life VASTLY improved' supports great; focus=sharp only weakly inferred from advice about effects"}, {"id": "5c6cb4c2", "text": "Hm I think there's many types of brain fog and I dont exactly know what other people mean by it, but I feel it as a sort of drowziness, a fuzzy feeling. I just dont think of anythîng for a few seconds and lose track of the conversation, explanation or dialogue on tv. Used to happen alot when doing maths or watching things where alot is going on at the same time like watching pro league of legends or world of warcraft pvp (there's ALOT going on if you know all the things to look out for). It wasnt because I was bored with it, more like overwhelmed.", "mood": "low", "energy": null, "focus": "foggy", "meds": [], "feelings": ["bored", "overwhelmed"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Hm I think there's many types of brain", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=foggy nails the drowsy/fuzzy first-person fog; mood=low overreaches (fog isn't sadness)"}, {"id": "b419dab2", "text": "This isn't just ADHD. I don't know if it is depression, character traits from your husband causing relationship issues, etc. but ADHD is only one component of this, albeit a big one.\n\nI'm in college now and, even when I was off meds, I would at least try. Despite chronic latenesses, asking for extensions, last minute cramming, and regular all nighters the effort would be there. Just not the focus, organization, etc. The times I would kinda stop caring and flame out would be after anxiety, failures, or personal issues triggered a depressive episode.\n\nI still live with my parents and when they get on me to do something like fill out paperwork or clean up my room a bit (which is embarrassing as an adult) I do it for a bit. Then get distracted. Then do it for a bit again. Then soon after get mentally exhausted and do some tomorrow unless it's absolutely urgent. And so on. ADHD means it's so ", "mood": "low", "energy": "tired", "focus": "present", "meds": [], "feelings": ["exhausted", "overwhelmed", "apathetic"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I don't know if it is depression", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "correct", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "mood/energy right (self-loathing, mentally exhausted); focus=present contradicts 'Just not the focus'"}, {"id": "4949187d", "text": "This is what gets me at work, I think.\n\nThe pattern is usually:\n\nStart a new job -&gt; use the initial excitement to create something good -&gt; surprise people -&gt; great feeling.\n\nThen, get assigned boring stuff -&gt; everybody knows what the expected outcome is -&gt; shut down.\n\nI guess it's not realistic to think one can surprise people all the time, but maybe there is some trade where a pattern of small \"surprises\" could be utilized to keep us happy?", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Start a new job -&gt", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'great feeling' captured but it's one pole of a described oscillation that ends in 'shut down'"}, {"id": "e2ddb7ef", "text": "The problem with running is that you have to do it regularly to get the 'high', and the first few weeks suck pretty hard.  They suck double-hard if you don't have a fair bit of running in your past.  \nAlso- you won't get a runner's high from a 30 minute jog, or probably even from an hour just plodding along.  \nI've only gotten the 'high' once I'm in pretty decent shape, and generally after about 45-60 minutes of running at a pretty good clip (fast but something I could do for an hour or so).  \nIt's also called a second wind- just as you start to feel tired and crappy, the endorphins kick in and suddenly you're on top of the world and never want to stop.  \n\nThe good news is that if you really just don't like running, pretty much any sort of exercise can give you similar benefits.  You just have to be willing to go past your comfort zone.  \nIt's not easy or 'fun', but it's worth it.", "mood": "good", "energy": "tired", "focus": null, "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "They suck double-hard if you don't have a", "gold": ["energy"], "jmood": "na", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=tired pulled from a generic description of running ('feel tired and crappy'), not author's state"}, {"id": "0169579f", "text": "Sounds like you got stuck in what's called dysphoric rumination, also known as a negative thought spiral. I used to think that the best way to deal with this was to ride it out and let it pass. I was very wrong and became overwhelmingly unhappy, what you need to do is break the spiral as soon as you can. I started going for walks listening to recommended music with the aim of finding a new track to add ty one of my playlist or a new artist or doing something that engaged my brain in something else. \n\nThe problem is that what you're effectively doing is hyper focusing on the negative thoughts, you need to break that focus and once it's passed its much easier to get in with your day. It's also important that when you manage to do this to see it as a success and be proud of yourself for getting out the spiral. It's not weakness to get sad, but it is strength to overcome it!", "mood": "okay", "energy": null, "focus": "present", "meds": [], "feelings": ["proud"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Sounds like you got stuck in what's called", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "mood=okay and focus=present both from 2nd-person advice ('be proud of yourself','break that focus')"}, {"id": "cf920adb", "text": "Speaking from a psychoanalytic perspective, I don’t think it is much of ADHD that is causing disinterest. Rather, it seems like the development of moderate depression? I get your point, that you can’t spark interest and keep it lit, but you shouldn’t lose 90% interest in everything enjoyed. \n\nWhat concerns me is that I am always finding new things to “master” via hyperfocus. Whether I stick to that ‘thing’ depends, but finding dopaminergic results is always possible. For you, it seems like the opposite, and sounds more like a depressive state, as you can’t capture interest within anything anymore: a fundamental criterion to diagnose depression. \n\nHope this helps give better insight to your situation. I could be entirely incorrect, as I don’t know you like a patient, but this is just my analysis from reading what you’ve given.\n\n(I’m aware depression has been brought to attention in the co", "mood": "good", "energy": "steady", "focus": "lockedIn", "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Speaking from a psychoanalytic perspective", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=lockedIn fits 'always finding new things to master via hyperfocus'; mood/energy unsupported"}, {"id": "694ea465", "text": "I am concerned about this issue as well and I just started taking the meds, my biggest worry was dehydration but now I am seeing a slight slowdown in my ability and focus of my surroundings if I play on meds compared to without. I have hit my knee several times playing soccer and I only felt a slight pain compared to the other player , so you might be right about the pain thing but more insight is needed", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "I am concerned about this issue as well", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp is backwards — text reports a 'slight slowdown in ability and focus' on meds"}, {"id": "9fd6363b", "text": "Strattera gave me chills for the first month. I only started to truly feel the effects of it after the 2 month mark. It helped with my anxiety, I also seemed to be in a better overall mood. And I am more focused, although not completely. My doctor wants to give me a small dose of stimulants to top off with my strattera. \n\nMy only side effect with it, is that I have a harder time climaxing. And when I do, it's not as powerful so I feel like there is more that I have to squeeze out. Leaving me with the world's worst case of blue balls. \n\nAs far as organization. That's something that we consciously have to work on. I have to set reminders and write notes. Medication can help, but all our bad habits like disorganization will take work on our part.\n\nAnd vyvanse is similar to strattera. In that they are both norepinephrine reuptake inhibitors. Vyvanse is a stimulant and strattera isnt.", "mood": "good", "energy": null, "focus": "sharp", "meds": ["Strattera", "Strattera", "Vyvanse", "Strattera", "Vyvanse", "Strattera"], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Strattera gave me chills for the first month", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "'better overall mood' + 'more focused' + Strattera/Vyvanse all captured; dupes in meds harmless"}, {"id": "d0ece2cc", "text": "That’s what I did, I’m always looking to take less Adderall because nasty side effects and it’s great that I don’t have to commit to a whole day of being medicated every morning. I just wait till I need it. \n\nBy the way, I don’t know if you can get your pharmacy to order different generic brands for you, but they all have different ratios of the amphetamine salts (I think name brand has 50/50 l- and d-amphetamines). I’ve noticed some brands are better or worse for my comedowns, that crash you mentioned. Might want to experiment if you can.", "mood": "good", "energy": null, "focus": null, "meds": ["Adderall", "amphetamine", "amphetamine"], "feelings": [], "activities": ["Errands"], "sleepHours": null, "sideEffect": true, "title": "That’s what I did", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "meds+sideEffect right; mood=good refers to a convenient dosing schedule, not an actual mood state"}, {"id": "8ed5823a", "text": "There are many people who are diagnosed in adulthood. It's not too late, get an official diagnosis and work out a treatment plan from there. \n\nIf you do get medication, it is nothing to feel guilty about. There's so much stigma for no reason around medication for the brain. Plenty of people take medication to treat all sorts of disorders which cause them to function properly. In this case, the function problem happens to be weird things going on with neurotransmitters.\n\nI don't think you should worry about people judging you. It sounds like your wife is supportive of you, and I think the rest of your family would understand. Many people with ADHD, myself included, only mention it to a very close circle of friends family; the only people you have to tell are those who are not judgmental.\n\nAnd ultimately, you can't allow your health, career, and personal life to suffer unnecessarily becaus", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["guilty"], "activities": ["Resting", "Work"], "sleepHours": null, "sideEffect": false, "title": "If you do get medication", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "correctly null — guilt is 2nd-person reassurance ('nothing to feel guilty about'), not author's mood"}, {"id": "b801409a", "text": "If you’re like me maybe you logically decided that the way you wanted to react to things wasn’t anger. “I’m not angry at this person because I can empathize with their point of view even if this situation is very frustrating to me.” I get angry “at situations” still but if I can’t pretty quickly find some way to channel that and improve a situation it burns out pretty quick, but I’m never angry directly AT PEOPLe and I chose to be that way because regulating how I feel wa the best way I knew how to regulate my behavior", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["angry"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "“I’m not angry at this person because I", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "anger present but qualified as transient/regulated; mood=low overstates a reflective, neutral post"}, {"id": "346c3fe5", "text": "I'm kind of a bit late to this party but I was feeling low and surfing this subreddit is helpful sometimes. I'd like to add my two cents in.\n\n&amp;#x200B;\n\nI have never seen someone use ADHD as an excuse to just do what they do wrong without consequence. I've only ever seen people use it as an explanation. For me, it's like, \"I'm sorry I interrupted you. I have ADHD which involves impulse control and, while I've come a long way since I was a kid, I still struggle with it. Please continue where you left off before I cut you off.\" I mean, I never say sorry like that. It's usually just, \"sorry I interrupted you, that was rude. Please continue.\" But, you get the idea. I have had a problem with self-blame over everything that's happened to me in life and continue to deal with that. I internalize the problems I have with others and tend to tell myself that I just suck. So, when I tell someone ", "mood": "g
