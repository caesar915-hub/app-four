 run a marathon. Not one of those things is easy, though. Be kind to yourself. Really. It's important. Don't beat yourself up for the thi", "mood": "good", "energy": "tired", "focus": "sharp", "meds": ["rits"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Don't beat yourself up for the things you", "gold": ["energy", "focus"], "jmood": "false_positive", "jenergy": "partial", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "advice post: focus=sharp misreads 'focus on the waking up' (effort, not cognition); mood=good unsupported; energy=tired is only the intended bedtime tiredness; 'rits' unverifiable (text truncated)"}, {"id": "8ef32560", "text": "I've found it to be pretty good so far. Anxiety is reduced, I was sweating alot and that seems to have reduced somewhat. Have been getting more hyperfocused to the point that I haven't taken breaks at work and have got headaches from staring at my monitor for so long.\nIt's not perfect, still struggling with motivation for many things. I've been sleeping a little less but that can be chalked up to the hot weather and some current life stress.\n\nOverall much better than the instant release I was taking from my point of view", "mood": "good", "energy": null, "focus": "lockedIn", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "Anxiety is reduced", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "missed", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=lockedIn and mood=good both well-supported; energy missed — 'struggling with motivation' + sleeping less marked in gold but null"}, {"id": "3e2f7f96", "text": "I'm going into social work right now which I'm finding be pretty ADHD friendly.  Another thread brought up a commonality that many of us feel more able to help other people than we are to help ourselves.  Sometimes I wonder if I must be crazy to think I can help other people to manage their lives when my own is such a disaster but somehow whatever it is that doesn't click for me when I'm doing certain things for myself is just there when I go to help other people.  Like my client who feels overwhelmed and can't get tasks done(sound familiar?). I can help him schedule and prioritize his life like a boss, but when it comes to my own I'm hopeless.  Plus there tend to be a lot of crisis situations which are always where I shine.  And I think the experiences I've had related to my ADHD really help towards accepting and empathizing with my clients.  The paperwork is crap though.", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["overwhelmed"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Sometimes I wonder if I must be crazy", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=low defensible from 'I'm hopeless'/'my own life is such a disaster'; but feelings=[overwhelmed] is misattributed (it's the client's state)"}, {"id": "bfd0ed4f", "text": "So, this isn’t about guilt, but I’m trolling Reddit while attempting my psych homework (lol) and it’s talking about how a dopamine deficiency might result in “reduced feelings of pleasure”.... I’ve never heard of that before, but it explains so well what I experience sometimes with ADHD... like, I don’t feel constant guilt... but I don’t get that satisfaction that people supposedly feel when they finish something and do it well. That’s what I feel guilty about, not finishing things or doing them well enough because I couldn’t focus. Sorry for the rant. Hope you can get past that feeling. You deserve help :)", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": ["guilty"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I’ve never heard of that before", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp is inverted — text says 'because I couldn't focus'; guilt/anhedonia (no satisfaction) is a missed low-mood signal"}, {"id": "e300d4a7", "text": "Sometimes setting up a reward system helps. For me, forcing myself to read every single word of an assignment, or even copying down the instructions for it, helps me sink in exactly what is necessary. Otherwise, even on my meds it can be very hard to absorb. Once you can do that, trying in short increments (half hour, 45 minutes, an hour if you're feeling ambitious) and taking a break to watch a show, grab a snack or play a little bit of a video game is good. Just don't let your reward become your focus-- it's easy to forget and start bingeing a show, for example.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Eating"], "sleepHours": null, "sideEffect": false, "title": "Just don't let your reward become your focus--", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp false — advice post saying it's 'very hard to absorb' and using 'focus' as a noun ('don't let your reward become your focus')"}, {"id": "7d45a6c9", "text": "Two quick things:\n\nFirst off, ADHD meds (if you're taking them) really only treat core symptoms but don't help with other possible deficits you might have like potentially needing to learn coping strategies to help with emotional regulation, new systems of organization, etc., that can negatively effect really important long term outcomes in your life (i.e. college, having a stable relationship, job-security).\n\nSecondly, the systems you transition into from childhood to adolescence and then adulthood all generally offer more autonomy and less structure and very well could contribute to your sense that your symptoms are getting worse.  I think newkiwiguy said it best, as all of these things can contribute progressively to higher levels of impairment.  \n\nI feel your pain, I'm trying to finish a Master's and it's been the hands down the hardest most brutal thing I've ever done in my life.   ", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "First off", "gold": ["mood"], "jmood": "missed", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=steady unsupported; personal disclosure 'hardest most brutal thing I've ever done' is a missed low-mood signal"}, {"id": "03d829b2", "text": "Getting off Meds has worked for me, but I want diagnosed until later in life and my parents had put me into study skills classes as a kid when the schools suggested that I might have a problem. My dad didn't want to diagnose, so I was taught strategies. All was well and good until I finished my Master's and got fired in the same week. Things started to spiral and after months of various attempts at diagnosis my doc finally suggested and had me tested. It was super weird at first but then all started to make sense. \n\nI took meds for several months, read about half of a ton of books, and went to a therapist for awhile. Ultimately, I drive my husband crazy. He felt like I wasn't me and I want happier. I quit Meds and haven't looked back. I still have Ritalin for if I need it, but I haven't taken one in months. I use my phone as the more stable/reliable portion of my brain and everyone in my", "mood": "great", "energy": "steady", "focus": "present", "meds": ["Ritalin"], "feelings": ["excited"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "My dad didn't want to diagnose", "gold": ["mood"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "correct", "overall": "poor", "note": "over-asserted: mood=great/energy=steady/focus=present all unsupported by a reflective mixed-history narrative; only meds=[Ritalin] is right"}, {"id": "2fca9609", "text": "It's never too late to reach out for help. Anxiety is something that you can deal with and reduce. It takes time, but you will be able to shake all of the negative things and move forward.\n\n&amp;#x200B;\n\nYou've done the right thing by reaching out, and now it's just a matter of time and really focusing on what will help you recover. Do more of the things that fill you with positive energy and try to decrease stresses. \n\n&amp;#x200B;\n\nIf you have one in your area, attending a support group will do wonders. It's a safe place to talk with people going through the same things, and you may even make some friends :)", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "You've done the right thing by reaching out", "gold": ["mood", "energy", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "all second-person encouragement to another person; mood=good and focus=sharp ('focusing on what will help YOU recover') are not the author's state"}, {"id": "acc52643", "text": "I am not intentionally immature and obnoxious but I have my points as I think we all do.  I would think it is the ADHD specifically H in this instance because I still seem to make people angry without even thinking about it.  I do it in discussions too.  In classes or work, without Dexedrine anyhow, I ask that one thing that irks or winds things up.  I feel like it is impulsiveness, restlessness and boredom.  I spare some types of friends of that behavior.   I also have some friends who are obnoxious themselves so.  I have learned \"everything in moderation\" with some folks.", "mood": "low", "energy": null, "focus": null, "meds": ["Dexedrine"], "feelings": ["angry"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I would think it is the ADHD specifically", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "missed", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "mood=low overreaches — 'angry' is about making OTHERS angry, not the author's mood; 'restlessness and boredom' is a missed energy signal; Dexedrine correct"}, {"id": "07fc790e", "text": "Well, I'm somewhere better than I was in middle school - which in my eyes is a pretty great improvement lol I still struggle tho, haven't started meds yet. The only friend I really have left that isn't also family lives on the other side of the country, and while I do enjoy my own company I have a hard time indulging in my hobbies due to my lack of focus, my tendency to procrastinate, and my horrible habit of jumping onto a new project before finishing the previous one\n\nI used to be really depressed and had a lot of anxiety, but I consider myself more or less cured of depression thanks to meds and therapy, and my anxiety is heavily reduced and Im getting better at challenging it\n\nIm currently on disability/welfare tho, Ive been since I was 18, I didnt even finish middle school school - it traumatized me and while I still dream of getting an education, I don't think I'll be going back to ", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Well, I'm somewhere better than I", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=sharp inverted — text explicitly cites 'my lack of focus'; mood=low fits the bittersweet ongoing-struggle tone"}, {"id": "e4a12cc9", "text": "i don't think there is a specific animal you can use to symbolise adhd. plus a squirrel imo would be the worst, bc it would just perpetuate this notion that all people with adhd are hyperactive and impulsive.\n\ni guess it depends on what you're trying to do. are you making artistic depictions of adhd? trying to explain it to someone out of the loop? or are you just trying to relate to something to feel less alone?\n\nno matter what, it's really up to you. i see \"are you a squirrel or butterfly\" when it comes to adhd, if that helps at all.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I don't think there is a specific animal", "gold": ["energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — meta-discussion about ADHD-as-squirrel, no personal state; all-null correct (gold 'energy' is the stereotype 'hyperactive', not the author)"}, {"id": "6254a2a0", "text": "So I've recently started a thing to help me, and I was actually thinking of making a dedicated post about it, we'll see.\n\nI use music as a timer. \n\n**TL;DR - I have a one hour playlist of my favourite high energy songs that act as a timer.**\n\nSo, like pretty much 90% of people ever, I hate doing chores. And like every ADHDer, It's sometimes nearly impossible to get myself to DO those chores. Focus is an issue. Getting started is an issue. Staying on the task, is an issue.\n\nSo I decided that one hour is a good chunk to focus on chores on. Setting timers is boring, and you always end up checking the time every twenty seconds.\n\nSo I used my Google play (I assume Spotify can do this too), and made a playlist of my current top songs that was nearly exactly an hour long (mine ended up being 59:59... SCORE.)\n\nNow whenever I need to do something, I shuffle that playlist. I'll take a look at the ", "mood": "good", "energy": "charged", "focus": "sharp", "meds": [], "feelings": [], "activities": ["Chores", "Hobbies"], "sleepHours": null, "sideEffect": false, "title": "So I've recently started a thing", "gold": ["energy", "focus"], "jmood": "correct", "jenergy": "partial", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=sharp is wrong — text says 'Focus is an issue'; 'sharp' was triggered by 'high energy songs' (the tool), and energy=charged describes the playlist not the author"}, {"id": "6145b98a", "text": "Medication really helps. So does creating some structure for yourself, via to-do lists, having a workspace that you only use for work (ideally a separate work computer but not everyone can afford that), calendaring, tracking projects. I do well at work because I'm too afraid of letting other people down to allow myself to slack; but when I know what I'm working on isn't terrible urgent or exciting, that's usually where I have problems.\n\nBut when I'm off my meds or don't have a lot to do, it can be hard to get motivated. I try to create structure with hobbies, going to the gym, getting up at a set time, etc. but it doesn't always work perfectly ... I end up sitting in my PJs and playing video games a lot as well. Also, if I'm overworked and burned out, I can get sucked into an internet hole and lose a day.  \n\nIt's an ongoing struggle. I knew I wanted to go to grad school a few years ago a", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": ["motivated"], "activities": ["Fitness", "Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "But when I'm off my meds or don't", "gold": ["mood"], "jmood": "partial", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "missed low energy — 'hard to get motivated', 'lose a day', 'sitting in PJs'; mood=okay understates the ongoing struggle (meds=[] fine, no named drug)"}, {"id": "e5fc257d", "text": "I just try to go to the gym and exhaust myself. The problem is when it's winter &amp; there is no sun for months &amp; I have no motivation to leave my apartment or do anything. Another problem is injury setbacks. Then I'm stuck staying up to 4 or 5am more often then I'd like. Melatonin made me so drowsy in the morning, and I keep hearing that the dosing is just hypothetical (you should start with a small dose). I've also tried a friend's Ambien. Also an extreme drowsy effect. SO, for 6 months (Michigan) I force myself to the gym (no naps!), pre-workout supplements help, then pop a ***ZMA supp. (Google it)*** 30 minutes before bed and that helps calm me down.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "Then I'm stuck staying up to 4 or", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good is the opposite — winter post: 'no sun for months & I have no motivation'; that low motivation is also missed energy"}, {"id": "c6e36ab4", "text": "I get the feeling. I have constantly remind myself, that every part of my life has an AdHD flavor to it, because that is just how my brain works.\n\nNot just focusing on uninteresting overwhelming stuff, but going to places where are many people and I don't have something to do.\nMany other things, that I crunsh my teath while I sleep a stress related ADHD thing...\n\nAnd of cause...\nI didn't want to be myself as a teen,not that I wanted to die, I just wanted to fit in. Even though I didn't know, I was just different than the others.\nEven though I like myself now, most of the time, there is still bagade to carry around. :-)\n\nSo yeah... I totally went somewhere with this text I didn't know I would.\nHmm no one is going to read it anyway ;-)", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Not just focusing on uninteresting overwhelming stuff", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp false — text says focusing on 'overwhelming stuff' is hard; ambivalent mood ('baggage to carry', 'didn't want to be myself') was missed"}, {"id": "cbf5c47a", "text": "I'm in a very similar position to you about how I feel about medication, though I'm still in school. This is why I'm planning on switching off of a stimulant med to try strattera during the summer. I've heard that the focus it gives you is a lot more \"natural feeling\" and its withdrawal less severe if need be. If it works, i know it'll ease me knowing that I won't have to rely on stimulants and have to experience the constant energy up/downs that come with taking them.", "mood": null, "energy": null, "focus": "sharp", "meds": ["Strattera"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "This is why I'm planning on switching off", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "focus=sharp false — it's hypothetical hearsay about Strattera ('I've heard the focus is more natural'), not the author's state; meds=[Strattera] correct"}, {"id": "931d28a1", "text": "Understanding doesn't negate emotional pain though, unfortunately. Pretty sure when I say things like 'you always do that', it gets internalized as 'you are defective'. But he DOES always freakin do that, lol. And also he doesn't really get why I get mad. He seems to not connect one event to the next, so I blow after a pattern and he's legitimately surprised and thinks it was spontaneous. It's a cognitive thing of some sort, I'm guessing. It kind of makes it difficult for him to understand that my exasperation is justified. I'm not sure there even is a fix, so I will probably just keep stumbling along and hope things don't get blown up too far. Thank you though. I very much appreciate your input.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Understanding doesn't negate emotional pain though", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "missed mood — clear emotional distress/anger ('emotional pain', 'I blow', 'keep stumbling along'); matches gold 'mood', extractor returned nothing"}, {"id": "008badad", "text": "I know that it's frustrating. I also struggle with anxiety and school and it hasn't been easy. The one thing that has gotten me through is to think about the worst thing that could happen with school. Every time the answer is that I may have to repeat the class which isn't the end of the world and something that I can get over. \nIf you feel like breaking then take a step back and focus on your mental health, it's more important than finishing a school project or exam. School is something that you can stop or start at any time in your life and your mental health stays with you always which is why it's essential to work on it right away.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "If you feel like breaking then take a", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp false — keyword trap: 'focus on your mental health' means prioritize, not attentional sharpness; author's own state not asserted"}, {"id": "ecc9d9de", "text": "Well, not everyone gets the same side effects, even the common ones, and those that do will experience them differently. I personally never have that crash many people describe with their meds wearing off. I clench a bit at what I figure is probably the peak of my medication, but mostly if I'm stressed or really concentrating, it's not a constant daily thing. My biggest side effect is feeling thirsty and having a dry mouth most days. My work desk always has my water bottle, a glass of sparkling water, and, if it's before noon, half a cup of coffee I've warmed up twice already.\n\n (Haha, the other day I forgot my meds and finished my coffee in an hour, ate all my lunch by 11:30am, and was having a hard time doing my work, doing that thing when you're kind of observing it from a detached place, like, \"That's my work that I'm working on. That's stuff I need to do. It's time to start. Look, i", "mood": "flat", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Eating", "Work"], "sleepHours": null, "sideEffect": true, "title": "I personally never have that crash many people", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=sharp is backwards — the detached passage is about NOT focusing off-meds ('hard time doing my work'); mood=flat and sideEffect=true both fit"}, {"id": "f15ce59c", "text": "I just went to my college's office the other day, as well, so high five! My person was supportive as well, but didn't feel like she was well-informed enough to help at a capacity I need. More of \"this is what the book says to do, so I'll say it.\" I could also be looking for a miracle solution.\n\nI 'suffer' from a high IQ with ADHD, so it's often hard to pinpoint what will help me. I don't really take notes, but I do well on (most) tests, so it's hard to say *I need notes* or extra time. Same thing applies for studying. Things like this. \n\nShe did bring up audio textbooks which could help. I'm primarily a visual learner, but I also don't really have the focus/attention to read. Listening to information can be better added into my life.\n\nHope your help is effective! :)", "mood": "good", "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "My person was supportive as well", "gold": ["focus"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=present contradicts text — 'don't really have the focus/attention to read'; mood=good fits the upbeat tone ('high five!', ':)')"}, {"id": "76c08d92", "text": "Being able to do tech support with someone else in the room.\n\n\nMy Fiance's parents are the god damn worst. Normally they are great, but holyshit is this ever hard. I need to concentrate, offering my food by just putting it in my line of sight is an issue, asking me random tech related questions is an issue, deciding that this would be a good time to use a hammer for some window repair, also an issue.\n\nI already look \"frustrated\" when concentrating that hard, then when I'm actually frustrated its even worse, then my Fiance gets worried and I get worried about that, but I also still need to fix the problem.\n\nI just can't do it no matter what. It's the most exhausting thing for me.", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": ["frustrated"], "activities": ["Eating"], "sleepHours": null, "sideEffect": false, "title": "Normally they are great", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "missed", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "focus=sharp only partial — author concentrates hard but 'just can't do it'; missed energy ('most exhausting thing'); mood=low correct"}, {"id": "639fc22e", "text": "was always masked in school because i had a passion for learning and it was very easy to get good grades + the work i found was below my level, so i never really had homework. i get aaaaalllllll the way thru college, then start picking up internships and part time jobs and suddenly i find rote, repetitive tasks hard because it's so boring. i wonder how everybody else can be productive, but i always need to get up every 10 minutes or check my phone or NOT do any work. i started thinking about what's causing it and anxiety didn't fit ( i wasn't fixated on a 'worry' - i just couldn't focus ) and then once i toyed w/ the idea of ADHD, i found relief in the symptoms. \n\nmy memory of my childhood is very very bad - i can't remember much - but what i can salvage also explains a lot lmao.", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Was always masked in school because i had", "gold": ["mood", "energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "clean — focus=distracted nails it ('I just couldn't focus', 'get up every 10 minutes or check my phone')"}];
const SIGS = ['mood','energy','focus','meds'];
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function stats(){
  const el = document.getElementById('stats');
  const ov = {good:0,ok:0,poor:0};
  const per = {}; SIGS.forEach(s=>per[s]={correct:0,partial:0,missed:0,false_positive:0,na:0});
  DATA.forEach(d=>{ ov[d.overall]=(ov[d.overall]||0)+1; SIGS.forEach(s=>per[s][d['j'+s]]++); });
  let h = `<span><b>${DATA.length}</b> records</span><span>overall: <b>${ov.good}</b> good / <b>${ov.ok}</b> ok / <b>${ov.poor}</b> poor</span>`;
  SIGS.forEach(s=>{const p=per[s];const scored=p.correct+p.partial+p.missed+p.false_positive;
    h+=`<span>${s}: <b>${scored?(p.correct/scored).toFixed(2):'–'}</b> acc (fp ${p.false_positive}, miss ${p.missed})</span>`;});
  el.innerHTML = h;
}

function chip(sig,d){
  const v = d[sig]==null? '∅' : (Array.isArray(d[sig])? (d[sig].join(', ')||'∅') : d[sig]);
  const j = d['j'+sig];
  return `<span class="chip" data-j="${j}"><i class="dot"></i>${sig} <span class="v">${esc(v)}</span> <span style="color:var(--mut)">·${j}</span></span>`;
}

function render(rows){
  document.getElementById('count').textContent = rows.length+' shown';
  document.getElementById('list').innerHTML = rows.map(d=>`
    <div class="card">
      <div class="crow">
        <span class="id">${d.id}</span>
        <span class="ov ${d.overall}">${d.overall}</span>
        <span class="gold">gold present: <b>${d.gold.map(esc).join(', ')||'—'}</b></span>
      </div>
      <div class="text">${esc(d.text)}</div>
      <div class="sig">${SIGS.map(s=>chip(s,d)).join('')}</div>
      ${(d.feelings.length||d.activities.length||d.sleepHours!=null||d.sideEffect)?
        `<div class="meta">feelings: ${d.feelings.map(esc).join(', ')||'—'} · activities: ${d.activities.map(esc).join(', ')||'—'} · sleepHours: ${esc(d.sleepHours??'—')} · sideEffect: ${d.sideEffect?'yes':'no'}</div>`:''}
      <div class="note">${esc(d.note)}</div>
    </div>`).join('');
}

function apply(){
  const o=document.getElementById('fOverall').value, s=document.getElementById('fSignal').value,
        v=document.getElementById('fVerdict').value, q=document.getElementById('fSearch').value.toLowerCase();
  let rows = DATA.filter(d=>{
    if(o && d.overall!==o) return false;
    if(s && v && d['j'+s]!==v) return false;
    if(s && !v) {/* signal alone: no constraint */}
    if(!s && v && !SIGS.some(x=>d['j'+x]===v)) return false;
    if(q && !(d.text.toLowerCase().includes(q) || d.note.toLowerCase().includes(q))) return false;
    return true;
  });
  render(rows);
}
['fOverall','fSignal','fVerdict','fSearch'].forEach(id=>document.getElementById(id).addEventListener('input',apply));
document.querySelectorAll('button.q').forEach(b=>b.addEventListener('click',()=>{
  const q=b.dataset.q, $=id=>document.getElementById(id);
  $('fOverall').value='';$('fSignal').value='';$('fVerdict').value='';$('fSearch').value='';
  if(q==='poor'){$('fOverall').value='poor';}
  if(q==='moodfp'){$('fSignal').value='mood';$('fVerdict').value='false_positive';}
  if(q==='energymiss'){$('fSignal').value='energy';$('fVerdict').value='missed';}
  apply();
}));
stats(); apply();
</script>
</body></html>
