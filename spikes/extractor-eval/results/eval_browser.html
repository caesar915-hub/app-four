s": "partial", "jmeds": "na", "overall": "ok", "note": "focus=distracted is the right concept but drawn from a hypothetical 'if someone', not the writer's own state."}, {"id": "f59e171d", "text": "Ok, I couldn't focus long enough to read all of that. And I took my meds today. But I think I got the gist of it, and I experience it too. \n\nWhat I think it is is basically habits and things from before the medication, and perhaps also anxiety and depression if you have it(which affects my productivity, personally, and you may want to consider whether you have depression). \n\nSee, off meds, I do work on a time-crunch. I procrastinate until the last minute, and then rush to get everything done when the panic sets in and the adrenaline appears. \n\nOn meds, I have a constant stream of that adrenaline, urging me more subtly, to do my work. I'm so used to not doing my work unless I have a super strong urge to do it, that I ignore it and keep goofing off. Sometimes, I actually have a harder time focusing, and I actually take longer on essay tests for example when I have taken my medication than ", "mood": null, "energy": "steady", "focus": "distracted", "meds": ["Adderall"], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I procrastinate until the last minute", "gold": ["mood", "energy", "focus"], "jmood": "missed", "jenergy": "partial", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "focus=distracted and Adderall correct; energy=steady is a stretch and active depression ('taken over') left as no-mood."}, {"id": "1e683742", "text": "Also, for long term effects, as long as you stick to therapeutic doses, you should be okay. The whole \"euphoria\" feeling is normal the first few times you take it, but as your body adjusts that should go away. And so long as the medicine is still helping with attention issues, you shouldn't increase the dosage to chase the euphoria feeling.\n\nI haven't seen evidence of really negative long term effects of therapeutic doses. It can exacerbate existing stuff (like high blood pressure), though.", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Also", "gold": ["focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=okay on a purely informational post about euphoria/therapeutic doses; no personal mood expressed."}, {"id": "05263c75", "text": "This is me. I'm 30 years old and was diagnosed 7 months ago and started on vyvanse. I just didn't understand how people were so productive with friends, school, work, clubs. 30 years old and still working on my undergrad and feeling so behind in life. I still don't understand how some people can take on so much and so easily, but the vyvanse helps me be more a productive person in general and that's all that I want. Sometimes once I get a few simple tasks done, I can ride the wave and make it a really productive day. It's an awesome feeling. \n\nFor myself awareness of those years of accomplishing little to nothing can really affect your self esteem and can lead to depression if you don't get help.", "mood": "great", "energy": null, "focus": null, "meds": ["Vyvanse", "Vyvanse"], "feelings": [], "activities": ["Hanging Out", "Work"], "sleepHours": null, "sideEffect": false, "title": "I still don't understand how some people can", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "missed", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "mood=great and Vyvanse correct, but 'ride the wave / really productive day / awesome feeling' energy missed."}, {"id": "97087091", "text": "I’ve never felt like I fit in with my family. I remember when I was really really little I had this recurring dream that always had me left out of the loop. I always felt a little weird but I accepted my weirdness. I was suspected when I was young because of how distracted and frequent aloofness because I was busy daydreaming compared to other kids. Some school counselor I remember tested me but it was never pushed beyond that. My parents never raised it to my doctor in elementary and left it alone. My brother is very organized and accelerated while meanwhile I got grounded every single report card in school. \n\nThe grades and pressure of performance was when things started getting dark about being ‘off’.  It came to a head as a teenager. I gave up and was pretty melancholic all the time. My grades were like the stock market so it didn’t make sense to my parents - one quarter I’d be in 90", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": ["grounded", "absorbed"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I was suspected when I was young because", "gold": ["focus"], "jmood": "missed", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "poor", "note": "Strong low mood missed ('melancholic all the time', crying, never good enough); 'grounded' misread as a feeling when it means punished."}, {"id": "87547849", "text": "You’re welcome! If you have any other questions feel free to ask. I was in denial for a long time but decided it was time to finally do something about it. I don’t feel cracked out or jittery. (I did on the first day but now it’s like my cup of coffee) it just gives me energy and keeps me focused , and I don’t have my normal crashes throughout the day or feel as lazy. I still get lazy and unmotivated at times, but not nearly as much as before. I’m able to speak and comprehend more than I did before. Before I would talk to people and not even realize what we were talking about mid conversation because my mind would just wander. I went through several meds before I found one I liked. Gave me a headache at first, but it goes away. :) best of luck!", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I don’t feel cracked out or jittery", "gold": ["mood", "energy", "focus"], "jmood": "na", "jenergy": "missed", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=sharp ('keeps me focused') correct, but clear energy gain ('gives me energy, no crashes') missed."}, {"id": "887b1637", "text": "I have three kids and even homeschool. If anything, having ADHD makes me more compassionate. \n\nBeing good at emergent/last minute situations is a total strength in parenting. You are constantly \"putting out fires\" with kids around- most of them emotional fires.\n\nADHD makes you so much more perceptive (assuming no co-morbid ASD-type conditions) that you can understand your child's needs more quickly and accurately.\n\nHyperfocus allows you to truly live \"in the moment\" with your children, even though it might result in chicken nuggets for dinner because you kept playing or working on something together.\n\nYes, it is challenging, but they will love you no matter what your shortcomings are and if you resolve to choose to be loving and humble in those shortcomings, they will respect you all the more. And be more inclined to seek you out to deal with their own (which will probably be a lot like ", "mood": null, "energy": null, "focus": "lockedIn", "meds": [], "feelings": ["loved"], "activities": ["Eating", "Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Hyperfocus allows you to truly live \"in the", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "focus=lockedIn from 'hyperfocus' as a general parenting strength, not a current locked-in state."}, {"id": "139f0e91", "text": "What I gathered from books and lectures from reputable researchers is that the therapeutic effect of stimulant medications doesn't go away even after a prolonged usage of medications. Of course this is assuming that you stay within therapeutic dosages. If you snort it, you will mess up your receptors no matter what. \n\nHere is a comment I wrote a while ago about how some people feel some benefit from weekly medication holidays and how my psychiatrist interprets it: https://www.reddit.com/r/ADHD/comments/4p02rh/taking_a_break_from_meds_on_weekends/d4gzbhb \n\nBTW I completely stopped the medication holiday thing. I tend to get lightheaded the day after skipping the medication. YMMV\n\nThe way I understand stimulant medication tolerance is that we do form a good kind of tolerance within the first few weeks or months on a new medication or a new dosage. This is why the initial side effects tend ", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "What I gathered from books and lectures from", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good on an educational post about tolerance/medication holidays; no personal mood stated."}, {"id": "778969f4", "text": "I just increased my dose this morning and it kicked in way faster than the 12.5. my doctor skipped the 25 too and put me on 37.5. Before, I had been waking up about 3 hours early to take it so it was kicked in by the time I got to work, but that backfired majorly this morning. It took a Max of an hour before I kicked in really well. It feels so much better than the 12.5. I was really worried it wouldn't work and I'd be stuck with it for another month but most of the kinks seemed to have smoothed out now.", "mood": "good", "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": 3, "sideEffect": false, "title": "I just increased my dose this morning and", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "mood=good (relief, 'feels so much better') correct; focus=present unsupported — text is about dose onset, not focus."}, {"id": "61a1ed2d", "text": "Dude I go from sooooo happy like weeeee!\nTo why the fuck doesn't anybody love me ever!!\nAll the time. I think I'm just over reacting.\nBut the times I feel super depressed just cuz I feel like I need to feel that way now. That's the weird shit I can't explain.\nSometimes I just need to cry. For no reason but so I can feel happy after maybe. Like you know get that weak shit out of my eyes. I dono. No that's not why.\nWhatever it is I like to cry. I feel fucked when I don't cry for a long time. Like something is wrong.\nI think about all the people who used to be my friends, I think about all the girlfriends who broke up with me, I think about all the money I owe, I think about all the work I do when humans are supposed to be out hunting and gathering but the government made that basically illegal to do all year so we are forced to pay taxes and work until we basically die because I don't thin", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Hanging Out", "Work"], "sleepHours": null, "sideEffect": false, "title": "Dude I go from sooooo happy like weeeee!", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood=low captures the dominant depressed/crying tone of an emotionally labile post; no spurious signals."}, {"id": "f01ee212", "text": "Yeah. After we raised my dose I noticed that I was a WRECK the week before my period. Just anxious beyond belief and emotional and I couldn't focus for shit. I even yelled at my mom.\n\nThe first month I was confused because normally it wasn't that bad but the next month came and I screamed at her again and I looked at my calendar and instantly everything fell into place. This month I've been having more focusing issues and I've been irritated more easily but I haven't been crazy so maybe my body is adjusting.", "mood": "low", "energy": null, "focus": "distracted", "meds": [], "feelings": ["anxious"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "Just anxious beyond belief and emotional and I", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "clean — mood=low ('a WRECK', emotional) and focus=distracted ('couldn't focus for shit') both right."}, {"id": "35be72c9", "text": "Using amphetamine, even lisdexamphetamine has an extremely high physical dependence rate for any extended use period which is how it is described. This is elementary pharmacology, and citing it seems silly. Don't spread lies that some people may believe. \n\nYou are using silly anecdotal evidence. \n\nIf you want to actually know some stuff read through amphetamines Wikipedia page, specially the pharmacology section. If you run across something you don't understand feel free to ask me through a DM. I will be happy to help educate anyone on most drugs, this one in particular. But forreal dude. Any amphetamine extended daily amphetamine use, even in lisdex (agreed it's the least abusable) is going to cause MAJOR physical withdrawals as the body and brain recalibrate their respective neurotransmitter systems.", "mood": "great", "energy": null, "focus": null, "meds": ["amphetamine", "dex", "amphetamine", "amphetamine", "amphetamine", "amphetamine", "dex"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Using amphetamine", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "poor", "note": "mood=great wrong — combative pharmacology info-dump, no positive mood; amphetamine/dex correctly caught."}, {"id": "b8a0b501", "text": "100000% same. I'm a very green attorney finishing work for a judge. I had constant work anxiety about screwing up menial tasks and just operating in an office period. Even the smallest report to my boss would have me so nervous and afraid I couldn't even think straight.\n\n&amp;#x200B;\n\nNow that I've started my medication, my anxiety has almost totally disappeared. I can organize my thoughts and communicate like I never could before. Now when the judge calls me in to discuss a case, I'm engaged and participating from time-zero instead of after five minutes of anxiety panic.\n\n&amp;#x200B;\n\nIt also helped other co-morbidity issues. \n\n&amp;#x200B;\n\nIt is really hard to describe since I'm so new to my treatment, but I am just happy I'm finally getting better.\n\n&amp;#x200B;\n\ntl;dr: hell yes it helped", "mood": "good", "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I'm a very green attorney finishing work for", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "mood=good ('just happy I'm finally getting better') and focus=present ('organize my thoughts, engaged') both supported."}, {"id": "1818f144", "text": "I feel you and it's really admirable that you're trying to help your little brother.  I'm not sure this will work but you could speak with your school counselor.  \nYou could just start the conversation with this family issue that's affecting you.  This lets you explain how it is hurting everyone in your family and you could segue into asking if they can help arrange something for your brother.  He's in a different school but still in the same district, right?  It's not much but it may be something.  \n&amp;nbsp;  \nSchool districts should have resources to help their students, especially when there are emotional and learning disabilities involved.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I feel you and it's really admirable that", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — pure advice to help a brother; extractor correctly returned no mood/energy/focus/meds."}, {"id": "87182213", "text": "I have a cup of coffee every morning still with taking adderall 2x a day. I used to self medicate with coffee as in drinking a cup in the morning, a large amount in the afternoon, and some in the early evening just to be functional. Coffee helps me wake up in the morning so I am not as groggy. Adderall just keeps me focused. Nothing wrong with having a cup in the morning I believe.\n\nIt might affect adderall because apparently adderall is excreted faster when your stomache is more acidic AKA has coffee in it. T", "mood": null, "energy": null, "focus": "present", "meds": ["Adderall", "Adderall", "Adderall", "Adderall"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I have a cup of coffee every morning", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "focus=present ('Adderall keeps me focused') and Adderall both correct; reasonable to leave energy null."}, {"id": "c95a08e1", "text": "This may sound stupid, but be aware of how much you are working at your job. I ended up loving my job at college because I got to socialise and I was constantly doing something, constantly moving. That ended up taking priority over my degree, even though I *knew* it shouldn't so I took a load of extra shifts, especially in finals week.\n\nMy advice is, take a job that has a set amount of shifts per week and don't fall into the trap of distracting yourself from coursework with your job.", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": ["loved"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I ended up loving my job at college", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "Retrospective advice; focus=distracted fairly tracks 'distracting yourself from coursework'."}, {"id": "aa696ee1", "text": "I was asked to stop watching Netflix at work (in the background, of course) after several months of it not being an issue.  I completely freaked out about how I'd get work done without my brain firing off 1000 different things every minute.  So I googled \"need constant stimulation\" and my whole life clicked into place...  I had honestly NEVER considered ADHD.  I'm really not sure why, but I never looked into it.  I've always needed overwhelming stimulation, and my mind races like crazy.  \n\nA few weeks later, I went to a psychiatrist.  His assistant talked with me about a lot of things - just a general life situation and history.  She asked me about my symptoms, and I explained them (as well as I could remember).  She gave me a questionnaire, which I filled out in about 10 minutes.  \n\nThen I talked to the doc.  He looked over my history and questionnaire, and we talked a bit about my life", "mood": null, "energy": null, "focus": null, "meds": ["Strattera", "Strattera"], "feelings": [], "activities": ["Screen Time", "Work"], "sleepHours": null, "sideEffect": false, "title": "I completely freaked out about how I'd get", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "'Completely freaked out' negative mood missed; Strattera captured (but duplicated)."}, {"id": "6eda2655", "text": "In only one article do the authors state that is there a possible correlation between ADHD and dementia. That article is [Golimstok et al., \"Risk factors for dementia with Lewy bodies: A case-control study,\" *Neurology.*](http://onlinelibrary.wiley.com/doi/10.1111/j.1468-1331.2010.03064.x/abstract;jsessionid=E78D5AE9702C318078CED6860980315B.f03t01?userIsAuthenticated=false&amp;deniedAccessCustomisedMessage=) [Here is an article](https://www.psychologytoday.com/blog/the-distracted-couple/201411/adhd-and-dementia-what-s-the-connection) from *Psychology Today* which demonstrates that there is possibly a connection (basically, this article is a recap of the previous article).\n\n[This post](http://www.additudemag.com/q%26a/ask_the_add_medical_expert/7265.html) from ADDitude Magazine (\"ADD and Alzheimer's: Are These Diseases Related?\") says there is no correlation, but there's no date to this a", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "UserIsAuthenticated=false&amp", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Pure citation dump; focus=distracted triggered by 'the-distracted-couple' in a URL."}, {"id": "617af4b5", "text": "There's really no wrong way, just the best way for you. That said, there are benefits to doing it. When I started, I was taught that eyes open or closed weren't important in the beginning, that that is something to work up to.\n\nFor the first week or so, I started with eyes closed. After I got better I started with eyes open. It does help, in that it helps you be aware of where you are, and helps slot you into \"the moment\" a little more deeply, quicker. I'll pick a point and gently stare in its direction, notice the things around me, notice the distance between me and the things in the world (for me this helps create a mental distance between \"myself\" and the world), then I'll notice the edges of things which give them shape and form (again, it's recognizing those boundaries which helps me recognise my own existential distinction). All the while I'll take deep breaths in through the nose,", "mood": "good", "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "That said", "gold": ["focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Meditation how-to: focus=distracted and mood=good both unsupported (text is about gaining focus)."}, {"id": "ee247063", "text": "&gt; Yeah you can post positive stuff here too, but i just feel like the majority of the posts are help posts\n\nIt would generally be far easier to post what you want to post to offset the other ones as opposed to creating a brand new subreddit, figuring out how to advertise it, and then _changing the focus of the established subreddit_.\n\nWe welcome all positive posts too, and if you post some I'm sure you'll get quite a bit of participation.  It seems a tad extreme to automatically default to making a new sub and forcing the existing one to change.", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "&gt", "gold": ["focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Subreddit-policy meta-comment; focus=sharp keyed off 'focus of the subreddit', mood=good unfounded."}, {"id": "0205dfcd", "text": "You are 30 years old and have recently been diagnosed. You're earned an associates degree undiagnosed and unmedicated. *You can do this.*\n\nIf you want to be anxious, be anxious. If you want to be terrified, be terrified. Just keep moving forward, adapt, learn what works best *for you*. \n\nThings I do to help me in school:\n\n- Take all the notes. Yes, all of them. Even those little unimportant details can help jog your memory later.\n\n- Review the notes immediately after class. Just a quick glance will suffice.\n\n- Keep your backpack organized. I take 15 minutes every night to clean out any clutter and reorganize anything that may have been misplaced. \n\n- Stickie notes.\n\n- Phone reminders.\n\n- Minimal highlighting. \n\nIf you fidget, buy a fidget cube. If you need complete silence, rent out a study room or purchase noise canceling headphones. If necessary, speak to the disabilities office on cam", "mood": "great", "energy": null, "focus": "sharp", "meds": ["Adderall", "Adderall"], "feelings": ["anxious"], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "If you want to be anxious", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "mood=great unsupported (advice + hypothetical 'if you want to be anxious'); Adderall + focus correct."}, {"id": "1a277060", "text": "That's exactly what I thought! I don't know what I said to give her the impression that my mood doesn't line up with reality - I may react a little bigger than is reasonable or get overly excited, but it's still a normal emotion/reaction. I was so offended when I read that part of the report, that my mood have no basis in reality, because it's just not true. They are extreme, sure, but it's usually pretty obvious what in the outside world triggered me. I don't know why she would have a thing with stimulants because she's a psychologist and can't prescribe meds anyway... \n\nFeels shitty because I feel like she literally saw a woman in her mid 20s complaining of being distracted, that I talk and drive fast, and got bipolar in her mind (even though I specifically said I relate HARD to the ADHD experience) and the rest was all confirmation bias. I fell into the stereotype I was trying really ", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": ["excited"], "activities": ["Outdoors", "Resting"], "sleepHours": null, "sideEffect": false, "title": "I don't know what I said to give", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "Clearly negative ('so offended','feels shitty') mood missed; focus=distracted is correct."}, {"id": "281c143d", "text": "I have similar situation to your friend's where when I went back home, I felt miserable and like a failure. I'm currently cycling through the process of being depressed and then okay, depressed and then okay. I think the best thing to do for her is to do what you're already doing. Keep her updated and talk to her about things that are on her mind.\n\nShe might be sitting in her room alone with nothing to do but thinking about all the shitty things that have happened over the course of her college experience. Just be reassuring and talk to her about how there will be more opportunities. Also, try to make plans with her whenever you can. I am always afraid that I'm intruding on people's lives so I just keep to myself but it makes me feel so much worse.\n\nTL;DR: Keep doing what you're doing, be a support system for her and try to make plans with her ASAP.", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "I have similar situation to your friend's where", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood=low matches 'miserable','depressed' — clean."}, {"id": "489d9987", "text": "Totally relate to this.   \nMy doc has finally pulled me out of a depression that i was in so long i didnt even realise i was in it - and the paralyzing feelings of utter dread and horror, that can just be so overwhelming, have abated significantly.   \nI agree that it is not run of the mill depression - we are not run of the mill people ;-)   \nTake a brain that has a hundred non-synchronous things going on inside it at any one time, plunge it into the void of despair, and shake it up with power-surges of anxiety. Not a pretty picture.", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "My doc has finally pulled me out of", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Strong depression/dread/despair mood missed; focus=distracted is a false positive."}, {"id": "cecc48d9", "text": "I think part of this might be emotional dsyregulation, which is part of ADHD. My son has ADHD and will often take offence to friendly teasing or feel like gentle redirection is punishment or harsh criticism. I think it is more that he overreacts emotionally to negative things. So even a tiny amount of friendly teasing still triggers feelings of inadequacy and then he is stuck on those feelings and they are more intense than the situation warrants because of emotional dysregulation. This overrides any rational perception about the other person's intention. But if he watches other people being teased, like on tv, he can usually discern if it is friendly or not.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Even a tiny amount of friendly teasing still", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Third-person about son's dysregulation; correctly emits no first-person signal."}, {"id": "28a59561", "text": "You sound a lot like me. I managed to get my Masters degree like this, before being diagnosed. I was used to doing at most 2-3 days worth of 10+hours panicked crunch before exams, and pass with mediocre grades. I did my masters' thesis in a week and got a really high grade on it too!\n\nThen I got a full-time job, where I was actually expected to sit down and work for 8 hours a day. I managed to pull it off for a while, but I crashed and burned really quick. I was just not capable of that kind of sustained effort. I felt depressed and would often waste time online instead of working.\n\nI tried freelancing, but that was all a pattern of running low on money, taking up a project, procrastinating until client got pissy, go in crunch mode and finish project in record time, relaxed because I had money and didn't do anything for days/weeks/months, and the cycle would repeat.\n\nI am now taking meds", "mood": "great", "energy": "steady", "focus": null, "meds": [], "feelings": ["panicked"], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "I was used to doing at most 2-3", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "partial", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Current state positive (mood=great ok); energy=steady captures recovery but ignores 'crashed and burned' history."}, {"id": "cdd887e9", "text": "Would you be able to take a mental health leave of absence? I work in higher ed, and it's definitely not an unheard of or even unusual thing. With a therapist, you likely already have access to the medical documentation that would be necessary. There's no shame in taking a break from school if it's in your own best interest. Maybe you could talk to your academic advisor? Universities and professors want you to graduate and succeed, if you reached out to your professors or advisor, I bet you'd be really surprised at the options available to you. I'm happy to talk more specifically if you want to DM me!\n\nAs an additional note, the point of therapy isn't necessarily a diagnosis, it's learning how to \"do something about it\", learning healthy coping mechanisms and skills. If you feel like you aren't getting that from your therapist, it's completely reasonable to find another provider. It took", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": ["relieved", "validated"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I'm happy to talk more specifically if you", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Relief/validation is real but past-tense about finding a therapist; mood=great overstates current state."}, {"id": "8e250e7f", "text": "Yes! Well, sort of. \n\n\nI've been wanting to ask other ADHDers about something similar. I do this thing sometimes when I think I need to take a nap, but I don't really sleep. I make sure everything is quiet and comfy, close my eyes and just exist. It's not sleep. In fact, I can't sleep. It's more like suspension. After about 20 minutes I feel way better and can (kind of) continue with my day. \n\nWhen it's actually time to sleep is when it takes me forever to relax and my mind keeps going. That's when I suddenly have the motivation to do all the things I should have been doing during the day.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I do this thing sometimes when I think", "gold": ["energy"], "jmood": "false_positive", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "'Feel way better' after rest is an energy signal (missed); mood=good is unsupported."}, {"id": "7612ae81", "text": "47 year old adhd male married 25 years, and I understand and empathize a lot about how you feel. The only advice I have that has recently helped me, is slowing way down before I react or even feel anything. Seems to help me in about any situation if I can just simply pause for a moment and get in the right mindset before I try and sort through the pile of hot garbage that just dropped into my lap. I believe adhd minds move pretty fast but do much better slowed down, especially in emotional situations.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I believe adhd minds move pretty fast", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Empathy/advice only; mood=good asserted with no personal mood in text."}, {"id": "41266d05", "text": "since starting medication ive been doing a good job of cutting this kind of stuff out.\n\n\ni was diagnosed at 34, and have plenty of experience with what youre talking about. ive wound up teaching myself what seems like a zillion useful skills and have another zillion things ive been interested in but never really followed through on. maybe its because i built up decades of frustration, but once i realized i now have some degree of control over myself, i tossed just about all the secondary and tertiary hobbies/interests out the window. i thought long and hard about my interests over the course of my life, and have come up with a singular goal that excites me and have focused on that. granted, i do need to stay on top of myself. if X days go by and im falling off course, i need to correct this. i write down what i do daily, hour by hour, so i can look back and see how well ive been doing wh", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": ["excited"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I was diagnosed at 34", "gold": ["mood", "energy", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=sharp correct ('focused on that'); 'goal that excites me' mood signal missed."}, {"id": "d0b2b1d5", "text": "While I cannot vouch for any \"mouth fidget toys\" I can certainly see how they could have a use.  I too tend to chew my nails/chew on things while working.  For years people told me that it was just a \"nervous habit\" or a form of anxiety, but I am beginning to think it has more to do with stimulation and focus.  \n\nI forced myself away from this activity after I was bullied during high school for mangling the caps of every BIC pen I owned, but have been meaning to give it a try again.  Other items you could chew are: a straw, the stick from a sucker or Qtip, or (if you want that down-home country look) a grass stem.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "For years people told me that it was", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp keyed off 'stimulation and focus' mechanism; author reports no current sharp focus."}, {"id": "d78372b5", "text": "Math, more accurately numbers has always been easy for me.  at 37 i still know the license plate number for the 88' Oldsmobile my parents had when i was 6 (AEC 219) adn the fedex account number for the first company i worked for in 1995. \nI can easily recall most any number i crunch at work - i'm a construction estimator.\n\nwhen it comes to writing the proposal and delivering the proposal, the easy part of selling, just write the number on the boiler plate form and email to client, i can't / don't do it in a timely fashion. \ni have no follow up calls to clients in the last month, just a simple call to say \"how are you, is my proposal likely to solve your problem' - can't find the time or the energy.", "mood": null, "energy": null, "focus": null, "meds": ["dex"], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "When it comes to writing the proposal and", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "missed", "jfocus": "na", "jmeds": "false_positive", "overall": "poor", "note": "meds=['dex'] hallucinated (no med in text); 'can't find the energy' low-energy signal missed."}, {"id": "76f026b6", "text": "I have exactly all the problems you've listed. Was never diagnosed with depression, but I have problems with feeling empathy and caring about others in general. \n\nI know what you mean when you get into that state of mind where everything works perfectly. I react quickly, speak fluently without stuttering or putting my words in the incorrect order, etc. I've noticed I tend to get into this state around 4 AM on an all nighter gaming binge with my best friend, who I suspect has ADHD frankly because he acts just like me, but he has never been diagnosed. I love when I'm in this state of mind, it's amazing to call out commands to my teammates with confidence, expecally during something that requires lots of teamwork ( destiny raids )\n\nEDIT: I realize this comment is probably absolutely no help to you, sorry about that, I just understand exactly what your going through and wish I could be of he", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "I love when I'm in this state of", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood=great matches 'I love when I'm in this state, it's amazing' — clean."}, {"id": "ae4e0efb", "text": "This is beyond strange, because for one thing I agree with you, and the second being that I just cut my hair 2 days ago as well which ramped up my productivity doing homework. Albeit the reason I got the haircut was that I was trying to correct a botched haircut I got a week prior myself which also was botched. \n\nAnyways, I'm sure the reason for the productivity boost has psychological ties about feeling more confident when you know that you are presenting the best looking version of yourself out in the world, but I thought it was a fun coincidence.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "This is beyond strange", "gold": ["energy"], "jmood": "na", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Repeated 'ramped up my productivity'/'productivity boost' energy signal missed."}, {"id": "02123eac", "text": "Normal is going to feel different for everyone, medications can effect people more profoundly or less so than others.\n\nThe question is, does it help in a significant and meaningful way? If so, your on the right dosage (although do know the effects can fluctuate for the first few months as your body stabilises). It’s helping and your interested if it can help more? That’s a fair interest to have, but that’s something you will want to talk about with your doctor.\n\nJust know it’s not designed to effect your motivation, on high dosages it can, although that would have more to do with the unintended side effect of euphoria that can occur.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "The question is", "gold": ["energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Abstract dosage advice; correctly emits nothing despite energy gold hint."}, {"id": "5309012d", "text": "I hope you get the help you're seeking when you get in to a doctor!  Recognizing that you need some extra help and then slogging through the necessary requirements to get there is daunting, but worth it.\n\nAnd please don't compare yourself too much to people posting their success stories!  Most people are more likely to talk about how much their lives have improved than how much they haven't, online.  That doesn't mean there aren't plenty of people in the same boat you are.  I know I've just changed so much since 10 years ago that there's not too much point in comparing.  My life hasn't gone in several directions I hoped it would, but some of those unexpected and not always pleasant twists and turns ended up being necessary to teach me what I actually want in life.\n\nThere's a number of ways in which I could be further ahead in life if I'd known how my goals would change down the line and ", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["hopeful"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "And please don't compare yourself too much to", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'A lot happier','hopeful about the future' positive mood missed (only feeling 'hopeful' captured, no level)."}, {"id": "01b9e215", "text": "Omfg .. same! I've spent a lot.of weekends feeling restless because I didn't take a shower in the morning. At the same time it's too much effort to shower. But I don't like it, so I end up feeling ugh and not doing _anything_ the whole damn day. Also me, can spend literally 2 hours pruning up in a hot bath. And of course I get my phone, my Kindle, my magazines _in case I get bored_.  My SO is always amused when he sees me take all my required entertainment material to bath time �� After all that I usually just end up watching something on YouTube. Whether I should shampoo or not is a serious energy expenditure Q as is finally getting out of the tub. I always thought I was just lazy and indulgent. I haven't been diagnosed but I sure AF relate to everyone here pretty hard.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["restless", "bored", "amused"], "activities": ["Screen Time"], "sleepHours": null, "sideEffect": false, "title": "I've spent a lot.of weekends feeling restless because", "gold": ["energy"], "jmood": "na", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'Serious energy expenditure', can't do anything all day = low-energy/inertia, missed."}, {"id": "d42770b1", "text": "Not diagnosed but i can say i have the exact same experience - for the first time in my life i really feel like i am here and doing the things i want to do and dont get lost all the time and more focused on just doing the things i set out to do than ever before in my life.\n\nJust this general feeling of being here and actually being able to handle multiple goals and wants at the same time. like i feel ive never been a better and more functional version of myself. I wonder if those benefits come from being way farther away from this level of \"normal functinality\" than other people or if meditation is really just that good. or i am now just that good.", "mood": "okay", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Not diagnosed", "gold": ["focus"], "jmood": "partial", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=sharp correct ('more focused than ever'); mood=okay undersells 'never been a better version of myself'."}, {"id": "d01f53f1", "text": "I’ve been diagnosed and aware of ADD for over 20 years but have been absolutely amazed since joining here a year ago. It’s just so different going from having a vague awareness of processing things differently to identifying all these specific shared experiences. \n\nThe self-acceptance has been life-changing. Thanks all.\n\nTo OP: I think some way of ticking off time passing is the way to go. I don’t get why I was never able to do the math of how long it would take. I was in a city and always spent so much on taxis when I always lived extremely close to train and bus stops. I’m a stay at home mom right now and in a phase where I don’t really have any firm appointments and that’s awesome but there are a million other ADHD miseries that come with no schedule and little lives depending on you. Anyway, The Amazon dot has been good for me in terms of calling out for the time and calling out for ", "mood": null, "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I don’t get why I was never able", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=present has thin basis; post is about self-acceptance/time-tips, no clear present-focus state."}, {"id": "7c0d2d24", "text": "All throughout the day!!! Sometimes it’s quick to find the place I put it and not “interfering.” I’ll find it somewhere that makes sense, just lost track of where I put it. Then most other times I eventually find it somewhere “distinct” I put it to “remember” and that has included the washing machine when I forgot I left it on my comforter and wanted to wash my bedding, fallen out of pocket, left behind, in the fridge, a drawer etc.\n\nMy phone is dead a lot so I’m in luck if I can use Find my iPhone. But only once I manage to charge my other devices that also dead to complete two factor authentication to get in...\n\nI start a lot of sentences (out loud thoughts) with “where’s my...?” And I could solve this by getting what the commenter mentioned above, a tile! Highly recommended. It was a great two years when I had mine. Then the battery died and I had to order a new tile. And two years af", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Fitness", "Hanging Out"], "sleepHours": null, "sideEffect": false, "title": "It was a great two years when I", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=great asserted on a post about chronic lost-item anxiety and the 'I did it again' shame cascade — wrong sign."}, {"id": "6d552d17", "text": "Hey, I didn't think about this, but you're right! I think drinking coffee might be reducing the effectiveness of my Vyvanse! \n\nI didn't realise coffee was acidic, and I actually did notice that on mornings where I drank my coffee first I felt incredibly tired even after taking my Vyvanse, now I realise probably the absorption was affected. \n\nAlthough now I am on 40mg and it's actually over stimulating me (I intend on phoning tomorrow and requesting a lower dosage, perhaps 20mg + 10mg to take a few hours later if it's possible) and drinking a small coffee has made me feel better.\n\nAnyway I'll follow this post to see if anyone else shares good information, good luck in your quest for that same information!", "mood": "good", "energy": "tired", "focus": null, "meds": ["Vyvanse", "Vyvanse"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I think drinking coffee might be reducing the", "gold": ["energy"], "jmood": "false_positive", "jenergy": "correct", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "energy=tired and Vyvanse correct, but mood=good unsupported (writer is over-stimulated, planning a dose cut); also Vyvanse duplicated."}, {"id": "87c677ef", "text": "This post resonates so much with me right now. I'm finding myself in a similar situation, cutting people off, making bad choices, lost my job, home, coming here for inspiration and information so that I don't feel so alone. And I'm so great ful for that, for you guys. \n\nI'm terrible at advice but I can empathise with the mental anguish of this situation. \nAll I will say is maybe try and remember that all of the above would be a pretty daunting and debilitating situation for alot of fully functioning people, so allow yourself to struggle a little, don't put too much pressure on yourself. Even the most functional of thinkers would probably hit a bit of a wall when dealing with all this. \n\nI hate how crippling that anxiety can be when it hits so for you to take that shower �� that a major achievement. So remember that too. \n\nAnd is losing your job a definite? I only ask because I've been to", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I'm finding myself in a similar situation", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=low is defensible but the post is mostly consoling someone else; the writer's own low state is past-tense/muted."}, {"id": "60c12b54", "text": "I don't have a direct answer, but I can tell you that my life is in a similar place in some ways, where I like being my unmedicated state of being spontaneous and having my mind connect things in all sorts of unexpected ways.\n\nHowever, I can say that when I look at things objectively I'm either stagnating or under-performing professionally depending on which of my professions I'm looking at, my long term creative projects continuously stall out, my apartment is a mess, I don't keep in touch with people the way I should, I go through cycles of stress and anxiety, etc...\n\nWhen I look at it that way, the \"joyful wandering mind\" doesn't seem all that great compared to the trade-offs.  I have an appointment to start medication next month.", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I don't have a direct answer", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=great latches onto 'doesn't seem all that great' (a negation) while the post lists stagnation, mess, stress, anxiety."}, {"id": "23fec1e1", "text": "First, congratulations on your baby! My partner and I both had our first child at that same age, years before we met. Whatever you're feeling, I'm pretty sure we've been there. You've got this!\n\nI was undiagnosed because I was a wiz at school. That being said, college presented its own challenges. Suddenly there was no endpoint in sight because instead of obtaining a single diploma, I was given the choice of hundreds of degrees. Talk about overwhelming. I dropped courses and changed majors, and 9 years later I finally got a bachelor's degree. This doesn't help you.\n\nThere are two things that have helped me immensely since my diagnosis, outside of reading the right books and talking with a therapist. They're going to seem a bit strange.\n\n1. Make your bed. Every morning, make your bed. If nothing else, when your day is complete, the very last thing you will do is get into a made bed. It's ", "mood": "okay", "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": ["Hobbies", "Outdoors"], "sleepHours": null, "sideEffect": false, "title": "This doesn't help you", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=present is fabricated from a described Headspace coping ritual, not a current self-report; mood=okay is thin."}, {"id": "c9c8473e", "text": "Someone can surely find the video, but there was a doctor who was speaking at a medical conference about ADHD.  The whole video is like an hour long or so.  He said a thing that made me feel a shitload better in your regard.  Something to the effect of \"across the board, no matter who you are, ADHD folks have the emotional maturity of 30% less than their age.\"\n\nIf you're 30, you have the emotional maturity of a 21 year old.  That's barely better than someone right out of high school.  Gauge yourself based on that instead.  Are you doing awesome for a 30 year old?  No?  Are you doing better than someone 21?  Probably so.  It's just how we are.\n\nEDIT:  Russell Barkley is the doc.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "He said a thing that made me feel", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=good rests only on 'made me feel better' about a relayed quote — mild and second-hand, not a clear mood report."}, {"id": "caabcf4d", "text": "I'd like you to think about this in a different perspective, I was in a very similar situation as you.\n\nYes, you have ADHD. University is hard for the average person, ADHD made it a lot harder for you. Since it sucked, it isn't a great surprise that you didn't want to do it (studying... etc). You got into the habit of not doing it.\n\nYou did not fail out of university because of your ADHD, you failed out because you (understandably) had trouble with forcing yourself to do what you have to do.\n\nBeing treated with medication does not mean that you'll automatically do better at school. It makes it easier for you, but you still have to have a lot of self control, and self motivation.\n\nIf you're having trouble with sending in documents, you will have trouble with school.\n\nIf you know you're procrastinating, do something about it. It's now in your power. Replace the bad habits with good habits.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Since it sucked", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good unsupported — the post is tough-love advice to someone else with no first-person current mood."}, {"id": "8ec4bde7", "text": "Make you feel normal? As in you dont feel 'anything' or makes you feel 'like a normal person'? \n\nYou shouldnt be feeling like you have a firecracker up your ass. That sounds horrible. According to my doctors that means that you don't exactly need the meds to begin with or are over medicated... I got fired from my job when my doctor put me on too high a dose of Adderall lol went back to my correct dose after that and have been so happy since", "mood": "great", "energy": null, "focus": null, "meds": ["Adderall"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "According to my doctors that means that you", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "clean — 'so happy since' returning to correct dose supports mood=great; Adderall captured."}, {"id": "70d48ec1", "text": "Try not to think of yourself as just a shitty person....although I am guilty of the same. My strategy, if I don't get a diagnosis is to implement all the other non-medication options that people recommend for ADHD (exercise and meditation). The last couple of weeks I've been exercising 4 times a week (Weights + Running) and sporadically before that and my mood has increased massively. I know it's not for everyone but I think of exercise as medication for depression and ADHD and not solely for fitness.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["guilty"], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "Try not to think of yourself as just", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "explicit 'my mood has increased massively' returned no mood — a clear positive-mood miss."}, {"id": "c2fb21d3", "text": "My dad has said stuff like that before (she wants to be seen as the victim, etc.), which I do get but also they had a really shitty divorce (married 25 yrs), so IDK how much of that is personal bias. \n\nBut, you're not the first person to say that? So that's not totally surprising I guess. I just don't know how much of it is true. \n\nI tried that last semester- my brother's been going through a rough patch, and simply put all her attention sort of went straight to him a lot. So I sort of pulled away? (she would change the topic of convo to him a lot and I just felt like I was playing second fiddle, so I just. Drifted.) The outcome is a bit of a long story, but simply put I don't think that'll really work. A middle ground approach might, but I don't really know how that would work?\n\nIDK- Like, I know I've played a part in this situation, but I also know that the way she acts over stuff just", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I just don't know how much of it", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=distracted misreads social withdrawal ('drifted', 'pulled away') as attention; mood (frustrated/stuck) was missed."}, {"id": "6cccfa76", "text": "So sorry you are having a tough time with this. Me too!!! I took a week off and hope to catch up on that myself. All those emails make me feel like a scattered mess at work. And it makes me sick to my stomach. Meds do help some but they can't help control massive amounts of information from pouring into my email.lol. I also recently got an adhd coach to help me with organizing and prioritizing at work. This does help me.\n\nSo a couple tips I learned that may help you:\n\n- set up \"rules\" in your email. Learn how to on you tube. These rules can send certain emails with a particular subject line or sender to any folder you want, including trash. They could mark messages as important or show a pop-up box on ur screen, if, for example, the come from your boss. I've been able to divert so much crap to folders where I can look at them later if they are just newsletters or the freaking food menus ", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Eating", "Work"], "sleepHours": null, "sideEffect": false, "title": "-create an \"open\" or \"action\" folder and any", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "'scattered mess at work' with email overload is a clear distracted-focus signal that was missed."}, {"id": "ff079a0f", "text": "I know your trying to be helpful but you're right I've heard the same useless advice more times than I've heard to pay attention. \nI HAVE been working on myself since the day I was born much less recently. I'm not looking for another person to fulfill me. I'm not missing pieces. \nAll I'm trying to say is being single is a stressor that regularly would be easy to handle, yet with all these other external factors is becoming a massive frustration. \nI don't NEED help with the problem I need help with how to regulate my emotions as I handle the issue.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I don't NEED help with the problem I", "gold": ["focus"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'becoming a massive frustration' / needing to 'regulate my emotions' is a low/frustrated mood that was missed; gold's focus tag is dubious."}, {"id": "f35e8e12", "text": "Well... I'm trying to make it so I don't miss out on so much, but so far:\n\n* An academic career - turns out grad school is REALLY HARD when you can't start anything.\n* An engineering career (couldn't hack it - couldn't motivate myself to ever actually *do* anything at work\n* A teaching career (missed out on filing my paperwork to get a teaching certificate after completing all the requirements.  I'm still mad at myself for that one\n* Being a better dog trainer (one of my major hobbies - but sticking though with things is very difficult)\n* Feeling like I have worth... I'm unemployed and supported by my husband and I hate it and feel bad every single day", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I'm trying to make it so I don't", "gold": ["energy"], "jmood": "false_positive", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good contradicts a failure litany ('feel bad every single day', 'hate it'); low motivation/energy also missed."}, {"id": "0eddfe15", "text": "Im currently 20 years old; ritalin changed my life forever. Im no longer failing at every single exam, i can focus and be in control over MY life, im functional and capable of doing anything. Before the med? I was a wreck. I kept failing and back then it didnt occur to me that i have ADD. I was too blue and depressed bc i didnt get why i wasnt like all the other people. I felt secluded and an absolute failure. Im glad i got diagnosed and went on ritalin.", "mood": "great", "energy": null, "focus": "sharp", "meds": ["Ritalin", "Ritalin"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Im currently 20 years old", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "clean — 'ritalin changed my life', 'i can focus and be in control' map well to mood=great, focus=sharp, Ritalin."}, {"id": "d534a3fc", "text": "My SO has been unendingly patient with me. I have the tendency to leave things around, or start a project and stop halfway through. I *do* try to keep the clutter to a minimum (it helps that I can't work in a messy area and I work from home), but I often fail or forget. He gently reminds me to do things that I've agreed to do, and is really easy-going about my forgetfulness.\n\nAside from being in a relationship with the kindest and most supportive person I've ever met, I believe a big part of it is communication. Bullet list time!\n\n* Over the years I've sent him articles and Reddit posts that I feel explain my situation as somebody with ADHD quite well, so he can better understand what's happening when nothing seems to happen.\n* I've given him blanket permission to ask that I do things immediately; if I'm playing PS4 and the garbage needs to be taken out, when I say \"sure, later\" he gentl", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Chores", "Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "* Over the years I've sent him articles", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood=good fits the warm, grateful tone toward a supportive partner."}, {"id": "5b7ddee8", "text": "Hey,\n\nI've been sleeping 5 hours per day for two years and I take Vyvanse 70 mg (which is a very high dose). Usually the meds work for me the whole day - from 8-9 am to 8-9 pm, and even after launch (not a heavy one) I don't feel like I want to sleep.\n\nHowever there is a point in the day specially in the end of the afternoon that you feel 'focused' but at the same time all you want is a nap of 10-20 minutes. You can't concentrate and eventually you'll sleep a little bit. At least that's what happens for me and I hate it.\n\nWhat can I say... It does work but there's a point in the day specially in the afternoon and you're sitting and reading something, somehow you just feel very sleepy. None of this happen during the morning or from 7 pm to 9-10 pm.", "mood": null, "energy": null, "focus": "distracted", "meds": ["Vyvanse"], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I've been sleeping 5 hours per day for", "gold": ["focus"], "jmood": "na", "jenergy": "missed", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "focus=distracted (afternoon 'can't concentrate') and Vyvanse correct, but the strong 'very sleepy/nap' tired-energy signal was missed."}, {"id": "cdcfa3ae", "text": "Hey man, exact same spot as you college course wise and medication wise. I was actually started on 20 mg vyvanse and got up to 70 in a month. I'd say it wouldn't hurt asking or questioning about a maybe higher dose; I've also heard of some people on this sub talking about how they take vyvanse and then another pill or med later in the day to keep everything going. But I'd say in the end that is the best part of vyanse, no crash, no rush, just clear thoughts and bliss.", "mood": null, "energy": null, "focus": "sharp", "meds": ["Vyvanse", "Vyvanse"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I was actually started on 20 mg vyvanse", "gold": ["mood", "energy"], "jmood": "missed", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "focus=sharp ('clear thoughts') and Vyvanse correct, but 'bliss' positive mood was missed."}, {"id": "59f6853f", "text": "Maybe the Twitter route is a good idea. The NHS complaints process seems like such a long process. \n\nAre you being treated? You say I'm \"catastrophsing\" the situation, but you don't completely know what my situation is. Medication might only help a little, but I need that extra bit of help.  I've been trying all of the things you're suggesting and that others suggest for years, and I've got to the stage now where every day is an enormous struggle. I have had therapy and diets and exercise regimes my whole life. \n\nI'm sorry if that sounds passive aggressive, I don't mean it to. I'm just beyond frustrated.", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["frustrated"], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "You say I'm \"catastrophsing\" the situation", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — 'every day is an enormous struggle', 'beyond frustrated' supports mood=low."}, {"id": "49dd1888", "text": "* Adderall IR, 50mg at this point. Started at 20, went up to 40 the month after, currently at 50. Usually do 20 in the morning, 20 midday, 10 in the late afternoon, sometimes I space out that middle dose.\n* Starting off, I had really severe dry mouth and so much peeing. Focusing on hydration WITH ELECTROLYTES made all the difference. I still have pretty intense appetite supression as well, but track my food and get calories in with easy things like flavored creamers, protein, etc.\n* Baseline anxiety levels absolutely plummeted. \n* I stopped running into things as much and am INFINITELY more able to roll with sudden changes. \n\nNo identity change, beyond feeling better about myself and my capabilities, and the ability to better able to put into action the things I want to be doing. Helps me be MORE myself because my brain isn't using up all its energy running a million tabs in my mental br", "mood": "good", "energy": "steady", "focus": "sharp", "meds": ["Adderall"], "feelings": [], "activities": ["Eating", "Fitness"], "sleepHours": null, "sideEffect": true, "title": "* Adderall IR", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "partial", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "strong record; energy=steady is a reasonable read of 'not running a million tabs' though only loosely stated."}, {"id": "17644f02", "text": "Not exactly what you asked for, but thought I'd mention because I went on a similar quest and turned up empty, so did this instead. If you have a strong supporter who's willing to help, especially in a particular goal's timeframe (I.e., not forever) then they can be this for you. I was perfectionist-ing out on writing my dissertation for a while, and my mother got on board with this idea to send $5 a day when I wrote a good chunk of the diss. The idea was specific and concrete, ostensibly to be spent at Starbucks; I found this best because you can talk yourself out of a small amount of abstract money for any particular day, but a specific reward was binary: I either got to go to Starbucks, or I didn't. This also had the added bonus of someone I cared about being aware of my progress and holding me accountable, which was as simple as \"did you earn it today?\" Just having someone aware was ", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Not exactly what you asked for", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — practical reward-system advice with no self-reported mood/energy/focus; null is correct."}, {"id": "2c575c22", "text": "You’ve got a lot of good advice and what sounds like a solid plan so I’m not going to get into that. I just want to validate how you’re feeling right now. That doctor obviously doesn’t understand the scope of ADHD nor how it tends to present in girls. \n\nI relate to your daughter a lot in that math was super easy for most of my life because I could do it in my head and basically do other things in class after teaching myself the lesson, but once I had to start writing things down I made so many careless mistakes and got so frustrated because I couldn’t even seem to rewrite a line without changing a sign or dropping a decimal. \n\nIt sounds like you’re doing your best to help and I know she’s going to appreciate that you fought for her. :)", "mood": "low", "energy": null, "focus": "present", "meds": [], "feelings": ["frustrated"], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "That doctor obviously doesn’t understand the scope of", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=present fabricated from a childhood math anecdote; mood=low is mostly empathy toward another, thinly first-person."}, {"id": "1c60774a", "text": "I recently started the bullet journal system and I really like it!\nIdk about you but if you have trouble sticking to planners and stuff (at least if you’re like me at all), the best way to keep up with planners or journals is to:\n\n1. Find a buddy to keep you accountable (my gf is a very organized person and keeps a very neat and functional planner. She also makes a good buddy cause she encourages me to write things down when I’m verbalizing to her my to do list &amp;c.) \n\n2. Keep it simple. Don’t come up with an organizational system that is so overly-complicated that you won’t remember it later or even want to bother to do it. Making your journal accessible to yourself will help you keep up with it over time. Modify the suggested system to one that suits you best! \n\n3. Get a notebook that has a pretty basic layout. That gives you a lot of ways to set up your journal as you please. Mine ", "mood": null, "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Idk about you", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=present unsupported (bullet-journal how-to, no focus self-report); mild positive mood ('I really like it') missed."}, {"id": "bb7f8b3b", "text": "That's a pretty interesting find. A number of these symptoms definitely ring true, and I can definitely see how they'd make reading in particular kind of a struggle. No doubt needing a second for words to really register would slow things down on its own, but I can imagine the need to turn around and process the sentence they cohere adds another layer to it - especially if the eyes are moving from word to word faster than the head can take them in \\^\\^; Sounds like it comes down to there being only so much space in a person's working memory, and where processing's a bottleneck, it kind of overflows.\n\nBy the way, it also sounds like something else I've read about - Concentration Deficit Disorder (sometimes called Sluggish Cognitive Tempo), an informal diagnosis that more or less splintered off of ADHD. It's characterized by similar symptoms - slow mental processing speed leading to diffic", "mood": null, "energy": "sluggish", "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "By the way", "gold": ["mood", "energy", "focus"], "jmood": "na", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "both energy=sluggish and focus=sharp are pulled from a third-person discussion of CDD/SCT symptoms, not the writer's own state."}, {"id": "4fd0603b", "text": "Oh I want to get better. I keep trying and sometimes I am successful at counteracting it but when it comes to these hard classes where I really have to be on top of everything and focus in class,  I cant, I literally just can't. There is input from my eyes and ears but my mind just doesn't process anything, its very frustrating and it affects my motivation to show up to class as well (\"why show up if I cant focus at all, its not gonna benefit me?\", ill tell myself while I sit in bed). Its a never ending cycle I keep falling into even if things seem to be better for a little while.", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "There is input from my eyes and ears", "gold": ["energy", "focus"], "jmood": "false_positive", "jenergy": "missed", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp is inverted — text says 'I literally just can't' focus / mind 'doesn't process'; mood=good also wrong and low energy ('sit in bed') missed."}, {"id": "9a9e9420", "text": "Different environments affect me differently. If I’m able to move and I’m with my family or boyfriend I’m running around like a child or making noises or talking when I shouldn’t be and am just annoying in general. If I’m alone or in class it’s the opposite. I’m a sloth on NyQuil. Just sleep and eat and drift in and out of my thoughts. The meds make everything more sharp and they give me mental energy. They don’t make me overly hyper, just very focused on whatever it is I want to focus on", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "The meds make everything more sharp and they", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "missed", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "Missed energy despite explicit 'give me mental energy'; focus=sharp correct."}, {"id": "7924bc4e", "text": "For me, an absolute deal breaker is high-intense exercise instead of steady light cardio as your son does. I gain way more effectiveness in my stims just from a 10-20 minute resistance style workout done at very high-intensity than I do with an activity like walking, I can't begin to stress that they simply aren't comparable in how they effect my mood. \n\nI see you're observing the issue of finding motivation to get him into that form of fitness, which is exactly the issue I had since I have EDTS as well. I got around this by going to group classes. Prepare for a thread backlash but I LOVE Crossfit because the classes are short, they're incredibly intense, and the group setting allows for those who aren't motivated enough to exercise independently. If I went to a normal gym I'd get nothing done. In this setting you get people to help motivate you and exercise hard.\nIt doesn't have to be c", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "For me", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=steady is lifted from 'steady light cardio' (exercise type), not the author's energy."}, {"id": "9b240567", "text": "I see my psychiatrist at the end of June, and I will definitely bring it up with her. It's funny that the therapist said that my inattentiveness is because of my anxiety/depression, bc I've been on wellbutrin for ages now and the inattentiveness, etc. hasn't gone away (which you would figure would happen once doing better/on medication if that was actually the cause, right?).\n\nI guess the psychologist he referred me to HAS to see you for an ADHD intake (at least according to my therapist)...I'm hoping that he will take me seriously despite what my therapist said to me.", "mood": "good", "energy": null, "focus": null, "meds": ["Wellbutrin"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "It's funny that the therapist said that my", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "mood=good unsupported (only a hypothetical 'doing better'); Wellbutrin correctly captured."}, {"id": "1a626781", "text": "Thank you so much for that! I never thought of the two as different, or even quite relevant to what I was feeling, but it certainly is. She's very cool. I'll try to read up more on this and try accept guilt and divert shame when appropriate, and when it's a personal fuck up, try and treat myself as I would treat a friend. Why should we treat ourselves any differently? I suppose that's something we ideally have complete control over, right?\n\nSounds like we are both on the same path, with the same goals, but have done different research so far. I'm very glad I posted! I hope you enjoy the NVC stuff. The anecdotes in Martin Rosenberg's book are incredibly powerful; worth buying the book for, too. Stories from Israeli/Palestinian conflict resolution sessions to incidences of racial tension in the southern US (very similar situations to what's going on today) to teachers fighting to connect w", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Sounds like we are both on the same", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — grateful, glad tone supports mood=great."}, {"id": "9b6a244a", "text": "I get this too! You aren’t alone and now I know I need to speak up to my doc. I figured I was the only one, or that’s how it should be. \n\nI got switched to adzenys recently and it has become way too habit forming for me and I have abused it in the past when I was really stressed. But I started doing that because I would get so tired 1-2 hours after taking it. \n\nHopefully you find a solution. I’m wondering if it’s a thyroid issue or something else for me personally. Thank you
