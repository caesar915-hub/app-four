alse_positive: post is about a habit-tracking system and accomplishment, no mood expressed."}, {"id": "6607f538", "text": "I tried ritalin for a bit and i was the same way. My anxiety has been so extreme the past few months and the ritalin made it worse. It also made me think things like \"why can't I just be like other people and NOT need 50 medications just to do what regular people Do??\" My Dr took me off Ritalin for a while but i miss it :( and I think we just gotta remind ourselves that we are superstars. We are working 3 times as hard just to be as productive as others, of course it's exhausting and what not. I've been trying to work on positive thoughts so I try to tell myself \"well greatness takes time and effort- these other ppl have greatness fall into their laps but you are working harder to achieve it- you are a badass!!\" (Yes my positive self-help borders on overconfidence, lemme be) haha", "mood": "good", "energy": "tired", "focus": null, "meds": ["Ritalin", "Ritalin", "Ritalin"], "feelings": ["exhausted"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I tried ritalin for a bit and i", "gold": ["mood", "energy"], "jmood": "partial", "jenergy": "correct", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "energy=tired/exhausted right ('of course it's exhausting'), Ritalin right; mood=good partial — dominant tone is distress, only ends on defiant self-talk."}, {"id": "8e880306", "text": "Organization is one of the things I hyperfocus on. I have just spent countless hours in the last three days making color-coded spreadsheets for how my day and week should progress, from the pomodoros down to 15-minute intervals for cleaning (to stay on top of it and not get overwhelmed) \n\nI've done this for years, and I know it's not going to work, even as I do it. It's one of my tripwires for things spinning wildly out of control. For me, it's perfectionism and escapism and procrastination all rolled into one nasty ball.", "mood": "okay", "energy": null, "focus": "lockedIn", "meds": [], "feelings": [], "activities": ["Chores", "Work"], "sleepHours": null, "sideEffect": false, "title": "Organization is one of the things I hyperfocus", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "focus=lockedIn correct (hyperfocus on spreadsheets), but mood=okay false_positive — text conveys distress ('spinning wildly out of control', 'nasty ball')."}, {"id": "e96f4573", "text": "I'm 51 and just diagnosed a few weeks ago. I went to a therapist because I thought I had OCD and was really flaking out. I wasn't sure if it was because of the massively stressful and depressing year I had just gotten out of, but I knew something had to change. I got tested after a few months of therapy and started adderall a few weeks ago. My current batch of symptoms became way more evident in adulthood, I think exacerbated by stress, anxiety, and menopause brain. \n\nSame with me about school: very good student, not unruly, high achiever, college grad, good career and made good money before kids. But always on the move. Always working. Always chasing some creative stimulation. Now it's like 10 different voices in my head yelling out competing ideas and thoughts about how I should do things, what I should do, who will be pissed if I do X, who will be impacted if I do Y, and what if Z hap", "mood": "good", "energy": "tired", "focus": null, "meds": ["Adderall", "Adderall"], "feelings": ["exhausted"], "activities": ["Driving", "Eating", "Errands", "Work"], "sleepHours": null, "sideEffect": false, "title": "I wasn't sure if it was because of", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "missed", "jmeds": "correct", "overall": "poor", "note": "mood=good and energy=tired both wrong: text is overwhelm/'madness'/'always on the move' (not tired, not good); impaired focus ('competing thoughts', 'paralyzed') missed."}, {"id": "3e46e324", "text": "The “overwhelmed” feeling is something I couldn’t articulate until after I was diagnosed. It’s been there my whole life. I’m convinced the eating disorder i had growing up stemmed from exactly that— I felt overwhelmed and that everything was out of control, so taking control of my food and appearance put me at ease. Low self esteem played a part, too, obviously. I had a pretty great life and family so everyone (even the therapist my parents made me see) was confused about where it was coming from. After I was diagnosed I just randomly went “ohhhhhhhhh that makes sense now...” every day for like a month ������", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": ["overwhelmed"], "activities": ["Eating"], "sleepHours": null, "sideEffect": false, "title": "The “overwhelmed” feeling is something I couldn’t articulate", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=great false_positive: 'pretty great life' describes circumstances; emotional content is overwhelm + eating disorder + low self-esteem. feelings=overwhelmed is the only right read."}, {"id": "a3d37582", "text": "Some foods can affect your medication, that’s why they say you have to take it on an “empty” stomach. Milk, for instance, reduces the effectiveness of some medication.\n\nMethylphenidate usually works for 3-4 hours and after that you can experience what’s called “rebound”. The sudden drop in dopamine can make you feel worse than when you took it. That is why I was told to take one pill (10 mg) every 4 hours or so and not postpone it for an hour because I’m in a meeting or someting. These days I take Concerta which lasts a lot longer (36 mg which lasts me about 9 hours).", "mood": null, "energy": null, "focus": null, "meds": ["methylphenidate", "Concerta"], "feelings": [], "activities": ["Work"], "sleepHours": 9, "sideEffect": true, "title": "Methylphenidate usually works for 3-4 hours and after", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "Pure pharmacology info; null mood/energy/focus correct, meds right. But sleepHours=9 is a misread (9h is Concerta duration, not sleep)."}, {"id": "060d6d78", "text": "Same here. My job right now is very lenient about when I show up but that's probably actually not a perk because it's tempting to give it another half hour and another and another. But even when I had to be there on time, I was almost never late because I was scared out of my mind of being late.\n\nAnywhere that I have strict rules to follow I can function because I'm afraid of the consequences. Same if other people depend on what I do.\n\nBasically I'm constantly stressing myself out and I crash at the first opportunity.", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": true, "title": "But even when I had to be there", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=low right ('constantly stressing myself out'); 'I crash at the first opportunity' is an energy-crash signal that was missed."}, {"id": "4e1646b6", "text": "Yup! \n\nMy deductible I found out today is $1000 and they only pay 80% afterwards... bastards indeed ! (jealous of your $400 deductible :) )\n\nI like the UX designer role, I'm actually angling right now for a developer job in a creative ad agency where I would be working with designers like you to basically get the layout assets and make the website.\n\nIn addition to being by the kitchen/printer, I am currently listening to a very pregnant woman who happens to be indian (vivid imagery purposes) who eats on the hour every hour, but does not seem to have the manners to eat with her mouth closed (think very disgusting slurping noises, 100% sure I have [Misophonia](http://en.wikipedia.org/wiki/Misophonia)) ... /endrant , but seriously I loathe having a desk where my back isn't against a wall, so I am always using some form of mental energy to assess what is going on around me. I guess I don't w", "mood": null, "energy": "tired", "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "In addition to being by the kitchen/printer", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Both wrong: 'tired of trying to fight to focus' is idiomatic fed-up + he uses constant mental energy (not physically tired); he struggles to focus, so focus=sharp is inverted."}, {"id": "01c51bd9", "text": "Next time you have this surge of RSD tell yourself that these feelings are normal. Everybody has them, its an old warningsystem that your lizard brain inherited from ancestors who were naturally selected because of it.\n\nThen realise what you dont have: a fully working prefrontal cortex that would be able to act as a container to reign in these emotions automatically, so instead you become overflown by the warning message. It causes a flood of conflicting emotions which create their own reality. The possibility of rejection becomes so real, and the consequences seems so overwhelming, but they are not. Its just your prefrontal cortex that acts too slow to absorb or rationalize this ancient reflex.\n\nWould you stop swimming if a pool had a sign that warned you of the risk of drowning when you acted irresponsibly? Probably not cause you know the risks and how to avoid them. And most of all, y", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "Next time you have this surge of RSD", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — educational RSD/lizard-brain advice with no first-person current mood/energy/focus; correctly nulled."}, {"id": "c0fd58df", "text": "Yeah, I've had to deal with the \"wasted time\" thing after finally getting treatment for another chronic disease. Will still have to process it.\n\nHow do you feel the treatment has affected you?\n\nI guess in a very blunt way; do you feel like you?\n\nMy impression based on reading about the drugs is it makes it easier to do the things you want, rather than change the things you want. Also seems to have limited side effects and can be stopped with no lasting changes. So maybe it's not that risky to try.\n\nI think I have the feeling that I've just found a balance in my situation and making a change might push it off. Probably just my anxiety talking.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Yeah, I've had to deal with", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Reflective questions about treatment; faint 'just my anxiety talking' aside is too weak to require a mood. Nulls acceptable."}, {"id": "c2a98864", "text": "I don't think you'll have to worry about offending Aspies by describing them as very obviously different -- I think being very obviously different is the condition's essence, and I think we're a group that's harder to offend on average :)\n\n(I'm also realizing I didn't explicitly state that I had Asperger's the post. Without further ado, I have Asperger's. Hi!)\n\nFeeling out-of-proportion upset when routines are disrupted definitely sounds like Asperger's. However, I think your comment overall reveals my dilemma: it's hard to tell where one condition ends and the other begins. I think each must have distinguishing traits -- obsessions and social blindness in Asperger's and ... well, I'm not as familiar with ADHD so I'm not sure which to pick, but I'm sure there are good ones -- but it becomes especially muddy when it comes to executive dysfunction (e.g., regulating emotions and emotional e", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I don't think you'll have to worry about", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — friendly Asperger's-vs-ADHD discussion, no personal mood/energy/focus state; correctly nulled."}, {"id": "edd41885", "text": "agree with below comment about how physical stuff helps mental stuff! if you have ADHD, spacey feeling most likely is from that. However, if this \"spaciness\" is impairing you to the point where you can't fully form sentences and can't effectively carry out simple tasks, definitely talk to your doctor. If you're on meds, maybe need to up it!\n\nIf you're already receiving treatment, then after getting into proper sleep, hydration, nutrition, you can look at concentration, focusing, grounding, etc exercises. \nLike meditation...I had been really into it, and now I really want to get back on the wagon. Try it out! There are online lessons, youtube videos, and more on meditation. Totally trying to convert you :)\n\nHere's a cool infographic-y video about meditation!\nhttps://www.youtube.com/watch?v=t4tS6YJdqVQ\n\nGood luck, and hope you get to clear the fog!", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Screen Time"], "sleepHours": null, "sideEffect": false, "title": "If you're already receiving treatment", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus=sharp inverted: text is about a 'spacey feeling'/'clear the fog' (impaired focus) and is advice directed at the reader, not the writer."}, {"id": "61d83c59", "text": "I’m sorry to hear what you’re going through but I definitely can sympathize with you. Unfortunately, my mom was the same exact way. I was diagnosed and told to be put on Ritalin when I was 7 or 8 and my mom refused because she does not believe in ADHD, and thinks doctors only prescribe it to her kids hooked or whatever.\n\nIn high school I had a best friend who also had ADHD and we were literally the same person with the same struggles. Prior to this I had no idea I was diagnosed when I was younger, so I went to my mom and told her that I think I have it and she told me that I was but also that ADHD “isn’t real”. \n\nNow that I’m 20 and can make decisions about my medical health I have chosen to start medication and it has the best thing I’ve ever done. My advice is to just wait it out like I did, you’re almost at the age to make your own decisions. It will be hard and i’m sure you’re just a", "mood": "great", "energy": null, "focus": null, "meds": ["Ritalin"], "feelings": ["frustrated"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I was diagnosed and told to be put", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "mood=great defensible ('best thing I've ever done', 'medication has been great'), Ritalin right; feelings=frustrated points at the reader but mood read holds."}, {"id": "4c27bac5", "text": "I always see these relationship posts and my advice is to not plan everything around their ADHD, just be a good partner and be understanding. Theatre and comedy are loved by some people with ADHD it’s more of a personal thing and he might just not like it so it’s easier to play it off as ADHD or maybe he genuinely doesn’t wanna sit through it all, for me it’s both lol\n\nAnything thoughtful will do for me, if I’m in a relationship I want my girlfriend to be happy and for us to equally enjoy things I don’t want her constantly serving my ADHD desires and not enjoying herself because if she did that we’d never leave the house and I’d just wanna cuddle all day watching TV. All I appreciate is them planning stuff because I tend to never think about planning stuff in advance so when they have a date whatever it is I’m stoked\n\nPersonally I love going to new restaurants, going to new places, somew", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": ["loved"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Theatre and comedy are loved by some people", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=great right (enthusiastic: 'I'm stoked', 'I love going to new places'); feelings=loved is a misread ('loved by some people' = theatre, not the writer), but that axis isn't judged here."}, {"id": "7a76f667", "text": "Is the increased anxiety worth the increased focus. I'm only recently diagnosed but my personal focus has been on improving my quality of life. Like you, I'm on Vyvanse (70mg) and whilst it certainly makes me much more anxious (I've been through a few job interviews lately, was waaay better at them before the medication purely because of the increased anxiety) the positives make it worth it. I guess my two cents is your medication won't fix your ADHD, you just have to decide what exactly you want from it.", "mood": "low", "energy": null, "focus": "sharp", "meds": ["Vyvanse"], "feelings": ["anxious"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "Is the increased anxiety worth the increased focus", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "focus=sharp right ('increased focus'), Vyvanse + anxious right; mood=low partial — he's ambivalent and concludes 'the positives make it worth it', not clearly low."}, {"id": "ff0a3dc6", "text": "To be honest, the way I could focus on vyvanse, I've never been able to do that before. But it's not strong enough, and too finicky. Dex calms and slows me down. So right now, a combo of them, but at what dose, still trying to work it out. \n\nit took that whole ritalin experience and me to realise just how bad my ADHD really is. \nDex on its own just made me tired. I think I metabolize meds really quickly, or incorrectly.\nAccording to my GP some people need both a long-acting and short acting formulation. They shrink I'm seeing now is an ADHD specialist, and I was horrified at the amounts she was talking about. But I may need them sooner rather than later. Still want to drag it out as long as I can tho..", "mood": null, "energy": "tired", "focus": "sharp", "meds": ["Vyvanse", "dex", "Ritalin", "dex"], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "To be honest", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "correct", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "energy=tired ('Dex made me tired') and focus=sharp ('the way I could focus on vyvanse') both explicit; Vyvanse/dex/Ritalin all captured. Strong record."}, {"id": "b5a5b6bf", "text": "Not so good! I've been having a lot of anxiety/depression issues in the last two months or so and getting myself to do anything that isn't my job or the absolute bare minimum to take care of myself has been a lot of trouble. If I just focus on doing my job/the bare minimum it's okay-ish but if I try to add in anything else it seems to just be a recipe for a ton of guilt and anxiety and not getting much of anything done. I'm hoping to see a doctor and start trying to get meds sorted out again soon but it might not happen til the new year at this rate :/", "mood": "okay", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "If I just focus on doing my job/the", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Both inverted: text is 'not so good'/anxiety+depression so mood=okay overshoots; he can't get anything done, so focus=sharp is wrong ('okay-ish' was only bare-minimum function)."}, {"id": "31ce9a7a", "text": "I too feel your struggle I am constantly losing things or I have something like my phone and do something and put it down and just walk away. I can't tell you how many times my hubby says here don't forget your phone. I am constantly looking for my glasses. I try to keep certain things in containers for my life but I still lose stuff. It's the nature of this beast distractions especially for me. Happens more once medication wears off. I acctually know when it does because I can't keep up with my crocheting patterns. Mistakes are made and then my OCD kicks in and half to fix it. But I  deal your not alone. As I age it's getting worse also.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Outdoors"], "sleepHours": null, "sideEffect": false, "title": "I can't tell you how many times my", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "focus missed: clear distractibility ('constantly losing things', 'can't keep up with patterns once meds wear off') should yield scattered/foggy, extractor returned none."}, {"id": "cdfd10be", "text": "^^  This! \n\nI've always been pretty good at math, but plagued with careless mistakes and inconsistent ability to use/remember the things I know. I've also suspected dyscalculia sometimes, but these things are also adhd-symptoms. If anything, it's the frustration that is the most impairing aspect of it, because it just takes so much energy to continue. It is hard work, and a lot of work. \n\nSimilar to /calmingSandiego, I found my inspiration through other sources like engineering, and programming. Having a motivation and context can really help, and paradoxically I found more difficult math easier because you can understand the formulas instead of just memorizing them. Adhd means having a very limited working memory, so being able to associate a and b, instead of having to remember \"a b\" as one chunk is very useful. \n\nOne example is geometry. Memorizing each rule for each shape in each dim", "mood": "great", "energy": "charged", "focus": "sharp", "meds": [], "feelings": ["frustrated"], "activities": ["Screen Time", "Work"], "sleepHours": null, "sideEffect": false, "title": "I've always been pretty good at math", "gold": ["mood", "energy", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "partial", "jmeds": "na", "overall": "poor", "note": "mood=great unsupported ('great' modifies the teacher) and energy=charged inverted ('takes so much energy to continue' = drained); focus=sharp partial via med-aided study. Only feelings=frustrated is right."}, {"id": "6457a4a8", "text": "I said a lot. \n\nI said if I had a friend who didn't know their car wasn't running good, I would tell them. I would tell them about this really simple thing they can put in their gas tank that would make their car run better. \n\nI explained how I had all of the signs. You couldn't miss them. To think that so many people probably knew, but didn't say anything. All of the struggles, and failures I had in my life. Things could have been very different if just one person had said something. I look back on the last 40 years of my life, and I can't help but feel sadness, and frustration. My life would have been very different.\n\nI asked my doctor if she ever suspected adhd in someone, that she should strongly encourage them to get diagnosed, and try medication. \n\nIt still hurts thinking about my past. I don't know if that's ever going to go away.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "I said if I had a friend who", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good inverted: text is explicitly sad ('I feel sadness, and frustration', 'It still hurts thinking about my past'); car/fuel line is a meds metaphor, not positive mood."}, {"id": "84370eaf", "text": "I tend to experience the same effect where once I get started I can somewhat easily complete things- the only issue is that my emotions are so raw and my anxiety is through the roof before, during and after the task. My brain does not want to be doing this task - does not even want to be here, I hate myself because I feel like I haven’t made meaningful progress in years and then I start to remember all the other stuff I should also get started on but theres so much mental processing power and so many uncertainties to deal with. Ugh, I just shutdown after completing that one task and I’m not able to build momentum.", "mood": null, "energy": "sluggish", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Ugh", "gold": ["mood"], "jmood": "missed", "jenergy": "correct", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Raw emotions/self-hatred/anxiety = clear low mood, returned null; energy 'sluggish' (shutdown) is right."}, {"id": "20040aa1", "text": "Oh good! Did you get a copy of the results from your doctor though? Doctors can vary in their opinion on what sub-optimal levels are, so you may find it useful to have your results and do some research to see if others consider any of your levels sub-optimal.\n\nWhat about hormones, ever had those checked?\n\nP.S. -- I'd check back up on your iron levels; we don't absorb very much from iron tablets, so your iron might not be rising much. Using a high dose iron pill (mine are 65mg) and taking it with vitamin C to help absorption will help your levels rise faster.\n\nIron is also a good example of something doctors don't universally agree on. A few months ago I got some blood tests and my iron ferritin was 35, which my doctor said was perfectly healthy. However, when I recently went to a sleep doctor, I mentioned I had issues with restless legs and she asked me what my iron levels, specifically ", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["restless"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Did you get a copy of the results", "gold": ["energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Clean — 'restless' here is restless-leg-syndrome advice, not energy; correctly left all levels null."}, {"id": "3b2a621e", "text": "Well, the first thing you’ll need to understand is the difference between an Emotional Support Animal (ESA) and a Service Dog (SD).  The ESA (can be any animal) is kinda like the pet most of us had as kids (I had a cat, myself).  It’s that friend that will love you no matter what, is always there happily waiting for you at home (and so glad to see you) when you’re having a bad day, etc.  They don’t really “do” anything, they are just there as your friend, confidant, and well, support.\n\nAn SD is actually trained tasks (actions to take) in response to some part of a disability (the most famous examples are probably leading a blind person, or alerting a diabetic to a blood sugar change).  These are the dogs (can only be a dog or mini horse) that are heavily trained.  Because of this training they get public access (ESAs do not) with their handlers (the handler gets public access with the SD", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "It’s that friend that will love you no", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Asserted mood 'great' on a purely informational ESA-vs-service-dog explainer with no first-person affect."}, {"id": "3382de9f", "text": "Ay fellow IBer! Honestly the IB and ADHD are a bad combo, it was hell but I still got through it with decent grades, so it is possible. \n\nI can only offer my own experiences obviously, but personally my tried and tested method for getting through all the boring crappy work was staying up really late doing everything except what I was supposed to until I was too tired and sad to hold it off any longer. I don't recommend. BUT! I was undiagnosed at the time, so no accomodations were put in place for me, except for extra time. If your school offers any accomodations, take them!\n\nI second studying in groups too, that was the only thing that got me through Maths. It's to do with the 'body double' concept that's been floating around lately. So much of my procrastination of 'boring' tasks came from anxiety about not knowing something or not having decided something that was needed in order to co", "mood": "low", "energy": "tired", "focus": "sharp", "meds": [], "feelings": ["sad"], "activities": ["Hobbies", "Resting", "Screen Time", "Work"], "sleepHours": null, "sideEffect": false, "title": "The IB and ADHD are a bad combo", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "correct", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "mood low / energy tired right, but focus 'sharp' is wrong — writer describes procrastination, not sharp focus."}, {"id": "17855213", "text": "I’m exactly the same way - jack of all trades, master of none. The only things I have ever really stuck with long enough to get really good at are coding and psychology, and in both cases, it was largely because I had an external structure that required I keep going even when my heart wasn’t in it (ie a job and regular appointments with therapists and counsellors).\n\nOne thing I have noticed from coding though is that often what I initially label as a loss of interest is actually a solvable problem once I dig into it. So like, I might lose interest in learning a new coding language, but I’ve been through it enough times now to know that what is actually happening is I’m feeling discouraged by a lack of visible progress. So I set really tiny goals that can be quick wins to make me interested in it again. Or sometimes my loss of interest can be hiding a sense of overwhelm at how huge the th", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["discouraged"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "The only things I have ever really stuck", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'Discouraged by lack of progress' is a clear low-mood signal captured as a feeling but no mood level set."}, {"id": "364bee6e", "text": "I talk so much. As a kid, my dad nicknamed me Princess Talk-a-lot. I recently learned that this is part of ADHD. Feeling compelled to talk. So many times if I have a thought or idea, I feel compelled to share it. And it nags at me constantly if I don't. Then it turns out the thought I shared is usually one that no one else cares about, so I feel dumb for having brought it up.\n\nDepression and anxiety can be very much linked to ADHD, and I think caused by struggles with it. \n\nGo get tested.", "mood": null, "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "And it nags at me constantly if I", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus 'present' unsupported (compulsive talking, not grounded focus); 'feel dumb' low-mood missed."}, {"id": "55759e18", "text": "*For me*, on ritalin, which can have a totally different class of side effects:\n\nUnder dosage: *Slightly* less distractable, but still hyper and ADHD and also *much better able to notice my symptoms*. I'm sick today and my meds are less effective and they are doing something, but GODS my ADHD is winning and I keep bouncing all over the place and getting distracted and feel like they are doing nothing. Then they wear off and I realise that they were actually doing a lot, because I'm nonfunctional without them. \n\nCorrect dosage: Feel normal, don't really get bored, am calm and settled, have trouble realising I need to stop doing things or make decisions because nothing fixes that, but otherwise fine. Also thirstier because stimulants = dehydrating.\n\nOverdosage: BRAIN IS SUPER CONTENT and fixates on whatever is infront of it, like hyperfocus basically, because everything is rewarding right ", "mood": "good", "energy": null, "focus": "foggy", "meds": ["Ritalin"], "feelings": ["settled", "content"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "*For me*", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "mood 'good' (calm/content) and Ritalin right, but focus 'foggy' contradicts text describing hyperfocus/less-distractible."}, {"id": "be1500bb", "text": "Thank you very much for the support and for the suggestions. I, too, find that once the momentum starts, it can actually feel good. But the dread of looking at it at the beginning feels so much bigger. That's where the simple-categories approach seems to really be a breakthrough for my way of thinking. I don't have to try to figure out a whole organization system as I go. That's what I used to do. And that's why I never did it.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "'It can feel good' + 'breakthrough' supports mood 'good'; rest correctly null. Clean."}, {"id": "ec991a99", "text": "In my case it's unlikely, I've been this way for a while. I can't remember enough of my teenage years to know if I was this forgetful before then, but in my adult years I was forgetful enough that it turned into full blown OCD over my anxiety of forgetting something, I became quite obsessive with needing to check the clock so many times or check and double check and triple check that I set the wake up alarm the correct way. Eventually the OCD was treated with SSRIs and that part was helped, but the distracted parts didn't really. But it was just my normal, I didn't realize just how much it was an issue until I started meds and realized that I wasn't nearly as forgetful. But then the meds became my new normal. And yesterday was my first day without meds in months, and the difference was pretty big, it might be coincidence, I could have just been slated to have a bad day no matter what I d", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Eventually the OCD was treated with SSRIs and", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus 'distracted' matches 'the distracted parts'; clinical recount has no clear mood, null correct."}, {"id": "d1acd743", "text": "&gt;and he is often dismissive or very reactive to it if I do not agree with his point of view\n\nI have been guilty of this in the past (before I had heard of adult ADHD). Supposedly it's a combination of impatience (because we think we already know the answer and think we can jump to the resolution), emotional overreaction, and a failure to pay attention to the other's body language and other cues. \n\nJust knowing these things has helped me moderate myself in (calmer) discussions and negotiations.", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": ["guilty"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I have been guilty of this in the", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy 'steady' fabricated (no energy cue); 'guilty' self-critical mood left unleveled."}, {"id": "bc9ae320", "text": "Count me in. Lately I apologize but then still talk over them.\n\nIt gets me anxious listening to something I already know where is going and when I have a feedback to it or an idea I have to interrupt and say it right away or I'll completely forget what I was thinking and I'll be spacing out on them.\n\nLol I'm a fucking mess\nMy adderall do not fix it either.\n\nThen again my adderalls have never changed anything.", "mood": "low", "energy": null, "focus": "distracted", "meds": ["Adderall", "Adderall"], "feelings": ["anxious"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "It gets me anxious listening to something I", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "mood low, focus distracted ('spacing out'), Adderall all correct — though Adderall duplicated in meds[]."}, {"id": "9ceac551", "text": "I absolutely love vyvanse. I tried concerta, Ritalin and adderall before this. I like adderall as well, but vyvanse is so much smoother and I feel great on it. I still use 10mg of adderall as a booster occasionally, as suggested by my doctor. \n\nMy mom has hypothyroidism as well as ADHD, and she takes vyvanse too. She's never had a problem with drug interactions.\n\nI truly think vyvanse is the freakin best. Once you start taking it for a few weeks, you honestly don't even know when it really kicks in or wears off anymore, which is absolutely amazing. No other med I've tried is like that. I can definitely feel the vyvanse start to work, but it builds slowly over like 1.5 hours for me, so I don't really notice. It works for me for about 6 hours really well, and maybe 2 or 3 after that if I work out midday. It wears off slowly, and does not cause me to have headaches or feel abnormally tired ", "mood": "great", "energy": "steady", "focus": null, "meds": ["Vyvanse", "Concerta", "Ritalin", "Adderall", "Adderall", "Vyvanse", "Adderall", "Vyvanse", "Vyvanse", "Vyvanse"], "feelings": [], "activities": ["Work"], "sleepHours": 6, "sideEffect": false, "title": "I tried concerta", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "partial", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "mood 'great' (loves vyvanse) right; energy 'steady' over-read; meds present but massively duplicated (Vyvanse x5)."}, {"id": "8b3765f2", "text": "I have been there. The key for me was to complete two actions everyday no matter how silly or fake or dumb they felt (trust me, they probably will!). \n\n1) Find something (anything!!) for which you are thankful. Even if doesn't feel worth it. Even if it doesn't feel like you mean it. Even if you don't mean one fucking bit of it. It doesn't matter: just say you are thankful. Do it everyday. It could be the fact that you weren't such a dick to someone when you could have been, or that you were because they really did deserve it, or that you helped someone, or that you got yourself out of bed before 1:30pm, or that you did everything you needed to do an more, or that there is water, or that there is light. Again, it doesn't matter. Put a note somewhere where you will see it that either reminds you to say something or just has the words written that you need to repeat. Repeat is as often as y", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": ["bored"], "activities": ["Screen Time", "Work"], "sleepHours": 5, "sideEffect": false, "title": "Even if it doesn't feel like you mean", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Both mood 'good' and focus 'sharp' read from 2nd-person gratitude/focus advice, not the writer's own state."}, {"id": "4fce5e34", "text": "Do you like music? Easiest way to get moving is stick on some loud music and dance in your room or go for a fast walk.\n\nI love running because it's time when I can blast my favourite music as loud as I want in my headphones and that just gets me moving!\n\nHave you got a friend or someone who can partner with you? You're less likely to bail if theres someone else doing it with you.\n\nAlso in terms of it being fun - the thing is, I don't really find running fun. It's really fucking hard and there are some days I end up walking a lot because I'm too tired to run.\n\nYou just have to trust it will make you feel better. Because it really will. Those endorphins are so nice when you finish your run, and really addictive!\n\nCan you gamify it? There are some running apps where it's like a zombie apocalypse and you're running away from the zombies. I've never done one but a friend of mine started runni", "mood": "flat", "energy": "tired", "focus": null, "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": true, "title": "You're less likely to bail if theres someone", "gold": ["energy"], "jmood": "false_positive", "jenergy": "partial", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood 'flat' unsupported (writer is encouraging/upbeat); energy 'tired' only weakly/occasionally supported."}, {"id": "0c436283", "text": "Thanks for the advice.  I’m not sure why it came off that I am short with him or pick on him.  Do I get frustrated? Yes.  Do I take it out on him?  Never!  I’m extremely patient and actually have worked with children in a professional setting before.  Every time I tell him something I’m forced to repeat, I try to tell him like it’s the first time. A gentle reminder.\n\nOne thing that has become clear is that when I tell him something he should already know, he always says “I know!” in frustration and I think what he’s trying to say is he knows, but he can’t use what he knows in the moment.  \n\nRecently I’ve taught and been playing him chess to try and hone some focus skills.  He’s caught on to it really fast and when I teach him WHY certain moves are good, he ends up using the move later for it’s intended purpose.  So I know he get’s it.  \n\nI just want to absorb as much info on being the be", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": ["frustrated"], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Do I get frustrated?", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus 'sharp' is the child's chess focus, not writer's; mood 'low' over-reads mild frustration in an otherwise positive post."}, {"id": "05a868d2", "text": "That makes me pretty outraged. Just like you said, those are the *exact* type of conditions that I do the best in. Of course I was focusing, they were new and interesting puzzles! I love puzzles!\n\nI just read online that the 'hit the space bar when you see the X' tests track your movement with the camera... Are you kidding me? Just because I'm sitting still doesn't mean my brain is. I'm so annoyed. Ugh. Thank you for your response.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Of course I was focusing", "gold": ["focus"], "jmood": "missed", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus 'sharp' right ('Of course I was focusing... I love puzzles'); but 'outraged/annoyed' negative mood missed."}, {"id": "88ad60f3", "text": "So I’m very sensitive to Adderall. Like I start having heart issues and the whole 9.\n\nRitalin works great for me.\n\nBoth are stimulants though.\n\nTry different medications. There are also non-stimulant ADHD medications that work for some people. No joke I tried about 5 different types before Ritalin was discussed. \n\nOne thing to pay attention to. Some ADHD medications can zombie you out. I remember one of them made me feel like I was just sitting in the back of my head, watching everything happen. It also killed any ups and down in my mood; Great for downs, horrible for ups.\n\nThen they started me on anti-depressants to counter act this.\n\nEventually the Dr said they wanted to start me on  an anti-psychotic to prevent other issues between these medications.\n\nThat’s when I said “Nope, we will be doing something else.”", "mood": "flat", "energy": null, "focus": null, "meds": ["Adderall", "Ritalin", "Ritalin"], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "I’m very sensitive to Adderall", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "mood 'flat' nails the zombie/'killed ups and downs' description; Adderall+Ritalin captured (Ritalin dup)."}, {"id": "684a9c30", "text": "Somewhere in between. Went in for anxiety/depression, but knew it was being caused by work related focus problems.  Didn't exactly self-diagnose, but mentioned a couple inattentive symptoms.  Had a long conversation with my doc, we agreed chances were good enough that it was worth trying stimulants before antidepressants because we'd get answers right away.  They solved everything immediately. My doc is convinced, and I'm happy, but I'm still trying to understand what it all means, since I somehow managed 40+ years without anyone even hinting at the possibility....", "mood": "great", "energy": "steady", "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Went in for anxiety/depression", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "false_positive", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "mood 'great'/happy and focus 'sharp' (focus problems 'solved') right; energy 'steady' has no textual support."}, {"id": "e062b054", "text": "This is me. I work nights, and up until about a week ago I could sleep fine. One of those \"Falls asleep before his head hits the pillow\" types. But I had a dream that I lost my family about two weeks ago, and since then?\n\nI'm lucky to have between...I don't know? 2-4, maybe 5 hours of sleep a day.\n\nToday was a day I FINALLY fell asleep just fine, but after 4 hours of sleep, my wife came in the room and disturbed me just enough that I was broken from that sleep.\n\n*Instantly* my mind loaded up four songs, six regrets, a reminder I was supposed to be asleep, some admonishment of not sleeping like I was, and teased me with the *feeling* that I could just roll over and it drift back asleep.\n\nBut nope.\n\nInstead I'm awake, sobbing ugly sobs, my head playing \"Bury a Friend\" while reminding me my alarm is set to go off in two hours and that familiar ball of anxiety is resting happily in my chest.", "mood": "okay", "energy": "alert", "focus": null, "meds": [], "feelings": [], "activities": ["Hobbies", "Resting", "Work"], "sleepHours": 5, "sideEffect": false, "title": "I work nights", "gold": ["mood"], "jmood": "false_positive", "jenergy": "correct", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood 'okay' contradicts acute distress (sobbing, regrets, anxiety) — should be low; energy 'alert' (wired) is fine."}, {"id": "640be13b", "text": "I take generic ritalin as well (15mg morning, 10mg after, 10mg after that). \n\nThe one thing I've found to help most is music.  Another is simple youtube videos or other disengaged media - something where you can sit back and watch.  I make sure not to play games when it's wearing off, because they tend to make me frustrated/feel hopeless (especially when I'm losing - multiplayer doesn't help).  \n\nOne thing you may want to try is drinking coffee/monster with it - for me, it works best to start drinking it before I take my pill (1+1/5 10mg tablets).  Also, if you take more than one pill's worth, try breaking the first one in half or taking a \"smaller\" dose between 30min-1hour before taking the rest, as that can help offset some of the side effects (or, it does for me).", "mood": "low", "energy": null, "focus": "present", "meds": ["Ritalin"], "feelings": ["frustrated"], "activities": ["Resting", "Screen Time"], "sleepHours": null, "sideEffect": true, "title": "I take generic ritalin as well (15mg morning", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "mood low ('frustrated/hopeless') and Ritalin right; focus 'present' unsupported by media/wearing-off advice."}, {"id": "d45c78a0", "text": "Oh, yes! I agree that writers should proof their own completed work before handing it off. I only asked because I previously worked for a newspaper where we all had to correct our own work as there were no staff proofers.\n\nYou don't have to feel guilty about letting this fellow go. You can't keep him on forever like this, after all. If he's causing this much extra work for you and your other staff, it sounds like he's not suited to his current work environment.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I agree that writers should proof their own", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Clean — neutral advice about firing/proofing an employee; correctly returned no levels."}, {"id": "820f3704", "text": "I got diagnosed when I was 33 years old. I had just finished my third year of teaching 9th grade English and my administration basically asked me to resign. I had problems with being late (but not by much time) and plus, I had an administrator who absolutely did not like me and put me on a PIP my second year because I made a mistake and left a movie with some cursing (I didn't know about it) for students to watch the week of EOCs at the end of my first year. I mean, I screwed up really bad and though I apologized and made it right, my head principal, who was a vindictive jerk, really made an example out of me and bullied me. \n\nI had suspected back in college that I had ADHD after taking a class about learning disabilities and gifted children, but I never gave it much thought nor could I do anything about it because I couldn't afford to. Besides, I was working and going to school and I wa", "mood": "okay", "energy": null, "focus": "sharp", "meds": ["Adderall XR"], "feelings": ["overwhelmed"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I had just finished my third year of", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "Adderall XR right; mood 'okay' under-reads overwhelm/devastation; focus 'sharp' unsupported (post is about overwhelm)."}, {"id": "a480cba8", "text": "This \"Doctor\" seems to do just about everything wrong. I don't really have any clue on how the us-system works in this case. But you should have the right to switch to another doctor in the same practice or whatever? If i am using the right sentance?   \n\n\nEaither way, i am not sure how to put out into text what i mean. Cuz i am onto my \"stimulants\" right now but still can't concentrate. So, how that for an advantage i guess?", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I don't really have any clue on how", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus 'distracted' matches 'on stimulants but still can't concentrate'; generic 'stimulants' (unnamed) correctly not in meds."}, {"id": "9b543ab0", "text": "For me I'm a tad more irritable medicated but mostly I find I'm much more aware of when I need time to myself and can better plan accordingly. \n\nBefore meds I had heaps of time to myself because the world was just too damn much and the instant and controllable stimulation from the Internet meant that HUGE chunks of my time were just alone on my computer. \n\nNow it's like I have the space in my brain to identify 'I'm really irritable/tired/overwhelmed, I'd like some time to myself' and then instead of just withdrawing and feeling resentful of anything that disturbs me I can communicate to my partner to leave me alone for a bit and turn off my phone notifications.", "mood": "low", "energy": "tired", "focus": null, "meds": [], "feelings": ["overwhelmed"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "Now it's like I have the space in", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "correct", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood low + energy tired both match 'irritable/tired/overwhelmed'; 'medicated' unnamed so empty meds is fine."}, {"id": "3bd29615", "text": "I was overdosed once. Like WAAAAAY overdosed. I felt sooooo calm and soooooo good.\n\nOff meds I have been described as manic though.\n\nHell I even stumbled across a couple case studies claiming to have treated psychosis only with stimulants, which should not be possible. It was hypothesized that the two subjects in question were so hyperactive it literally caused a break with reality.\n\nthere's no conclusive black-and-white \"always or never\" about stimulants.\n\nWhich is why I said \"most people with ADHD.\"\n\nI've heard some people get more focused and more anxious at the same time, which is baffling to me tbh. But I respect the reality people have described...", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": ["anxious"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I felt sooooo calm and soooooo good", "gold": ["mood", "energy", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Abstract third-person discussion (others' calm/focus/anxiety); mood=low and focus=sharp both fabricated from non-self content."}, {"id": "7896090e", "text": "If you are taking the wrong dose, it can totally mess with you.  Also, if your \"silly and funny\" is a coping technique for intense social anxiety stemming from ADHD, like the stereotypical class clown, when that's gone, you might not want to be like that anymore.  People who liked you as the class clown might not be good friends anymore, but others will.  You may get along with a different sort of people.\n\nI think I still have my sense of humor medicated, but I don't always feel the need to share it with everyone!!!!!!", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I think I still have my sense of", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Advice post with only faint 'sense of humor intact'; nulls are the safe, defensible call — clean."}, {"id": "2a646e66", "text": "I have no credit cards, only my debit card but your point is well taken. I think I will be adding my SO to the account so that any purchases I make will be seen and that in turn will help me not make stupid purchases when I will have to answer for them.\n\nI have in the past attempted to quit gaming. But it does not work. It is my only outlet and my hyper focus target. When I have cut it out (Computer died for over 2 months) I became a miserable wretch to be around because I was going crazy with nothing to do. Our living conditions greatly impact that as well as we do not have TV or anything that can replace the computer games to help relax after work. \n\nNot saying the idea is a bad one in some situations, I just feel that if I can cut out the spending and just play the games, this will help a ton. I do not play games that cost monthly so financially, the act of playing games is not an iss", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "But it does not work", "gold": ["focus"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "mood=low ('miserable wretch') and focus=sharp (gaming 'hyper focus target') both well-supported."}, {"id": "ff7817da", "text": "No I think the sentences are all related. My point is that liberal arts degrees are pretty much worthless these days. My school has big name recognition in many white collar fields but I failed to rub elbows. Every job I've ever had (even in the financial field) didn't require a degree and no one asked about college in any of my interviews; never asked about GPA, clubs, course load, course content, etc. \n\nIt all matters who you know, not what you studied. It's all about politicking.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["content"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Every job I've ever had (even in the", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Pure opinion on degrees/'who you know'; mood=good and feelings=[content] are fabricated — no emotional content."}, {"id": "161bea97", "text": "Congratulations! Honestly, don't let how overwhelmed you are scare you. I know a lot has come together all at once. My advice would be to try not to worry about things that you have messed up or even parts of your life that have been affected in a negative way in a negative way, if you catch my drift. It will weigh heavy on you and you'll miss the point--that you know why. \n\nI was diagnosed when I was 22, so I understand how you feel completely. I have largely underperformed in college. I've mortally wounded relationships, and they were important ones too. I damaged my relationship with my parents, and It's still healing a year later. \n\nThat being said, diagnosis is a gift, regardless of what age you are. You will honestly not believe the difference that medication can make. The first time I took adderall, it was like 22 year long fog had been lifted from my brain. I could think clearly,", "mood": "good", "energy": null, "focus": "sharp", "meds": ["Adderall"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Congratulations! Honestly, don't let how overwhelmed", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "focus=sharp ('fog lifted, think clearly') and meds=[Adderall] correct; mood=good is mostly recounted past relief/advice, weakly personal."}, {"id": "f7af7b15", "text": "This is me right now.  I was diagnosed in October, but the first chance I have to see my doctor is early December. The receptionist asked the purpose of the meeting, and all I said was \"I went to see a therapist and they've prescribed something for me that needs her signature.\"  I'm relatively new to this doctor, and I'm nervous because when I met her the first time, I said I was anxious; it happened to be around the time I was a few months into a new job that was causing me stress and my ADHD was kicking my ass.  The doctor just said, \"Oh, we're all nervous about new jobs.\"\n\n:\\", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["anxious"], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "I'm relatively new to this doctor", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "'This is me right now', nervous/anxious/stressed → mood=low correct; clean."}, {"id": "435539a2", "text": "I am ADHD PI, my spouse has anxiety, severe allergies, and a bit of either ASD and/or ADHD. We have four kids, all late elementary school/ middle school, and I'm currently trying to figure out which ones have ADHD. As Dr. Barkley said in a lecture, ADHD is the diabetes 1 of the brain and we have better resources, and more of them, that work to treat ADHD than any other brain disorder. We're also in an age where people who work with kids are being educated that all brains work differently and there is no one size fits all education model, special needs services are more accessible, information on different brains and managing them is available to anyone for free on the internet. We still have great social stigmas to overcome but as a parent, I'm feeling pretty well equipped to deal with ADHD in any or all of my kids. I am in a priveleged position of being educated and knowing how to advoc", "mood": "great", "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "As Dr. Barkley said in a lecture", "gold": ["mood"], "jmood": "partial", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'feeling pretty well equipped' is mildly confident, not 'great'; energy=steady is a fabricated FP (no energy content)."}, {"id": "00f38837", "text": "I've sadly considered this option as well. I'm loud, I make jokes constantly, and sometimes I find a fellow loudmouth who can keep up with me but it always feel like I'm getting negative attention that I didn't expect. I figure \"if I met someone like me, I would like them.\" But I don't find many people reacting the same way.\n\nAs of yet, I haven't been able to *not* be myself unless I'm a bit buzzed and can \"feel out a room\" a bit better, otherwise I'm being myself and it seems to be a bit too much for people. Even friends I've had since childhood now seem to have taken the \"depression\" route and part of me thinks that's just the cost of growing up? Part of me thinks everyone kinda hates me. \n\nEither way; this is the first time I've found this sub and I'm really fucking happy to have found all of you", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I'm loud", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Dominant tone is insecurity/sadness ('everyone kinda hates me', depression); mood=great inverts it — 'happy' only refers to finding the sub."}, {"id": "9dd2473b", "text": "#####&amp;#009;\n\n######&amp;#009;\n\n####&amp;#009;\n [**Highly sensitive person**](https://en.wikipedia.org/wiki/Highly%20sensitive%20person): [](#sfw) \n\n---\n\n&gt;A __highly sensitive person__ (__HSP__) is a person having the [innate](https://en.wikipedia.org/wiki/Innate) [trait](https://en.wikipedia.org/wiki/Trait_theory) of high [sensory](https://en.wikipedia.org/wiki/Sensory_perception) processing [sensitivity](https://en.wikipedia.org/wiki/Sensitivity_(human\\)) (or *innate sensitiveness* as [Carl Jung](https://en.wikipedia.org/wiki/Carl_Jung) originally coined it  ). Some common signs are sensitivity to loud noises, bright or fluorescent lights, and strong smells. HSP's often describe themselves as having a rich and complex inner life. They may startle easily and get rattled when required to accomplish a lot in a short time. According to Elaine N. Aron and colleagues as well as other r", "mood": "great", "energy": null, "focus": "present", "meds": ["dex"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Some common signs are sensitivity to loud noises", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "false_positive", "overall": "poor", "note": "Text is a Wikipedia HSP bot definition with zero personal content; mood=great, focus=present, meds=[dex] all hallucinated."}, {"id": "898897fe", "text": "ive tried different ones since high school (adderall, ritilan, biphentin, vyvanse) but they either made me too jumpy or they didn’t last long enough or they messed with my sleeping schedule. vyvanse was the least jumpy for me and it wasn’t as intense as adderall and it lasted longer without having a bad comedown so i stuck with that after trying everything else. \n\nyou might be right though sometimes i do feel like maybe vyvanse is too subtle although i do feel it working. i basically tried all the adhd meds that i heard of and idk much about the others which is prob why i decided to just settle for vyvanse. maybe i should increase my dose if that doesn’t mess with my sleep schedule.", "mood": null, "energy": null, "focus": null, "meds": ["Adderall", "Vyvanse", "Vyvanse", "Adderall", "Vyvanse", "Vyvanse"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Ive tried different ones since high school (adderall", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "partial", "overall": "ok", "note": "meds captured but duplicated 6x and missed ritalin/biphentin; 'jumpy' is side-effect not mood — nulls otherwise fine."}, {"id": "28bc292b", "text": "I wasn't diagnosed until much later in life. When I started my medication (Adderall) I tried it for a few weeks &amp; then asked my family if they noticed any difference. The first feedback I got was that my driving was a lot better. \n\nA lot ADHD meds aren't tolerated well by children, but now that you're an adult it would definitely be worth checking again to see what options are available for you. If you do try a new medication be sure to give it some time to see if it works. For me the first few weeks felt strange but because a friend told me to stick with it for at least a month I was able to adjust to it. Now I hate to drive if I've I haven't had my Adderall. \n\nAnd remember, dying in a car accident is not the solution to your pain. Chances are you won't die but you'll end up in a ton of physical pain, or you'll end up killing someone else. ADHD is exhausting, there's no doubt about ", "mood": "good", "energy": "tired", "focus": "present", "meds": ["Adderall", "Adderall"], "feelings": ["exhausted"], "activities": ["Driving", "Work"], "sleepHours": null, "sideEffect": false, "title": "When I started my medication (Adderall) I tried", "gold": ["energy"], "jmood": "partial", "jenergy": "correct", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "energy=tired ('ADHD is exhausting') and meds=[Adderall] correct; focus=present unsupported; mood=good weak (supportive tone, no personal positive)."}, {"id": "bbbcaad2", "text": "It lasts 12 for me.  Around hour 8 there is a slight fade of my clarity and motivation and energy but still way better than baseline, and it fades out almost entirely somewhere in the 12 to 14 hour range.  Caffiene will layer up and further boost my focus (too much sometimes...) And will have a detrimental effect on my emotional stability (same effect as it did prior to meds) but also seems to increase the rate that I ''burn through'' my medication, making it fade earlier in the day. \n\nI dose first thing in the morning, trying to get in the habit of doing the ''wake up 1 to 1.5 hours early, dose, go back to sleep'' method, which was amazing the few days I did it, otherwise I dose immediately with water and eat a while later.  Avoiding acidic drinks and vitamin C stuff first thing, that may only be for adderall but I figure it can't hurt, I get plenty of full awesome nutrition later in th", "mood": "good", "energy": "steady", "focus": "sharp", "meds": ["Adderall"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I dose first thing in the morning", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "correct", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "focus=sharp (caffeine 'boost my focus'), energy=steady ('better than baseline'), meds correct; mood=good only weakly supported."}, {"id": "371efc10", "text": "(diagnosed well into adulthood) Before meds, I used to exhibit \\*flashes\\* of brilliance and achievement. For instance, solving a physics problem that stumped the whole class. I would say I operated at my peak about 2% of the time. After meds, I'm at my peak almost all the time. I'm surprised and amazed.\n\nThat's probably the effect most relevant to your situation. Good luck!\n\nPS: I don't feel \"wired\" or anything like that. I'm actually way calmer in spite of operating at peak mentally.", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "(diagnosed well into adulthood) Before meds", "gold": ["energy"], "jmood": "missed", "jenergy": "correct", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "energy=steady ('calmer, not wired') correct, but 'at my peak almost all the time' is a clear focus signal that was missed."}, {"id": "ba105b1e", "text": "Hm, I don’t know if this is necessarily the healthiest advice to offer.... While I do believe it’s important for someone to adapt to the communication style that they’re presented with in a relationship, I also don’t think that it is unreasonable to ask for the friend to at least try to be more aware of the emotional needs of the other. \nI myself have a moderate case of ADHD, and while I know that I can be guilty of this behavior at times (being the friend described in the post, I mean), I also do make an active effort to perceive and react to emotional needs that my friends have. I care about them, and they can’t be expected to continually convey those feelings to me - at a certain point it could very well become very tiring for them. Relationships are supposed to be reciprocal, and it’s important that both sides make concerted efforts to support and listen to the other, especially when", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": ["guilty"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Hm", "gold": ["mood"], "jmood": "missed", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=steady fabricated (no energy content); self-critical 'guilty' tone is a mild mood signal extractor left null while still tagging feelings=[guilty]."}, {"id": "b90fd33f", "text": "I'm in a similar position to you! Bear with me as I'm really struggling to write today.\n\nI was diagnosed recently too and I've been on 30mg Elvanse for about three and a half weeks. I'm in my second year of uni and at the moment in the middle of my late summer resits because I did hardly any work throughout the year. I've just done three exams and my last one is tomorrow but I have essays due in on Wednesday as well. If I don't do this work, I don't progress to final year. I'm struggling with the effects of the meds not lasting as long as I’d like but I think there are things you can do to help.\n\nWhat I’ve been doing is:\n\n- Eliminating distractions beforehand and cramming as much work as possible into the time when my meds are working\n\n- When they’re not, trying to just do anything that I can manage—anything at all on my to-do list that I might otherwise waste that meds time on\n\n- Also w", "mood": "low", "energy": "sluggish", "focus": null, "meds": ["Elvanse"], "feelings": [], "activities": ["Eating", "Work"], "sleepHours": null, "sideEffect": false, "title": "I was diagnosed recently too and I've been", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "partial", "jfocus": "missed", "jmeds": "correct", "overall": "ok", "note": "mood=low and meds=[Elvanse] correct; 'really struggling to write today'/meds-not-lasting is a clear focus signal that was missed."}, {"id": "3a2d9cf0", "text": "&gt; It’s not that I was wired but I felt like everything was clear and everything made sense. With ADHD it feels like there’s so many different things that are scrambled in your head and you don’t know where to start and organize it\n\n\nThat makes sense.\n\nBut I think I should have been more clear.  I am in my 30s, I dealt with ADHD without being treated due to my parents at a younger age not wanting me on medication and after that it was just financial burden. I have been on medication for about 6 months now.  \n\nI had to create my own methods to focus, whether it was to drink a ton of coffee daily, exercise, or energy drinks.  I cut back on a lot of caffeine ever since starting ADHD medication.   \n\nI know what it suppose to do or at least what it is suppose to help me do.  My problem is, I don't know what to compare it to.  This isn't just me taking a pill and boom I am done, I still catc", "mood": null, "energy": "steady", "focus": "sharp", "meds": [], "feelings": [], "activities": ["Fitness"], "sleepHours": null, "sideEffect": false, "title": "&gt", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "partial", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=sharp ('everything was clear, made sense') correct; energy=steady only weakly inferable from caffeine/exercise mentions."}, {"id": "27e6f593", "text": "**I do agree with you, it's definitely a catch-22 situation, and I personally don't think medication should be withheld from anyone who stands to benefit from it.**\n\nThat said, I do think there are people who might benefit from medication while living in an unstructured environment, who would otherwise not need it at all when they're in a structured environment. I might be one of those people - I was mostly OK in high school, for example, and I've had jobs where I've been extremely productive because of the way the workflow is structured, despite the fact that I'm forced to sit at a computer and the work is various levels of interesting (i.e. sometimes not at all). I might feel horrible at the end of the day, but I don't need anything stronger than a coffee to get through it. In contrast, when it comes to big goals/projects that require active input from me in terms of planning and struc", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "**I do agree with you", "gold": ["energy"], "jmood": "na", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'I feel horrible at the end of the day' is an energy-depletion signal that was missed (gold=energy); rest defensibly null."}, {"id": "1cd252b0", "text": "Your health comes first. I had some resistance when approaching my parents about it after I flunked my first semester at college. The timing of it all made it seem like I was making excuses, but I knew that the diagnosis fit me. After really pushing my parents to the point where I was willing to pay out of pocket to see a doctor, they relented and made an appointment for me. My mom started doing more research and realized that I was the typical ADHD but I had never been challenged in high school so I never crashed and burned until college where the ADHD became more apparent. They've become much more supportive and try to help me but supplements or healthy food to keep me on the right track. \n\nYou're parents care about you and they just don't seem to understand ADHD very well. I still don't fully understand it after almost 2 years from my diagnosis.  Try to give them some more information", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": ["Eating"], "sleepHours": null, "sideEffect": false, "title": "My mom started doing more research and realized", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Narrative/advice with no current state; energy=steady is a fabricated FP, null mood is correct."}, {"id": "adbcd8c0", "text": "English teacher here. I'm constantly dropping markers, throwing pens, and falling while I'm in class. At least one of these each class. Done it for years. \nI focus well in class until everyone is busy and I don't have someone to pay attention to. Anxiety drives me here where it would destroy me in any other situation. I actually work 8--12 hours a day somehow without dying. Unfortunately I don't eat enough and I'm often late... But I'm a good teacher at least.. Just don't give me a repetitive task.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I focus well in class until everyone is", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "'I focus well in class' → focus=sharp correct; only faint 'good teacher' mood, null is fine."}, {"id": "0eb678e6", "text": "I feel the pushing people away thing hardcore. I pushed a lot of people away in the last few years. \n\nIt’s probably due to the fact that I was pretty depressed for the last few years about being fired from my job back in early 2016. Definitely didn’t help that the reason they fired me wasn’t my fault. \n\nThen I got a job working for DirecTV tech support. That was a mistake and a half. Customers calling in yelling and screaming half the time acting like it’s my immediate fault that their tv isn’t working blah blah blah. Obviously I knew it wasn’t my fault but it was still adding to my depression. One day I hit an all time low (something a customer said) and I just packed up the few things I had in my desk and walked out. Didn’t say a word to anyone. \n\nNow I’m at a new job as an IT Specialist (absolutely loving it too) and I get to help people solve their problems all day and it’s glorious!", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["loved"], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "It’s probably due to the fact that I", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Tense error: depression is explicitly past ('last few years'); current state is 'absolutely loving it'/'glorious' → mood=low inverts the present."}, {"id": "a8d83858", "text": "", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": null, "title": "", "gold": [], "jmood": "false_positive", "jenergy": "missed", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Post is about sleep/fatigue (energy, missed); extractor mis-assigned mood=good + focus=present, both fabricated."}, {"id": "bc33fb0d", "text": "", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": null, "title": "", "gold": [], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Describes severe ADHD / exec function 'in the 20s' (impaired); focus=sharp is the exact opposite of the text."}, {"id": "3b1f0556", "text": "There's that defeated feeling of \"even when I try really hard it's nearly impossible to focus and get anything done, so why bother\" that could be called laziness.\n\nSometimes I feel like I've only got a certain allotment of \"try\" and I use it all up and I've just got nothing left. Is that laziness? I don't know.\n\nI do know that I try to avoid calling myself lazy because it leads to getting angry with myself and then depressed, and that takes me even farther away from being productive.", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": ["defeated", "angry"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "There's that defeated feeling of \"even when I", "gold": ["mood", "energy", "focus"], "jmood": "correct", "jenergy": "missed", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "mood=low (defeated/depressed) correct, but 'nearly impossible to focus' → focus=sharp inverts it; energy depletion ('nothing left') missed."},
