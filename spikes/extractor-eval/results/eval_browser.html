ood", "energy": null, "focus": "present", "meds": [], "feelings": ["sad"], "activities": ["Hanging Out", "Resting", "Work"], "sleepHours": null, "sideEffect": false, "title": "I have ADHD which involves impulse control and", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "text explicitly says 'I was feeling low' yet mood=good (opposite); focus=present unsupported"}, {"id": "97906a8a", "text": "I am not a doctor. \n\nDifferent meds work for different people. There is always an adjustment period, particularly I’ve noticed for the ER medications. Absolutely bring this up to your doctor at your appointment, but he may want you to continue for a couple of weeks to see if the medication levels out in your system. At that point if you’re still having issues, he may change the dosage or try a different medication. My son takes Concerta and we have him take it at the latest possible time before leaving for school to maximize its effectiveness throughout the day. \n\nDo you use caffeine? You may want to monitor your intake while taking stimulant medications to avoid this type of crash. Good luck with finding the right medication/dosage for you!", "mood": null, "energy": null, "focus": null, "meds": ["Concerta"], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "My son takes Concerta and we have him", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "mood/energy correctly null (author advising a parent); Concerta named so meds presence is fine"}, {"id": "f80461da", "text": "Stimulant medication isn’t “motivation in a pill”. I wish it was. If you don’t want to do your homework and take the medication, unless you actually force yourself to do your homework, you’re just going to browse reddit or play video games with more intense focus. \n\nThe idea is once you actually start the homework, you’re much less likely to lose attention and forget what you were doing and walk off. The catch is, you still have to actually start your homework. \n\nI’m less likely to randomly recall “hey, I need to order more lotion off amazon” and load up the app and lose myself browsing sales and impulse buying while doing homework with medication.  If I never start the homework because I just don’t feel like it, well the medication isn’t going to “make me” start it.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "If you don’t want to do your homework", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "focus=sharp largely from general mechanism/2nd-person ('browse reddit with more intense focus')"}, {"id": "d12fde49", "text": "You just said what I wanted to say. Hang in there. I feel the same and I'm stressed bc my work performance is suffering and it doesn't help working with bullies.  I went out yesterday and had a beach day with friends. It felt good to be with supportive friends and being outdoors. I still felt guilty though about being out and about and \"ignoring my responsibilities/tasks\" that I should be doing. Is that normal?\nAnyways, sorry your feeling like that. It helped being around supportive people.", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["guilty"], "activities": ["Hanging Out", "Work"], "sleepHours": null, "sideEffect": false, "title": "I feel the same and I'm stressed bc", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood=low fits 'stressed, work suffering, felt guilty' despite a positive beach-day moment"}, {"id": "082e7ab8", "text": "Hey, no I've never tried Adderall alone. I was diagnosed with ADHD when I was 15 and have been on and off Ritalin my whole life. I'm 33 now. I didn't like Ritalin because the side effects but I have to say I did force myself to take it and it got me through school. I didn't start taking Adderall until a few months ago and I have to say I'm really loving it. I can still feel my emotions, which I couldn't on Ritalin. Anyways, I've been on mitazapine about 4 years now and I love it. I get most my anxiety at night and without medication I just couldn't ever get a good night sleep. I've been on lots of different meds for my anxiety, but that's another long story. I really have concluded with myself that I should be on more than just one psych med.", "mood": null, "energy": null, "focus": null, "meds": ["Adderall", "Ritalin", "Ritalin", "Adderall", "Ritalin"], "feelings": ["loved"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Hey", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "partial", "overall": "ok", "note": "clear positive ('really loving it') but mood=null; meds missed mitazapine/mirtazapine the author names"}, {"id": "e0aede30", "text": "Well sort of. I've found that it's better to try to regulate the energy you expend because once a \"crash\" happens there really isn't much you can do about it. You need to sit it out and it will resolve itself. I've found this to be much more easy to do with medication than without.\n\nMaybe I should have explained it more in detail, but the way I said it still the most true way for me. I wasn't intentionally leaving out details for the sake of laziness or anything, it rather was the most exact way to put it for me. I was aiming for lingual precision, but I realize that it wasn't the best strategy.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I've found that it's better to try to", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good invented from a general discussion of energy regulation and crashes; no author mood"}, {"id": "96bfa6e6", "text": "26, female, just diagnosed about a month ago. I told my grandmother (who raised me) on the phone about the diagnosis and the first thing she said was \"but then how did you get such good grades in school\"? \n\nMy behaviour in elementary school often landed me in the hallway or being held in at recess, I was \"annoying on purpose\" and lacked the self-awareness to realize when I was doing this so I managed to ostracize myself fairly effectively right through to highschool when I replaced the annoying behaviour with becoming very withdrawn and socially anxious. But my grades were always good, so my grandparents decided to ignore the ADHD because they didn't want to medicate me, and figured they would \"fix me\" with discipline. I believe this only ended up with me being the anxious/depressed mess that I am today. \n\nI managed to get a bachelor's degree and graduate on the Dean's list, but since th", "mood": "low", "energy": "steady", "focus": null, "meds": [], "feelings": ["anxious", "withdrawn"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I told my grandmother (who raised me) on", "gold": ["mood"], "jmood": "correct", "jenergy": "false_positive", "jfocus": "na", "jmeds": "missed", "overall": "ok", "note": "mood=low right (anxious/depressed mess); energy=steady unsupported; missed Amantadine named in text"}, {"id": "117e7772", "text": "Wow you must have the same brain I do. I'm glad to see someone who got through what I'm dealing with.  I have close friends even my boyfriend who just can't understand how I feel about it. Lots of times I get the while \"weed is amazing dude why would you want to stop smoking when it helps you so much?\" And it's super hard to explain to a stoner ADHD, anger/anxiety and the shame I feel for smoking almost everyday. I feel like all I am doing is whining. Anyways thank you guys for reading and commenting. It really means so much to me!!!", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "I'm glad to see someone who got through", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "gratitude is real but mood=great ignores explicit shame/anger/anxiety and 'all I am doing is whining'"}, {"id": "90d35318", "text": "I would like to underline your point about the journal. It has been a big game changer for me since it allowed me to identify what works for me on the long term and what doesn't. Also, it gives me the opportunity to reflect on my moods and gives me some distance to overwhelming situations. That beeing said, don't be too hard on yourself if you can't seem to find consistency within the first weeks of journaling. The journal will still be there, even if you skip it one day or another. I usually write two or three sentences about my day and track the following things: my general mood, stress level, workouts, meds, my level of socialising, sleep (quality and length), productivity and if I've done something nice for myself. I would suggest to start tracking the most important point to you and slowly add others as soon as you don't feel overwhelmed. There are some great resources online who co", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "It has been a big game changer for", "gold": ["mood", "energy"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "enthusiasm is about journaling's value ('game changer'), not a stated current mood; great is high"}, {"id": "cf9538b1", "text": "Yea I’ve been experimenting with this lately. It lets me recharge my focus and then I don’t have as much contempt to do work because I feel like I got the entertainment/vegging out I needed and it gets my brain flowing again. I’ve been more productive as a result. Prior to this I used to try and eliminate all fun and distraction until I got my stuff done like most people do, but it was just impossible and I ended up just going all day with no work or fun, and it was miserable and I just sat around self loathing. The only thing you have to be aware of is how much time you have in the day. Luckily for me I actually get bored of video games and whatnot after a while, and I’m just like “eh may as well do my homework now it’s something to do” and that’s my perfect headspace for productivity.", "mood": "low", "energy": null, "focus": "lockedIn", "meds": [], "feelings": ["bored"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "It lets me recharge my focus", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=lockedIn fits 'recharge focus/perfect headspace'; mood=low describes the PAST, not improved present"}, {"id": "bbc0421e", "text": "In the same boat here. I’ve just recently gotten into basically my first long term relationship. It’s been amazing so far but sometimes tough. I have the same sensitivity issues because of the ADHD. I had the same issues for the longest time trying to find some kind of connection with a girl and I just couldnt find it. Life sometimes seems to fly by and everything seems to point to “it’s just a problem with me”. It’s not, I promise. My biggest advice/thing that’s helped me is just taking it day by day. And if day by day becomes too overwhelming take it hour by hour or minute by minute. I’ve found that I get the most sensitive when I get overwhelmed so just find something that works for you that helps slow things down a little bit to where you can not let your thoughts run rampant. Hopefully this helps! Even if it’s just letting you know that we’re all in this together!", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": ["overwhelmed"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "It’s been amazing so far", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "\"amazing so far\" is about the relationship, not the writer's mood; mood=great over-reads an advice post."}, {"id": "2feac22c", "text": "Oh my god thank you for this...I was diagnosed 3 years ago (sophomore year of college) and have been on medication since  but I still experience these work symptoms to a point even when I'm on my medication. ESPECIALLY the \"listening and trying very hard to understand what someone is explaining to you, thinking you get it, and then walking out of the meeting and sitting down at my desk and realizing I still have no fucking clue\". Makes me feel a lot better that I'm not the only one that experiences these \"work\" symptoms and the anxiety that goes with it. \n\nI just completed my first year out of college at an entry level corporate job and unfortunately made quite a few of these mistakes the first 6 months on the job as I had a LOT of new processes to learn.. and I still continue to beat myself up sometimes thinking about those mistakes and what my team members and managers thought of my ab", "mood": "good", "energy": null, "focus": "present", "meds": [], "feelings": [], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "Makes me feel a lot better that I'm", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "mood=good fits the relief; focus=present is unsupported (text recounts past work struggles, no current focus state)."}, {"id": "2f629b7a", "text": "I ended up just getting my GED and my scores on that were high enough to get me into university.  You could consider that, but I respect the fact that you want to actually finish high school. You sound like a diligent worker.  \n\nI feel your frustration on being \"behind\" in life- I am too. but just remember that generations of society before us constructed this idea of what we have to achieve and when we're supposed to have achieved it in order to be \"happy.\" It's going to take me 6 more  years total to graduate university and I'm only a sophomore.  This is because I'm not medicated and I can just barely handle working 32 hours a week on top of the six credits I take. You were given a crap set of cards in terms of mental health, just like me, and now you've figured out what to do with them with your secret weapon, medication. You're doing just fine :)", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I feel your frustration on being \"behind\" in", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mild frustration + net-positive solidarity; mood=okay is a fair read. clean."}, {"id": "d3c1441e", "text": "I have a similar system for myself. When I’m running late in the morning, I thank my ‘future self’ for making my lunch the night before and leaving it out on the side so that I can grab it and go. If I’m feeling productive, I will help out my future self because I know my future self will be appreciative. I am my future self and I thank myself whenever I lend myself a hand for when the future catches up. I am my future self, I never get to see my future self, but I know my future self was there helping and nurturing and caring for me, which is a really positive relationship to have with myself I find. \nI hope that makes sense?", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Eating", "Fitness"], "sleepHours": null, "sideEffect": false, "title": "When I’m running late in the morning", "gold": ["energy"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "positive self-reflection; mood=good correct; energy=null right ('feeling productive' is conditional). clean."}, {"id": "9613121e", "text": "Hey I just wanted to say don't give up. Meds don't agree with everyone, I personally don't take them, but life with ADHD has got better with therapy and implementing the perspective and tips I get into my everyday life. Like lists - they help sooo much with anxiety! I have so much trouble like you with the morning routine and have my bad days, like today where I woke up anxious about the start of the working week and actually threw up. But I put the steps i learnt in therapy in place and I am coping better than I would have in the past. Shopping/cooking/eating/ cleaning is hard but if its on my list in achievable steps along with things like daily exercise and mediatation it has become easier and my BMI is no longer underweight. While not a cure, hopefully therapy will help! If you don't relate to the therapist find someone who you do relate to. Goodluck. I am here if you ever need to ta", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["anxious"], "activities": ["Chores", "Eating", "Fitness"], "sleepHours": null, "sideEffect": true, "title": "Meds don't agree with everyone", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "current state is anxious/'woke up anxious, threw up'; mood=good captures the hopeful framing but misses the salient negative self-state."}, {"id": "6f0fc68d", "text": "Not to question your parenting whatsoever- but do you want think this could maybe a nurture over nature situation? \n\nI’m new to this, but apparently there’s a whole language to be used with teenagers for example to actually get them to HEAR you. One line that I’ve been using and have had a lot of success with is: “What do you need right now?” \n\nSometimes the fight isn’t even about what they’re saying it is about, but rather an underlying issue. \n\nKids, especially those at 7 years old, aren’t so great at articulating themselves. So it’s up to us to ask strategic and none-threatening questions that come from an area of concern and care. \n\n“How was your day” is an easy one to shut down with “good”. Us humans have been socially wired to answer with something like that. \n\nIt’s just like when we ask “how are you”. Everyone says “good/fine” even though we may not be. \n\nI think I’m sounding prea", "mood": "great", "energy": "charged", "focus": null, "meds": [], "feelings": ["wired"], "activities": ["Outdoors"], "sleepHours": null, "sideEffect": false, "title": "Kids", "gold": ["energy"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "pure parenting-advice post; mood=great and energy=charged/'wired' are fabricated ('socially wired' is an idiom, praise is to the addressee)."}, {"id": "06c03739", "text": "I feel you. I'm 22, diagnosed at 21. I have ADHD, depression, and anxiety. Or as I like to call it, the trifecta of laziness. And once you enter the rabbit hole of doing nothing all day, it becomes hard to claw out of.\n\nAre you on medication? If not, are you able to see a doctor/psych to get medication? Medication will jumpstart your motivation and allow you to focus.\n\nIf you're unable to get medication, I was for a long period, this is what I did. *Note: I didn't realize this is what I was doing at the time,  but in retrospect it's the best way to describe it.* I entered college as a biology major. I quickly got bored and lost interest. School has always been the bane of my existence, classroom learning was entirely too boring for me. Couldn't pay attention, always procrastinated homework/just didn't do it, and would skip class because something else was more interesting. I rationalized", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": ["bored"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "And once you enter the rabbit hole of", "gold": ["mood", "energy", "focus"], "jmood": "missed", "jenergy": "missed", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus=sharp matches the programming hyperfocus, but clear depression/'doing nothing all day' low mood and depleted energy were both missed."}, {"id": "17ea8999", "text": "It's  infuriating, and yet (for me at least), if you alternate between being disciplined and letting yourself enjoy your procrastination you can still be productive.\n\nSounds like you're in a loop of getting through the day, not completing your  To Dos, being upset about that, feeling defeated, then repeating each  day like that.\n\nYou  might find that your frustration with that cycle will allow you to  smash through some of those tasks, or just adds to the feeling of being  defeated.\n\nGive yourself permission to work on that task for a while without distractions (no Youtube, no music etc) so that you can enjoy those distractions a bit more once it's done or you've achieved a minor milestone.\n\nSometimes we think we've not been productive enough or that this episode of procrastination will spell disaster for the entire day; when in reality if we stop that negative thinking and focus on enjo", "mood": "okay", "energy": null, "focus": "sharp", "meds": [], "feelings": ["defeated"], "activities": ["Screen Time", "Work"], "sleepHours": null, "sideEffect": false, "title": "Sounds like you're in a loop of getting", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "'defeated' belongs to the addressee's loop; focus=sharp unsupported, mood=okay only weakly grounded in an advice post."}, {"id": "c3244630", "text": "She is very well versed on various medications...As if she had recited an article on a certain med from wikipedia (whenever I brought up a certain med at random) so I will go with sadistic psychopath.\n\nNone the less, a doctor does not have to be brilliant to be a fantastic doc. They just need to listen to their patients and work with them. Outside of the box thinking as opposed to mere book smarts which push some of the nastiest big pharm drugs on us: \"Having a rough day? Do you ever get feel sad? Do you occasionally lack energy or motivation?? Here, take this pill that will wreak havoc on your psych and induce horrid withdrawal upon ceasing use\".\n\n\nGood point on reporting this to a medical enquiry board. It's not for the sake of solving my own issue while wreaking havoc in her life like she seems to want to do with me.... But it is for everyone else out there who do not become prey to s", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["sad"], "activities": ["Outdoors", "Work"], "sleepHours": null, "sideEffect": false, "title": "None the less", "gold": ["mood", "energy"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "affect is anger/contempt at a doctor; mood=low/'sad' gets negative valence but wrong texture ('sad' only appears mocking the doctor's script)."}, {"id": "07abd74e", "text": "It's gonna sound weird, but weed.  I never really smoked again after getting caught once when I was 14. [side story to follow.. maybe]. However, a couple of years ago I started to dabble and try it again. A couple of times I felt like I maybe smoked more than I should have, or it was stronger stuff, or x,y,z.. anyways I noticed a pattern after those few occasions. The day after I felt different... I felt.. normal. Like, I had this clarity and focus that I was not used to at all. I hadn't acknowledged/addressed my ADHD in years. My dad was sorta in the \"ADHD isn't real, he just needs to try harder\" camp when I was growing up. Thus, I sorta adopted those views (though, not to the extreme, more like I just ignored my own obvious ADHD). Anyways, it occurred to me, \"this must be how 'normal' people experience the world everyday,\" and I was suddenly reminded of my ADHD. So I made an appointmen", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "It's gonna sound weird, but weed.", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "explicit 'clarity and focus' after weed; focus=sharp correct. clean."}, {"id": "19215265", "text": "How about something like Attention Regulatory Disorder? That allows room for hyperfocus, as well as scatterbrained inability to pay attention. It puts the focus on an inability to regulate attention normally. \n\nGranted, that still doesn't quite get at the \"Intention\" issue and \"Time Blindness,\" as that one guy put it.\n\nMaybe more specific, but potentially too specific would be, \"Task Awareness Regulatory Disorder.\" That would certainly make it more clear how it pertains to getting work done, which is where we tend to catch the most flack. Unfortunately, it'd also have a rather, er... damaging acronym... which honestly wasn't intentional when I wrote it out.\n\nBut then, even \"task awareness\" may be too broad, as I think a big problem is when a task is not stimulating enough or it's perceived to be too stimulating; too boring (or too overwhelming) = disengage, forget, not get it done.\n\nSo m", "mood": null, "energy": "steady", "focus": "lockedIn", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "That allows room for hyperfocus", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "abstract brainstorm of a new ADHD name; focus=lockedIn and energy=steady are fabricated from conceptual mentions of 'hyperfocus'."}, {"id": "03b972a6", "text": "I have a couple of friends with BPD. People who don't understand it are so cruel and it makes me so angry when my friends are written off by other people for their behaviours. \n\nEven people who SHOULD or DO understand it can still have absolutely no patience or poise, because it just seems like the person is attention seeking or being overdramatic. One of my closest friends has it and people treat him like absolute crap, even when I tell them how it affects him. \n\nI actually didn't really \"get\" BPD at all until I read a BPD feels tumblr a while ago - the wikipedia page is so confusing! It's so much easier to understand when you're reading a description from someone who actually has it. Thank you for explaining it a bit on here.", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["angry"], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "People who don't understand it are so cruel", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "'makes me so angry' is a genuine current affect; mood=low captures negative valence. focus=null right (gold hint notwithstanding)."}, {"id": "287e3f06", "text": "Thanks! And yeah, I understand. I've just been dealing with the inability to focus and other issues since I was a kid, way before I even had anxiety, so I guess I'm a bit frustrated that they're being contributed to stress and anxiety when I know it's not just that. I've been wondering if I have ADHD for a few years now but only just recently got to a point where I thought it would be good to get it checked out since I'm having a hard time in college with paying attention and getting work done even though I'm trying really hard.\n\nI guess I'm also frustrated about the process because I spend a lot of time researching coping mechanisms and stuff like that to help myself. I've tried a lot of things, and some of them work, but when it comes to getting motivated and being able to sit down and get things done, rarely anything works. So I feel like whatever coping mechanisms she might have are ", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": ["frustrated", "motivated", "anxious"], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "I've just been dealing with the inability to", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "mood=low fits frustrated/anxious, but focus=sharp is the OPPOSITE of the stated 'inability to focus / hard time paying attention'."}, {"id": "62a4937a", "text": "Yes, I relate to a lot you've written, for me it's intense social anxiety at places like school or adjusting to a new job, often stressing that i will not be able to learn/grasp what is expected of me quick enough, be humiliated in the process, disappoint the person who took a chance on me and let them down, fail, quit and/or get fired.\n\n This is a pattern that happens often, my social anxiety/ADD often leaves an impression that I'm impersonal, aloof, cold and unapproachable. This is all due to being so far outside my comfort zone with my crippling fear of \"She isn't very bright is she?\" \"Thank god your pretty cause you aren't very smart.\"\n\nThe negative self talk can be very difficult to overcome, sometimes I just let the thoughts run through me like a waterfall, with a heavy heart, I push forward. I often feel I am doing everything wrong. But I have such an inner drive to figure myself ", "mood": "great", "energy": null, "focus": "sharp", "meds": [], "feelings": ["grateful", "loved"], "activities": ["Outdoors", "Resting", "Work"], "sleepHours": null, "sideEffect": false, "title": "This is all due to being so far", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "explicit gratitude/'at my happiest' (mood=great) and 'I can hyper focus for hours' (focus=sharp) both supported despite the anxious framing. clean."}, {"id": "afd33efd", "text": "I haven't had panic attacks until I got on this ride discovering adhd. They don't happen frequently. I feel like this last one was the most \"true\"  panic attack, and the others were more intense emotional fits, because I had clearer thought processes and could complete thoughts and understand my feelings during those. This one was not like that. \n\nHowever, even long before my diagnosis,  my friends would say I worry a lot. During my first appointment with psychiatrist he asked if I worry a lot and he did mumble something about anxiety and \"we'll get to that later\" \n\nI'll call my doctor today yes. Thanks for the reply &lt;3", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "They don't happen frequently", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "panic attacks + chronic worry/anxiety clearly convey a negative/anxious mood; extractor returned null mood."}, {"id": "dcf4257d", "text": "I think the line for me is when I want to do something and I can but I won't do because I'm not willing to (being lazy). \n\nFor me ADHD is like I want to do it and I need to do it but I can get myself up to do it. It's not by will.\n\nFor example: I need to hand in an essay, I really need to and God knows I want to but I can't seem to start and something is holding me back or even if I start I get distracted very easily. Where as if I am being lazy, it's because oh well I'm just tired and don't wanna do it. I don't know if that makes sense.", "mood": null, "energy": "tired", "focus": "distracted", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "For example: I need to hand in an", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "correct", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "'I'm just tired' (energy=tired) and 'I get distracted very easily' (focus=distracted) both stated. clean."}, {"id": "16127b51", "text": "The lack of focus is our main worst enemy, but we have the Hyperfocus, when you go into the flow and nothing can stop you from what you are doing: hunger, thirst, fatigue, distractions, the ticking clock, everything fades out, you get sh*t done. I work at night because of this, i can be very productive when in hyperfocus.\n\nStartup life is even more stressful, what i am going to do is “sacrifice” to make something that will continue to pay me in the long term, investing time building a software that i could sell as product to many and for a recurrent scheme. \nWhen i have money, i will hire people to keep doing the improvements.", "mood": null, "energy": null, "focus": "lockedIn", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "The lack of focus is our main worst", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "explicit hyperfocus/flow; focus=lockedIn correct. energy=null defensible (general trait description, not a current-state report)."}, {"id": "f803f091", "text": "If she is doing well academically, which seems to be the case, I would be weary of holding her back solely because of social difficulties. I had similar issues as a child, socialising extremely poorly, having frequent meltdowns, refusing to interact with or being insulting toward my peers, and just being generally odd. The thing that helped me most in terms of socialising was progressing to higher grades. In elementary school and middle school, I felt that I couldn't have a meaningful conversation with anyone around me, so I stopped trying. Only by high school, in a more academically advanced programme, and especially now in university, do I feel able to actually relate to the people around me.\n\nI have no idea if that will be the case for her, but it's worth considering that while poor social skills can be the result of a disorder, they can also be the result of not being able to relate ", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "If she is doing well academically", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "advice about a child's schooling, no writer self-state; all-null is correct. clean (gold mood hint is a false hint)."}, {"id": "86028205", "text": "You’re at the age now where you don’t have to involve your family in any medical decision/information. It sucks to go through all of it alone. But it keeps you safer in the long run. Both emotionally, and physically. \n\nADHD is very real. Most everyone in my family has it. My dad would have had an amazing career if he just took ADHD meds. I’m the only one in the family that’s been diagnosed (5 times.) Fuck their opinions. Fuck your family’s opinion on mental health. Until they start working out their own shit, their opinions are irrelevant. \n\nBe prepared, as you get older and do well on your medication, to out-do them in every fashion. Especially when your analytical brain starts to come into fruition. You’re going to be frustrated by how spastic they are.\n\nYou’ve got this, OP. We’re here for you. Keep making good choices for you. Be proud of yourself.", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["frustrated", "proud"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "You’re at the age now where you don’t", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "tone is defiant/empowering ('be proud', 'fuck their opinions'); 'frustrated' is a future hypothetical for OP, so mood=low mischaracterizes the post."}, {"id": "8e1a9365", "text": "Hey OP, I think I can help you out but we need a bit more info first.\n\nFirst - what time of day do you take Vyvanse? What time of day do you start to feel irritated? Are you eating throughout the day?\n\nTo give you a short answer, I have experienced exactly what you have and it's happened as a result of 2 things, 1) blood sugar and hydration falling leading to irritability, and 2) the dose is too high.\n\nGive us a bit more info and I think I might be able to help.", "mood": "low", "energy": null, "focus": null, "meds": ["Vyvanse"], "feelings": [], "activities": ["Eating"], "sleepHours": null, "sideEffect": false, "title": "First - what time of day do you", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "meds=Vyvanse correctly extracted, but mood=low is the OP's irritability quoted back by a helper asking questions, not the writer's mood."}, {"id": "d428bbec", "text": "I'm 29. I found out I had symptoms of ADHD a few months ago when I went to see a psychiatrist to address anxiety/depression problems. He diagnosed me with anxiety, depression, AND ADHD. I was totally caught off guard. I have a minor in psychology and used to work in special education with children who had ADHD, and it still required a formal diagnosis by a psychiatrist for me recognize some of those symptoms in myself! As a child, no one suspected I had ADHD. I was mostly a \"space case\" who managed to get by solely because of intelligence and a manipulative smile. (LOL) Looking back, I can say that the latter years of my undergrad were the first time I feel that my ADHD symptoms truly had a negative impact on my life. But, at the time, I honestly thought it was more of a self control/self discipline issue.", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I found out I had symptoms of ADHD", "gold": ["mood"], "jmood": "na", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "diagnosis-history narrative with no current energy; energy=steady is fabricated. mood=null defensible."}, {"id": "527198d6", "text": "This is exactly where I am now.  Homework completion became a huge problem for me starting in middle school due to having multiple teachers, less support, and not being able to  all my homework the night before it was due because of the amount of work given.  This was one of the biggest red flags I've noticed when looking back.  The older I got, the more was expected of me and I started to fall apart and confused why the hell I couldn't do things other people could do (long term motivation, socialize, focus on things they're not interested).", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "The older I got", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "post is about focus problems / 'falling apart' historically; focus=sharp contradicts the text."}, {"id": "de08a92d", "text": "Agree with everything you've said. I think having an understanding boss is also crucial. In my case, I can give him a heads up in case my meds are changing in that it might change my productivity, when I arrive at work, how focused I seem while I'm at work, etc., and he is much more forgiving in case I'm going through an ADHD-related slump.\n\nI'm a labor and human rights professional, and I run my company's factory ethics program. I'm the only person who does what I do in the company, and I'm at the mid-manager level, so I have a LOT of flexibility in setting my own goals and picking my own tasks. It feels amazing.", "mood": "great", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "In my case", "gold": ["energy", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "mood=great fits 'it feels amazing'; focus=sharp is weak — only meta references to 'how focused I seem at work', no clear current focus state."}, {"id": "e4d79a0d", "text": "From my experience, environment plays a huge role in my behavior. I tend to eat crap and spend too much time on the internet if the surrounding environment promotes it or tolerates it or if I'm bored.\n\n\nOn the other hand, if the environment offers a \"better distraction\" than junk food or Internet consumption, or the environment is void of these items, then I'll naturally gravitate towards the healthier alternatives. \n\n\nIn my late 20s I started budget traveling--meeting different people, living in hostels, walking instead of driving, and visiting countries with healthy street food made it easy to live a quality lifestyle. With so many people, sites and points of exploration, I tend to spend most of my waking hours out and about (away from a computer). When healthy food is cheap, as in Vietnam, you can eat impulsively and never feel bad. When you don't have a car, one tends to walk, ride a", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["bored"], "activities": ["Driving", "Eating", "Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "When you don't have a car", "gold": ["focus"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "reflective lifestyle essay; mood=good inferred from general positivity, not a stated current mood ('bored' is conditional)."}, {"id": "f18db485", "text": "Often children of ADHD had emotionally unavailable parents who were dealing with their own trauma and shit.\nSo the children end up assuming responsibility for the parents emotions and will actively shut down their own to try and not upset them. \n\nWhen we repeat this pattern in life we become people pleasing to the point where we feel unable to express our own emotions.  \n\nBut these emotions don't go anywhere and although it feels good to affirm our self worth by helping others ultimately we are just suppressing our own needs just as we did as children.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "But these emotions don't go anywhere and although", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "Clean — abstract essay on childhood emotional suppression; extractor correctly returned no mood/energy/focus/meds."}, {"id": "e13068a8", "text": "Definitely PM me!!! Always happy to have more people to talk to who “get it”, yknow?? When I started this whole journey I felt super alone so I’m happy to help someone else NOT feel like that. \n\nYeah maybe wait till a day you’re at home? Just in case you don’t like it. You should also try it on regular days too though just to make sure, but on too high of a dose (&amp; esp the first few days of it) my heart raced and I got all anxious so I would have been useless at work either way, yknow? It settled into just “consistently not as comfortable / productive as I was at the right dose” but the first day I didnt love. \n\nHaha yup. I now carry around granola bars at all times just in case. I hate the “oh fuck I forgot to eat my blood sugar is crashing everything is awful” stage. Worth having a quick “fix” on hand for that one.", "mood": "low", "energy": "sluggish", "focus": null, "meds": [], "feelings": ["anxious", "settled"], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "Always happy to have more people to talk", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "na", "jmeds": "missed", "overall": "poor", "note": "mood=low and energy=sluggish are unsupported (writer is upbeat/helpful; 'heart raced/anxious' was a past dose anecdote, not current low/sluggish); a stimulant dose is clearly discussed yet meds=[]."}, {"id": "259b19a1", "text": "Not sure when your last experience with Teva was, but from what I understand, Teva changed their formula about 2 years back and the change was so drastic, that it caused a huge uproar online for like months. If you do a google search, you're likely to find many long, angry posts about it.\nTeva has never worked for me personally, but that's probably because CVS only began filling my scripts with it after the formula change. \nI haven't seen as many posts about Teva lately and there are still plenty of people of people out there who prefer it over other generic brands. But that doesn't mean it doesn't suck any less for the rest of us lol...\n\nYour best bet may be to request a different generic at your pharmacy and (through trial and error) find one that suits you", "mood": "low", "energy": null, "focus": "present", "meds": [], "feelings": ["angry"], "activities": ["Errands", "Resting"], "sleepHours": null, "sideEffect": false, "title": "If you do a google search", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "mood=low and focus=present are fabricated — text is informational advice about Teva generic; 'angry posts' describes others online, not the writer."}, {"id": "6f22415e", "text": "This is huge for me! I’d say this and an inabilty to switch tasks are the main ways my exec dysfunction kills me. Struggling right now with two assignments because i just can’t start them. It also happens with other things, like brushing my teeth before bed. I just can’t make myself do it. I often end up staying up until 4 AM because I couldn’t make myself go brush my teeth at 10 PM, and I can’t sleep without doing so. I know I need to do it, and I technically know how, but it’s like my brain can’t figure out how to physically act out the first step. Same with tasks that are more mental, like my current essay. I know what I need to do, but I can’t initiate the physical action to start it, even if my mind breaks it into steps. I also get stuck on what i’m already doing, even when it isn’t stimulating or productive, so starting something different/new feels impossible. I’ve always describe", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I often end up staying up until 4", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "Strong focus/task-initiation impairment ('can't start', exec dysfunction, staying up to 4AM) clearly conveyed but focus returned null — a miss; mood/energy reasonably null."}, {"id": "34d931cd", "text": "This is really involved and I haven't done it in a good ten years (since I had one high school English teacher require this), but this strategy was the most effective thing to help me organize my thoughts.\n\nYou will need:\nLots of index cards\nPen\nRecommended: an outline, markers for color-coding\n\nEach notecard can have one thought or sentence on it.\nYou can write out all the disjointed sentences you have now or you could make \"place holder\" notecards and pencil in what you need/if you know where to find it (ex.  \"Need fancy quote from literary criticism about bob...look at class notes).\n\nThen you can lay out your index cards on the floor and arrange your essay card by card.  Makes it really really tangible.  Can see if all your sentences have the same structure.  Can determine if each thing you say supports your thesis.  No thesis card...whoops!  Probably a good time to draft a thesis sta", "mood": null, "energy": null, "focus": "lockedIn", "meds": ["dex", "dex", "dex"], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "This is really involved and I haven't done", "gold": ["mood", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "false_positive", "overall": "poor", "note": "Pure how-to (index-card essay method); focus=lockedIn and meds=[dex,dex,dex] are both invented — no medication and no self-focus state in text."}, {"id": "6db12f5d", "text": "You are very young still, there are a lot of paths open to you. The best path for you would be to obtain your education abroad at a American or European university (Do not limit yourself to the US, Europe has a lot of good institutions and finding a job after graduating can be much easier). While expensive to study abroad, I think this can be feasible for you since you are very young.\n\nI am from Brazil and had somewhat similar experience and goals. I managed to move to the US as part of a student abroad program when I was 16 then eventually moved on to attend university there. I too thought math was too hard for me. But I kept at it because I enjoyed it and felt it could help my future. I graduated with both Computer Science and Math degrees. It was very hard but I made it, I didn't know I had ADHD at the time and wasn't treated so I had to give my all (plus some!) to get there.\n\nEven if", "mood": "great", "energy": "steady", "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "It was very hard", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Encouraging advice to a young stranger about studying abroad; mood=great, energy=steady, focus=sharp all unsupported — no current self-state expressed."}, {"id": "e6fbb9b7", "text": "I think society used to be less of a challenge for people with ADHD. So many things were different: most jobs demanded you to move a lot, but not necessarily to use your brains /concentrate that hard. There weren't as many distractions. You didn't have to choose between different options in life, pretty much everything was settled from the beginning for most people. I would love to have a life where other people /society tells me what to do and takes care of the big choices in life (profession, marriage) for me. I would feel way more relaxed and wouldn't have to doubt everything every day, because it was out of my hands anyway.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["settled"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "You didn't have to choose between different options", "gold": ["focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=good is a false positive — 'settled' is a hypothetical wish about historical society, and writer says they'd 'love' such a life (implying current isn't); focus correctly null despite gold hint."}, {"id": "5aef95f8", "text": "&gt;And as frustrating as it is, I also take huge comfort in my diagnosis\n\nI always been a person who take responsibility, has much for my failure than success. This help me always try to think about what I can do better and how to improve myself. \n\nSo when I was diagnosed it was a positive and a relief because at that point I was at loss about why I was not able to improve some very basic stuff about myself, I was kind of hitting a ceiling and could not understand why some stuff looked so easy for other people and was so hard for me. (procrastination overload, I am looking at you)\n\nI now know what was the potential source of many of my failures and feel much more confident to find ways to better myself. In the last year since I was diagnosed, I got a promotion and my financial situation improved substantially, so I believe I am in the right path. Still have many other thing to improve i", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": ["frustrated"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "&gt", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood=good is defensible — writer describes diagnosis as 'positive and a relief,' more confident, got a promotion; 'frustrated' is a quoted fragment but net positive holds."}, {"id": "1b2f72f9", "text": "i had issues in school, but not anything that showed me falling behind in studies due to my ability to pass anything without really studying..\n\nbut yeah i spent most of my time reading under the table or doodling in the later years..\n\nbut yeah i was always unorganized, always late and bat with time, lots of procrastination and the likes.. never held a study or a job for more than a few years, never had a long term girlfriend...\n\nwhen i got diagnosed it was more of a feeling of, now i know where i can read and focus my concentration on. And also where i can get help, or ways to mitigate my issues.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "When i got diagnosed it was more of", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus=sharp contradicts the text — writer recounts chronic distraction, procrastination, reading under the table; diagnosis let them 'know where to focus,' not that they are focused now."}, {"id": "6b7ace20", "text": "Haha, I'm the opposite. I really enjoy working out math or hard science (physics, chemistry), but my ADHD really screws me up. In highschool I took AP Calculus and while I could usually understand the material - when I managed to pay attention in class and practice at least a little at home - I would always fall victim to careless errors (dropping a negative, adding instead of multiplying). This would lead to me getting the answer hopelessly wrong and feeling stupid / discouraged because I thought I had known what I was doing. My calc teacher even started calling those kind of errors as \"pulling a (Aim_2_misbehave)\". Add to that the fact that I have a really difficult time focusing on any sort of reading that involves primarily numbers and equations, and my enjoyment of math is quickly turned to frustration. Writing, on the other hand was always fun for me. Because I had a good vocabular", "mood": null, "energy": "steady", "focus": "sharp", "meds": [], "feelings": ["discouraged"], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "This would lead to me getting the answer", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "mood low-ish 'stupid/discouraged' is past-tense but directionally ok (partial); energy=steady and focus=sharp are wrong — text is about careless errors and difficulty focusing on math."}, {"id": "088a05ea", "text": "This is a very common issue with taking meds for ADHD, and I'll copy and past what I put in a post earlier.  Personally, when I put myself on medication I tend to become apathetic towards things that aren't my main focus, whereas I almost have puppy love when I'm not on my meds.\nI have found that Ritalin for me mutes my personality and makes me very quiet, almost anti social. I don't want to go out, I don't want to enjoy life, I just want to get things done. I've found ways to manage this personally so now I am social, outgoing, and I honestly do care about my friends.\n\nSo what are you like off your meds?  I went off my meds after I graduated high school and spent the several years finding ways to deal with my ADHD through non-medicated means.  Some things have helped, but nothing is as good as medication.  I think my ADHD is not as bad as most (I was originally diagnosed with ADD until ", "mood": "low", "energy": null, "focus": "present", "meds": ["Ritalin"], "feelings": ["apathetic"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Personally", "gold": ["focus"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "meds=Ritalin correct and apathy supports a low-ish mood (partial), but focus=present is unsupported — writer notes apathy toward non-focus things, not a measured focus state."}, {"id": "f05a1996", "text": "Hmm. Maybe I should give 20mgs another try, I still have some left. I find it weird that I was feeling fine most of the day, only with a little bit of elevated heart rate. \n\nI think the reason I was spending so much time on that was because I didn't really have anything productive to do. Honestly this whole thing is getting pretty frustrating, I can't tell if it's working or not, I have no idea what I'm doing. im just trying to get some meds that will help me function in college, which I start in a couple months... Highschool was very very hard for me and I can't imagine that college is going to be easier.", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I find it weird that I was feeling", "gold": ["energy"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "partial", "overall": "ok", "note": "mood=okay fits 'feeling fine most of the day' plus frustration; meds missed — '20mgs' clearly refers to a stimulant being titrated but meds=[] (gold flagged energy, not captured)."}, {"id": "e8803837", "text": "Adderall is no where near the only medication out there. And the fact that you had such severe side effects and your doctor didn’t change your prescription tells me they weren’t really paying attention to your needs. I have very severe adhd as well and have been on meds since the first grade. I almost didn’t graduate high school even on the largest dose I had ever taken daily (72 mg concerta and 4 mg intuniv every morning often with a boost of a short acting in the afternoon). By the first year of college I basically had no appetite. Literally just stopped feeling hunger at all. I had to tell myself to eat because I never knew when I should. So I switched meds. Since the first grade I’ve probably been on 20 different combinations of meds and 100 different doses within that. Just like you, not taking my medication isn’t an option, because I wouldn’t be able to function day to day. I stron", "mood": "low", "energy": "alert", "focus": null, "meds": ["Adderall", "Concerta", "Intuniv", "Focalin", "Intuniv"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Adderall is no where near the only medication", "gold": ["focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "meds (Concerta/Intuniv/Focalin) correct, but mood=low and energy=alert are unsupported — encouraging advice about med trials; no current low mood or alertness stated."}, {"id": "1656804d", "text": "hey friend, I'm a med student currently at 5th year of 6 years MBBS program and i barely just barely passed each year by torturing myself at the night of the exam and staying awake all night and studying. so i started Strattera about 11 days ago and i can find few improvements  (it takes one month for full effect) as my family and friend confirmed the changes like I'm more stable in conversations and i stay more focused and quiet during lectures. Hopefully this will get better for me and i will be able to study and focus better in the near future and i hope this inspires you to resume your studies in medicine.", "mood": "good", "energy": "steady", "focus": "sharp", "meds": ["Strattera"], "feelings": ["inspired"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Hey friend", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "Solid — Strattera correct, hopeful/inspired mood=good fits, focus=sharp matches 'stay more focused' improvement; energy=steady is a mild over-reach but tolerable."}, {"id": "9b4997ab", "text": "Unmedicated here as well.\n\nI think of myself as a person who struggles compared to other people and have to adapt and work around my struggles. This is perfectly okay!\n\nCaffeine is probably the best replica to stimulants. Howeve it dehydrates you, a large amount is not healthy, mixing with sugar can make it even more unhealthy,/defeats it's purpose, plus it doesn't last very long. So use it as a temporary boost, don't rely on it. Think of the one part of the day that you struggle with focusing the most and use caffeine during this time.\n\nI naturally have a lot of energy and have trouble staying still. Walking around as much as possible throughout the day helps me focus. Engaging with other people helps a lot too. Distractions can be difficult. Earbuds can help. Another tip: Change locations where you work frequently. \n\nTomorto timer (pomorado technique?) is probably the most effective wa", "mood": "great", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "Howeve it dehydrates you", "gold": ["energy", "focus"], "jmood": "false_positive", "jenergy": "correct", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "energy good — 'naturally have a lot of energy' supports it; but mood=great is unsupported (it's advice) and focus=sharp contradicts 'trouble focusing' framing."}, {"id": "caf0c196", "text": "This sounds so much like my life that I wasn't entirely sure I hadn't written it myself. In my case, I finally got help and was diagnosed with ADHD way into adulthood. Then, a couple years later, I was also diagnosed with depression. In my case the best medication is Welbutrin, which is an anti-depressant but was originally for treatment of ADHD.\n\nEven before I was diagnosed, I managed somehow to get through both the Navy nuclear power program and later through law school. But I always felt like I was a fraud, over my head, and somehow everything would catch up with me. I couldn't seem to study or apply myself the same way others did, and missed what seemed obvious to everyone else. Yet people kept thinking I was really smart, which made me even more insecure. Now I don't know which condition causes which problem, exactly, ADHD and depression do tend to feed on each other in my case. On ", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I couldn't seem to study or apply myself", "gold": ["mood"], "jmood": "partial", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Depression diagnosis + 'felt like a fraud' supports a low mood, so mood=null is arguably a miss and energy=steady is an unsupported insertion in an otherwise reflective/down post."}, {"id": "eb9866e6", "text": "Your thyroid levels determine how your body creates things, makes and process energy, what your body does with drugs, how effective dopamine, norepinephrine, and adrenaline are (these are called catecholamine neurotransmitters, thyroid+serotonin probably has interactions but it has not been studied as much) and the ability of your brain to think.  When your thyroid levels are out of wrack it is much harder to use certain parts of your brain and that is the reason why you can see effects tied to depression, anxiety, and adhd even if you had none of those conditions, and those conditions made worse if you also have one or more of those conditions.\n\nIt explains completely why you gained 75 lbs, and your depression is now worse.\n\nFiguring out how to treat all 5 conditions (weight, thyroid, anxiety, depression, adhd) will be complicated for each med effects another condition and you have to f", "mood": null, "energy": null, "focus": null, "meds": ["Wellbutrin", "Wellbutrin"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Your thyroid levels determine how your body creates", "gold": ["mood", "energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "Clean — clinical thyroid/med-interaction explainer; meds=Wellbutrin correct, no self mood/energy/focus asserted (correctly null)."}, {"id": "993a80f8", "text": "My story is similar to a TON of women with ADHD, but I figured I'd share anyways. \nWhen I was in grade school, I was always able to focus fairly well in class, but had trouble doing work independently and homework, as well as having a hard time with emotional regulation (common for ADHD kids) so I had temper tantrums nearly every day. My problems continued on as I went to high school, and my organizational problems got worse. I forgot to do my homework nearly every night, frequently left important notebooks and papers in my locker, and my work was a mess. On top of that, it affected my home life as my parents started giving me more responsibility. My room was always messy, I would forget to do my chores, and my emotional regulation problems continued, causing me to have outbursts that negatively impacted my relationships with family members. All of this combined with anxiety and panic at", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": ["grateful"], "activities": ["Hobbies", "Screen Time", "Work"], "sleepHours": null, "sideEffect": false, "title": "When I was in grade school", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Long childhood backstory (tantrums, disorganization, anxiety); mood=good/grateful is questionable for this narrative and focus=sharp directly contradicts 'trouble focusing/forgot homework.'"}, {"id": "38eaede1", "text": "I find it hard to follow conversations without some kind of visual aids. Chatting to people at parties or the pub for long periods of time is hard. It's like the whole conversation unravels, I lose what's going on, then I get distracted in my own thoughts. \n\nI'm awful over the phone or Skype calls. I need to see some gesticulating or something to be able to focus at all.\n\nI tend to do okay if the conversation is very back and forth. It's when they are talking for a long time, like telling a story or trying to explain something that I kind of can't keep track well. I feel like it's partly why I suck so much at small talk. For example, one of the worst conversations for me to try and follow is someone trying to talk about their job, because before they can tell you the anecdote, they have to explain what their job is, what the industry is, how it works, who everyone is.... It's exhausting.", "mood": "low", "energy": "tired", "focus": "distracted", "meds": [], "feelings": ["exhausted"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "It's like the whole conversation unravels", "gold": ["focus"], "jmood": "partial", "jenergy": "partial", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus=distracted is spot-on ('get distracted in my own thoughts', can't keep track); tired/exhausted is really conversational fatigue not low mood/energy, so mood=low and energy=tired are loose but directionally fair."}, {"id": "f2adf391", "text": "In my experience, yes, but not directly. You don't just pop a pill, and suddenly everything is all hunky-dunky. Instead, the pills make it easier for you to do what you want to do when you want to do it, to achieve the things you try to achieve. A natural side effect of suddenly being able to do what you set your mind to is feeling more confident in your ability to do things.\n\nI've also found that I get less tired in social situations since I've been medicated, so I'm more likely to actually engage in conversation with people, whereas before, once I started to get a little bored, I was reaching for my phone and praying for the time I could leave. \n\nSo, it doesn't make you (me) more confident, it makes you more CAPABLE. \n\nThis isn't to say that your achievements on meds are not your own- someone else explains that the meds are like a really good assistant: they help you get things done, b", "mood": null, "energy": "tired", "focus": null, "meds": [], "feelings": ["bored"], "activities": ["Resting", "Work"], "sleepHours": null, "sideEffect": false, "title": "You don't just pop a pill", "gold": ["energy"], "jmood": "na", "jenergy": "partial", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "energy=tired/'bored' draws on 'I get less tired since medicated' — that's a contrast about the past, not a current tired state, so it's a weak/partial read; mood/focus correctly null."}, {"id": "685f52d9", "text": "I don't have a lot of formal counselling experience and this is totally anecdotal, but I have come a long way emotionally in terms of addressing my personal depression and emotional problems.  Though now I realize I may have struggled with some emotional disregulation for much of my life in a bit way.  I, too, was recently diagnosed and I'm 33.  I do feel as if I am able to make the most of my ADHD treatment because I am now in a much healthier place on an emotional level.  It's been said before, but meds don't exactly fix your ADHD.  They just put you in a place where you can start working on using tools to work toward your own goals.  It doesn't get rid of that urge to do stupid things. I still totally act like I have ADHD.  But it does put me in a place where I can recognize when I am doing something I don't want to and shift back to what I want to be doing.  However, being in a place", "mood": "great", "energy": null, "focus": null, "meds": ["Adderall XR"], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I don't have a lot of formal counselling", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "meds=Adderall XR correct; mood=great well-supported ('truly life changing', 'lost a lot of tension', 'more patient') — strong record."}, {"id": "3d3066f5", "text": "I know this might be coming a little late, but when I was feeling down or when my limbic system was in shock over something intense like relationships and breakups, the best coping mechanism that actually helped me process it and overcome it was by doing exercise. The more intense the RSD feedback, the more intense I would push myself on the run.  \n\nExercise, I have been told, also helps with the stimulant come-downs in the evenings and afternoons, if that applies to you. \n\nFinding a mentor who was accepting and patient with my venting and rants also helped massively. He helped me regain a sense of worth and concentrate on my studies. It helped that he was able to give perspective on a lot of worries I had about my future. RSD will make you feel so inadequate that you can't even work on making yourself a better person because your so insecure and socially withdrawn. Try to ignore your br", "mood": "good", "energy": null, "focus": null, "meds": ["Ritalin", "Dexedrine", "Vyvanse", "Vyvanse"], "feelings": ["withdrawn"], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "I know this might be coming a little", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "meds (Ritalin/Dexedrine/Vyvanse) correct, but mood=good contradicts the content — advice to someone on RSD/depression/'feeling down/socially withdrawn'; if anything mood skews low."}, {"id": "efa963b9", "text": "Hopefully he will get over being \"miffed \" and get down to business next time. Likely he was embarrassed that he missed seeing your email /felt somewhat guilty about being on vacation and therefore  clueless. Also it sounds as if he's not that well,prepared  having to research different meds - you'd assume he'd have a list in his head of first line/ second line meds/ meds that dont have such n such side effects as much, etc. Perhaps he's nervous or uncomfortable in some way and is reflecting this on you.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["guilty"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Likely he was embarrassed that he missed seeing", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood is unsupported — 'embarrassed/guilty' are speculations about the writer's doctor, not the writer's own state; no self-mood expressed (should be null)."}, {"id": "fd812c73", "text": "These are really good. Want to add a couple of things.\n\nDon't leave the dishes if possible. My mother always said the number one thing you should do before bed is wash all the dishes. Otherwise they just accumulate. Ok only starting to do this in earnest lately and it helps huge. Morning has way too much brain fog to worry about that crap and I'd rather use the clarity after morning coffee for other things. But like you said YMMV.\n\nHaving friends or family over is also brilliant. I find I get kind of bored with their conversation so I have to do something to stay engaged. Like clean. In fact when I'm trying to clean I sometimes force my kids to come sit in the same room and talk to me so I don't get sidetracked.", "mood": "great", "energy": null, "focus": "present", "meds": [], "feelings": ["bored"], "activities": ["Chores"], "sleepHours": null, "sideEffect": false, "title": "Morning has way too much brain fog to", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Cleaning tips post; mood=great and focus=present are invented — 'bored' refers to needing stimulation while cleaning and 'brain fog' is mentioned, no positive mood or present-focus state."}, {"id": "03243f84", "text": "I definitely have a problem controlling my raw emotions and am generally up and down as well. When I'm happy I have a childlike enthusiasm. I'm a crier, but my sadness will often manifest as anger - particularly in front of others. \n\nI particularly have a hard time letting go of anger, but oddly, I kind of like it. I think it's because I find anger motivating and a little bit satisfying. I'm usually moved into action, and I try to channel my energy into something constructive (which I wish I could say was always the end result).\n\nThough I like the catharsis of crying, sadness tends  to demotivate me which I hate because it makes me feel helpless. It's harder for me to get out of my pits of despair. Ultimately, I think that avoiding sadness results in me experiencing less empathy making me appear cold, when in reality I'm just super sensitive and can't handle that type of pain.", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": ["motivated"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "When I'm happy I have a childlike enthusiasm", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=great false_positive: text is net-down (despair/helplessness/'pits of despair'), only anger is described positively as motivating."}, {"id": "a667b772", "text": "I forget what book I read but it's probably thematic across the literature on ADHD how we need stimulation. Some people need 5 TVs on at the same time to concentrate, some people need to skydive, motorcycle or do some other risky hobby. But definitely the stimulation can come from anything including work emergencies. Put me in a pressure cooker and I'll be cool. \n\nAre you happy moving from town to town? If so, good for you - moving can be scary.", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "Are you happy moving from town to town?", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=great false_positive: 'happy moving from town to town?' is addressed to the reader, not the writer's own mood."}, {"id": "28cfb7d1", "text": "I am happy to hear of your decision to continue on your journey. That is so awesome! I deal with my own issues. I am just coming through my own perspective recalibration. I got so wrapped up in a project that it took a buddy cutting me off mid-rant to correct me. Just because I didn't accomplish all of my ancillary goals I failed to correctly view it as a success. Kind of a wake up call for me!\n\nGlad to hear you are putting those mundane realities into perspective and celebrating your successes. It is easy for us to become so hyper-focused on doing everything perfect that we throw our hands up in the air at the slightest frustration.\n\nSounds like you've regrouped and have taken advantage of the resources around you. I am super stoked for you and for the fact that I have been taught these techniques myself. They seem to help everyone but especially high functioning types.\n\nI will check ou", "mood": "great", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I am happy to hear of your decision", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "mood=great right (super stoked/awesome); focus=sharp partial — text describes past hyperfocus on a project (lockedIn-ish), framed as a problem, not clean sharpness."}, {"id": "86aa1b2e", "text": "I've been on a ketogenic diet since Feb/March of this year and I think it helps a lot. Improves energy and focus, lowered my blood pressure, increased motivation, better sleep, etc. Plus, for those who have problems eating enough while on medications like adderall, you can combine the low carb diet with intermittent fasting so that you only need 1-2 big meals a day. \n\ngo to /r/keto for more info. I would definitely recommend it, especially if you have some extra weight to lose as well. I've lost ~50lbs of fat since March.", "mood": "good", "energy": null, "focus": "sharp", "meds": ["Adderall"], "feelings": [], "activities": ["Eating"], "sleepHours": null, "sideEffect": false, "title": "Improves energy and focus", "gold": ["energy", "focus"], "jmood": "false_positive", "jenergy": "missed", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "energy=missed — text explicitly says keto 'improves energy' yet no energy returned; focus=sharp correct, Adderall correct, but mood=good unsupported (diet benefits, no mood)."}, {"id": "9902096f", "text": "There are a few tricks for that, too. For one, I’m using an app called “Productive.” You write a list of all the regular habits you want to do each day and every time you do one, you cross it off. If you do all of them you get a “perfect day.” If you do this several times in a row, you create a “perfect streak.”\n\nFor me, I have a few things I want to do every day. One of them is exercise, one of them is work on my career, etc. If I don’t do at least 5 minutes of these, I don’t let myself cross them off the list.\n\nOf course, this means that a lot of days, I seriously only do 5 minutes of these things. But that is better than 0, I still keep my perfect score on my app, and it keeps me in the habit of doing the things I want to do.\n\nI really believe it works. I have been trying to exercise regularly for over a year, and I never made it more than 2 weeks until I started this. Now I’ve been e", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Fitness", "Work"], "sleepHours": null, "sideEffect": false, "title": "If I don’t do at least 5 minutes", "gold": ["energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=good f
