{"id": "a49c36bb", "text": "I'm 25, I have degrees in Math and Computer Science, pay all my bills on time, live alone successfully, take good care of my cat, have an awesome job in software at an awesome company. I got great grades in school, and have gotten numerous awards and recognitions at places I've worked (I was awarded the same coveted employee award twice, a feat only accomplished by one other employee in the history of that company). I am often praised for my skills and knowledge and hard work. I have friends that are amazing people. I'm a noticeably cheerful and happy person. I don't have money yet to do all the things I'd like to (recently out of school), but I am carefully monitoring my finances and hope to save enough to start going on small trips. I'm single but I'm also not looking, and I'm happier being completely independent. I was also unmedicated until I was about 22, so I did most of that witho", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I got great grades in school", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "'noticeably cheerful and happy person... I'm happy' → mood=great correct; clean."}, {"id": "fcaf9277", "text": "you need to leave. I'm surrounded by ADHD people that don't want treatment and I have to leave too at some point. I don't know what I'm going to do once I feel fine (ADD medication is fine, depression is not) but I left an ex-girlfriend and ended multiple friendships because of what you are talking about; since my diagnosis.\n\nYou aren't there to make up for your fiance's easily treatable deficiencies. Nobody can expect that from another person. \n\nIf he chooses a live of controlling anxious dysfunction that's fine. But you don't have to be a part of it. People have to take a leap of faith sometimes. If they can't do that with you when you're that important to them apparently and mean the best for both of you then what's the point of the relationship? You're not being heard by the person you love the most. What will that do to you over time?\n\nMy father talks incessantly and doesn't really ", "mood": "okay", "energy": "tired", "focus": null, "meds": [], "feelings": ["anxious"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I'm surrounded by ADHD people that don't want", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "correct", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood:okay too neutral — writer conveys low/pained mood ('It hurts', resignation); energy:tired correct."}, {"id": "7aa470bc", "text": "I have both ADHD and GAD with some panic thrown in and bouts of depression periodically.\nIt sucks, having to deal with both. The anxiety you already have is magnified by the ADHD, which usually makes you a helluva lot more restless than you would be, and makes sleeping harder.\n\nThen the ADHD is worse the more anxious you are because you already can't focus, and now you're going from one thing that is making you anxious to the next and to the next and on and on, so focusing is basically non existent because your brain becomes engulfed in sporadic thoughts of everything you've ever felt anxious about.\n\nTherapy helps a lot. Learning when to take breaks from work/school/whatever helps a lot. You should find things that are interesting/enjoyable enough for you to turn to when you can't stop the cycle of unwanted thoughts and worry. I usually play a video game for 30 mins, take my dog for a wa", "mood": "low", "energy": null, "focus": "distracted", "meds": [], "feelings": ["restless", "anxious"], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "The anxiety you already have is magnified by", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "partial", "jmeds": "missed", "overall": "ok", "note": "focus:distracted from generic 'you can't focus' framing; missed past meds (antidepressant/ADHD med/benzo)."}, {"id": "d11d7648", "text": "Hello, I haven’t taken my meds yet today so I’m not the most attentive reader but I did get through at least 75% of what you wrote :) and I wanted to say I’m really sorry for everything you’ve been struggling with for your whole life, no one deserves to go through that kind of stuff. You seem like a good person who’s really trying to make connections with people but you’re just misunderstood. I know what it feels like to be constantly brimming with thoughts, but to have to hold them in because I am aware no one has the time or energy to listen to my spiel all the time. I have to find other ways to expend my energy and literally limitless ideas. The constant stream of thoughts is SO ANNOYING, I can totally relate. The thinking is half intriguing to me but half very distracting and a waste of time. \n\nI wanted to ask if you are taking any medications right now? Or have you tried them before", "mood": null, "energy": null, "focus": "distracted", "meds": [], "feelings": ["misunderstood"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "You seem like a good person who’s really", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "correct", "jmeds": "missed", "overall": "ok", "note": "focus:distracted correct ('haven't taken meds, not most attentive'); missed clear current med mention ('only been on meds 2 days')."}, {"id": "82c9f192", "text": "The reason I haven't been evaluated is mostly because I'm extremely high functioning - I haven't lost a job over my scatterbrain (mostly because my boss is fantastic and I love my job to bits), I'm in uni and getting good grades (even though exam phases consist of endless procrastination and then about two weeks of extreme productivity and many hours of daily+nightly overly caffeinated cramming once the deadline panic finally gets me moving), I haven't had a relationship end or friends abandon me over this, and just in general I feel like it's not affecting me enough to be worth a professional's time - even if I were to get a diagnosis, which I probably wouldn't if it's not hurting me enough, I don't know if I'd even require or want medication. I don't mean to sound ungrateful, of course it's great that I'm doing so well overall, but for some stupid reason it bothers me that I can't get ", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "The reason I haven't been evaluated is mostly", "gold": ["energy", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "mood:great overstates ambivalent self-view ('bothers me','laziness'); scatterbrain/procrastination = distracted focus missed."}, {"id": "c2694aec", "text": "Typically no. The only times I've noticed weakness was on Vyvanse, because it really messed with my appetite and I was trying to get by on one meal, maybe two, every day. On Ritalin and Adderall, I was able to eat and exercise normally, so I didn't feel weak, just exhausted. Ritalin didn't cause many sleeping problems, but Adderall did so I had many sleepless nights. There's so many different factors... I kept telling myself I'd keep a log of how I've been feeling on meds this past month or two and I kept forgetting to do it T_T", "mood": null, "energy": "steady", "focus": null, "meds": ["Vyvanse", "Ritalin", "Adderall", "Ritalin", "Adderall"], "feelings": [], "activities": ["Eating", "Fitness"], "sleepHours": null, "sideEffect": false, "title": "On Ritalin and Adderall", "gold": ["energy"], "jmood": "na", "jenergy": "false_positive", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "energy:steady contradicts text ('just exhausted','weakness','sleepless nights'); meds Vyvanse/Ritalin/Adderall correct."}, {"id": "e8ea3e8d", "text": "Thank you for your story, and of course I read every word of it. (Hey, I'm also here, procrastinating at 5 am, after I tried working again but gave up after 5 minutes due to zero motivation / ability to focus....)\n\nReading success stories like this is starting to make me feel really hopeful. My apartment is in a state of decay, falling apart around me, but every time I try doing something about it I just.. sort of stop. I used to think it was just the computer addiction, but I was this way even at the last clinic I stayed at. They asked me to call up a list of therapists. I sat there and gave up after the first few calls and then procrastinated for a month while falling in love; and suffice to say, they had to *force* me to call the therapists (or risk getting thrown out) before I was able to do it. Any therapeutic task I was given I usually just put somewhere on my desk and instead walk", "mood": null, "energy": null, "focus": "lockedIn", "meds": [], "feelings": ["hopeful"], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "(Hey", "gold": ["mood", "energy", "focus"], "jmood": "missed", "jenergy": "missed", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "focus:lockedIn is the opposite — text says 'zero ability to focus, gave up after 5 min'; hopeful mood and low energy both missed."}, {"id": "950d8b67", "text": "Deep breaths. It sounds like Anxiety is also a player here. You are doing very well.  If you are feeling pressured and scared you need to remind yourself how far you have come already. I think positive self think will be beneficial in helping you to continue on to get these assignments done.\n\nPerhaps you should set aside an hour in the evening that you are dedicating to these assignments. When that hour rolls around, go to the spot you would normally work at and sit down. Remind yourself why you are doing this, Remind yourself how great you are doing in the first place to be afforded this opportunity. Remind yourself that you can do this.\n\n\nRemember to breath deeply and steadily to help with nerves. Just try and pick up the pen and put it to the paper. Perhaps write whatever comes to mind, and if it is suiting, run with it. If it isn't that ok. Centre your thoughts. So when you think, sq", "mood": "good", "energy": null, "focus": "present", "meds": [], "feelings": ["scared"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I think positive self think will be beneficial", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Pure advice to another person — mood:good and focus:present attribute the addressee's state to the writer."}, {"id": "82388ff3", "text": "I'm sure it's going to play out well. Look, I was an extracurricular teacher a long time ago of children and teens and I always saw very dysfunctional kids that weren't medicated or, very doped early teens that clearly had much more resources than what they were allowed to show and couldn't because they were always foggy. And what they both had in common were parents that couldn't bother, couldn't bother in wondering if their kids were struggling and couldn't bother in knowing how it is the real life of a medicated kid in school, so as long as you bother and notice stuff, even if you have to force yourself to follow through in that stuff you notice, everything should be all right. Also, always reach out to the teachers, they are usually overwhelmed individuals that seem as if just don't want to be extra bothered, but they are full with information about your kid and it usually gives a gr", "mood": "low", "energy": null, "focus": "present", "meds": [], "feelings": ["overwhelmed"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Look", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Advice to a parent; 'overwhelmed' is about teachers generally — mood:low and focus:present have no writer-state basis."}, {"id": "5c452230", "text": "I've been on concerta for a year now. Started with 36 mg extended release when I went back to school in sept. In regards to focus and productivity it was unbelievable, I was motivated to work from 8am-8pm every day even the weekends. I don't think I felt anxiety because there was always something to occupy my mind. Although in my personal life I still wasn't handling emotional regulation, but I don't think meds can really do that alone.... I've been attempting mindfulness lately that's been really helpful. Anyway, after Christmas I went to work for 8 months and the job was a desk job with a lot of down time. It was here that I started feeling super jittery and anxious. Mood swings like crazy, antisocial, snapping at my SO. It was bad. If you're like me and you need to be active I don't think any meds will get you settled into a chair for 40 hr/wk. it's not in some of us and that's fine. ", "mood": "good", "energy": null, "focus": "present", "meds": ["Concerta"], "feelings": ["motivated", "anxious", "settled"], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": true, "title": "I've been on concerta for a year now", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "missed", "jfocus": "correct", "jmeds": "correct", "overall": "ok", "note": "focus:present + Concerta correct; energy null despite 'motivated 8am-8pm' / 'jittery'; mood:good only fits current, ignores 'mood swings, it was bad'."}, {"id": "4b89a9df", "text": "I'm in my 30s and had a diagnosis as a kid, but never did anything with it because I was afraid of meds and my parents respected that.\n\nI just coped all through school like you did.\n\nAnd I just lost a lead position on my project because the department director told me I wasn't performing.\n\nI finally sucked it up and got an eval set up. I had my first appointment and the psych said she recommended that I continue and get the full eval.\n\nI really want to try some meds and see how they help. I'm tired of feeling like a lazy fuck but being completely incapable of changing no matter how hard I try. When I drink just enough coffee where I'm not quite having a panic attack but more than usual, I feel like my head is clear and I can actually get shit done....but those times I have too much I have a 2 hour panic attack and am completely useless.", "mood": null, "energy": "tired", "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I'm in my 30s and had a diagnosis", "gold": ["energy"], "jmood": "missed", "jenergy": "partial", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus:sharp matches 'head is clear, get shit done'; energy:tired reads the idiom 'tired of feeling lazy'; low/frustrated mood (lost lead role) missed."}, {"id": "a1ae1d69", "text": "I feel opposite, I used to get so overwhelmed by all the things i wanted to/needed to do, I'd wind up curled in an anxious-tense ball of panic just watching TV while hours passed. On medication, I can work a little on one project, move on to another, focus on a good TV show for an hour, even take a nap. \n\nI don't really get fake energy from meds, I feel the same level of energy with or without, my brain just feels sharper on them and I have far less anxiety and \"nervous energy\" that used to paralyze me into doing nothing. On meds, I can just get from point a to poing b faster and see the easiest most efficient ways to get things done. I still nap on my meds, and I still get tired on my meds like I did off them.", "mood": "low", "energy": "tired", "focus": "sharp", "meds": [], "feelings": ["tense", "anxious", "overwhelmed"], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "I feel opposite", "gold": ["mood", "energy", "focus"], "jmood": "partial", "jenergy": "correct", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "focus:sharp ('brain feels sharper') and energy:tired ('still get tired on meds') correct; mood:low describes the past paralysis, present is improved."}, {"id": "d1b5d677", "text": "You started with saying you had a debate with your wife and I was like oh gosh I'm sorry.. but it's actually an interesting debate, not an angry one. :P\n\nAs for who should pay, it's hard to say. The way business models have changed lately, to rely solely on ad revenue instead of sales or subscription revenue, means that it's very difficult to gauge how much things should cost each person anymore.\n\nIndividual ads don't make a lot of money, and clicking on the ad is worth looking, and following through with a product purchase can be worth even more depending on how things are set up. So blocking a few ads on a site you view once is likely only a few cents max of lost revenue, but you also completely remove the possibility of a click or purchase. And that's multiplied when it's a site you visit regularly. So what seems like \"free\" to most people, can range quite  lot in actual value. (This ", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "You started with saying you had a debate", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Abstract debate on ad revenue; mood:okay has no emotional-state basis ('interesting debate, not angry')."}, {"id": "e9c7a4b7", "text": "*If it works, you will know*. \n\nFor me, the second day confirmed if it still works. For me, Ritalin worked the first day, but only to get me wired. Second day did zero. My psychiatrist refused to change it.\n\nNew doctor switched my to Vyvanse. It wired me the first day like Ritalin. Second day and beyond it has been working. I cannot tell you how happy I am.\n\nAsk your doctor to change meds. If they refuse for some reason, get a new doctor.", "mood": "great", "energy": "charged", "focus": null, "meds": ["Ritalin", "Vyvanse", "Ritalin"], "feelings": ["wired"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "For me", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "correct", "jfocus": "na", "jmeds": "correct", "overall": "good", "note": "clean — mood:great ('how happy I am'), energy:charged ('wired'), Ritalin/Vyvanse all correct."}, {"id": "9495e0b6", "text": "Figuring out a routine to stick to has been life saving for me. It’s HARD, but once you find your groove, it’s magic. \n\nI have a big fat red wallet to make sure I don’t lose it and I can touch it in my purse to reassure me it’s there because I usually have to look 5 times at something for it to stick in my brain. I make sure I keep my card in the second compartment, put it back, stare at it, close. ID in first compartment, put it back, stare, close. \n\nKeys on a long lanyard with a large card holder with my metro pass, again, easier to keep track of with its size. Loop it around my neck until I lock my car, then tuck into my purse. If it’s still on my neck, then I haven’t locked my car.\n\nI use the memos &amp; calendar apps on my phone religiously, even if I’m sure I’ll remember it, I use it and it has been a life changer! \n\nI could go on and on about all the steps I take but I think I out", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I have a big fat red wallet to", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood:good fits ('it's magic'); energy null despite explicit 'can't muster the energy to brush my teeth'."}, {"id": "c853a919", "text": "I didn't know tension felt as part of ADHD could manifest as teeth clenching. That's another thing I do. Like the saying goes, I literally \"grit my teeth\" in order to focus. I also do it when I'm angry or frustrated. My wife notices my jawbone doing this weird, \"poking out\" kind of thing when my teeth are pushed together, and she can instantly tell I'm annoyed about something I'm working on, or perhaps frustrated at myself for failing at something or not understanding something.", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": ["frustrated", "angry"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I didn't know tension felt as part of", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "partial", "jmeds": "na", "overall": "ok", "note": "mood:low correct (frustrated/angry/annoyed); focus:sharp overreads 'grit my teeth in order to focus' — that's effortful tension, not sharp focus."}, {"id": "126e096c", "text": "I found that gratefulness is an antidote to self pity, not depression. \n\nWhen I am depressed I feel an ENORMOUS sense of guilt because I'm hyperaware of how much I have to be grateful for. My journals flood with long lists of things I'm grateful for and I write letters and thank you notes to everyone I can think of and feel HORRIBLE for feeling so desperately in pain when I shouldn't. \n\nThe speaker's statement is dangerous and isolating for those with depression.", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["grateful"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "When I am depressed I feel an ENORMOUS", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "mood:low correct ('When I am depressed'); note feelings:[grateful] is a coping behavior, not positive mood."}, {"id": "7c936e4f", "text": "I definitely thought this several times while I was taking a mindfulness class a few months ago. \"Why do you keep saying there's nothing that can be done about the thing I'm worried about? There **are** things I could be doing!\" It was extra frustrating for me, with ADHD, because a lot of the things that would be popping in my head were things that I meant to do a while ago, or important things I'd been putting off, so hearing the instructor say \"just let it go, worrying won't change it\" bugged me, because really worrying about it and dwelling on it until I finally manage to *do* *something* seems to be one of my \"coping\" skills for procrastination. \n\nWhat I realized, though, is that they were trying to get me to a place where I could do **both** things: \n\n 1.  have thoughts and *act on them* \\(fixing the things that need to be fixed, planning things that need to be planned, feeling the ", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "\"Why do you keep saying there's nothing that", "gold": ["energy", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "focus:sharp unsupported — cognitive reflection on acting vs observing thoughts; mood:low overstates mild 'frustrating/bugged me'."}, {"id": "8e130508", "text": "Sadly in the real world, the fault lies on you for not making an inquiry  to the pharmacy and asking what kind of generic they have stocked currently. This is your responsibility to yourself as a buyer as in any normal case of product purchase in which all sales are final. \n\nJust take it as a learning experience, and avoid anything Aurobindo Pharmaceuticals manufactures. Yes those pills are crap. I would recommend the Eon labs generic, but that company was recently purchased by Aurobindo. The E404's aren't what they used to be, but they're better than U30's. My refrences to the stamps are the 20mg ones since I've been on those forever.\n\nIt's all crap compared to the originals that Shire made, when I reminisce upon taking those back when I was a kiddo. I still haven't a clue what makes the variations in the modern generics. It could be a really complex answer involving polymorphism of the", "mood": "good", "energy": null, "focus": null, "meds": ["amphetamine"], "feelings": [], "activities": ["Errands"], "sleepHours": null, "sideEffect": false, "title": "The E404's aren't what they used to be", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "correct", "overall": "ok", "note": "meds:amphetamine correct (E404/U30 generics); mood:good wrong — tone is critical/annoyed ('those pills are crap'), no positive mood."}, {"id": "ddd92505", "text": "I feel for you. It's tough to interract with people on an emotional level when you yourself may not know how to read others emotions or express your own. It's hard to be thrown into a world where people communicate the most by a large margin through tone, inflection, body language, and the shared context of an emotional response to a situation. I say, don't worry about 'not having friends'. Compare yourself of today, to who you were yesterday. How can you better yourself today? What do you want to learn, to experience, to grow to be? What do you think you need to do to work towards being who you want to be? \n\nAnother way I think you could work this issue is to find people who think like you do; maybe some people like engineers, or chess players, mathmaticians, scientists or other like minded hobbies and things that don't need emotions in the picture as much to still be a social, producti", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I say", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Entirely advice to the reader ('Stay strong, good luck'); mood:good reflects warmth toward addressee, not writer's own state."}, {"id": "fb1bf9bd", "text": "The answer is yes, especially if you're going to up your dose every few weeks you're going to hit the wall very soon. But it also depends on what dose you are now, what was your starting dose and for how long you are taking amphetamines in general. \n\nThis is ADHD medicine, you're not supposed to chase the high. Because if you do - you can end up taking over 1000mg a day, and still don't feel that \"high and focus\" - just barely able to be functional (if at all).", "mood": null, "energy": null, "focus": "present", "meds": ["amphetamine"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "The answer is yes", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "meds:amphetamine correct; focus:present unsupported — 'barely functional/high and focus' is generic dose-chasing warning, not writer's state."}, {"id": "2669baaa", "text": "Good analogy with the prosthetic leg, I totally understand what you mean.\n\nIn my experience this is also because we love to fully understand the task at hand and complete it to the best of our abilities.. this makes our studying much more than just memorising information (which will obviously take much more effort and time than our peers)\n\nIn the end, despite the huge amount of extra effort we put in, we end up becoming experts at what we're passionate about rather than presenting information for the sake of achieving grades. \n\nMy intention with the comment was simply that this way of working may mean that we end up following a path the majority haven't, and we shouldn't feel guilty about it.\n\nI wish you well on your journey :)", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "My intention with the comment was simply that", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — encouraging reflection with no strong self-state; all-null is correct."}, {"id": "2a6403a5", "text": "I'm building my own reminder app.  I haven't been able to find one that works for me reliably.  My problem is that I get so deeply focused in something, an alert goes off &amp; I'll sometimes dismiss the alert without realizing it.  I'm just getting started, but the focus of my app will be unrelenting reminders to get started AND requests to confirm I actually did the work.\n\nExample: I recently went to put laundry in the dryer (my apartment building has 4 washers and 4 dryers), but all 4 dryers were occupied.  One dryer had been idle for a while, and when I went to move someone else's dried crap onto a shelf, I realized it was my laundry from 2 days ago.  I had set an alarm to remind myself to get the laundry, but between dismissing the alarm and actually initiation of Operation GetMyShit, I got distracted.  \n\nThis kind of thing happens to me all the time, and has only gotten worse as I ", "mood": null, "energy": "alert", "focus": "sharp", "meds": [], "feelings": [], "activities": ["Chores", "Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "My problem is that I get so deeply", "gold": ["focus"], "jmood": "na", "jenergy": "false_positive", "jfocus": "correct", "jmeds": "na", "overall": "ok", "note": "focus:sharp correct (hyperfocus, 'get so deeply focused'); energy:alert unsupported — no energy-state claim, only attention/hyperfocus."}, {"id": "c6270ef1", "text": "How are you all okay with this? Serious question. It hasn't helped me. Yes, I've had a lot of stuggles in my life, probably culminating in graduate school. But because I never connected the dots, i... Well I never really dwelled on any of it. My inability to execute nebulous tasks, my failure to  carry-on long, in-depth conversations, my unending procrastination, my forgetfulness... \n\nIt was bliss. I never realized I had these problems. I was always happier not knowing. Slowly, I've started connecting the dots. I remember googling ADHD 6 years ago when I had a job in which I had to do repetitive tasks, it became impossible... I remember wondering occasionally but I generally was happy.\n\nNow, I see very clearly my shortcomings and I hate myself for it. Now I notice when I can't seem to stay on a single damn task for more than 2 minutes. I see now why my wife is annoyed when I bring up unr", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": ["connected"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "But because I never connected the dots", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "poor", "note": "mood:okay is wrong direction — clearly low now ('I hate myself for it','never accomplish anything'); 'can't stay on a task >2 min' = distracted focus missed; feelings:[connected] misreads 'connected the dots'."}, {"id": "2f77dab2", "text": "Thats awesome! I have recently moved to 3x 10mg from 3x5mg and I think I might have found the sweet spot, but not sure if I should go higher 'just to see'. \n\nAs for being more productive, it is certainly true, but it has its side effects as I feel like I have moved to the other extreme where its all work and no play. As someone already mentioned on the site weeks ago, have to practice finding that sweet spot between the two.\n\nAnyways, good luck on the new treatment hope it is effective as you hope it to be! :)", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I have recently moved to 3x 10mg from", "gold": ["energy"], "jmood": "na", "jenergy": "partial", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Unnamed stimulant dose (3x10mg) so meds null defensible; productivity/'sweet spot' arguably an energy/output signal left null."}, {"id": "f8e043cf", "text": "Not even antidepressant \"cure\" depression. They help relieve the symptoms. In my case specifically. Addy doesnt make me feel happy or euphoric. I really dont feel anything except capable of doing the things that my depression. Has prevented me from doing for years. It is the early days and things can change as I'm well aware of with any type of psychotropic drug. The difference is addy works right now and not weeks and weeks later. \nI am under the care of a psychiatrist  who explained that yes my depressive symptoms would go away right away.  If I were to quit my anti depressants I would slink back into a horrible black hole again. \n\nAlso dont confuse being happy about being able to think straight and having a clear head for once with euphoria. \nMy whole demeanor  has changed in 3 short days by taking addy. I just feel calmer than I have in years. Like doesnt feel overwhelming  for a cha", "mood": "great", "energy": null, "focus": "sharp", "meds": ["addy", "addy", "addy", "Adderall"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Addy doesnt make me feel happy or euphoric", "gold": ["mood"], "jmood": "correct", "jenergy": "na", "jfocus": "correct", "jmeds": "correct", "overall": "good", "note": "clean — first-person med-response post; mood/focus/meds all supported (\"calmer than in years\", \"clear head\", Adderall)."}, {"id": "5e4d9a3d", "text": "I'll preface my wall of text with this: Unfortunately, you cannot make anyone think or do anything they don't want. Fact.\n\nThat being said, if your parents attended the tests and were told by the specialist that you have ADHD, then they know full-well you have it. The only reason I can think of with what limited information of the situation you've given us is that they could be trying to deny that it's real and incurable. You're their child and nobody wants that kind of hardship for their children. \n\nFrom my experience, it's also very hard for people to understand what it's like to have ADHD. Try feeling what it's like to have autism. You can understand what the disability is like, but It's impossible to feel it, to live it. It's the same with ADHD. People can only have book smarts on the disorder. They can't understand it on a personal level.\n\nMy suggestion is to either give them some r", "mood": "low", "energy": null, "focus": "present", "meds": [], "feelings": ["frustrated"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I'll preface my wall of text with this:", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Pure second-person advice with no author state; mood=low and focus=present are both invented."}, {"id": "4027dced", "text": "I think you’re thinking of dopamine instead of serotonin. Norepinephrine seems like more of an alertness molecule to me. If you’ve ever taken the nasal decongestant pseudoephedrine (often in day time cold medicine) then you know what raised levels of norepinephrine feels like. \n\nDopamine plays a role in things like motivation, reward, learning and attention. Both of these molecules are in a family called catecholamines. If you compare the molecule of a medication like adderoll to a catecholamine like dopamine or norepinephrine you’ll see how similar they are. \n\nI’m not formally educated on this stuff but it seems like ADHDers have some kind of altered synthesis/ metabolism of these chemicals or altered receptors for them.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I think you’re thinking of dopamine instead of", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "clean — neurochemistry explainer; correctly returned no mood/energy/focus."}, {"id": "470f7150", "text": "Not quite work, but there's a simulation game I enjoy playing, with a small subreddit that holds contests to do with the game, and the deadline for one of those contests is today. \n\nThe project is mostly finished but I'm feeling a bit burned out on it, so it's become less fun and more of a chore, and when things become chores they are ripe for procrastination.\n\n(Plus, last night I learned that there's only one other confirmed entrant to the contest which has taken the wind out of my sails a little bit.)\n\nAlso, my parents said they were up for going cycling today. It's a sunny day and I like cycling... but I've not exercised in ages, and I had a bad night's sleep last night, so I'm not super feeling in the mood right now...", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Fitness", "Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "The project is mostly finished", "gold": ["mood"], "jmood": "missed", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Missed a clear first-person low state — \"burned out\", \"bad night's sleep\", \"not in the mood\" (mood+energy both present)."}, {"id": "ae90c754", "text": "I make it a point to structure my life so that distractions aren't even option. I have website blockers and an add-on which cuts away all of the recommended content from youtube (no more clickbait-triggered rabbit holes). The only social media I use is Instagram, and I only subscribe to a few close friends and stay away from the dopamine-stimulating, highly-digestible pages (think Carl Jung quotes and medieval artwork instead of memes and other fast-food entertainment). I make the internet more boring so it makes it a less appealing alternative to productivity.\n\nRoutines are a big thing, too. I'm actually kind of fortunate in that my Asperger's makes me form routines by default, so they help me hold my life together by making me do the same thing everyday, almost on autopilot. I have routines for eating, getting ready in the morning, sleeping, what I wear, working out, doing homework, et", "mood": "good", "energy": "alert", "focus": null, "meds": [], "feelings": ["content"], "activities": ["Eating", "Screen Time"], "sleepHours": null, "sideEffect": false, "title": "I have website blockers and an add-on which", "gold": ["energy", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Describes distraction-blocking systems, not a felt state; energy=alert and mood=good unsupported."}, {"id": "70affdd2", "text": "&gt; We are more likely to be creative and inventive than neurotypical people.\n\nIs this a known thing?\n\nI wrote code for a living (now retired) and I'm thinking of the several occasions that I got in trouble for the approach I took to a problem. \n\nFor example, I was part of a team of 4 which was tasked with re-implementing 100+ PDFs as HTML. They were used to collect data. While the other 3 hand-coded HTML to emulate a given PDF, I wrote a tool that did 90% of the conversion programmatically. \"No more tools!\" I was told, and when I was applying my tool and producing more output than the other 3 team members combined, *they fired me*. It was one of those places where they had to spend the budget or lose it in the next year -- and I was being too productive so there was danger of *not* exhausting the budget.\n\nAnother time I wrote an app to do 90% of what the code review team focused on eac", "mood": null, "energy": "tired", "focus": "sharp", "meds": [], "feelings": ["exhausted"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "While the other 3 hand-coded HTML to emulate", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Keyword trap — energy=tired/\"exhausted\" from \"exhausting the budget\"; focus=sharp invented from work anecdote."}, {"id": "e39c7f92", "text": "You knowing what's going on means you can help her and give her a huge advantage that many people don't get. Having good tools and coping mechanisms makes ADHD so much easier to tackle.\n\n\n Even just understanding why you may have difficulties with certain things really helps so you don't internalize thinking you're lazy or stupid. \n\n\nDon't worry about feeling guilty think about all the ways you can help her. Think about all the things you and many others wish they knew about as a kid.\n\n\nGetting some professional help is a good idea because they'll be able to help guide you. But also don't be afraid to research and try things that you find online too. There are so many other smart people dealing with similar issues who have great ideas, I see them sharing their findings on here all the time.", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "You knowing what's going on means you can", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Reassuring advice to a parent; mood=great is not the author's state (false positive)."}, {"id": "367f3626", "text": "Big tip: no one knows how to adult. \n\nClose enough to adulting in my experience is making sure you can function in your life\n\nExample: \n\npaying bills \n\nhaving a job/income stream, \n\nhaving a roof over your head, \n\nbeing able to function in the needed roles in your life ie student, workers \n\nor being able to seek help should you not be able to do the above \n \nAnd asking for help isnt wrong, despite the number of stubborn adults around you who may think so.  \n\nFeel free to just enjoy your life too when adulting isnt needed. Sometimes icecream instead of dinner is okay. Playing games, with toys or other “child” activities is okay too, just dont let it stop you from working and your other adulting.", "mood": "okay", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Eating", "Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Sometimes icecream instead of dinner is okay", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Keyword trap — mood=okay lifted from \"icecream instead of dinner is okay\", not an emotional state."}, {"id": "1b609021", "text": "Organisation helped a lot for me (it sounds simple but it took a lot of time and involved both cursing and crying before I got there). When I know where everything should go, I feel a lot less overwhelmed, it takes away (most) of the thinking, it's just picking things up and putting them down somewhere else. \n\nThe key for both the cleaning and the organisation is to start with ALL the things you can before you do this part:\n\n&gt;I start to sorting everything I have and after an hour it's even worse then when I started\n\nThink of it like a video game, some chores come with built in 'save points'. If you're getting rid of the trash that's lying around, you're automatically saving your progress, you can stop midway, but the trash that's gone is still gone. Same with laundry, dishes etc. Those are the 'low hanging fruits' of cleaning. When you start with those a lot of the clutter is gone and", "mood": "low", "energy": null, "focus": "sharp", "meds": [], "feelings": ["overwhelmed"], "activities": ["Chores", "Hanging Out"], "sleepHours": null, "sideEffect": false, "title": "When I know where everything should go", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Constructive cleaning advice; mood=low overstates (states feeling LESS overwhelmed), focus=sharp invented."}, {"id": "336776a5", "text": "The concept of time has always been something I’ve struggled with. I’ve always felt like I’m standing still and everyone else is bustling around me, like they’re on a totally different timeline than me. It makes me feel like... I dunno, like I’m constantly behind? It’s overwhelming and makes me want to give up a lot. \n\nIt’s also very hard with dating or maintaining relationships, especially when it comes to replying to messages/texts. I will look at a message someone sent me a week ago and I get super surprised that it was a week ago and also I never responded?? Like, they just messaged me yesterday I thought?! \n\nI think the best way to go with this is to just be open and honest. Explain your thought process and how you struggle with just time as a whole. I have a lot of friends who message me repeatedly until I finally focus on our conversation, especially if they’re asking me a questio", "mood": "great", "energy": null, "focus": "sharp", "meds": [], "feelings": ["grateful"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I have a lot of friends who message", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Time-blindness struggle + gratitude is not \"great\" (partial); focus=sharp contradicts text (can't focus on convos)."}, {"id": "1977b30c", "text": "Hey,\n\nyou seem angry right now, that's okay, but try to calm down slowly so you can think about your next steps and evaluate the tips you might be getting here.\n\nSo, why are you so sure you have adhd? Forgetfulness, no motivation etc can be caused by depression too.\nDepression can also start really early in live.\n\nI'd strongly advise you against focussing on a diagnosis and instead being open minded to what your doc suggests.\n\nBut I'd also be with you when you say you've though about it long and intense and you are pretty sure you have adhd and think your doc is wrong.\n\nIf so and you can't switch, I'd do the best and most in depth adhd self test you can find on the internet, print out the results and show them to your doc. If you have evaluation cards from your teachers which indicate adhd you can show them to your doc too.\n\nJust don't forget, you'll benefit most of getting treatment for", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["angry"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "You seem angry right now", "gold": ["mood", "energy", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "\"You seem angry right now\" is the reader's state, not the author's; mood=low is a misattribution."}, {"id": "74144729", "text": "Do you have an idea how you may react in certain situations? If you end up sleeping in late because you went to bed early, do you feel that could cause you issues?\n\nThe answers we seek must come from a source that we want them to come from. When I make a schedule for myself I have to be happy with that schedule. I can not force myself to make a schedule or it will serve no purpose. I must know before hand that I want it to work and it will.\n\nI am replying in an abstract way because its my only way to reply to this. I wish I could give you a direct answer... but I assume you know what needs to be done but just havent been attracted to doing it.\n\nSchedules, Discipline, learning routines, good life style etc etc etc. Simple words that we understanding but will have no meaning since we have issues just start doing them.\n\nTLDR: Sorry your having issues atm and hope you can create good routine", "mood": "great", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "When I make a schedule for myself I", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Abstract schedule advice; mood=great pulled from conditional \"I have to be happy with that schedule\"."}, {"id": "82bbbe69", "text": "I think that non/ADHD people do this because they themselves could handle the chatter, when we can’t. So while your sister could grab her keys and whatnot while you talked to her, you can’t and she may not get that. Customers are just like that, sadly. Either they’re too talkative or they don’t talk enough. \n\nI get suuuuuper frustrated when I have to stop working to talk to someone or they interrupt my focus. I’ve taken to announcing when I’m going to do chores or start a project so others know to let me plow through it. It only works 50% of the time but it’s better than never haha", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": ["frustrated"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Either they’re too talkative or they don’t talk", "gold": ["mood", "focus"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Author is frustrated by interruptions, so mood=good is wrong direction; focus=sharp contradicts \"interrupt my focus\"."}, {"id": "8c4b20dd", "text": "This is really recognizable. For me looking back I always struggled with my ADHD but I managed in school. I didn't get super high grades but they were passable. I managed to get a master's degree with doing basically no homework. My biggest hurdle was never the test making, it was the projects, reports etcetera. Stuff that took time and planning to finish. But even then I managed to scrape together just enough motivation to hand in something somewhat passable.\n\nHowever my obvious struggles came when I got a full-time job where slacking off got consequences. Unlike school I was expected to deliver all the time and my motivational well had run dry within a very short time. And that's when I started wondering if something else was going on. \n\nSo you managing to get a degree doesn't meant you can't have ADHD. You probably managed in school, maybe even had some tricks to cope with things you ", "mood": "great", "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I didn't get super high grades", "gold": ["energy"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Retrospective on struggle (\"motivational well had run dry\"); mood=great and energy=steady both unsupported."}, {"id": "948900a9", "text": "Medications affect different people in different ways. So the side affects one patient gets, another won't. I started Strattera a couple of years ago. At the moment I take 100mg each morning because 120mg gave me cardiac symptoms. \n\nStrattera didn't do much at all for my concentration or inattentiveness, but it certainly helped a lot with my lack of motivation and depression. However, it took a good few months to get the full effects. \n\nMost side effects go away after a few weeks, but the nausea has always stayed with me, so my doctor gives me something for this. \nTalk to your doctor if you don't think it's helping, it isn't for everyone.", "mood": null, "energy": null, "focus": "sharp", "meds": ["Strattera", "Strattera"], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I started Strattera a couple of years ago", "gold": ["mood", "energy", "focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "correct", "overall": "ok", "note": "Meds (Strattera) + sideEffect correct, but focus=sharp directly contradicts \"didn't do much for my concentration\"."}, {"id": "ecd63f73", "text": "Interesting ideas.   I like the *idea* of being able to get to sleep at a reasonable hour at night.\n\nMy problem is that I feel absolutely awful if I'm short on sleep.  I feel ill.  I am not productive.  Setting my alarm for some early hour is me taking a big risk I may ruin tomorrow &amp; feel crappy all day.   Any thoughts?   \n\nAnd even when I'm short on sleep I can't be sure I'm asleep before midnight.   I can't always control my mood, energy, wakefulness, insomnia (?)", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": true, "title": "I like the *idea* of being able to", "gold": ["mood", "energy"], "jmood": "correct", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Mood=low correct (\"feel absolutely awful\"), but missed energy despite \"not productive\" + explicitly naming uncontrollable energy."}, {"id": "25f20cf7", "text": "Yeah, it is impossible to retain/understand any new information during an episode of the brain fog, even more than usual. This makes working on those days really suck. \n\nConversely, I had this weird episode of derealization during a severe panic attack recently where I was in my house, and in my mind I knew that and recognized all my things, yet at the same time, I didn't recognize anything at all. I was in my house, but at the same time I was in a new place that I didn't recognize...it is hard to articulate. I couldn't have even told you where the light switches were, and I started freaking out even more than I was already. I felt like I had just entered someone else's house for the first time and was a stranger in my own home. Luckily, I had the presence of mind to know what was up and go lie down to ride it out.\n\n That was the most extreme episode of derealization I have ever experien", "mood": null, "energy": "alert", "focus": "foggy", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "Yeah, it is impossible to retain/understand", "gold": ["focus"], "jmood": "na", "jenergy": "correct", "jfocus": "correct", "jmeds": "na", "overall": "good", "note": "clean — focus=foggy (\"brain fog\") and energy=alert (\"completely alert\") both explicitly stated."}, {"id": "033fa929", "text": "My mom was the exactly same. She may have not called me a bitch but she wasn't there for me emotionally speaking. I didnt have any friends in school, my parents didn't understand me at all, I had no one to talk to basically. I didnt know what depressions was in my teens but Im sure I was depressed looking back on it now.\n\nI used to cry in my room for hours over my loud music hoping someone would come in and talk to me. I thought they never heard me, but apparently my mom had, but didn't know how to deal with it so she never came in... Sometimes I wish I didnt know this now, but it is what it is.\n\nI was recently diagnosed and Im pretty sure I have it from my mom (but she doesnt wanna hear any of it related to her, she is glad it helps me, thats it). I am starting to understand my mom a bit more though through my own diagnosis, so I hope we can get some form of relationship, since there ne", "mood": "good", "energy": null, "focus": "distracted", "meds": [], "feelings": [], "activities": ["Outdoors"], "sleepHours": null, "sideEffect": false, "title": "I didnt have any friends in school", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Mostly melancholic childhood reflection ending in self-acceptance; mood=good overstates, focus=distracted has no basis."}, {"id": "af5be936", "text": "Thanks but it seems to me that then my ex and the social worker would think I \"bought\" a diagnosis to try to explain away my own parenting problems and escape taking responsibility for my parenting.\n\nI mean, I've explained many times that getting an accurate diagnosis would be essential for any parent helping them parent their child, but I think I'm stigmatised because I have official diagnoses of ASD and ADHD and I take antidepressants (and now ADHD meds too) and I'm off work, and my ex shines away being a fully employed, fully functional member of society, who doesn't have a diagnosis of any mental problems, only Dyslexia.\n\nI mean, ex knows he has ADHD because we used to do online tests when we were together, and he got top scores, much higher than I did. So it took everyone by surprise when I got diagnosed with ADHD alongside the ASD that I'd suspected. When I've learned more about AD", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I mean", "gold": ["mood", "focus"], "jmood": "missed", "jenergy": "na", "jfocus": "false_positive", "jmeds": "missed", "overall": "poor", "note": "Missed meds (\"antidepressants and now ADHD meds too\") and distressed mood; focus=sharp is the EX's trait, not author's."}, {"id": "cc131435", "text": "Keep grinding away. I'm doing the exact same thing right now.. well, I'm supposed to be studying.. I've been in college for 8 years now, after failing a bunch of classes, I've learned to go slow. Take fewer classes, and if it's a really hard class, take only that class so you can focus on it. I suppose for other people this is bad advice, but I've gotten this far, and if I dont fail these classes this semester, I'm going to finally be in the home stretch. It really just takes baby steps.", "mood": null, "energy": null, "focus": "sharp", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I'm doing the exact same thing right now", "gold": ["focus"], "jmood": "na", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Advice to reduce course load \"so you can focus\"; focus=sharp is a goal in advice, not the author's state."}, {"id": "7d3edee8", "text": "My parents never fully understood daily struggles/challenges until I wrote my thesis that was focused on a self-study. And that was helpful for them to understand, and my dad who has ADHD, was able to relate and finally see his struggles. My mom became more aware about certain things and would ask how I am when certain noises would bring on anxiety for me. My parents were never “tough love” with my symptoms, so I’m sorry you’re going through this.\nBut I’m wondering if you typed up or found information on ADHD focusing on the symptoms, explaining those symptoms and why they are experienced for them to read would help them understand more?\nI feel like a lot of people see ADHD as a “you’re just all over the place, can’t focus” but don’t realize it’s other symptoms like regulating emotions and managing multiple tasks/thoughts. It’s draining!!\nI hope you’re able to do some self care. Hope thi", "mood": null, "energy": "steady", "focus": "foggy", "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "My parents never fully understood daily struggles/challenges until", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "false_positive", "jfocus": "false_positive", "jmeds": "na", "overall": "poor", "note": "Empathetic advice post; all three (mood=good, energy=steady, focus=foggy) invented with no author state."}, {"id": "367ccad5", "text": "School is important to me so I make a point to be on time for class. I have been trained to have an immense amount of guilt if I skip class, so the guilt overrides my desire to skip. As I always say, \"better late than never!\" Since I'm an on-campus student in college, my gauge for whether I should skip or not is whether I'm feeling well enough to concentrate on the material being presented or if I'm so sick that sleep is more useful than class.", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "As I always say", "gold": ["mood", "focus"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "Mood=good unsupported (post is about guilt/attendance rules); no real emotional state expressed."}, {"id": "064a54c8", "text": "I have pretty much same symptoms. When i try to memorize something off of my textbooks i zone out and start talking to myself about a different subject . Suddenly i realize i am saying the words(out loud) was memorizing complete wrong . Like instead of Dandruff , i say randoff (something not even English). Pretty wired. \nI don't rock back and forth though. Instead I move my leg up and down or shake it . \nall my life i used perform well at school. I could ace exams because i could pay attention in lectures. But i could never sit down and study a textbook. Recently i have done a lot worse since every subject requires sitting down and reading a god damn long textbooks.\n\nIf anyone tries to have a conversation with me that is longer than 3 minutes i will start talking to myself and respond short words to the other person without even noticing.\n\nI have been diagnosed as ADHD only in adulthood.", "mood": null, "energy": "charged", "focus": null, "meds": [], "feelings": ["wired"], "activities": ["Hobbies"], "sleepHours": null, "sideEffect": false, "title": "Pretty wired", "gold": ["energy", "focus"], "jmood": "na", "jenergy": "correct", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "Energy=charged/wired plus motor restlessness is fair, but missed clear inattention (\"zone out\", can't read a textbook)."}, {"id": "b0e223c0", "text": "It is all myth and hearsay. It is the Battle for the Heroes. Autistic people claim Einstein, ADHD'ers will claim whoever mouths right this month. :-)\n\nSoon there will be back alley slug fests over who gets to claim a person. For Borderliners it is extra tough; they can't make up their minds. Autistics will never compromise and rigidly hoard their hijacks. Sociopaths claim serial killers while the Anxious are too afraid to tell who they admire as their own. Schizophrenics tend to go for the mad scientists while the maniacal   Bipolars inevitable go for saints and rock artists.\n\nI once knew a woman who thought Saddam Hussein was her father. Her real father was a minister so that explains it. Success is basically who you claim as your own. :-)", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["anxious"], "activities": [], "sleepHours": null, "sideEffect": true, "title": "Sociopaths claim serial killers while the Anxious are", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "Satirical post; mood=low and feelings=anxious are a keyword trap on \"the Anxious\" (a group, not the author)."}, {"id": "a1cfc610", "text": "Yes for sure!!!! I have very little hunger drove most of the time--sometimes I don't notice I haven't eaten and am hungry until I literally feel sick to my stomach.\nAlso, as others mentioned, I often have a low energy drive to actually cook something so even if I DO recognize I'm hungry I might just sit in bed thinking 'I should get up and make food, I should get up and make food, I should...' for hours without actually doing it and end up having sleep for dinner instead. Quick microwave meals or PB+bread and the like are a lifesaver.", "mood": null, "energy": "tired", "focus": null, "meds": [], "feelings": [], "activities": ["Eating"], "sleepHours": null, "sideEffect": false, "title": "I have very little hunger drove most of", "gold": ["energy"], "jmood": "na", "jenergy": "correct", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "energy=tired well-supported by 'low energy drive' and sitting in bed for hours; clean"}, {"id": "3717c93c", "text": "I can't stop doing nothing either. I think it could be a horrible form of procrastination, like next level shit. I think it's called the dark purgatory of procrastination (http://waitbutwhy.com/2013/10/why-procrastinators-procrastinate.html) where one, instead of resorting to fun activities that are normally enjoyed after a sense of accomplishment, browses the internet for countless hours or compulsively unlocks and locks their iPhone. You don't derive pleasure from these sort of 'pleasurable' activities. Because you're stuck in a purgatory. There could be a lot of resistance facing you when switching tasks and a huge lethargy overtakes you. At least that's what happens to me.", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "You don't derive pleasure from these sort of", "gold": ["mood", "energy"], "jmood": "missed", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "returned nothing; 'huge lethargy overtakes you' is a clear energy=tired signal, plus anhedonia (no pleasure) implies low mood"}, {"id": "1ae052d2", "text": "I did youtube for a year that just finished this month. I made loads of money but it went terribly.\n\nI probs worked like 8 hours a week on average. I often went 6 weeks doing absolutely zero work. I ended up going clubbing a lot on weekdays, going to the casino to play poker, playing world of warcraft all day, waking up at 4pm. I had zero structure. I only really left the house to go drinking / clubbing / gambling (which was a lot by the way)\n\nI feel guilty for doing so little. Im unmedicated by the way\n\nI think if you were to be self employed as somebody with ADHD you *have* to do daily exercise, sleep well, eat well, and take meds if you have them", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": ["guilty"], "activities": ["Fitness", "Hobbies", "Screen Time", "Work"], "sleepHours": null, "sideEffect": false, "title": "I did youtube for a year that just", "gold": ["mood"], "jmood": "missed", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "'I feel guilty for doing so little' conveys low mood but mood left null (only captured as feeling); meds correctly empty (unmedicated)"}, {"id": "9fdeb050", "text": "Accurate as fuck man. What helped me was getting the habit of having a set time that I'm productive every single day, even on weekends. For example I would keep a list on my fridge door of everything that needs done that week (right it down as soon as you know you have to do it or you'll forget)\n\nThen you have to start getting in the habit of forcing yourself to be productive from certain hours. I.e from 12:00-1:30 I'll get as much stuff done on the weekly list as possible.\n\nIt doesn't have to be hard stuff either, in fact it's a lot easier if you start with easy stuff and get some momentum going. You do whatever you need to do to be able to be productive in that set time, wether it's coffee or meds", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": false, "title": "For example I would keep a list on", "gold": ["energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "pure productivity advice, no first-person state; correctly returned nothing (gold over-marks energy)"}, {"id": "8065e8d5", "text": "Well since therapy is usually a kind of \"this is my problem, let's work on it\" kind if thing it may help you if you go to a therapist with the challenges ADHD gives you in your day to day life.\nTherapy for ADHDis usually either to patch up the problems caused by ADHD or to find coping mechanisms, wich can sometimes be in group therapy sessions.\n\nIf you feel like your life is spiralling out of control or you feel very limited in how much you can do then go to a therapist. If you have a decent amount of control in your life right now you may not need it, but if you feel like ADHD is significantly impacting you you should definitely seek out professional help and an diagnosis.\n\n(I'm not a medical professional, please talk to one if you have any concerns)", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "Since therapy is usually a kind of \"this", "gold": ["mood"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "second-person hypothetical therapy advice ('if you feel...'); no author mood; correctly empty"}, {"id": "73d2fc7b", "text": "I’m really curious what you like about Zoloft and that combination in general! I was on 30mg of Vyvanse for 2 months until I felt like it gave me more anxiety than it was worth. (And it was a pretty obvious high.) But before switching, my doctor prescribed Zoloft. Though I never ended up trying it.\n\nI’m back on Concerta now (as I was the 6 months prior to Vyvanse), and it’s better but still gives me anxiety, but not nearly as much as Vyvanse. \n\nDo the benefits of Zoloft outweigh any side effects you see? I’ve been putting off trying Zoloft out of fear side effects would “dim” me somehow.", "mood": "good", "energy": null, "focus": null, "meds": ["Vyvanse", "Concerta", "Vyvanse", "Vyvanse"], "feelings": ["curious"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I’m really curious what you like about Zoloft", "gold": ["mood"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "partial", "overall": "poor", "note": "mood=good unsupported — text is about med-induced anxiety and fear ('curious' is not good mood); meds duplicated Vyvanse x3 and missed Zoloft"}, {"id": "12bde789", "text": "I am definitely going straight into college but I am sure it is what I want. I am extremely excited. I have worked a part time job the last two years of high school as well as being an IB student (all honors essentially) and I was in a lot of extracurricular activities so I also feel that more work is better for me. I simply have to focus because I have a set schedule and everything.\nThank you for this response! Ill have to see how this summer off of meds goes.", "mood": "good", "energy": null, "focus": "sharp", "meds": [], "feelings": ["excited"], "activities": ["Work"], "sleepHours": null, "sideEffect": false, "title": "I am extremely excited", "gold": ["focus"], "jmood": "correct", "jenergy": "na", "jfocus": "false_positive", "jmeds": "na", "overall": "ok", "note": "mood=good fits 'extremely excited'; focus=sharp is wrong — 'I simply have to focus' is an intention, not a report of being focused"}, {"id": "0a132e3a", "text": "I have no control over my behaviours, misplace things,  miss deadlines, fade out mid conversations, blurt out things I shouldn't, show up late for appointments or forget about them altogether, even missed my dad's 60th birthday party because my brain convinced me it was the next day. (my brother is still not talking to me because of this...) My brain is a mess 24/7, which doesn't always make me the best (boy)friend, although I wish was misdiagnosed, all the evidence (which is overwhelming) is pointing the other way.\n\nEight years back after getting fired from my second job as an adult I was so depressed, I seriously thought about committing suicide. My girlfriend (and professional help ofcourse) helped me through it and it's because of her my life is as organised as it is now and because of her I sought help/diagnosis. So even though my life seems peachy right now, it wasn't always like t", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Hanging Out"], "sleepHours": null, "sideEffect": false, "title": "My brain is a mess 24/7", "gold": ["mood"], "jmood": "partial", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "ok", "note": "mood=low is right direction but understated given explicit suicidal ideation ('seriously thought about committing suicide')"}, {"id": "114c1711", "text": "Well I gave each treatment a full month before giving him my findings. He’s trained in eastern and western medication and wanted me to buy a $150 heart math monitor to learn meditation after I told him meditation gives me anxiety. \n\nIt seems like it’s always a fight, but he gets amusement from it. Watching me fight him for my health. \n\nIt’s always hard starting over, I’m trying to remain as optimistic as possible. The crash is just so extreme as if I’m not taking anything at all, and the medicine is 50mg stronger. \n\nIt’s only been three days but I didn’t expect to crash like this. I figured I might just not feel a difference for a while as compared to the SR", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": [], "sleepHours": null, "sideEffect": true, "title": "It’s always hard starting over", "gold": ["mood", "energy"], "jmood": "false_positive", "jenergy": "missed", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good contradicts the post — dominant affect is an extreme stimulant 'crash'; that crash is also a missed low-energy signal"}, {"id": "27396503", "text": "The fact that I was supposedly one of the smartest students they ever had was why I ended up with a 3.7 GPA in high school. I did not deserve the good grades I was given. \n\nI turned everything in late. I copied anything I could, such as math and physics homework. I was given so much leeway because they all knew I could get into any university I wanted with my test scores and background (Hispanic, first-generation college student female interested in mathematics).\n\nBut... my first private university didn't work out for some obvious and not-so-obvious reasons. I didn't give up and immediately enrolled in community college, and finally, at age 27, after 15+ semesters of college, I earned a transfer degree with a 2.6 GPA. My transcript is riddled with As, Fs, and Ws.\n\nI see a psychiatrist regularly for depression management, but I made an emergency appointment to see him this Wednesday after", "mood": null, "energy": "steady", "focus": null, "meds": [], "feelings": [], "activities": ["Hobbies", "Work"], "sleepHours": null, "sideEffect": false, "title": "I did not deserve the good grades I", "gold": ["mood"], "jmood": "missed", "jenergy": "false_positive", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "energy=steady has no textual basis; meanwhile depression-management/regret context conveys low mood that was missed"}, {"id": "be00c005", "text": "I totally agree it's important to have people understand why. However at the end of the day what you do is a concrete reality. You can't be in a relationship where one person shoulders the vast majority of the mental load. Even in non-adhd marriages that can be a relationship ruiner. \n\nWhy can only take you so far without the what you bring to the table. \n\nHave you read the \"you should have asked\" comic? Once you take gender relationships into the equation, expecting a partner, especially if you're the male partner with a female partner, to shoulder the burden of remembering what needs to be done when and how it needs to be done is unfair to them. Even if you have ADHD it can put beyond what a person can cope with on one person's shoulders. \n\nIt's not fair to expect someone to do more than they mentally can bear. And it's not a lack of understanding why if someone decides they can't be t", "mood": "good", "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Chores", "Resting", "Work"], "sleepHours": null, "sideEffect": false, "title": "Throw in caring for a child and it", "gold": ["energy"], "jmood": "false_positive", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "poor", "note": "mood=good is wrong — this is an abstract analytical essay on mental load in relationships, no positive personal mood"}, {"id": "9c14ea39", "text": "It was less that I was compelled so much that I was anxious and knew I wouldn't be able to stop worrying unless I checked. My anxiety is definitely ADHD style as it's not about a specific action (my understanding of OCD) or generalized. It's the mental broken record style of hyperfocusing on something that isn't useful or good combined with ADHD emotions. \n\nBut yeah, ADHD is a grab bag with a lot of overlap with other issues. I have the hyperfocusing problem, so it can seem like obsessiveness, though I am not \"compelled\". I could have kept on with my day, and usually be do. This time I was close enough to my house and had time to spare before my first meeting.", "mood": "low", "energy": null, "focus": null, "meds": [], "feelings": ["anxious"], "activities": ["Work"], "sleepHours": null, "sideEffect": true, "title": "It was less that I was compelled so", "gold": ["mood", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "missed", "jmeds": "na", "overall": "ok", "note": "mood=low fits the anxiety; but explicit 'hyperfocusing'/'mental broken record' focus signal was returned as null"}, {"id": "52e6df30", "text": "A lot of people don't realize what hyperactivity can be. I don't literally bounce off the walls (my ADHD is the combined type, but I can definitely *see* the hyperactivity in myself and think it is perhaps the largest factor in my ADHD) but I talk too fast, can't sit still and do nothing (even in my 30s; I need constant input -- I can *sit* if I have constant, stimulating, mental input, as can many hyperactive boys, frankly), fidget, mash buttons in video games when I get impatient (my SO and I were playing The Division and he was idling to look something up, and I was just mashing X over and over again to roll or climbing vehicles), can't stand still at the grocery store when my SO is selecting something new and it takes more than 5 seconds (I pace, tap my feet, etc), etc. All of this is as much hyperactivity -- and far more likely for an adult woman -- as the little boy running around ", "mood": null, "energy": null, "focus": null, "meds": [], "feelings": [], "activities": ["Fitness", "Hobbies"], "sleepHours": null, "sideEffect": false, "title": "A lot of people don't realize what hyperactivity", "gold": ["energy"], "jmood": "na", "jenergy": "na", "jfocus": "na", "jmeds": "na", "overall": "good", "note": "descriptive essay on what hyperactivity looks like, not a current-state report; correctly empty (gold over-marks energy)"}, {"id": "3572269c", "text": "I had the same experience as you. I'm very calm, good listener, very very long patience. My little brother was the hyperactive bouncyball. He had ADHD, everyone could see that (they said).\n\nBut years down the line I was diagnosed with it as well, I was told it is primarily in my mind. I lack the impulsivity like my little brother has.\n\nI started on meds, dexamphetamine, something similar like Adderall. And it changed everything. I was scared at first. Am I going to be independent on this stuff? Will these make me a different person? I kinda like myself, the only part I hate is that I can't get shit done like I want too. \n\nBut, I will tell you. Don't be scared. You won't change. You will be you but with a focus you always desired. I see it as people who constantly drink coffee. They dont second guess that habit but do it constantly because otherwise they can't 'start up' or focus.\n\nCaffei", "mood": "good", "energy": null, "focus": "present", "meds": ["dex", "amphetamine", "Adderall"], "feelings": ["scared"], "activities": [], "sleepHours": null, "sideEffect": false, "title": "I'm very calm", "gold": ["energy", "focus"], "jmood": "correct", "jenergy": "na", "jfocus": "partial", "jmeds": "partial", "overall": "ok", "note": "meds: 'amphetamine' double-counts dex and 'Adderall' is only a comparison ('something similar like'); focus=present is aspirational, not a current state"}, {"id": "89836827", "text": "I've gone from ridiculous night owl, regularly going to bed at 4-6am, to waking up at 4:30-5:00am every morning! I'm usually in bed and sleeping by 10:30 every night. The trick is to focus on the waking up and the going to bed will take care of itself. Set your alarm for when you want to wake up and get up when it rings. Immediately. No snoozing. Just do it. Every day. Even weekends. Even when you haven't been able to sleep the whole night. It will suck. You will hate it and curse my name. But after a week or two you'll wake up naturally just before the alarm, and miraculously, you'll fall asleep easily, at a reasonable time, because you'll be tired as fuck when bed time comes around.\n\nSimple is not easy! It's simple to lose weight, climb a mountain, or
